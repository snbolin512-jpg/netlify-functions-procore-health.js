[build]
  command = "npm run build"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/procore-health"
  status = 200

[[redirects]]
  from = "/api/packets"
  to = "/.netlify/functions/api-packets"
  status = 200

[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/procore-projects"
  status = 200

[[redirects]]
  from = "/auth/procore/login"
  to = "/.netlify/functions/procore-auth-start"
  status = 200

[[redirects]]
  from = "/auth/procore/callback"
  to = "/.netlify/functions/procore-auth-callback"
  status = 200

[[redirects]]
  from = "/webhooks/procore"
  to = "/.netlify/functions/procore-webhook"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
