[build]
  publish = "."
  command = "echo OhmBoy clean rewrite static build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/ohmboy-health"
  status = 200

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/ohmboy-events"
  status = 200

[[redirects]]
  from = "/api/intake"
  to = "/.netlify/functions/ohmboy-intake"
  status = 200

[[redirects]]
  from = "/api/clear"
  to = "/.netlify/functions/ohmboy-clear"
  status = 200

[[redirects]]
  from = "/api/promote"
  to = "/.netlify/functions/ohmboy-promote"
  status = 200

[[redirects]]
  from = "/api/packet-ledger"
  to = "/.netlify/functions/ohmboy-packet-ledger"
  status = 200
