[build]
  publish = "."
  command = "echo OhmBoy V0.20 full restore static build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/ohmboy-health"
  status = 200

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/ohmboy-events"
  status = 200

[[redirects]]
  from = "/api/clear"
  to = "/.netlify/functions/ohmboy-clear"
  status = 200
