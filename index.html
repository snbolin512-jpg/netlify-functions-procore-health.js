<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ωboy V0.25.0 — Command Map: Cost Report, Circuit Tracker, One-Line, Node Cards, Recall Training</title>
<style>
:root{
  --ivory:#fffff6; --white:#fff; --black:#070707; --gray:#565656;
  --copper:#b87333; --copper-dark:#7a3f16; --teal:#0f766e; --red:#c92525;
  --shadow:0 22px 54px rgba(20,16,10,.07); --shadow-soft:0 12px 28px rgba(20,16,10,.048);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Avenir Next LT Pro","Avenir Next","Avenir",Helvetica,Arial,sans-serif;font-weight:300;color:var(--black);background:radial-gradient(circle at 92% 0%,rgba(184,115,51,.055),transparent 30%),linear-gradient(180deg,#fff 0%,var(--ivory) 64%,#fffef9 100%)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;padding:12px}
.shell{width:min(1680px,calc(100vw - 24px));min-height:calc(100vh - 24px);margin:0 auto;border:1px solid rgba(184,115,51,.22);background:linear-gradient(180deg,rgba(255,255,255,.985),rgba(255,255,246,.985));border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.topbar{height:52px;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid rgba(184,115,51,.14)}
.datepill{display:inline-flex;align-items:center;gap:8px;color:#111;font-size:13px}
.bell{position:relative;width:34px;height:34px;display:grid;place-items:center}.bell b{position:absolute;top:2px;right:3px;width:15px;height:15px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
svg{stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.floating-home{position:fixed;left:18px;top:18px;z-index:1000;border:1px solid rgba(184,115,51,.55);background:rgba(255,255,255,.9);backdrop-filter:blur(12px);color:#111;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow-soft)}
.view{display:none}.view.active{display:block}
.hero{display:grid;grid-template-columns:340px minmax(0,1fr);gap:34px;align-items:start;padding:18px 44px 30px;border-bottom:1px solid rgba(184,115,51,.14)}
.jackson-area{display:flex;justify-content:center;align-items:flex-start;min-height:300px}.jackson{width:285px;max-height:310px;object-fit:contain;filter:drop-shadow(0 24px 22px rgba(20,16,10,.12))}
.title{margin:0;padding-top:2px;font-size:62px;line-height:1.03;font-weight:300;letter-spacing:-.065em;color:var(--black)}.subtitle{margin:9px 0 26px;max-width:720px;font-size:17px;line-height:1.45;color:#303030}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{border:1px solid rgba(184,115,51,.50);border-radius:14px;background:rgba(255,255,255,.88);box-shadow:var(--shadow-soft)}
.daily-card{min-height:168px;padding:22px 20px;display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:start;text-align:left;color:var(--black)}
.daily-card:hover,.module:hover,.action:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(20,16,10,.07)}
.icon{width:50px;height:50px;border:1.5px solid var(--copper);border-radius:999px;display:grid;place-items:center;color:var(--copper-dark)}.icon svg{width:25px;height:25px}.daily-card.red .icon{border-color:var(--red);color:var(--red)}.daily-card.teal .icon{border-color:var(--teal);color:var(--teal)}
.daily-card h3{margin:0;font-size:15px;font-weight:700;color:#111}.num{display:block;font-size:38px;line-height:1;margin:10px 0 7px;color:#111;font-weight:300;letter-spacing:-.04em}.num.teal{color:var(--teal)}.daily-card small{display:block;color:#3f3f3f;line-height:1.35;font-size:13px;min-height:35px}.link{display:inline-flex;align-items:center;gap:8px;margin-top:13px;font-size:12px;color:#111}
.ops-row{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;padding:0 44px 26px;border-bottom:1px solid rgba(184,115,51,.14)}
.ops-panel{border:1px solid rgba(184,115,51,.38);border-radius:14px;background:rgba(255,255,255,.88);box-shadow:var(--shadow-soft);padding:18px 20px}.ops-panel h2{margin:0 0 6px;font-size:21px;font-weight:700}.ops-panel p{margin:0 0 14px;color:#555;font-size:13px}.ops-actions{display:flex;flex-wrap:wrap;gap:10px}
.mascot-note{display:flex;gap:14px;align-items:center}.mascot-note img{width:86px;height:86px;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(20,16,10,.09))}.mascot-note strong{display:block;font-size:16px;margin-bottom:4px}
.action{border:1px solid rgba(184,115,51,.55);background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;color:#111}.action.primary,.action.dark{background:#111;color:#fff;border-color:#111}
.section{padding:26px 42px 18px}.section h2{font-size:22px;margin:0;color:#111;font-weight:700}.section p{margin:5px 0 0;color:#555;font-size:13px}
.map-wrap{position:relative;min-height:430px;margin-top:12px;overflow:hidden}.map-lines{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}.map-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 1.28fr 1.28fr 1.38fr 1.28fr 1.28fr 1.05fr;grid-template-rows:90px 90px 90px 90px;gap:14px 18px;align-items:center}
.bubble{border:1.2px solid rgba(184,115,51,.68);background:rgba(255,255,255,.92);border-radius:999px;min-height:74px;box-shadow:var(--shadow-soft);display:grid;place-items:center;text-align:center;padding:13px 22px;position:relative}.bubble label{font-size:12px;font-weight:700;color:#111;display:block}.bubble strong{display:block;margin-top:7px;color:#090909;font-size:22px;line-height:1.05;font-weight:400}.bubble strong.teal{color:var(--teal)}.bubble strong.red{color:var(--red)}.info{position:absolute;right:13px;top:12px;width:16px;height:16px;border:1px solid var(--copper);border-radius:999px;color:var(--copper-dark);font-size:10px;font-weight:700;display:grid;place-items:center;background:#fff}
.b-contract{grid-column:2;grid-row:1}.b-co{grid-column:3;grid-row:1}.b-revised{grid-column:4;grid-row:1}.b-cost{grid-column:5;grid-row:1}.b-po{grid-column:3;grid-row:2}.b-eac{grid-column:4 / span 2;grid-row:2}.b-left{grid-column:6;grid-row:2}.b-gain{grid-column:2;grid-row:3}.b-margin{grid-column:4;grid-row:3}.b-aging{grid-column:5;grid-row:3}
.callout{border:1px solid rgba(184,115,51,.34);background:rgba(255,255,255,.9);border-radius:10px;padding:11px 13px;box-shadow:0 12px 26px rgba(20,16,10,.055);font-size:12px;line-height:1.45;color:#111}.callout b{display:block;margin-bottom:4px;font-weight:700}.c-revised{grid-column:1;grid-row:2}.c-left{grid-column:6;grid-row:1}.c-po{grid-column:4;grid-row:3}.c-aging{grid-column:6;grid-row:3}
.modules{margin:8px 30px 26px;border:1px solid rgba(184,115,51,.28);background:rgba(255,255,255,.88);border-radius:14px;box-shadow:var(--shadow-soft);padding:17px 18px 19px}.modules h2{margin:0;color:#111;font-size:21px;font-weight:700}.modules p{margin:4px 0 14px;color:#555;font-size:13px}
.module-strip{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border:1px solid rgba(184,115,51,.28);border-radius:12px;background:#fff;overflow:hidden}.module{min-height:96px;background:#fff;border:0;border-right:1px solid rgba(184,115,51,.22);display:grid;place-items:center;gap:6px;padding:11px 7px;position:relative}.module:last-child{border-right:0}.module svg{width:32px;height:32px;stroke:#111}.module span{font-size:12px;color:#111;font-weight:400}.dot{position:absolute;width:8px;height:8px;border-radius:999px;background:var(--red);right:18px;top:18px}
.page{padding:32px 42px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.page h1{margin:0;font-size:42px;font-weight:300;letter-spacing:-.05em}.page .sub{margin:6px 0 0;color:#555}
.grid{display:grid;gap:16px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{padding:18px}.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#555}.kpi strong{display:block;margin-top:8px;font-size:30px;font-weight:700}.panel{padding:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.list{display:grid;gap:12px;margin-top:16px}.item{padding:16px;border:1px solid rgba(184,115,51,.36);border-radius:14px;background:#fff;box-shadow:var(--shadow-soft)}.item h3{margin:0 0 8px;font-size:18px}.item p{margin:0;color:#444;line-height:1.45}.badge{display:inline-flex;border:1px solid rgba(184,115,51,.4);background:#fff8ef;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;margin-right:6px}pre{background:#111;color:#fffdf5;border-radius:14px;padding:14px;max-height:360px;overflow:auto;white-space:pre-wrap}
.log-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid rgba(184,115,51,.28);border-radius:14px;background:#fff}.log-table th,.log-table td{text-align:left;padding:12px 13px;border-bottom:1px solid rgba(184,115,51,.18);font-size:13px;vertical-align:top}.log-table th{background:#fffdf8;font-weight:700;color:#111}.log-table tr:last-child td{border-bottom:0}
.takeoff-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.takeoff-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:700;color:#333}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(184,115,51,.34);background:#fff;border-radius:12px;padding:10px 11px;color:#111}.field.full{grid-column:1/-1}.takeoff-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result-card{border:1px solid rgba(184,115,51,.34);border-radius:14px;background:#fff;box-shadow:var(--shadow-soft);padding:15px}.result-card span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.10em;color:#555}.result-card strong{display:block;margin-top:7px;font-size:25px;font-weight:700}.takeoff-row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media(max-width:1300px){.hero{grid-template-columns:270px 1fr}.jackson{width:235px}.title{font-size:48px}.summary{grid-template-columns:repeat(2,1fr)}.map-lines{display:none}.map-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.bubble,.callout{grid-column:auto!important;grid-row:auto!important}.module-strip{grid-template-columns:repeat(4,1fr)}.grid.four{grid-template-columns:repeat(2,1fr)}.ops-row,.takeoff-layout{grid-template-columns:1fr}.ops-row{padding:0 18px 20px}}
@media(max-width:760px){.app{padding:6px}.shell{width:calc(100vw - 12px)}.hero{grid-template-columns:1fr;padding:18px}.jackson-area{min-height:210px}.title{font-size:38px}.summary,.grid.four,.grid.three,.takeoff-form,.takeoff-results{grid-template-columns:1fr}.section,.page{padding:20px 18px}.module-strip{grid-template-columns:repeat(2,1fr)}}

/* Ωboy V0.21.5 — packet treatment, detail views, xlsx export */
.pipeline-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pipeline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pipeline-actions .action{padding:8px 11px;font-size:12px}
.pipeline-actions .action.rfi{border-color:#0f766e;color:#0f766e}
.pipeline-actions .action.co{border-color:#c92525;color:#c92525}
.pipeline-actions .action.watch{border-color:#b87333;color:#7a3f16}
.pipeline-actions .action.procure{border-color:#6d4aa8;color:#513586}
.pipeline-actions .action.schedule{border-color:#0f5d80;color:#0f5d80}
.packet-detail-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.detail-hero{padding:20px}
.detail-hero h2{margin:8px 0 10px;font-size:30px;line-height:1.08;letter-spacing:-.04em}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.detail-section{padding:17px;margin-top:14px}
.detail-section h3{margin:0 0 8px;font-size:18px}
.detail-list{margin:0;padding-left:18px;color:#333;line-height:1.55}
.pipeline-status{display:grid;gap:10px;margin-top:12px}
.pipeline-status .item{margin:0}
.trace-box{background:#fff;border:1px solid rgba(184,115,51,.30);border-radius:14px;padding:14px;line-height:1.5;color:#333}
.export-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.xlsx-badge{display:inline-flex;border:1px solid rgba(15,118,110,.45);background:#eefbf8;color:#0f766e;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}
@media(max-width:1000px){.pipeline-grid,.packet-detail-layout{grid-template-columns:1fr}}


/* Ωboy V0.21.6 — asset hardening, equation popovers, manual intake, feature linkage */
.eq-popover{
  position:fixed;
  z-index:99999;
  max-width:min(460px,86vw);
  background:#101010;
  color:#fffdf5;
  border:1px solid var(--copper);
  border-radius:16px;
  padding:14px 15px;
  box-shadow:0 24px 54px rgba(0,0,0,.24);
  font-size:12px;
  line-height:1.48;
  white-space:pre-line;
}
.eq-popover b{display:block;margin-bottom:5px;color:#fff}
.eq-popover button{
  margin-top:10px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
}
.info{cursor:pointer}
.info:hover{background:#fff8ef}
.upload-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.upload-card{
  padding:20px;
}
.upload-card input[type=file]{
  width:100%;
  border:1px dashed rgba(184,115,51,.45);
  background:#fffdf8;
  border-radius:14px;
  padding:18px;
}
.upload-card textarea{
  min-height:130px;
}
.feature-map{
  display:grid;
  gap:14px;
}
.feature-row{
  display:grid;
  grid-template-columns:220px 1fr 1fr 180px;
  gap:10px;
  align-items:stretch;
  border:1px solid rgba(184,115,51,.30);
  background:#fff;
  border-radius:16px;
  padding:12px;
  box-shadow:var(--shadow-soft);
}
.feature-row h3{
  margin:0;
  font-size:15px;
}
.feature-row p{
  margin:0;
  color:#444;
  line-height:1.45;
  font-size:13px;
}
.health-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:6px 9px;
  font-size:12px;
  font-weight:700;
  border:1px solid rgba(15,118,110,.35);
  color:#0f766e;
  background:#eefbf8;
}
.health-pill.warn{
  border-color:rgba(201,37,37,.35);
  color:#c92525;
  background:#fff0f0;
}
.mascot-fallback{
  width:285px;
  height:310px;
  display:grid;
  place-items:center;
  border:1px solid rgba(184,115,51,.30);
  border-radius:28px;
  background:#fff;
  color:#7a3f16;
  font-weight:700;
  text-align:center;
  padding:20px;
}
@media(max-width:1000px){
  .upload-grid,.feature-row{grid-template-columns:1fr}
}

/* Ωboy V0.22.0 — reports, manpower, drawing intel, close-out */
.action.danger{border-color:rgba(201,37,37,.55);color:var(--red)}
.action.danger:hover{background:#fff4f4}
.mini-select{border:1px solid rgba(184,115,51,.34);background:#fff;border-radius:999px;padding:5px 8px;font-size:12px;color:#111}
.cell-late{color:var(--red);font-weight:700}
.cell-good{color:var(--teal);font-weight:700}
.badge-ok{border-color:rgba(15,118,110,.45);background:#eefbf8;color:var(--teal)}
.badge-warn{border-color:rgba(201,37,37,.4);background:#fff4f4;color:var(--red)}
.resolved-box{border-color:rgba(15,118,110,.4)}
.kpi strong.pos{color:var(--teal)}
.kpi strong.neg{color:var(--red)}
.kpi strong.pf.good{color:var(--teal)}
.kpi strong.pf.warn{color:var(--copper-dark)}
.kpi strong.pf.bad{color:var(--red)}
.chart-wrap{width:100%;overflow-x:auto;margin-top:14px}
.mp-chart{width:100%;min-width:640px;height:auto;display:block}
.mp-chart text{stroke:none}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#444}
.legend i.sw{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.sw.plan{background:rgba(184,115,51,.35);border:1px solid rgba(184,115,51,.7)}
.legend i.sw.earn{background:var(--teal)}
.legend i.sw.act{background:var(--red)}
.ohm-toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);z-index:100000;
  background:#101010;color:#fffdf5;border:1px solid var(--copper);border-radius:14px;
  padding:12px 18px;font-size:13px;max-width:min(620px,90vw);box-shadow:0 20px 46px rgba(0,0,0,.26);
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.ohm-toast.show{opacity:1;transform:translate(-50%,0)}
.ohm-toast.bad{border-color:var(--red)}
@media(max-width:1300px){.module-strip{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.module-strip{grid-template-columns:repeat(2,1fr)}}

/* Ωboy V0.25.0 — command map: vitals bar, one-line, node cards, training, circuit tracker */

/* overflow:hidden on the shell made it a scroll container, which stops
   position:sticky from holding to the viewport. clip keeps the rounded
   corners without that side effect. */
.shell{overflow:clip}
.topbar{position:sticky;top:0;z-index:60;gap:0;padding:0 20px 0 124px;background:rgba(255,255,251,.96);backdrop-filter:blur(10px)}
.topbar .datepill{margin-left:14px;flex:0 0 auto;white-space:nowrap}
.topbar .bell{margin-left:12px;flex:0 0 auto}
.floating-home{top:14px;padding:7px 13px}
.vitals{flex:1 1 auto;min-width:0;align-self:stretch;display:flex;overflow-x:auto;scrollbar-width:none}
.vitals::-webkit-scrollbar{display:none}
.vital{flex:0 0 auto;display:grid;align-content:center;gap:1px;padding:0 15px;border:0;border-left:1px solid rgba(184,115,51,.16);background:none;text-align:left;color:#111}
.vital:hover{background:#fff8ef}
.vital span{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:#666;white-space:nowrap}
.vital b{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2}
.vital b.good{color:var(--teal)}.vital b.bad{color:var(--red)}.vital b.warn{color:var(--copper-dark)}
.vital b i{font-style:normal;font-size:11px;margin-left:5px;color:var(--red)}
.vital em{font-style:normal;font-size:8.5px;font-weight:700;color:var(--red);margin-left:5px;letter-spacing:.08em;vertical-align:2px}

.note-warn{border-color:rgba(201,37,37,.4);background:#fffaf8}
.note-warn h2{color:var(--red)}
.linklike{border:0;background:none;padding:0;color:var(--copper-dark);text-decoration:underline;text-decoration-color:rgba(184,115,51,.45);text-underline-offset:3px;text-align:left;font-weight:400}
.linklike:hover{color:#111}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#333}
.action:disabled{opacity:.4;cursor:default}
.action.big{padding:13px 22px;font-size:15px}
.kpi strong small{font-size:15px;font-weight:400;color:#666}
kbd{font:inherit;font-size:11px;font-weight:400;border:1px solid currentColor;border-radius:5px;padding:1px 5px;margin-left:8px;opacity:.65}

/* status language shared by the one-line, node cards and lists */
.st-ok{--st:var(--teal)}.st-watch{--st:var(--copper)}.st-trip{--st:var(--red)}.st-none{--st:#b9b4aa}
.st-dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--st);flex:0 0 auto}
.st-dot.st-trip{background:#fff;box-shadow:inset 0 0 0 2px var(--red)}
.st-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--st);color:#111;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;margin-right:8px;background:#fff}

/* one-line */
.ol-headrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.ol-wrap{margin-top:14px;border:1px solid rgba(184,115,51,.28);border-radius:14px;overflow-x:auto;
  background:linear-gradient(rgba(184,115,51,.05) 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,rgba(184,115,51,.05) 1px,transparent 1px) 0 0/28px 28px,#fffefa}
.ol-svg{display:block;width:100%;min-width:1040px;height:auto}
.ol-svg text{stroke:none;fill:#111}
.ol-title{font-size:17px;font-weight:700}
.ol-meta{font-size:11.5px;fill:#5b5b5b!important}
.ol-area-name{font-size:14px;font-weight:700;letter-spacing:.01em}
.ol-name{font-size:12px;font-weight:700}
.ol-sub{font-size:10.5px;fill:#5b5b5b!important}
.ol-wire{stroke:#111;stroke-width:1.4;fill:none}
.ol-riser{stroke-width:2.2}
.ol-bus{stroke:#111;stroke-width:4;stroke-linecap:butt;fill:none}
.ol-bus.thin{stroke-width:2.2;stroke-linejoin:miter}
.ol-src{fill:#fff;stroke:#111;stroke-width:1.6}
.ol-main{fill:#111;stroke:#111}
.ol-hit{fill:transparent;stroke:none}
.ol-node{cursor:pointer}
.ol-node:focus{outline:none}
.ol-brk{fill:var(--st);stroke:var(--st);stroke-width:1.4}
.ol-brk.open{fill:#fff}
.ol-slash{stroke:var(--red);stroke-width:2;fill:none}
.ol-st-trip .ol-feed{stroke:var(--red);stroke-dasharray:3 3}
.ol-box{fill:#fff;stroke:rgba(184,115,51,.62);stroke-width:1.2}
.ol-tab{fill:var(--st);stroke:none}
.ol-node:hover .ol-box,.ol-node:focus-visible .ol-box{stroke:#111;stroke-width:1.7}
.ol-area:hover .ol-area-name,.ol-area:focus-visible .ol-area-name{text-decoration:underline}
.ol-st-ok{--st:var(--teal)}.ol-st-watch{--st:var(--copper)}.ol-st-trip{--st:var(--red)}.ol-st-none{--st:#b9b4aa}
.ol-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:#444}
.ol-legend span{display:inline-flex;align-items:center;gap:7px}
.ol-list{display:none;margin-top:14px}
.ol-l-area{border:1px solid rgba(184,115,51,.3);border-radius:14px;background:#fff;overflow:hidden;margin-bottom:12px}
.ol-l-row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid rgba(184,115,51,.16);background:#fff;padding:13px 14px;text-align:left;color:#111}
.ol-l-row.area{border-top:0;background:#fffdf8;font-weight:700}
.ol-l-row:not(.area){padding-left:26px}
.ol-l-row .nm{flex:1 1 auto;min-width:0}
.ol-l-row .mt{flex:0 0 auto;font-size:12px;color:#666;font-weight:400}

/* node card */
.node-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap}
.node-head h1{margin:2px 0 0;font-size:42px;font-weight:300;letter-spacing:-.05em;line-height:1.05}
.node-head .sub{margin:10px 0 0}
.crumb{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#666}
.crumb .linklike{font-size:12px;text-transform:uppercase;letter-spacing:.12em}
.node-nav{display:flex;gap:8px;flex-wrap:wrap}
.six-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.six-card{padding:18px 18px 13px;display:flex;flex-direction:column;min-height:236px}
.six-head{display:flex;align-items:center;gap:10px}
.six-n{width:26px;height:26px;border-radius:999px;border:1.5px solid var(--copper);color:var(--copper-dark);display:inline-grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 auto}
.six-head h3{margin:0;font-size:17px;font-weight:700}
.six-ask{margin:5px 0 12px;color:#666;font-size:12px}
.six-big{font-size:30px;font-weight:300;letter-spacing:-.035em;line-height:1.05;margin-bottom:10px}
.six-big small{display:block;font-size:12px;letter-spacing:0;color:#555;font-weight:400;margin-top:5px}
.six-lead{font-size:14px;line-height:1.45;margin-bottom:10px}
.kv{display:grid;grid-template-columns:minmax(92px,36%) 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(184,115,51,.15);font-size:13px;line-height:1.4}
.kv>span{color:#555}
.kv>b{font-weight:400;color:#111;overflow-wrap:anywhere}
.kv>b.bad,.t-bad{color:var(--red);font-weight:700}
.kv>b.good,.t-good{color:var(--teal);font-weight:700}
.kv small,.li small{color:#666;font-weight:400}
.kv small.bad,.li small.bad{color:var(--red);font-weight:700}
.li{padding:6px 0;border-top:1px solid rgba(184,115,51,.15);font-size:13px;line-height:1.4;overflow-wrap:anywhere}
.nil{color:#8a8578;font-style:italic;margin:0;font-size:13px}
.six-src{margin-top:auto;padding-top:12px;font-size:10.5px;color:#8a8578}
.lvl{display:inline-block;min-width:54px;text-align:center;border-radius:999px;border:1px solid #b9b4aa;font-size:10.5px;font-weight:700;padding:2px 7px;margin-right:8px;color:#444;background:#fff}
.lvl.High{border-color:var(--red);color:var(--red)}
.lvl.Medium{border-color:var(--copper);color:var(--copper-dark)}
.lvl.pk{border-color:rgba(184,115,51,.5);background:#fff8ef}
.node-edit summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.node-edit summary::-webkit-details-marker{display:none}
.node-edit summary h2{margin:0;font-size:20px}
.node-edit summary h2::before{content:"+";display:inline-block;width:18px;color:var(--copper-dark)}
.node-edit[open] summary h2::before{content:"–"}
.node-edit textarea{min-height:74px}

/* map editor */
.map-area{margin-top:16px}
.map-area-head{display:flex;gap:10px;align-items:center}
.map-area-meta{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin:12px 0}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.map-area-meta label{font-size:12px;font-weight:700;color:#333;display:grid;gap:5px}
.map-in{width:100%;border:1px solid rgba(184,115,51,.34);background:#fff;border-radius:10px;padding:8px 10px;color:#111;min-width:0}
.map-in.map-name{font-size:18px;font-weight:700;flex:1 1 auto}
.map-table td{vertical-align:middle}
.map-mv{display:inline-flex;gap:3px}
.mini-btn{border:1px solid rgba(184,115,51,.4);background:#fff;border-radius:7px;width:26px;height:26px;font-size:10px;color:#444;padding:0}
.mini-btn:hover{background:#fff8ef}
.map-row-act{white-space:nowrap}
.map-row-act .action,.map-row-act .grade{padding:6px 10px;font-size:12px;margin-left:4px}
.mini-select{max-width:260px}

/* walk + drill */
.walk-top{display:flex;align-items:center;gap:14px;font-size:13px;color:#444}
.walk-prog{flex:1 1 auto;height:6px;border-radius:999px;background:rgba(184,115,51,.18);overflow:hidden}
.walk-prog i{display:block;height:100%;background:var(--copper);border-radius:999px;transition:width .2s ease}
.walk-ask{margin-top:20px}
.walk-list{margin:14px 0 4px;padding:0;list-style:none;counter-reset:w;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.walk-list li{counter-increment:w;border:1px solid rgba(184,115,51,.3);border-radius:14px;padding:14px 14px 14px 50px;position:relative;background:#fff}
.walk-list li::before{content:counter(w);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:999px;border:1.5px solid var(--copper);color:var(--copper-dark);display:grid;place-items:center;font-size:13px;font-weight:700}
.walk-list li b{display:block;font-size:16px}
.walk-list li span{display:block;font-size:12px;color:#666;margin-top:3px}
.grade-row{display:flex;gap:8px;margin-top:12px}
.six-card .grade-row+.six-src{display:none}
.grade{border:1px solid rgba(184,115,51,.5);background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:#111}
.grade.hit{border-color:rgba(15,118,110,.55);color:var(--teal)}
.grade.miss{border-color:rgba(201,37,37,.5);color:var(--red)}
.grade.hit.on,.grade.hit:hover{background:var(--teal);color:#fff}
.grade.miss.on,.grade.miss:hover{background:var(--red);color:#fff}
.grade.big{padding:13px 26px;font-size:15px}
.six-card.g-hit{border-color:rgba(15,118,110,.7)}
.six-card.g-miss{border-color:rgba(201,37,37,.7);background:#fffafa}
.drill-stage{margin-top:20px;padding:28px 30px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.drill-q h1{margin:4px 0 14px;font-size:46px;font-weight:300;letter-spacing:-.05em;line-height:1.05}
.drill-slot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
.drill-slot b{font-size:20px}
.drill-slot span:last-child{color:#555}
.drill-clock{position:relative;width:112px;height:112px;flex:0 0 auto}
.drill-clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.drill-clock .trk{stroke:rgba(184,115,51,.2);stroke-width:6}
.drill-clock .run{stroke:var(--copper);stroke-width:6;stroke-linecap:butt;transition:stroke-dashoffset .15s linear}
.drill-clock b{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:300;font-variant-numeric:tabular-nums}
.drill-time{font-size:34px;font-weight:300;color:var(--teal);flex:0 0 auto;font-variant-numeric:tabular-nums}
.drill-time.bad{color:var(--red);font-weight:300}
.drill-answer{margin-top:16px;min-height:0}
.drill-actions{justify-content:center;margin-top:20px}
.drill-hint{text-align:center;margin-top:10px!important}

/* circuit tracker */
.module-strip{grid-template-columns:repeat(9,minmax(0,1fr))}
.pbar{display:block;height:6px;border-radius:3px;background:rgba(184,115,51,.17);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--teal);border-radius:3px}
.pbar.mini{display:inline-block;width:60px;vertical-align:middle}
.pbar.thin{height:5px}
.card.kpi.key{box-shadow:inset 0 3px 0 var(--teal),var(--shadow-soft)}
#circuitBoard .node-head{margin-bottom:16px}
.ckt-findrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ckt-q{flex:1 1 320px;min-width:0;font:inherit;font-size:17px;padding:12px 16px;border:1px solid rgba(184,115,51,.45);border-radius:12px;background:#fff;color:#111}
.ckt-q:focus{outline:2px solid var(--teal);outline-offset:1px}
.ckt-findrow .mini-select{max-width:230px}
.ckt-hint{margin:0!important}
.ckt-row{cursor:pointer}
.ckt-row:hover td,.ckt-row:focus td{background:#fff8ef}
.ckt-row:focus{outline:0}
.ckt-ov{font-variant-numeric:tabular-nums;font-size:12px;color:#444;margin-left:6px}
.ms-dots{display:inline-flex;gap:3px;vertical-align:middle}
.ms-dots i{width:9px;height:9px;border-radius:2px;background:rgba(184,115,51,.2)}
.ms-dots i.dpart{background:var(--copper)}
.ms-dots i.d100{background:var(--teal)}
.ph{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;border:1px solid rgba(184,115,51,.45);white-space:nowrap;background:#fff}
.ph-done{border-color:var(--teal);color:var(--teal)}
.ph-none{color:#777;border-color:#d8d2c8}
.ph-run{color:var(--copper-dark)}
.ms-strip{display:grid;gap:16px 20px;margin-top:14px}
.ms-col{display:grid;gap:4px;align-content:start}
.ms-col span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#666}
.ms-col strong{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.ms-col strong small{font-size:12px;font-weight:700}
.ms-col small{font-size:12px;color:#555}
.ms-col small.w{color:#8a8378}
.ms-col.key span{color:var(--teal);font-weight:700}
.ms-strip.slim .ms-col strong{font-size:18px}
.ph-list{display:grid;gap:2px;margin-top:12px}
.ph-row{display:grid;grid-template-columns:190px minmax(40px,1fr) 56px;gap:12px;align-items:center;border:0;background:none;padding:6px 8px;border-radius:8px;text-align:left;color:#111}
.ph-row:hover,.ph-row.on{background:#fff8ef}
.ph-row.on{box-shadow:inset 3px 0 0 var(--copper)}
.ph-row b{text-align:right;font-variant-numeric:tabular-nums}
.bd-group{margin-top:14px;padding-top:12px;border-top:1px solid rgba(184,115,51,.2)}
.bd-ghead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.bd-ghead b{font-size:17px;min-width:44px}
.bd-ghead span{font-size:13px;color:#555;flex:1 1 260px}
.bd-ghead .mini-select{max-width:260px}
.bd-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bd-chip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;align-items:baseline;text-align:left;border:1px solid rgba(184,115,51,.35);background:#fff;border-radius:10px;padding:8px 10px;color:#111}
.bd-chip:hover{border-color:#111;background:#fffdf8}
.bd-chip b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-chip small{font-size:11px;color:#666;white-space:nowrap}
.bd-chip .pbar{align-self:center}
.bd-chip em{font-style:normal;font-size:11.5px;font-variant-numeric:tabular-nums;color:#333}
.bd-chip.done{border-color:var(--teal)}
.ckt-scroll{overflow-x:auto}
.ckt-edit td,.ckt-edit th{padding-left:8px;padding-right:8px}
.ckt-edit th.msh{font-size:11px;max-width:96px;white-space:normal;line-height:1.2}
.ckt-edit th.msh.key{color:var(--teal)}
.ms-sel,.ms-all{font:inherit;font-size:13px;width:64px;padding:5px 4px;border:1px solid rgba(184,115,51,.4);border-radius:7px;background:#fff;color:#111;font-variant-numeric:tabular-nums}
.ms-sel.v100{background:#e3f3f0;border-color:var(--teal);font-weight:700}
.ms-sel.vpart{background:#fdf3e4}
.ms-sel.mine{box-shadow:inset 3px 0 0 var(--copper)}
.ms-all{color:#666}
tr.setall td{background:#fdfaf4;font-size:12px;color:#666}
tr.hi td{background:#fff3d6}
.ckt-go{font-size:12px;margin-left:6px;white-space:nowrap}

@media(max-width:1300px){
  .module-strip{grid-template-columns:repeat(4,1fr)}
  .six-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .walk-list{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .module-strip{grid-template-columns:repeat(2,1fr)}
  .ph-row{grid-template-columns:150px minmax(30px,1fr) 44px}
  .ms-strip{grid-template-columns:repeat(2,minmax(0,1fr))!important}
  .topbar{padding:0 10px 0 112px}
  .topbar .datepill{display:none}
  .six-grid,.walk-list,.map-area-meta,.grid.two{grid-template-columns:1fr}
  .six-card{min-height:0}
  .ol-wrap{display:none}
  .ol-list{display:block}
  .node-head h1,.drill-q h1{font-size:32px}
  .drill-stage{flex-direction:column;align-items:flex-start;padding:20px}
  .map-area-head{flex-wrap:wrap}
  .log-table{display:block;overflow-x:auto}
}

</style>
</head>
<body>
<button class="floating-home" id="homeBtn">← Cockpit</button>
<div class="app"><main class="shell">

</main></div>

const API = {health:"/.netlify/functions/procore-health",mockDrawing:"/.netlify/functions/procore-mock-event",mockSchedule:"/.netlify/functions/procore-mock-event?kind=schedule"};
const STORAGE_KEY = "ohmboy_v0230_state";
/* Earlier builds moved the key every release, which reset the PM's data on
   every deploy. From v0.23 a missing save is adopted from the newest older
   key instead. Add the outgoing key to the front of this list when the
   key next changes. */
const LEGACY_KEYS = ["ohmboy_v0220_state"];
const state = loadState();
function seedState(){return {
  packets:[],rawEvents:[],normalized:[],audit:[],rfi:[],co:[],pmDays:[],takeoffs:[],
  reports:{openPO:null,aging:null},
  schedule:{fileName:null,sheet:null,headerRow:0,uploadedAt:null,activities:[]},
  drawings:[],
  manpower:{projectName:"",startDate:"",finishDate:"",estimatedHours:0,hoursPerWeek:40,peakSkew:0.5,spread:0.21,entries:{}},
  /* These five figures are placeholders. source stays "demo" until a cost
     report is loaded ("report") or the PM saves real ones in Job Setup
     ("manual"); every screen that shows them says so. */
  financial:{originalContract:24750000,approvedCO:1325000,pendingCO:0,costToDate:11842000,eac:26480000,openPO:0,aging:{net30:0,net60:0,net90:0,net120:0},source:"demo",asOf:""},
  job:{name:"",number:"",gc:"",keyDates:[]},
  sov:{fileName:null,sheet:null,headerRow:0,uploadedAt:null,lines:[],matched:[],missing:[],dropped:0},
  wbs:{fileName:null,sheet:null,uploadedAt:null,lines:[],subtotals:{},sheetTotal:null},
  cr:{fileName:null,uploadedAt:null,asOf:"",asOfText:"",month:"",job:{},lines:[],subtotals:{},total:null,gp:null,composite:null,prior:null},
  ckt:{fileName:null,uploadedAt:null,title:"",ms:[],feeders:[],branch:[],spares:{},spareTotal:0,edits:{},last:null,dashAvg:null,tags:{},rev:0},
  map:{nodes:[],updatedAt:null},
  links:{},
  training:{cards:{},walks:[],sessions:[]},
  predictions:[],
  lastBackup:""
};}
function loadState(){try{
  /* Runs before the rest of this script is initialised. Use literals and the
     two consts above only — touching anything declared further down throws
     here and the catch would hand back a blank state. */
  let raw=localStorage.getItem(STORAGE_KEY);
  if(!raw){for(const k of LEGACY_KEYS){raw=localStorage.getItem(k);if(raw)break;}}
  const saved=JSON.parse(raw);
  if(!saved)return seedState();
  const base=seedState();
  const fin={...base.financial,...(saved.financial||{}),aging:{...base.financial.aging,...((saved.financial||{}).aging||{})}};
  // Saves from before v0.23 carry no source flag. Nothing could edit these
  // figures then, so untouched placeholder values are still the demo set.
  if(!(saved.financial||{}).source) fin.source=(fin.originalContract===24750000&&fin.costToDate===11842000&&fin.eac===26480000)?"demo":"manual";
  // Deep-merge the nested objects so a save from an older build still boots
  // with the new collections present instead of throwing on first render.
  return {...base,...saved,
    reports:{...base.reports,...(saved.reports||{})},
    schedule:{...base.schedule,...(saved.schedule||{})},
    drawings:saved.drawings||[],
    manpower:{...base.manpower,...(saved.manpower||{}),entries:{...((saved.manpower||{}).entries||{})}},
    financial:fin,
    job:{...base.job,...(saved.job||{}),keyDates:(saved.job||{}).keyDates||[]},
    sov:{...base.sov,...(saved.sov||{}),lines:(saved.sov||{}).lines||[]},
    wbs:{...base.wbs,...(saved.wbs||{}),lines:(saved.wbs||{}).lines||[],subtotals:(saved.wbs||{}).subtotals||{}},
    cr:{...base.cr,...(saved.cr||{}),lines:(saved.cr||{}).lines||[],subtotals:(saved.cr||{}).subtotals||{},job:(saved.cr||{}).job||{}},
    ckt:{...base.ckt,...(saved.ckt||{}),ms:(saved.ckt||{}).ms||[],feeders:(saved.ckt||{}).feeders||[],branch:(saved.ckt||{}).branch||[],spares:(saved.ckt||{}).spares||{},edits:(saved.ckt||{}).edits||{},tags:(saved.ckt||{}).tags||{}},
    map:{...base.map,...(saved.map||{}),nodes:(saved.map||{}).nodes||[]},
    links:saved.links||{},
    training:{cards:(saved.training||{}).cards||{},walks:(saved.training||{}).walks||[],sessions:(saved.training||{}).sessions||[]},
    predictions:saved.predictions||[]
  };
}catch(e){
  // An unreadable save is set aside, not overwritten by the next save().
  try{const bad=localStorage.getItem(STORAGE_KEY);if(bad)localStorage.setItem("ohmboy_unreadable_save",bad);}catch(_){}
  return seedState();
}}
function save(){
  const data=JSON.stringify(state);
  try{localStorage.setItem(STORAGE_KEY,data);}
  catch(e){
    // Out of room. The adopted pre-v0.23 save is the one thing safe to drop;
    // it is otherwise left alone so a rollback to v0.22 still finds its data.
    try{LEGACY_KEYS.forEach(k=>localStorage.removeItem(k));localStorage.setItem(STORAGE_KEY,data);}
    catch(e2){toast("Could not save — this browser's storage is full or blocked. Download a backup from Job Setup now.","bad");}
  }
}
function $(id){return document.getElementById(id);}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v){const n=Math.round(Number(v||0));return (n<0?"−":"")+"$"+Math.abs(n).toLocaleString();}
function feet(v){return Math.round(Number(v||0)).toLocaleString()+" LF";}
function qty(v){return Math.round(Number(v||0)).toLocaleString();}

function crc32(bytes){
  let table = crc32.table;
  if(!table){
    table = crc32.table = Array.from({length:256},(_,n)=>{
      let c=n;
      for(let k=0;k<8;k++) c = c&1 ? 0xedb88320 ^ (c>>>1) : c>>>1;
      return c>>>0;
    });
  }
  let crc = -1;
  for(let i=0;i<bytes.length;i++) crc = (crc>>>8) ^ table[(crc ^ bytes[i]) & 255];
  return (crc ^ -1) >>> 0;
}
/* Builds a STORED (uncompressed) ZIP, which is a valid .xlsx container.
   Field offsets follow APPNOTE 4.3.7 / 4.3.12 exactly:
     local header  30 bytes + filename
     central dir   46 bytes + filename
     end of CD     22 bytes                                            */
function zipStore(files){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;

  for(const f of files){
    const name = enc.encode(f.name);
    const data = enc.encode(f.data);
    const crc = crc32(data);

    const lh = new Uint8Array(30 + name.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);   // signature
    lv.setUint16(4, 20, true);           // version needed
    lv.setUint16(6, 0, true);            // flags
    lv.setUint16(8, 0, true);            // method 0 = stored
    lv.setUint16(10, 0, true);           // mod time
    lv.setUint16(12, 0, true);           // mod date
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true); // compressed size
    lv.setUint32(22, data.length, true); // uncompressed size
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);           // extra field length
    lh.set(name, 30);
    parts.push(lh, data);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);   // signature
    cv.setUint16(4, 20, true);           // version made by
    cv.setUint16(6, 20, true);           // version needed
    cv.setUint16(8, 0, true);            // flags
    cv.setUint16(10, 0, true);           // method
    cv.setUint16(12, 0, true);           // mod time
    cv.setUint16(14, 0, true);           // mod date
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint16(30, 0, true);           // extra length
    cv.setUint16(32, 0, true);           // comment length
    cv.setUint16(34, 0, true);           // disk number start
    cv.setUint16(36, 0, true);           // internal attrs
    cv.setUint32(38, 0, true);           // external attrs
    cv.setUint32(42, offset, true);      // local header offset
    ch.set(name, 46);
    central.push(ch);

    offset += lh.length + data.length;
  }

  const cdSize = central.reduce((s,c)=>s+c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);              // this disk
  ev.setUint16(6, 0, true);              // disk with central dir
  ev.setUint16(8, files.length, true);   // entries on this disk
  ev.setUint16(10, files.length, true);  // total entries
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);             // comment length

  const all = [...parts, ...central, eocd];
  const out = new Uint8Array(all.reduce((s,a)=>s+a.length, 0));
  let p = 0;
  for(const a of all){ out.set(a, p); p += a.length; }
  return out;
}
function colRef(c){
  // Beyond column Z the old String.fromCharCode(65+c) produced junk like "[".
  let s = "";
  c += 1;
  while(c > 0){ const m = (c - 1) % 26; s = String.fromCharCode(65 + m) + s; c = (c - 1 - m) / 26; }
  return s;
}
function sheetXml(rows){
  const cellRef = (c,r) => colRef(c) + (r + 1);
  const cell = (v,c,r) => {
    const ref = cellRef(c,r);
    // Real numbers as numbers, so Excel can sum and sort them.
    if(v !== "" && v !== null && v !== undefined && typeof v !== "boolean" && isFinite(Number(v)) && String(v).trim() !== ""){
      return `<c r="${ref}"><v>${Number(v)}</v></c>`;
    }
    return `<c r="${ref}" t="inlineStr"><is><t>${xmlEscape(v)}</t></is></c>`;
  };
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>cell(v,c,r)).join("")}</row>`).join("")}</sheetData></worksheet>`;
}

function normalizeManualIntake(kind, name, text){
  const isSchedule = kind === "schedule";
  const title = isSchedule ? `Manual Schedule Upload — ${name || "Schedule File"}` : `Manual Drawing Upload — ${name || "Drawing File"}`;
  const score = isSchedule ? 82 : 88;
  const summary = isSchedule
    ? "Manual schedule upload received. Review activity changes, critical path movement, resequence exposure, and manpower compression."
    : "Manual drawing upload received. Review revision deltas, scope conflicts, procurement exposure, RFI need, and potential CO impact.";
  const packet = {
    id: uid("PKT"),
    type: isSchedule ? "schedule" : "drawing",
    title,
    summary,
    score,
    moneyAtRisk: isSchedule ? 25000 : 35000,
    status: "open",
    createdAt: new Date().toLocaleString(),
    treatments: {},
    raw: { manualUpload: true, fileName: name || "", extractedText: text || "" }
  };
  state.packets.push(packet);
  state.rawEvents.push({ eventType: isSchedule ? "manual.schedule.upload" : "manual.drawing.upload", title, summary, raw: packet.raw });
  state.normalized.push(packet);
  addAudit(isSchedule ? "Manual Schedule Upload" : "Manual Drawing Upload", title, summary);
  /* No auto RFI. The RFI Log is PM manual entry — see item 5. */
  save();
  renderAll();
  renderPacketDetail(packet.id);
  navigate("packetDetail");
}
function handleManualUpload(kind){
  const fileEl = kind==="schedule" ? $("manualScheduleFile") : $("manualDrawingFile");
  const notesEl = kind==="schedule" ? $("manualScheduleNotes") : $("manualDrawingNotes");
  const file = fileEl && fileEl.files ? fileEl.files[0] : null;
  const notes = notesEl ? notesEl.value : "";
  if(!file){
    normalizeManualIntake(kind, "manual entry", notes);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || "").slice(0, 6000);
    normalizeManualIntake(kind, file.name, notes + "\n\n" + text);
  };
  if(/\.(txt|csv|json|xml|log)$/i.test(file.name)){
    reader.readAsText(file);
  }else{
    normalizeManualIntake(kind, file.name, notes + "\nBinary/PDF/DWG placeholder captured. Use Manual Compare or Drawing Takeoff to enter measured deltas.");
  }
}

function todayISO(){ return localISO(); }   // the local calendar day; toISOString() rolls to tomorrow in the evening
/* P6 exports mark actual dates "05-Oct-26 A" and constrained dates
   "05-Oct-26*". new Date() rejects the first outright, which silently turned
   off slip detection for every started activity. Markers are stripped, and
   day-month-year and US slash dates are built as UTC midnight so they agree
   with ISO dates and day arithmetic never crosses a DST change. */
const MONTH_IDX = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDate(v){
  if(v instanceof Date) return isNaN(v)?null:v;
  let s=String(v??"").trim();
  if(!s) return null;
  s=s.replace(/\s+[A-Za-z]$/,"").replace(/\*+$/,"").trim();
  const yr=(y)=>{ y=Number(y); return y<100?(y<70?2000+y:1900+y):y; };
  let m=/^(\d{1,2})[-\s\/]([A-Za-z]{3})[A-Za-z]*[-\s\/,]+(\d{2,4})\b/.exec(s);
  if(m && MONTH_IDX[m[2].toLowerCase()]!==undefined) return new Date(Date.UTC(yr(m[3]),MONTH_IDX[m[2].toLowerCase()],Number(m[1])));
  m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/.exec(s);
  if(m && Number(m[1])>=1 && Number(m[1])<=12 && Number(m[2])>=1 && Number(m[2])<=31) return new Date(Date.UTC(yr(m[3]),Number(m[1])-1,Number(m[2])));
  const d=new Date(s); return isNaN(d)?null:d;
}
function fmtDate(v){ const d=parseDate(v); return d?d.toISOString().slice(0,10):String(v||""); }
function hours(v){ return Math.round(Number(v||0)).toLocaleString()+" hrs"; }
function val(id,dflt){ const el=$(id); return el?el.value:(dflt??""); }
function confirmAction(msg){ return window.confirm(msg); }

/* Toast — quiet confirmation so uploads don't silently no-op. */
function toast(msg,kind){
  let t=$("ohmToast");
  if(!t){ t=document.createElement("div"); t.id="ohmToast"; t.className="ohm-toast"; document.body.appendChild(t); }
  t.className="ohm-toast show"+(kind==="bad"?" bad":"");
  t.textContent=msg;
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ t.className="ohm-toast"; },4200);
}

/* ===========================================================================
   Zero-dependency spreadsheet reader — .xlsx and .csv   (items 4 + 6)
   ---------------------------------------------------------------------------
   No SheetJS, no CDN. XLSX is a ZIP of XML and every current browser ships
   DecompressionStream('deflate-raw'), so we can open the container natively.
   That matters here: OhmBoy publishes as a static site with no npm install,
   so anything we can't do in vanilla JS we can't do at all.
   =========================================================================== */

const SHEET = (() => {

  function findEOCD(view, bytes){
    const min = Math.max(0, bytes.length - 65557);      // comment can be 64K
    for(let i = bytes.length - 22; i >= min; i--){
      if(view.getUint32(i, true) === 0x06054b50) return i;
    }
    throw new Error("Not a valid .xlsx file (no ZIP end-of-directory record).");
  }

  function readCentralDirectory(buf){
    const bytes = new Uint8Array(buf), view = new DataView(buf);
    const eocd = findEOCD(view, bytes);
    const count = view.getUint16(eocd + 10, true);
    let ptr = view.getUint32(eocd + 16, true);
    const entries = {};
    for(let i = 0; i < count; i++){
      if(view.getUint32(ptr, true) !== 0x02014b50) break;
      const method   = view.getUint16(ptr + 10, true);
      const compSize = view.getUint32(ptr + 20, true);
      const nameLen  = view.getUint16(ptr + 28, true);
      const extraLen = view.getUint16(ptr + 30, true);
      const cmtLen   = view.getUint16(ptr + 32, true);
      const localOff = view.getUint32(ptr + 42, true);
      const name = new TextDecoder().decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
      entries[name] = { method, compSize, localOff };
      ptr += 46 + nameLen + extraLen + cmtLen;
    }
    return { bytes, view, entries };
  }

  async function inflateRaw(slice){
    const ds = new DecompressionStream("deflate-raw");
    return new Uint8Array(await new Response(new Blob([slice]).stream().pipeThrough(ds)).arrayBuffer());
  }

  async function readEntry(zip, name){
    const e = zip.entries[name];
    if(!e) return null;
    const nameLen  = zip.view.getUint16(e.localOff + 26, true);
    const extraLen = zip.view.getUint16(e.localOff + 28, true);
    const start = e.localOff + 30 + nameLen + extraLen;
    const slice = zip.bytes.subarray(start, start + e.compSize);
    const out = e.method === 0 ? slice : await inflateRaw(slice);
    return new TextDecoder().decode(out);
  }

  const xml = (t) => new DOMParser().parseFromString(t, "application/xml");

  function colIndex(ref){                      // "BC12" -> 54
    let n = 0;
    for(const ch of ref){
      const c = ch.charCodeAt(0);
      if(c < 65 || c > 90) break;
      n = n * 26 + (c - 64);
    }
    return n - 1;
  }

  // Excel dates are days since 1899-12-30. A five-digit serial in a schedule
  // column helps nobody, so date-formatted cells come back as ISO.
  function excelDate(serial){
    const d = new Date(Math.round((serial - 25569) * 86400000));
    return isNaN(d) ? String(serial) : d.toISOString().slice(0,10);
  }

  async function readXlsx(arrayBuffer){
    const zip = readCentralDirectory(arrayBuffer);

    const shared = [];
    const ssRaw = await readEntry(zip, "xl/sharedStrings.xml");
    if(ssRaw){
      for(const si of xml(ssRaw).getElementsByTagName("si")){
        let s = "";                            // <si> may hold many <r><t> runs
        for(const t of si.getElementsByTagName("t")) s += t.textContent;
        shared.push(s);
      }
    }

    const dateStyles = new Set();
    const stylesRaw = await readEntry(zip, "xl/styles.xml");
    if(stylesRaw){
      const sdoc = xml(stylesRaw);
      /* Only the built-in date formats are listed. 164 and up are custom
         formats and can be anything — treating 164–167 as dates turned every
         currency cell in a workbook whose first custom format was "$"#,##0.00
         into a date serial. Custom formats are judged by their code below. */
      const dateFmtIds = new Set([14,15,16,17,22]);
      for(const nf of sdoc.getElementsByTagName("numFmt")){
        const code = nf.getAttribute("formatCode") || "";
        // Judge the bare pattern: quoted literals ("Qty"), [colour]/[locale] tags and
        // escaped characters can all contain d, m or y without meaning a date.
        const bare = code.replace(/"[^"]*"/g,"").replace(/\[[^\]]*\]/g,"").replace(/\\./g,"");
        if(/[dmy]/i.test(bare) && !/[#0?]/.test(bare)){
          dateFmtIds.add(Number(nf.getAttribute("numFmtId")));
        }
      }
      const xfs = sdoc.getElementsByTagName("cellXfs")[0];
      if(xfs){
        Array.from(xfs.getElementsByTagName("xf")).forEach((xf,i)=>{
          if(dateFmtIds.has(Number(xf.getAttribute("numFmtId")))) dateStyles.add(i);
        });
      }
    }

    // Sheet order comes from workbook.xml + rels, not filename guessing.
    const sheets = [];
    const wbRaw  = await readEntry(zip, "xl/workbook.xml");
    const relRaw = await readEntry(zip, "xl/_rels/workbook.xml.rels");
    const relMap = {};
    if(relRaw){
      for(const r of xml(relRaw).getElementsByTagName("Relationship")){
        relMap[r.getAttribute("Id")] = (r.getAttribute("Target")||"").replace(/^\/?xl\//,"");
      }
    }
    if(wbRaw){
      for(const s of xml(wbRaw).getElementsByTagName("sheet")){
        const rid = s.getAttribute("r:id");
        sheets.push({ name: s.getAttribute("name"), path: "xl/" + (relMap[rid] || "worksheets/sheet1.xml") });
      }
    }
    if(!sheets.length) sheets.push({ name:"Sheet1", path:"xl/worksheets/sheet1.xml" });

    const out = [];
    for(const sh of sheets){
      const raw = await readEntry(zip, sh.path);
      if(!raw) continue;
      const rows = [];
      for(const row of xml(raw).getElementsByTagName("row")){
        const cells = [];
        for(const c of row.getElementsByTagName("c")){
          const idx = colIndex(c.getAttribute("r") || "");
          const type = c.getAttribute("t");
          let v = "";
          if(type === "inlineStr"){
            for(const t of c.getElementsByTagName("t")) v += t.textContent;
          } else {
            const vEl = c.getElementsByTagName("v")[0];
            const rawVal = vEl ? vEl.textContent : "";
            if(type === "s") v = shared[Number(rawVal)] ?? "";
            else if(rawVal === "") v = "";
            else {
              const style = Number(c.getAttribute("s") || -1);
              const num = Number(rawVal);
              v = (dateStyles.has(style) && isFinite(num) && num > 1) ? excelDate(num) : rawVal;
            }
          }
          if(idx >= 0) cells[idx] = v;
        }
        for(let i = 0; i < cells.length; i++) if(cells[i] === undefined) cells[i] = "";
        rows.push(cells);
      }
      out.push({ name: sh.name, rows });
    }
    return out;
  }

  function readCsv(text, delim){
    // Sniff the delimiter so tab/semicolon exports don't land in one column.
    if(!delim){
      const head = text.split(/\r?\n/)[0] || "";
      const counts = [",","\t",";","|"].map(d => [d, head.split(d).length]);
      counts.sort((a,b) => b[1] - a[1]);
      delim = counts[0][1] > 1 ? counts[0][0] : ",";
    }
    const rows = [];
    let row = [], field = "", inQ = false;
    for(let i = 0; i < text.length; i++){
      const ch = text[i];
      if(inQ){
        if(ch === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQ = false; }
        else field += ch;
      }
      else if(ch === '"') inQ = true;
      else if(ch === delim){ row.push(field); field = ""; }
      else if(ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(ch !== "\r") field += ch;
    }
    if(field !== "" || row.length){ row.push(field); rows.push(row); }
    return [{ name:"CSV", rows: rows.filter(r => r.some(c => String(c).trim() !== "")) }];
  }

  async function readFile(file){
    const name = (file.name || "").toLowerCase();
    if(/\.(xlsx|xlsm)$/.test(name)) return readXlsx(await file.arrayBuffer());
    if(/\.xls$/.test(name)) throw new Error("Legacy .xls isn't supported — re-save as .xlsx or .csv.");
    return readCsv(await file.text());
  }

  /* Header mapping. Report exports never agree on column names, so match
     each field against aliases instead of demanding a fixed template. */

  function findHeaderRow(rows, aliases){
    const wanted = Object.values(aliases).flat();
    let best = { idx:0, hits:0 };
    for(let i = 0; i < Math.min(rows.length, 25); i++){
      const cells = rows[i].map(c => String(c).toLowerCase().replace(/[^a-z0-9]/g,""));
      const hits = wanted.filter(w => cells.some(c => c && c.includes(w))).length;
      if(hits > best.hits) best = { idx:i, hits };
    }
    return best.hits >= 2 ? best.idx : 0;
  }

  function mapColumns(headerCells, aliases){
    const norm = headerCells.map(c => String(c).toLowerCase().replace(/[^a-z0-9]/g,""));
    const map = {};
    for(const [field, opts] of Object.entries(aliases)){
      let found = -1;
      for(const opt of opts){ found = norm.findIndex(c => c === opt); if(found >= 0) break; }
      if(found < 0){ for(const opt of opts){ found = norm.findIndex(c => c && c.includes(opt)); if(found >= 0) break; } }
      map[field] = found;
    }
    return map;
  }

  function toRecords(rows, aliases){
    if(!rows.length) return { records:[], headerRow:0, map:{}, headers:[] };
    const headerRow = findHeaderRow(rows, aliases);
    const headers = rows[headerRow] || [];
    const map = mapColumns(headers, aliases);
    const records = [];
    for(let i = headerRow + 1; i < rows.length; i++){
      const r = rows[i];
      if(!r || !r.some(c => String(c).trim() !== "")) continue;
      const rec = { _row: i + 1 };
      for(const [field, idx] of Object.entries(map)) rec[field] = idx >= 0 ? String(r[idx] ?? "").trim() : "";
      records.push(rec);
    }
    return { records, headerRow, map, headers };
  }

  // "$1,234.56" / "(2,400)" -> number. Accounting negatives included.
  function num(v){
    if(typeof v === "number") return v;
    let s = String(v ?? "").trim();
    if(!s) return 0;
    const neg = /^\(.*\)$/.test(s);
    s = s.replace(/[()]/g,"").replace(/[^0-9.\-]/g,"");
    const n = parseFloat(s);
    return !isFinite(n) ? 0 : (neg ? -Math.abs(n) : n);
  }

  return { readFile, readXlsx, readCsv, toRecords, num, mapColumns, findHeaderRow };
})();

/* ===========================================================================
   Drawing intelligence — PDF metadata + revision mining   (item 8)
   ---------------------------------------------------------------------------
   Reads an uploaded sheet and pulls what a PM would otherwise open the drawing
   to find: sheet number, title, discipline, current revision, revision history.

   Honest limits, stated in the UI too:
     * Text must be real text. A scanned/rasterised sheet has no text layer and
       will come back empty — there is no OCR here.
     * Subset/custom font encodings can garble glyphs. Standard AutoCAD, Revit
       and Bluebeam exports use WinAnsi and come through clean.
     * Revision rows are matched by pattern, not table geometry. Everything is
       flagged for PM confirmation, never auto-approved.
   =========================================================================== */

const DWG = (() => {

  const latin1 = (bytes) => {
    let s = ""; const chunk = 0x8000;
    for(let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return s;
  };

  async function inflate(slice){
    for(const fmt of ["deflate","deflate-raw"]){
      try{
        const ds = new DecompressionStream(fmt);
        return new Uint8Array(await new Response(new Blob([slice]).stream().pipeThrough(ds)).arrayBuffer());
      }catch(e){ /* try next */ }
    }
    return null;
  }

  function ascii85(bytes){
    const out = []; let tuple = 0, count = 0;
    for(let i = 0; i < bytes.length; i++){
      const c = bytes[i];
      if(c === 0x7E) break;
      if(c <= 0x20) continue;
      if(c === 0x7A && count === 0){ out.push(0,0,0,0); continue; }
      if(c < 0x21 || c > 0x75) continue;
      tuple = tuple * 85 + (c - 0x21);
      if(++count === 5){ out.push((tuple>>>24)&255,(tuple>>>16)&255,(tuple>>>8)&255,tuple&255); tuple = 0; count = 0; }
    }
    if(count > 0){
      for(let i = count; i < 5; i++) tuple = tuple * 85 + 84;
      const b = [(tuple>>>24)&255,(tuple>>>16)&255,(tuple>>>8)&255,tuple&255];
      for(let i = 0; i < count - 1; i++) out.push(b[i]);
    }
    return new Uint8Array(out);
  }

  function asciiHex(bytes){
    const out = []; let hi = -1;
    for(let i = 0; i < bytes.length; i++){
      const c = bytes[i];
      if(c === 0x3E) break;
      let v = -1;
      if(c >= 0x30 && c <= 0x39) v = c - 0x30;
      else if(c >= 0x41 && c <= 0x46) v = c - 0x37;
      else if(c >= 0x61 && c <= 0x66) v = c - 0x57;
      else continue;
      if(hi < 0) hi = v; else { out.push((hi << 4) | v); hi = -1; }
    }
    return new Uint8Array(out);
  }

  // Unsupported filters (LZW, image codecs) return null so the caller skips
  // the stream rather than spraying binary into the extracted text.
  async function applyFilters(data, filters){
    for(const f of filters){
      if(f === "FlateDecode" || f === "Fl"){ data = await inflate(data); if(!data) return null; }
      else if(f === "ASCII85Decode" || f === "A85") data = ascii85(data);
      else if(f === "ASCIIHexDecode" || f === "AHx") data = asciiHex(data);
      else return null;
    }
    return data;
  }

  function pdfString(raw){
    let out = "";
    for(let i = 0; i < raw.length; i++){
      const ch = raw[i];
      if(ch === "\\"){
        const n = raw[++i];
        if(n === "n") out += "\n";
        else if(n === "r") out += "\r";
        else if(n === "t") out += "\t";
        else if(n === "b" || n === "f") out += " ";
        else if(n >= "0" && n <= "7"){
          let oct = n;
          while(oct.length < 3 && raw[i+1] >= "0" && raw[i+1] <= "7") oct += raw[++i];
          out += String.fromCharCode(parseInt(oct, 8));
        } else out += n;
      } else out += ch;
    }
    if(out.charCodeAt(0) === 0xFE && out.charCodeAt(1) === 0xFF){
      let u = "";
      for(let i = 2; i + 1 < out.length; i += 2) u += String.fromCharCode((out.charCodeAt(i) << 8) | out.charCodeAt(i+1));
      return u;
    }
    return out;
  }

  function hexStr(raw){
    const h = raw.replace(/[^0-9A-Fa-f]/g,"");
    let s = "";
    for(let i = 0; i + 1 < h.length; i += 2) s += String.fromCharCode(parseInt(h.substr(i,2),16));
    if(s.charCodeAt(0) === 0xFE && s.charCodeAt(1) === 0xFF){
      let u = "";
      for(let i = 2; i + 1 < s.length; i += 2) u += String.fromCharCode((s.charCodeAt(i) << 8) | s.charCodeAt(i+1));
      return u;
    }
    return s;
  }

  function readInfo(src){
    const info = {};
    for(const f of ["Title","Author","Subject","Keywords","Creator","Producer","CreationDate","ModDate"]){
      const lit = new RegExp("/"+f+"\\s*\\(((?:[^()\\\\]|\\\\.)*)\\)").exec(src);
      if(lit){ info[f] = pdfString(lit[1]).trim(); continue; }
      const hex = new RegExp("/"+f+"\\s*<([0-9A-Fa-f\\s]+)>").exec(src);
      if(hex) info[f] = hexStr(hex[1]).trim();
    }
    for(const k of ["CreationDate","ModDate"]){
      const m = info[k] && /D:(\d{4})(\d{2})(\d{2})(?:(\d{2})(\d{2}))?/.exec(info[k]);
      if(m) info[k] = m[1]+"-"+m[2]+"-"+m[3] + (m[4] ? " "+m[4]+":"+m[5] : "");
    }
    return info;
  }

  function readXmp(src){
    const m = /<x:xmpmeta[\s\S]*?<\/x:xmpmeta>/.exec(src);
    if(!m) return {};
    const grab = (re) => { const r = re.exec(m[0]); return r ? r[1].trim() : ""; };
    return {
      xmpTitle:    grab(/<dc:title>[\s\S]*?<rdf:li[^>]*>([\s\S]*?)<\/rdf:li>/),
      xmpKeywords: grab(/<pdf:Keywords>([\s\S]*?)<\/pdf:Keywords>/)
    };
  }

  async function extractText(bytes, src){
    let text = "";
    const re = /stream\r?\n?/g; let m;
    while((m = re.exec(src))){
      const start = m.index + m[0].length;
      const end = src.indexOf("endstream", start);
      if(end < 0) break;
      const dict = src.slice(Math.max(0, m.index - 600), m.index);
      const fm = /\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/.exec(dict);
      const filters = fm ? (fm[1].match(/\/([A-Za-z0-9]+)/g) || []).map(s => s.slice(1)) : [];
      let data = bytes.subarray(start, end);
      if(filters.length){
        data = await applyFilters(data, filters);
        if(!data){ re.lastIndex = end; continue; }
      }
      const chunk = latin1(data);
      if(/\bT[Jj]\b/.test(chunk)) text += chunk + "\n";
      re.lastIndex = end;
    }

    let out = "", pending = "";
    const tok = /\((?:[^()\\]|\\.)*\)|<[0-9A-Fa-f\s]+>|\bTJ\b|\bTj\b|\bTd\b|\bTD\b|\bT\*\b|\bTm\b|\bET\b/g;
    let t;
    while((t = tok.exec(text))){
      const s = t[0];
      if(s.startsWith("(")) pending += pdfString(s.slice(1,-1));
      else if(s.startsWith("<")) pending += hexStr(s.slice(1,-1));
      else if(s === "Tj" || s === "TJ"){ out += pending; pending = ""; }
      else { out += pending + "\n"; pending = ""; }
    }
    return (out + pending).replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim();
  }

  const DISCIPLINES = [
    [/^E[\d.\-]/i,"Electrical"],[/^M[\d.\-]/i,"Mechanical"],[/^P[\d.\-]/i,"Plumbing"],
    [/^FA[\d.\-]/i,"Fire Alarm"],[/^FP[\d.\-]/i,"Fire Protection"],[/^S[\d.\-]/i,"Structural"],
    [/^A[\d.\-]/i,"Architectural"],[/^C[\d.\-]/i,"Civil"],[/^T[\d.\-]/i,"Telecom"]
  ];

  function guessSheet(text, info){
    const hay = [info.Title || "", text.slice(0,4000)].join("\n");
    const pats = [
      /SHEET\s*(?:NO\.?|NUMBER)\s*[:\-]?\s*([A-Z]{1,3}[-\s]?\d{1,3}(?:\.\d{1,2})?[A-Z]?)/i,
      /\b([A-Z]{1,3}[-]?\d{1,3}\.\d{1,2}[A-Z]?)\b/,
      /\b([A-Z]{1,3}-\d{2,3}[A-Z]?)\b/
    ];
    for(const p of pats){ const m = p.exec(hay); if(m) return m[1].toUpperCase().replace(/\s+/g,""); }
    return "";
  }

  function guessDiscipline(sheet, text){
    for(const [re,name] of DISCIPLINES) if(re.test(sheet)) return name;
    if(/one[- ]line|gear schedule|feeder|switchgear|panelboard|conduit/i.test(text)) return "Electrical";
    return "Unknown";
  }

  function guessTitle(text, info){
    const m = /SHEET\s*TITLE\s*[:\-]?\s*([^\n]{3,80})/i.exec(text);
    if(m) return m[1].trim();
    if(info.Title) return info.Title.replace(/^[A-Z]{1,3}[-\s]?[\d.]+\s*[-\u2013]\s*/i,"").trim();
    return "";
  }

  function mineRevisions(text){
    const rows = [], seen = new Set();
    const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const rowRe = /^(?:REV\.?\s*|DELTA\s*|\u0394\s*|#)?([0-9]{1,2}|[A-Z])\s+((?:\d{4}-\d{2}-\d{2})|(?:\d{1,2}\/\d{1,2}\/\d{2,4})|(?:\d{1,2}[-\s][A-Z]{3}[-\s]\d{2,4}))\s+(.{4,140}?)\s*$/i;

    for(const line of lines){
      if(/^REV\b.*\bDATE\b.*\bDESCRIPTION\b/i.test(line)) continue;   // header row
      const m = rowRe.exec(line);
      if(!m) continue;
      let desc = m[3].trim(), by = "";
      const byM = /\s([A-Z]{2,4})$/.exec(desc);
      if(byM && desc.length > byM[1].length + 4){ by = byM[1]; desc = desc.slice(0, -by.length).trim(); }
      const key = m[1] + "|" + m[2];
      if(seen.has(key)) continue;
      seen.add(key);
      rows.push({ rev: m[1].toUpperCase(), date: m[2], description: desc, by });
    }

    const notes = [];
    const noteRe = /(?:DELTA|\u0394|REVISION|REV)\s*\.?\s*(\d{1,2})\s*[-\u2013:]\s*([^\n]{4,120})/gi;
    let nm;
    while((nm = noteRe.exec(text))){
      const t = nm[2].trim();
      if(!rows.some(r => r.rev === nm[1] && r.description.toUpperCase().includes(t.slice(0,15).toUpperCase()))){
        notes.push({ rev: nm[1], note: t });
      }
    }

    let current = "";
    const cm = /(?:CURRENT\s+REVISION|LATEST\s+REVISION|REVISION|REV)\s*[:\-]?\s*(\d{1,2})\b/i.exec(text);
    if(cm) current = cm[1];
    if(!current && rows.length){
      current = rows.map(r => r.rev).filter(r => /^\d+$/.test(r)).sort((a,b) => Number(b)-Number(a))[0] || rows[rows.length-1].rev;
    }
    const st = /\b(ISSUED FOR CONSTRUCTION|IFC|ISSUED FOR PERMIT|IFP|ISSUED FOR BID|IFB|FOR REVIEW|AS[- ]BUILT|RECORD SET|100%\s*(?:CD|DD|SD))\b/i.exec(text);

    return {
      rows: rows.sort((a,b) => (Number(a.rev)||0) - (Number(b.rev)||0)),
      notes, current, status: st ? st[1].toUpperCase() : ""
    };
  }

  async function analyze(file){
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const src = latin1(bytes);
    if(src.slice(0,5) !== "%PDF-"){
      return { ok:false, error:"Not a PDF. Drawing intelligence reads PDF sheets — export from Bluebeam / AutoCAD / Revit and retry." };
    }
    const info = readInfo(src), xmp = readXmp(src);
    const text = await extractText(bytes, src);
    const sheet = guessSheet(text, info);
    const rev = mineRevisions(text);
    return {
      ok:true,
      scanned: text.replace(/\s/g,"").length < 40,
      fileName: file.name,
      pdfVersion: (/^%PDF-(\d\.\d)/.exec(src) || [,"?"])[1],
      pages: (src.match(/\/Type\s*\/Page\b/g) || []).length || 1,
      meta: { ...info, ...xmp },
      sheetNumber: sheet,
      sheetTitle: guessTitle(text, info),
      discipline: guessDiscipline(sheet, text),
      currentRevision: rev.current,
      issueStatus: rev.status,
      revisions: rev.rows,
      revisionNotes: rev.notes,
      textSample: text.slice(0,1500),
      textLength: text.length
    };
  }

  return { analyze, mineRevisions };
})();

const ALIAS_PO = {
  poNumber:["ponumber","po","ponum","purchaseorder","commitmentnumber"],
  vendor:["vendor","supplier","vendorname","subcontractor","company"],
  description:["description","desc","scope","item","title"],
  amount:["poamount","amount","totalamount","committed","povalue","contractamount","total"],
  invoiced:["invoicedtodate","invoiced","billed","paidtodate","received"],
  remaining:["remaining","balance","openamount","remainingbalance","open"],
  eta:["expecteddelivery","delivery","eta","needby","promisedate","requireddate"]
};

const ALIAS_AGING = {
  customer:["customer","client","vendor","account","payee","name"],
  invoice:["invoice","invoiceno","invoicenumber","docno","reference"],
  amount:["amount","total","invoiceamount","balance"],
  current:["current","notdue"],
  d30:["130","030","net30","current30","days30","1to30"],
  d60:["3160","3060","net60","days60","31to60"],
  d90:["6190","6090","net90","days90","61to90"],
  d120:["90","91120","120","over90","net120","90plus","121"]
};

async function handleReportUpload(kind){
  const el = $(kind === "po" ? "poReportFile" : "agingReportFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a file first.","bad"); return; }
  try{
    const sheets = await SHEET.readFile(file);
    if(!sheets.length || !sheets[0].rows.length) throw new Error("No rows found in that file.");
    const rows = sheets[0].rows;

    if(kind === "po"){
      const { records, map, headerRow } = SHEET.toRecords(rows, ALIAS_PO);
      if(map.poNumber < 0 && map.vendor < 0) throw new Error("Couldn't find a PO number or vendor column. Check the header row.");
      const items = records.map(r => {
        const amount = SHEET.num(r.amount), invoiced = SHEET.num(r.invoiced);
        const remaining = r.remaining !== "" ? SHEET.num(r.remaining) : (amount - invoiced);
        return { poNumber:r.poNumber, vendor:r.vendor, description:r.description,
                 amount, invoiced, remaining, eta: fmtDate(r.eta) || r.eta };
      }).filter(r => r.poNumber || r.vendor || r.amount);
      state.reports.openPO = { fileName:file.name, sheet:sheets[0].name, headerRow:headerRow+1,
                               uploadedAt:new Date().toLocaleString(), items };
      state.financial.openPO = items.reduce((s,r) => s + r.remaining, 0);
      addAudit("Report Intake","Open PO Report Uploaded",
        `${file.name} — ${items.length} PO line(s), ${money(state.financial.openPO)} open exposure. Open PO Report + Financial Source Map updated.`);
      toast(`Open PO report loaded: ${items.length} lines, ${money(state.financial.openPO)} open.`);
    } else {
      const { records, map, headerRow } = SHEET.toRecords(rows, ALIAS_AGING);
      if(map.amount < 0 && map.d30 < 0) throw new Error("Couldn't find amount or aging bucket columns. Check the header row.");
      const items = records.map(r => ({
        customer:r.customer, invoice:r.invoice, amount:SHEET.num(r.amount),
        current:SHEET.num(r.current), d30:SHEET.num(r.d30), d60:SHEET.num(r.d60),
        d90:SHEET.num(r.d90), d120:SHEET.num(r.d120)
      })).filter(r => r.customer || r.invoice || r.amount);
      state.reports.aging = { fileName:file.name, sheet:sheets[0].name, headerRow:headerRow+1,
                              uploadedAt:new Date().toLocaleString(), items };
      state.financial.aging = {
        net30: items.reduce((s,r)=>s+r.d30,0), net60: items.reduce((s,r)=>s+r.d60,0),
        net90: items.reduce((s,r)=>s+r.d90,0), net120: items.reduce((s,r)=>s+r.d120,0)
      };
      const tot = Object.values(state.financial.aging).reduce((a,b)=>a+b,0);
      addAudit("Report Intake","Aging Report Uploaded",
        `${file.name} — ${items.length} invoice line(s), ${money(tot)} aged exposure. Aging Report + Financial Source Map updated.`);
      toast(`Aging report loaded: ${items.length} lines, ${money(tot)} aged.`);
    }
    save(); renderAll(); navigate(kind === "po" ? "openPOReport" : "agingReport");
  }catch(err){
    toast("Upload failed: " + err.message, "bad");
    addAudit("Report Intake","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}

const ALIAS_SCHED = {
  /* WBS used to be a fallback for the activity ID. Many activities share one
     WBS, so that keyed slip comparison to the wrong row. It is its own field. */
  actId:["activityid","taskcode","id","taskid","activitycode","uniqueid"],
  wbs:["wbs","wbscode","wbspath","wbsid"],
  wbsName:["wbsname","wbsdescription","wbstitle"],
  name:["activityname","name","description","taskname","activity"],
  start:["start","startdate","earlystart","actualstart","begin"],
  finish:["finish","finishdate","earlyfinish","end","enddate","completion"],
  float:["totalfloat","float","slack","totalslack"],
  pct:["complete","percentcomplete","pctcomplete","progress"],
  critical:["critical","criticalpath","iscritical"]
};

async function handleScheduleUpload(){
  const el = $("scheduleFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a schedule file first.","bad"); return; }
  try{
    const sheets = await SHEET.readFile(file);
    if(!sheets.length || !sheets[0].rows.length) throw new Error("No rows found in that file.");
    const parsed = SHEET.toRecords(sheets[0].rows, ALIAS_SCHED);
    const { map, headerRow } = parsed;
    let records = parsed.records;
    if(map.name < 0 && map.actId < 0) throw new Error("Couldn't find an activity name or ID column. Check the header row.");
    /* A native P6 spreadsheet export has two header rows: field codes
       (task_code, wbs_id, …) then captions (Activity ID, WBS Code, …). The
       first is taken as the header, so the caption row must not become an
       activity. The caption is also the only place that says whether float
       is in hours or days. */
    let floatUnit = map.float >= 0 ? String((parsed.headers || [])[map.float] ?? "") : "";
    if(records.length && /start/i.test(records[0].start) && /finish|end/i.test(records[0].finish)){
      floatUnit += " " + records[0].float;
      records = records.slice(1);
    }
    const floatInHours = /\(h\)|hours/i.test(floatUnit);
    const toDays = (v) => floatInHours ? Math.round(SHEET.num(v) / 8 * 10) / 10 : SHEET.num(v);

    const prior = {};
    (state.schedule.activities||[]).forEach(a => { prior[a.actId||a.name] = a; });

    const acts = records.map(r => {
      const critical = /^(y|yes|true|1|critical)$/i.test(r.critical) || (r.float !== "" && SHEET.num(r.float) <= 0);
      const a = {
        actId:r.actId, name:r.name, start:fmtDate(r.start)||r.start, finish:fmtDate(r.finish)||r.finish,
        wbs:r.wbs||"", wbsName:r.wbsName||"",
        float:r.float === "" ? null : toDays(r.float),
        pct:Math.max(0, Math.min(100, SHEET.num(r.pct))), critical
      };
      // Compare against the prior upload so movement is visible, not just state.
      const p = prior[a.actId || a.name];
      if(p && p.finish && a.finish){
        const d1 = parseDate(p.finish), d2 = parseDate(a.finish);
        if(d1 && d2) a.slipDays = Math.round((d2 - d1) / 86400000);
      }
      return a;
    }).filter(a => a.actId || a.name);

    const slipped = acts.filter(a => (a.slipDays||0) > 0);
    state.schedule = {
      fileName:file.name, sheet:sheets[0].name, headerRow:headerRow+1,
      uploadedAt:new Date().toLocaleString(), activities:acts,
      priorFileName:(state.schedule||{}).fileName || null
    };

    addAudit("Schedule Intake","Schedule Uploaded",
      `${file.name} — ${acts.length} activities, ${acts.filter(a=>a.critical).length} on critical path` +
      (slipped.length?`, ${slipped.length} slipped vs prior upload.`:"."));

    if(slipped.length){
      const worst = slipped.slice().sort((a,b)=>b.slipDays-a.slipDays)[0];
      state.packets.push({
        id:uid("PKT"), type:"schedule",
        title:`Schedule Movement Detected — ${slipped.length} activit${slipped.length===1?"y":"ies"} slipped`,
        summary:`Comparing ${file.name} to the prior upload: ${slipped.length} activities moved later. Worst: ${worst.name} (${worst.slipDays}d). Review critical path, resequence exposure, and manpower compression.`,
        score: slipped.some(a=>a.critical) ? 95 : 78,
        moneyAtRisk:0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
        raw:{ scheduleUpload:true, fileName:file.name, slipped:slipped.slice(0,25) }
      });
      addAudit("Schedule Intake","Schedule Slip Packet Created", `${slipped.length} activities slipped — packet raised for PM review.`);
    }
    save(); renderAll(); navigate("schedule");
    toast(`Schedule loaded: ${acts.length} activities${slipped.length?`, ${slipped.length} slipped`:""}.`);
  }catch(err){
    toast("Schedule upload failed: " + err.message, "bad");
    addAudit("Schedule Intake","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}
