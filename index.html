/* ===========================================================================
   ITEM 7 — Manpower Loading with bell-curve labor health
   ---------------------------------------------------------------------------
   Planned hours are distributed across the schedule window as a normal curve
   normalised to the estimate, so the plan always sums to the budget. The PM
   then enters earned and actual hours per week, and the chart overlays all
   three so labor health reads visually.

   Metric convention is the electrical-contractor one: PF = actual / earned,
   where below 1.00 is good. CPI (earned / actual) is shown alongside for
   anyone reading it from the CPM side.
   =========================================================================== */

function bellCurve(totalHours, weeks, skew, spread){
  const mu = (skew ?? 0.5) * (weeks - 1);
  const sigma = Math.max(0.8, (spread ?? 0.21) * weeks);
  const w = []; let sum = 0;
  for(let i = 0; i < weeks; i++){ const v = Math.exp(-Math.pow(i - mu, 2) / (2 * sigma * sigma)); w.push(v); sum += v; }
  return w.map(v => totalHours * v / sum);
}

function weeksBetween(startISO, finishISO){
  const a = parseDate(startISO), b = parseDate(finishISO);
  if(!a || !b || b <= a) return 0;
  return Math.max(1, Math.ceil((b - a) / (7 * 86400000)));
}

function weekLabel(startISO, i){
  const d = parseDate(startISO);
  if(!d) return "W" + (i + 1);
  d.setDate(d.getDate() + i * 7);
  return d.toISOString().slice(5,10);
}

function manpowerModel(){
  const m = state.manpower;
  const weeks = weeksBetween(m.startDate, m.finishDate);
  if(!weeks) return { weeks:0, rows:[], totals:{} };
  const planned = bellCurve(m.estimatedHours, weeks, m.peakSkew, m.spread);
  const rows = [];
  let cp = 0, ce = 0, ca = 0;
  for(let i = 0; i < weeks; i++){
    const entry = m.entries[i] || {};
    const earned = Number(entry.earned || 0), actual = Number(entry.actual || 0);
    cp += planned[i]; ce += earned; ca += actual;
    rows.push({
      i, label: weekLabel(m.startDate, i),
      planned: planned[i], earned, actual,
      crewPlanned: planned[i] / (m.hoursPerWeek || 40),
      crewActual: actual / (m.hoursPerWeek || 40),
      cumPlanned: cp, cumEarned: ce, cumActual: ca
    });
  }
  const totEarned = ce, totActual = ca;
  const pf  = totEarned > 0 ? totActual / totEarned : 0;      // <1.00 is good
  const cpi = totActual > 0 ? totEarned / totActual : 0;      // >1.00 is good
  const peak = Math.max(...planned);
  const remainingHrs = Math.max(0, m.estimatedHours - totEarned);
  const forecastAtComplete = pf > 0 ? m.estimatedHours * pf : m.estimatedHours;

  return {
    weeks, rows,
    totals:{
      estimated:m.estimatedHours, earned:totEarned, actual:totActual,
      variance: totEarned - totActual, pf, cpi,
      pctComplete: m.estimatedHours ? (totEarned / m.estimatedHours) * 100 : 0,
      peakHours: peak, peakCrew: peak / (m.hoursPerWeek || 40),
      remainingHrs, forecastAtComplete, forecastVariance: m.estimatedHours - forecastAtComplete
    }
  };
}

function manpowerChart(model){
  if(!model.weeks) return `<div class="item"><h3>Set the schedule window</h3><p>Enter a start date, finish date, and estimated hours to generate the loading curve.</p></div>`;
  const W = 1000, H = 380, padL = 62, padR = 18, padT = 18, padB = 46;
  const iw = W - padL - padR, ih = H - padT - padB;
  const rows = model.rows;
  const maxY = Math.max(...rows.map(r => Math.max(r.planned, r.earned, r.actual)), 1) * 1.12;
  const bw = iw / rows.length;
  const x = i => padL + i * bw;
  const y = v => padT + ih - (v / maxY) * ih;

  const bars = rows.map((r,i) =>
    `<rect x="${(x(i)+bw*0.12).toFixed(1)}" y="${y(r.planned).toFixed(1)}" width="${(bw*0.76).toFixed(1)}" height="${Math.max(0,(padT+ih-y(r.planned))).toFixed(1)}" fill="rgba(184,115,51,.30)" stroke="rgba(184,115,51,.65)" stroke-width="1"><title>${esc(r.label)} — planned ${Math.round(r.planned)} hrs (${r.crewPlanned.toFixed(1)} crew)</title></rect>`
  ).join("");

  const line = (key, color, dash) => {
    const pts = rows.map((r,i) => `${(x(i)+bw/2).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4"${dash?` stroke-dasharray="${dash}"`:""}/>` +
           rows.map((r,i) => r[key] > 0 ? `<circle cx="${(x(i)+bw/2).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="3" fill="${color}"><title>${esc(r.label)} — ${key} ${Math.round(r[key])} hrs</title></circle>` : "").join("");
  };

  const ticks = [0,.25,.5,.75,1].map(t => {
    const v = maxY * t;
    return `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="rgba(184,115,51,.16)"/>
            <text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#666" stroke="none">${Math.round(v).toLocaleString()}</text>`;
  }).join("");

  const step = Math.max(1, Math.ceil(rows.length / 16));
  const xlab = rows.map((r,i) => i % step === 0
    ? `<text x="${(x(i)+bw/2).toFixed(1)}" y="${H-padB+18}" text-anchor="middle" font-size="10" fill="#666" stroke="none">${esc(r.label)}</text>` : "").join("");

  const peakI = rows.reduce((b,r,i) => r.planned > rows[b].planned ? i : b, 0);

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="mp-chart" preserveAspectRatio="xMidYMid meet">
    ${ticks}
    ${bars}
    <line x1="${(x(peakI)+bw/2).toFixed(1)}" y1="${padT}" x2="${(x(peakI)+bw/2).toFixed(1)}" y2="${padT+ih}" stroke="rgba(15,118,110,.5)" stroke-dasharray="4 4"/>
    <text x="${(x(peakI)+bw/2+6).toFixed(1)}" y="${padT+12}" font-size="11" fill="#0f766e" stroke="none">peak ${Math.round(rows[peakI].crewPlanned)} crew</text>
    ${line("earned","#0f766e")}
    ${line("actual","#c92525","5 4")}
    <line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="rgba(184,115,51,.5)"/>
    ${xlab}
  </svg></div>
  <div class="legend">
    <span><i class="sw plan"></i>Planned (bell curve)</span>
    <span><i class="sw earn"></i>Earned hours</span>
    <span><i class="sw act"></i>Actual hours</span>
  </div>`;
}

function manpowerSCurve(model){
  if(!model.weeks) return "";
  const W = 1000, H = 260, padL = 62, padR = 18, padT = 14, padB = 34;
  const iw = W - padL - padR, ih = H - padT - padB;
  const rows = model.rows;
  const maxY = Math.max(model.totals.estimated, ...rows.map(r => Math.max(r.cumPlanned, r.cumEarned, r.cumActual)), 1) * 1.06;
  const x = i => padL + (i / Math.max(1, rows.length - 1)) * iw;
  const y = v => padT + ih - (v / maxY) * ih;
  const path = (key, color, dash) =>
    `<polyline points="${rows.map((r,i)=>`${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.4"${dash?` stroke-dasharray="${dash}"`:""}/>`;
  const ticks = [0,.5,1].map(t => `<line x1="${padL}" y1="${y(maxY*t)}" x2="${W-padR}" y2="${y(maxY*t)}" stroke="rgba(184,115,51,.16)"/>
    <text x="${padL-8}" y="${y(maxY*t)+4}" text-anchor="end" font-size="11" fill="#666" stroke="none">${Math.round(maxY*t).toLocaleString()}</text>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="mp-chart" preserveAspectRatio="xMidYMid meet">
    ${ticks}
    ${path("cumPlanned","rgba(184,115,51,.85)")}
    ${path("cumEarned","#0f766e")}

async function handleManpowerUpload(){
  const el = $("mpFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a timesheet export first.","bad"); return; }
  try{
    const sheets = await SHEET.readFile(file);
    const ALIAS_MP = {
      week:["week","weekending","period","date","weekend","enddate"],
      earned:["earnedhours","earned","earnedhrs","evhours","earnedvalue"],
      actual:["actualhours","actual","actualhrs","hours","manhours","laborhours"]
    };
    const { records, map } = SHEET.toRecords(sheets[0].rows, ALIAS_MP);
    if(map.actual < 0) throw new Error("Couldn't find an actual-hours column.");
    const m = state.manpower;
    const start = parseDate(m.startDate);
    let applied = 0;
    records.forEach((r, idx) => {
      let i = idx;
      const d = parseDate(r.week);
      if(d && start) i = Math.floor((d - start) / (7 * 86400000));
      if(i < 0 || i >= weeksBetween(m.startDate, m.finishDate)) return;
      m.entries[i] = {
        earned: SHEET.num(r.earned) || (m.entries[i]||{}).earned || 0,
        actual: SHEET.num(r.actual),
        note: "imported " + file.name
      };
      applied++;
    });
    addAudit("Manpower","Timesheet Import",`${file.name} — ${applied} week(s) applied.`);
    save(); renderAll(); navigate("manpower");
    toast(`Imported ${applied} week(s) of hours.`);
  }catch(err){
    toast("Import failed: " + err.message, "bad");
  }
}

async function handleDrawingUpload(){
  const el = $("dwgFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a drawing PDF first.","bad"); return; }
  toast("Reading drawing…");
  try{
    const r = await DWG.analyze(file);
    if(!r.ok) throw new Error(r.error);
    r.id = uid("DWG");
    r.uploadedAt = new Date().toLocaleString();
    r.reviewed = false;
    state.drawings.push(r);

    const label = [r.sheetNumber, r.sheetTitle].filter(Boolean).join(" — ") || file.name;
    if(r.scanned){
      addAudit("Drawing Intake","Scanned Sheet — No Text Layer",
        `${file.name} has no extractable text. Revision data must be entered manually.`);
      toast("Sheet has no text layer (scanned). Metadata captured; revisions need manual entry.","bad");
    } else {
      addAudit("Drawing Intake","Drawing Analyzed",
        `${label} — REV ${r.currentRevision||"?"}, ${r.revisions.length} revision row(s) found. Flagged for PM review.`);

      state.packets.push({
        id: uid("PKT"), type:"drawing",
        title: `Drawing REV ${r.currentRevision||"?"} — ${label}`,
        summary: r.revisions.length
          ? `Latest: ${(r.revisions[r.revisions.length-1]||{}).description||"see revision block"}. ${r.revisions.length} revision row(s) extracted from the sheet. Confirm against the issued set, then decide RFI / CO / procurement / schedule exposure.`
          : `No revision table found on this sheet. Metadata captured; confirm revision status manually.`,
        score: r.revisions.length ? 92 : 70,
        moneyAtRisk: 0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
        raw:{ drawingUpload:true, drawingId:r.id, fileName:file.name, sheetNumber:r.sheetNumber,
              currentRevision:r.currentRevision, issueStatus:r.issueStatus,
              revisions:r.revisions, revisionNotes:r.revisionNotes, meta:r.meta }
      });
      toast(`${label} — REV ${r.currentRevision||"?"}, ${r.revisions.length} revision row(s) extracted.`);
    }
    save(); renderAll(); navigate("drawingIntel");
  }catch(err){
    toast("Drawing read failed: " + err.message, "bad");
    addAudit("Drawing Intake","Analysis Failed", `${file.name} — ${err.message}`);
    save();
  }
}

function markDrawingReviewed(id){
  const d = state.drawings.find(x => x.id === id);
  if(!d) return;
  d.reviewed = !d.reviewed;
  d.reviewedAt = d.reviewed ? new Date().toLocaleString() : null;
  addAudit("Drawing Intake", d.reviewed ? "Drawing Marked Reviewed" : "Drawing Review Cleared",
    `${d.sheetNumber||d.fileName} — REV ${d.currentRevision||"?"}`);
  save(); renderAll(); navigate("drawingIntel");
}

function deleteDrawing(id){
  const d = state.drawings.find(x => x.id === id);
  if(!d) return;
  if(!confirmAction(`Remove ${d.sheetNumber||d.fileName} from the drawing register?`)) return;
  state.drawings = state.drawings.filter(x => x.id !== id);
  addAudit("Drawing Intake","Drawing Removed", `${d.sheetNumber||d.fileName} removed by PM.`);
  save(); renderAll(); navigate("drawingIntel"); toast("Drawing removed.");
}

/* ===========================================================================
   Ωboy V0.25.0 — Command Map
   ---------------------------------------------------------------------------
   One fixed skeleton for the whole job. Every record OhmBoy already holds
   (schedule activities, SOV lines, PO lines, RFIs, change orders, packets,
   drawings, takeoffs) is filed under an area → system node, and every node
   answers the same six questions in the same order:

       1 Scope   2 Money   3 Schedule   4 People   5 Risks   6 Open Items

   The fixed order is the point: a question about any part of the job lands
   on one address with six known slots. The one-line is that skeleton drawn
   as a single-line diagram. Morning Walk and Cold Drill train recall of it.

   Nothing here invents data. A slot with nothing linked says so, and the
   Map Links page lists every record that did not land on a node.

   Load order note: loadState() runs near the top of this script, long before
   anything in this block is initialised. It must never reference a const or
   let declared down here — that throws inside its try/catch and silently
   hands back a blank state.
   =========================================================================== */

  { key:"open",     n:6, label:"Open Items", ask:"What's open — RFIs, changes, drawings, deliveries?" }
];

  act:"Schedule activity", sov:"SOV line", po:"PO line", rfi:"RFI",
  co:"Change order", pkt:"Packet", dwg:"Drawing", to:"Takeoff", wbs:"WBS workbook line", cr:"Cost report line", ckt:"Board"
};

const BUDGET_KEYS = ["hoursProj","hoursEst","costProj","costEst","hoursJtd","hoursMonth","costJtd","costMonth","commit"];

/* ---------------------------------------------------------------------------
   Small helpers
   --------------------------------------------------------------------------- */

function localISO(d){
  d = d || new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function isISO(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }
function isoDays(a, b){                       // whole days from a to b
  const x = Date.parse(a + "T00:00:00Z"), y = Date.parse(b + "T00:00:00Z");
  return (isFinite(x) && isFinite(y)) ? Math.round((y - x) / 86400000) : null;
}
function isoAdd(iso, days){
  const t = Date.parse(iso + "T00:00:00Z");
  return isFinite(t) ? new Date(t + days * 86400000).toISOString().slice(0,10) : iso;
}
/* Past due means the due date is before today — due today is not late. */
function isPastDue(v){ const d = dISO(v); return isISO(d) && d < todayISO(); }
/* Intake already stores dates as ISO when it can read them. Skip the parser
   for those — it matters when a schedule has ten thousand activities. */
function dISO(v){ return isISO(v) ? v : fmtDate(v); }
function escapeRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function clip(s, n){ s = String(s ?? ""); return s.length > n ? s.slice(0, n-1).trimEnd() + "…" : s; }
function plural(n, one, many){ return n + " " + (n === 1 ? one : (many || one + "s")); }
function sumOf(list, key){ return list.reduce((s,x) => s + (Number(x[key]) || 0), 0); }
function pct1(v){ return (Number(v)||0).toFixed(1) + "%"; }
/* "demo" until figures arrive from Job Setup ("manual") or a cost report ("report"). */
function finDemo(){ return state.financial.source === "demo"; }
function nil(msg){ return `<p class="nil">${esc(msg)}</p>`; }
function kv(label, valueHtml, cls){ return `<div class="kv"><span>${esc(label)}</span><b class="${cls||""}">${valueHtml}</b></div>`; }
function shortDate(iso){
  if(!isISO(iso)) return String(iso || "—");
  const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return m[Number(iso.slice(5,7))-1] + " " + Number(iso.slice(8,10)) + (iso.slice(0,4) !== todayISO().slice(0,4) ? " ’" + iso.slice(2,4) : "");
}
function downloadText(name, text, type){
  const blob = new Blob([text], { type: type || "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

   can call it regardless of where in the script it sits. */

/* ---------------------------------------------------------------------------
   Map model — a flat list of nodes; an area has parent null, a system points
   at its area. Array order is the walking order.
   --------------------------------------------------------------------------- */

function mapNodes(){ return state.map.nodes; }
function mapNode(id){ return state.map.nodes.find(n => n.id === id) || null; }
function mapAreas(){ return state.map.nodes.filter(n => !n.parent); }
function mapSystems(areaId){ return state.map.nodes.filter(n => n.parent === areaId); }
/* The nodes you actually walk: every system, plus any area with no systems. */
function mapLeaves(){
  const out = [];
  mapAreas().forEach(a => { const s = mapSystems(a.id); if(s.length) out.push(...s); else out.push(a); });
  return out;
}
function mapOrder(){
  const out = [];
  mapAreas().forEach(a => { out.push(a); out.push(...mapSystems(a.id)); });
  return out;
}
function nodePath(n){
  const p = n.parent ? mapNode(n.parent) : null;
  return p ? p.name + " › " + n.name : n.name;
}
/* uid() is time + 4 hex digits, which collides when a generator creates a
   hundred nodes in the same millisecond. Node ids carry a counter instead. */
function nid(){
  nid.n = (nid.n || 0) + 1;
  return "N-" + Date.now().toString(36).toUpperCase() + nid.n.toString(36).toUpperCase() + "-" + Math.random().toString(16).slice(2,6).toUpperCase();
}
function newNode(name, parent, extra){
  return Object.assign({
    id:nid(), parent:parent || null, name:String(name || "").trim() || "Untitled",
    keywords:[], wbs:[], codes:[], owner:"", lead:"", counterpart:"", scopeIn:"", scopeOut:"", risks:[]
  }, extra || {});
}
function mapTouch(){ state.map.updatedAt = new Date().toLocaleString(); }

/* ---------------------------------------------------------------------------
   WBS handling. P6 exports give either a dotted code (CMH232.05.EL.MV) or a
   path of names (Building 5 > Electrical > MV). Both split into segments and
   are compared segment by segment, so "A.1" never claims "A.10".
   --------------------------------------------------------------------------- */

function wbsSplit(w){
  const s = String(w ?? "").trim();
  if(!s) return [];
  let parts;
  if(/>|\s\/\s|\\|\|/.test(s)) parts = s.split(/\s*(?:>|\s\/\s|\\|\|)\s*/);
  else if(/\s/.test(s)) parts = [s];            // a plain name like "Bldg. 5 Electrical" is one segment
  else parts = s.split(".");
  return parts.map(p => p.trim()).filter(Boolean);
}
function wbsJoin(segs, sample){
  return segs.join(/>|\s\/\s|\\|\|/.test(String(sample || "")) ? " > " : ".");
}
function wbsRules(){
  const rules = [];
  mapNodes().forEach(n => (n.wbs || []).forEach(p => {
    const segs = wbsSplit(p).map(x => x.toLowerCase());
    if(segs.length) rules.push({ id:n.id, segs, label:p });
  }));
  return rules.sort((a,b) => b.segs.length - a.segs.length);      // longest prefix wins
}
function wbsMatch(wbs, rules, cache){
  const raw = String(wbs ?? "").trim();
  if(!raw || !rules.length) return null;
  if(cache.has(raw)) return cache.get(raw);
  const segs = wbsSplit(raw).map(x => x.toLowerCase());
  let hit = null;
  for(const r of rules){
    if(r.segs.length > segs.length) continue;
    let ok = true;
    for(let i = 0; i < r.segs.length; i++) if(r.segs[i] !== segs[i]){ ok = false; break; }
    if(ok){ hit = r; break; }
  }
  cache.set(raw, hit);
  return hit;
}

/* Phase-code rules: a node lists code prefixes ("L0305", or just "M" for all
   material) and a budget line files under the node with the longest prefix
   its code starts with. A line with no code at all matches on its cost-type
   letter, so it still lands in that type's bucket. */
function codeRules(){
  const rules = [];
  mapNodes().forEach(n => (n.codes || []).forEach(c => { const p = String(c || "").trim().toUpperCase(); if(p) rules.push({ id:n.id, p, label:String(c).trim() }); }));
  return rules.sort((a,b) => b.p.length - a.p.length);
}
function codeMatch(line, rules, cache){
  const k = (line.code || line.type || "").toUpperCase();
  if(!k || !rules.length) return null;
  if(cache.has(k)) return cache.get(k);
  const hit = rules.find(r => k.startsWith(r.p)) || null;
  cache.set(k, hit);
  return hit;
}

/* ---------------------------------------------------------------------------
   Keyword matching for records that carry no WBS (RFIs, COs, POs, SOV lines,
   drawings, takeoffs). A node's own name counts as a keyword. Matches are on
   word boundaries so "MV" does not fire inside "REMOVE"; a trailing plural or
   unit number is allowed so "Generator" finds "Generators" and "MSB" finds
   "MSB1". Longest total match wins, and a system in a matching area outranks
   the same system name in another area.
   --------------------------------------------------------------------------- */

const KWCACHE = { sig:"", hits:new Map() };

function keywordRe(k){
  const parts = k.toLowerCase().split(/[\s\-_\/]+/).filter(Boolean).map(escapeRe);
  if(!parts.length) return null;
  const tail = /[a-z]$/.test(k.toLowerCase()) ? "(?:e?s|\\d+[a-z]?)?" : "";
  return new RegExp("(?:^|[^a-z0-9])" + parts.join("[\\s\\-_/]*") + tail + "(?![a-z0-9])");
}
function mapMatchers(){
  const list = mapNodes().map(n => {
    /* The node's own name is a keyword unless it would match by accident: a
       bare number ("98" fires on "98%"), or a generic bucket name the WBS
       builder had to fall back on ("General", "Material"). */
    const own = n.noNameMatch || /^\d+$/.test(String(n.name).trim()) ? [] : [n.name];
    const words = own.concat(n.keywords || []).map(k => String(k || "").trim()).filter(k => k.length >= 2);
    return { id:n.id, parent:n.parent, res:words.map(k => ({ k, len:k.length, re:keywordRe(k) })).filter(r => r.re) };
  });
  const sig = JSON.stringify(list.map(m => [m.id, m.parent, m.res.map(r => r.k)]));
  if(KWCACHE.sig !== sig){ KWCACHE.sig = sig; KWCACHE.hits = new Map(); }
  return list;
}
function keywordMatch(hay, M){
  if(KWCACHE.hits.has(hay)) return KWCACHE.hits.get(hay);
  const h = hay.toLowerCase(), score = {}, why = {};
  for(const m of M){
    let s = 0, w = "";
    for(const r of m.res){ if(r.re.test(h)){ s += r.len; if(r.len > w.length) w = r.k; } }
    if(s){ score[m.id] = s; why[m.id] = w; }
  }
  let best = null, bestScore = 0;
  for(const m of M){
    if(!m.parent || !score[m.id]) continue;
    const total = score[m.id] * 2 + (score[m.parent] || 0);
    if(total > bestScore){ bestScore = total; best = m.id; }
  }
  if(!best){
    for(const m of M){
      if(m.parent || !score[m.id]) continue;
      if(score[m.id] > bestScore){ bestScore = score[m.id]; best = m.id; }
    }
  }
  const out = best ? { id:best, how:"keyword “" + why[best] + "”" } : null;
  KWCACHE.hits.set(hay, out);
  return out;
}

/* ---------------------------------------------------------------------------
   The index: every record filed to a node, or to the unmapped bucket, with
   the reason it landed there. Built once per renderAll().
   --------------------------------------------------------------------------- */

let MAPIDX = null;
function mapInvalidate(){ MAPIDX = null; }
function emptyBucket(){ return { act:[], sov:[], po:[], rfi:[], co:[], pkt:[], dwg:[], to:[], wbs:[], cr:[], ckt:[] }; }

function recKey(type, rec, i){
  if(type === "act") return rec.actId || rec.name || ("row" + i);
  if(type === "sov" || type === "wbs" || type === "cr") return rec.key;
  if(type === "po")  return rec.poNumber || ("row" + i);
  if(type === "ckt") return rec.name;
  return rec.id;
}
function recHay(type, r){
  switch(type){
    case "act": return [r.wbsName, r.name].filter(Boolean).join(" ");
    case "sov": return [r.group, r.description].filter(Boolean).join(" ");
    case "po":  return [r.vendor, r.description].filter(Boolean).join(" ");
    case "rfi": return [r.title, r.question, r.drawingRef].filter(Boolean).join(" ");
    case "co":  return [r.title, r.summary, r.entitlement].filter(Boolean).join(" ");
    case "pkt": return [r.title, r.summary].filter(Boolean).join(" ");
    case "dwg": return [r.sheetNumber, r.sheetTitle, r.fileName].filter(Boolean).join(" ");
    case "to":  return [r.area, r.scope, r.route, r.drawing].filter(Boolean).join(" ");
    case "ckt": return [r.name, r.tag].filter(Boolean).join(" ");    // the number is repeated on its own so "1.2" finds UDB-1.2A
  }
  return "";                       // phase-code lines file by code only, never by keyword
}
function recLabel(type, r){
  switch(type){
    case "act": return [r.actId, r.name].filter(Boolean).join(" — ");
    case "sov": return [r.item, r.description].filter(Boolean).join(" — ");
    case "po":  return [r.poNumber, r.vendor, r.description].filter(Boolean).join(" — ");
    case "rfi": return [r.number, r.title].filter(Boolean).join(" — ");
    case "co":  return [r.number, r.title].filter(Boolean).join(" — ");
    case "pkt": return r.title || r.id;
    case "dwg": return [r.sheetNumber, r.sheetTitle || r.fileName].filter(Boolean).join(" — ");
    case "to":  return [r.route, r.scope, r.area].filter(Boolean).join(" — ");
    case "wbs": return [r.code || "(no code)", r.description || wbsTypeName(r.type)].join(" — ");
    case "cr":  return [r.code, r.description || wbsTypeName(r.type)].join(" — ");
    case "ckt": return r.name + " — " + (r.feeders.length ? plural(r.feeders.length, "feeder") : plural(r.branch.length, "branch circuit"));
  }
  return "";
}
function recordSets(){
  return {
    act: state.schedule.activities || [],
    sov: state.sov.lines || [],
    po:  (state.reports.openPO || {}).items || [],
    rfi: state.rfi, co: state.co, pkt: state.packets, dwg: state.drawings, to: state.takeoffs,
    wbs: state.wbs.lines || [],
    cr:  state.cr.lines || [],
    ckt: cktIndex().boards
  };
}

function mapIndex(){
  if(MAPIDX) return MAPIDX;
  const idx = { by:{}, unmapped:emptyBucket(), of:{}, how:{}, total:0, mapped:0, actBy:{ wbs:0, keyword:0, none:0 }, facts:{} };
  mapNodes().forEach(n => { idx.by[n.id] = emptyBucket(); });
  const has = mapNodes().length > 0;
  const M = has ? mapMatchers() : [], rules = has ? wbsRules() : [], wcache = new Map();
  const crules = has ? codeRules() : [], ccache = new Map();
  const sets = recordSets();

  for(const type of Object.keys(sets)){
    sets[type].forEach((rec, i) => {
      const lk = type + ":" + recKey(type, rec, i);
      const manual = type === "act" ? null : state.links[lk];     // activities map by rule, never one by one
      let id = null, how = "";
      if(manual === "none") how = "held unassigned";
      else if(manual && idx.by[manual]){ id = manual; how = "assigned by you"; }
      else if(has){
        if(type === "act"){
          const w = wbsMatch(rec.wbs, rules, wcache) || wbsMatch(rec.wbsName, rules, wcache);
          if(w){ id = w.id; how = "WBS " + w.label; idx.actBy.wbs++; }
        }
        const coded = type === "wbs" || type === "cr";       // budget and cost lines file by code only
        if(coded){
          const c = codeMatch(rec, crules, ccache);
          if(c){ id = c.id; how = "phase code " + c.label; }
        }
        /* A board or panel follows its group (every name carrying "1.2")
           when the group has been placed on the Circuit Tracker page. */
        let held = false;
        if(type === "ckt"){
          const g = (state.ckt.tags || {})[rec.tag || "—"];
          if(g === "none"){ held = true; how = "group held unassigned"; }
          else if(g && idx.by[g]){ id = g; how = "group " + (rec.tag || "other") + " placed by you"; }
        }
        if(!id && !coded && !held){
          const hay = recHay(type, rec);
          const k = hay ? keywordMatch(hay, M) : null;
          if(k){ id = k.id; how = k.how; if(type === "act") idx.actBy.keyword++; }
        }
      }
      idx.total++;
      if(id){ idx.by[id][type].push(rec); idx.of[lk] = id; idx.how[lk] = how; idx.mapped++; }
      else { idx.unmapped[type].push(rec); if(how) idx.how[lk] = how; if(type === "act") idx.actBy.none++; }
    });
  }
  MAPIDX = idx;
  return idx;
}

/* An area's bucket is its own records plus everything under its systems. */
function nodeBucket(id){
  const idx = mapIndex(), n = mapNode(id), b = emptyBucket();
  if(!n) return b;
  const ids = [id].concat(n.parent ? [] : mapSystems(id).map(s => s.id));
  ids.forEach(i => { const s = idx.by[i]; if(s) for(const t in b) b[t] = b[t].concat(s[t]); });
  return b;
}

/* ---------------------------------------------------------------------------
   Node facts — everything the six slots show, derived from linked records.
   --------------------------------------------------------------------------- */

function nodeFacts(id){
  const idx = mapIndex();
  if(idx.facts[id]) return idx.facts[id];
  const n = mapNode(id);
  if(!n) return null;
  const b = nodeBucket(id), today = todayISO();
  const kids = n.parent ? [] : mapSystems(id);

  /* 2 money */
  const sovValue = sumOf(b.sov,"value"), billed = sumOf(b.sov,"total"), balance = sumOf(b.sov,"balance");
  const poOpen = b.po.reduce((s,p) => s + Math.max(0, p.remaining || 0), 0);
  const coPending = b.co.filter(c => CO_PENDING.includes(c.status));
  const coApproved = b.co.filter(c => c.status === "Approved");
  /* The cost report is what is booked, so its lines are the budget when it is
     loaded, and they carry the actuals. The WBS workbook's lines are then kept
     alongside as a cross-check; with no cost report they are the budget. */
  const fromCr = b.cr.length > 0, prim = fromCr ? b.cr : b.wbs;
  const zero = () => ({ n:0, hoursProj:0, hoursEst:0, costProj:0, costEst:0, hoursJtd:0, hoursMonth:0, costJtd:0, costMonth:0, commit:0 });
  const budget = Object.assign(zero(), { n:prim.length, src:prim.length ? (fromCr ? "cr" : "wbs") : "", lines:prim, byType:{}, alt:null, overHours:[], overCost:[] });
  for(const l of prim){
    const t = budget.byType[l.type] = budget.byType[l.type] || zero();
    t.n++;
    for(const k of BUDGET_KEYS){ const v = l[k] || 0; t[k] += v; budget[k] += v; }
    if(fromCr){
      if(l.hoursJtd > l.hoursProj + 0.5) budget.overHours.push(l);
      else if(l.costProj > 0 && l.costJtd > l.costProj + 1) budget.overCost.push(l);
    }
  }
  if(fromCr && b.wbs.length){
    const wl = b.wbs.filter(l => l.type === "L");
    budget.alt = { n:b.wbs.length, hoursProj:sumOf(wl,"hoursProj"), costProj:sumOf(b.wbs,"costProj") };
  }

  /* 3 schedule — one pass, because an area can hold thousands of activities
     and this runs for every node on every render. */
  const acts = b.act, done = [], live = [], slipped = [], late = [], crit = [], early = [];
  let pctSum = 0, start = "", finish = "", anyStarted = false;
  let lowFloat = null, lowFloatFin = "", lastFin = null, lastFinDate = "";
  for(const a of acts){
    const s = dISO(a.start), fn = dISO(a.finish), sOk = isISO(s), fOk = isISO(fn);
    pctSum += a.pct || 0;
    if(a.pct > 0) anyStarted = true;
    if(sOk && (!start || s < start)) start = s;
    if(fOk && (!finish || fn > finish)) finish = fn;
    if((a.slipDays || 0) > 0) slipped.push(a);
    if(a.pct >= 100){ done.push(a); continue; }
    live.push(a);
    if(a.critical) crit.push(a);
    if(fOk && fn < today) late.push(a);
    if(a.float !== null && a.float !== undefined){
      const f2 = fOk ? fn : "9999";
      if(!lowFloat || a.float < lowFloat.float || (a.float === lowFloat.float && f2 < lowFloatFin)){ lowFloat = a; lowFloatFin = f2; }
    }
    if(fOk && (!lastFin || fn > lastFinDate)){ lastFin = a; lastFinDate = fn; }
    if(sOk && (early.length < 3 || s < early[2].s)){
      early.push({ a, s });
      early.sort((x,y) => x.s < y.s ? -1 : (x.s > y.s ? 1 : 0));
      if(early.length > 3) early.pop();
    }
  }
  slipped.sort((x,y) => y.slipDays - x.slipDays);
  const pctAvg = acts.length ? pctSum / acts.length : 0;
  const stand = !acts.length ? "" : (done.length === acts.length ? "Complete" : (anyStarted ? "In progress" : "Not started"));
  let driving = null, drivingWhy = "";
  if(lowFloat){ driving = lowFloat; drivingWhy = "lowest float, " + lowFloat.float + "d"; }
  else if(lastFin){ driving = lastFin; drivingWhy = "last to finish, " + shortDate(lastFinDate); }
  const nextUp = early.map(e => e.a);

  /* 6 open items */
  const openRfis = b.rfi.filter(r => !["Closed","Void"].includes(r.status));
  const overdueRfis = openRfis.filter(r => isPastDue(r.dueDate));
  const dwgPending = b.dwg.filter(d => !d.reviewed);
  const poDated = b.po.filter(p => (p.remaining || 0) > 0 && isISO(dISO(p.eta)));
  const poLate = poDated.filter(p => dISO(p.eta) < today);
  const poNext = poDated.filter(p => dISO(p.eta) >= today).sort((x,y) => dISO(x.eta).localeCompare(dISO(y.eta))).slice(0,3);

  /* 5 risks */
  const packets = b.pkt.filter(p => p.status !== "closed").sort((x,y) => y.score - x.score);
  const watch = (n.risks || []).map(r => ({ ...r, where:"" }));
  kids.forEach(k => (k.risks || []).forEach(r => watch.push({ ...r, where:k.name })));
  const lvl = { High:0, Medium:1, Low:2 };
  watch.sort((x,y) => (lvl[x.level] ?? 3) - (lvl[y.level] ?? 3));

  /* 4 people */
  const balls = {};
  openRfis.forEach(r => { const k = (r.ballInCourt || "").trim(); if(k) balls[k] = (balls[k] || 0) + 1; });
  const coWith = {};
  coPending.forEach(c => { const k = (c.owner || "").trim(); if(k) coWith[k] = (coWith[k] || 0) + 1; });

  /* circuits: what the boards and panels filed here add up to */
  const circuits = cktRoll(b.ckt);

  const openCount = openRfis.length + coPending.length + dwgPending.length + packets.length + poLate.length;
  const linked = Object.values(b).reduce((s,a) => s + a.length, 0);
  const written = !!((n.scopeIn || "").trim() || (n.owner || "").trim() || (n.risks || []).length);

  const why = [];
  if(overdueRfis.length) why.push(plural(overdueRfis.length, "RFI") + " overdue");
  const critSlip = slipped.filter(a => a.critical);
  if(critSlip.length) why.push("critical activity slipped +" + critSlip[0].slipDays + "d");
  const hot = packets.filter(p => p.score >= 75);
  if(hot.length) why.push(plural(hot.length, "high-score packet"));
  let status = "none";
  if(why.length) status = "trip";
  else {
    if(openRfis.length) why.push(plural(openRfis.length, "open RFI"));
    if(coPending.length) why.push(plural(coPending.length, "pending CO"));
    if(slipped.length) why.push(plural(slipped.length, "slipped activity", "slipped activities"));
    if(late.length) why.push(plural(late.length, "activity", "activities") + " past finish");
    if(poLate.length) why.push(plural(poLate.length, "late delivery", "late deliveries"));
    if(dwgPending.length) why.push(plural(dwgPending.length, "drawing") + " to review");
    if(packets.length) why.push(plural(packets.length, "open packet"));
    if(budget.overHours.length) why.push(plural(budget.overHours.length, "phase code") + " over projected hours");
    if(budget.overCost.length) why.push(plural(budget.overCost.length, "phase code") + " over projected cost");
    if(why.length) status = "watch";
    else if(linked || written) status = "ok";
  }

  const f = {
    node:n, bucket:b, kids, status, why, linked, openCount, circuits,
    money:{ sovValue, billed, balance, billedPct: sovValue ? billed / sovValue * 100 : 0, poOpen, coPending, coApproved, budget },
    schedule:{ acts, done, live, pctAvg, start, finish, slipped, late, crit, stand, driving, drivingWhy, nextUp },
    people:{ balls, coWith },
    risks:{ packets, watch, moneyAtRisk: packets.reduce((s,p) => s + (p.moneyAtRisk || 0), 0) },
    open:{ openRfis, overdueRfis, dwgPending, poLate, poNext, coPending }
  };
  idx.facts[id] = f;
  return f;
}

/* Project-wide top risks: open packets by score, plus watch items entered on
   nodes. A watch item has no computed score, so High/Medium/Low sort in at
   85/60/35 to interleave with packets sensibly. */
function topRisks(limit){
  const out = [], idx = mapIndex();
  state.packets.filter(p => p.status !== "closed").forEach(p => {
    const nodeId = idx.of["pkt:" + p.id];
    out.push({ score:p.score || 0, title:p.title, kind:"Packet", packetId:p.id, nodeId, money:p.moneyAtRisk || 0 });
  });
  mapNodes().forEach(n => (n.risks || []).forEach(r => {
    out.push({ score:{ High:85, Medium:60, Low:35 }[r.level] || 35, title:r.text, kind:"Watch item · " + r.level, nodeId:n.id, money:0 });
  }));
  out.sort((a,b) => b.score - a.score);
  return limit ? out.slice(0, limit) : out;
}

function sovTotals(){
  const lines = state.sov.lines || [];
  const value = sumOf(lines,"value"), total = sumOf(lines,"total"), balance = sumOf(lines,"balance");
  return { n:lines.length, value, total, balance, pct: value ? total / value * 100 : 0 };
}
function coLogTotals(){
  return {
    approved: state.co.filter(c => c.status === "Approved").reduce((s,c) => s + (c.value || 0), 0),
    pending:  state.co.filter(c => CO_PENDING.includes(c.status)).reduce((s,c) => s + (c.value || 0), 0)
  };
}

function nodeOptions(selected, autoLabel, noHold){
  let h = `<option value="">${esc(autoLabel || "— auto —")}</option>` + (noHold ? "" : `<option value="none"${selected === "none" ? " selected" : ""}>Hold unassigned</option>`);

      sys.map(s => `<option value="${esc(s.id)}"${s.id === selected ? " selected" : ""}>${esc(s.name)}</option>`).join("") + `</optgroup>`;
  });
  return h;
}

/* ===========================================================================
   Schedule of Values intake (.xlsx / .csv)
   ---------------------------------------------------------------------------
   Reads a pay-app continuation sheet (AIA G703 layout or anything close).
   Subtotal and total rows are dropped so sums are not doubled; a row with a
   description and no value is read as a section header and becomes the group
   for the lines under it.
   =========================================================================== */

const ALIAS_SOV = {
  item:["itemno","itemnumber","item","lineno","line","sovno","no"],
  description:["descriptionofwork","description","workdescription","desc","scopeofwork","scope"],
  value:["scheduledvalue","schedvalue","sovvalue","contractvalue","contractamount","value","amount"],
  total:["totalcompletedandstored","totalcompleted","completedandstored","completedtodate","billedtodate","totalbilled","billed","todate"],
  pct:["percentcomplete","pctcomplete","percent","pct","gc"],
  balance:["balancetofinish","balance","remaining"],
  retainage:["retainage","retention"],
  group:["area","building","phase","location","division","section","group","costcode","phasecode"]
};

async function handleSovUpload(){
  const el = $("sovFile"), file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a Schedule of Values file first.","bad"); return; }
  try{
    const sheets = await SHEET.readFile(file);
    // A pay app often puts the G702 summary on the first tab. Take the first
    // tab that actually has a description column and a value column.
    let pick = null;
    for(const sh of sheets){
      if(!sh.rows.length) continue;
      const t = SHEET.toRecords(sh.rows, ALIAS_SOV);
      if(t.map.description >= 0 && t.map.value >= 0){ pick = { sh, t }; break; }
    }
    if(!pick) throw new Error("Couldn't find a description column and a scheduled-value column on any tab. Check the header row.");
    const { records, map, headerRow, headers } = pick.t;
    if(map.group === map.description || map.group === map.item) map.group = -1;

    const pctVals = map.pct >= 0 ? records.map(r => SHEET.num(r.pct)).filter(x => x > 0) : [];
    const pctIsFraction = pctVals.length > 0 && Math.max(...pctVals) <= 1.0001 && !records.some(r => /%/.test(r.pct));
    const totalRow = /^\s*(grand\s+|sub\s*-?\s*)?totals?\b/i;

    const lines = [], seen = {};
    let group = "", dropped = 0;
    records.forEach(r => {
      const desc = r.description, item = r.item;
      if(!desc && !item) return;
      if(totalRow.test(desc) || totalRow.test(item)){ dropped++; return; }
      if(r.value === ""){ if(desc && map.group < 0) group = desc; return; }       // section header
      const value = SHEET.num(r.value);
      const pct = map.pct >= 0 && r.pct !== "" ? SHEET.num(r.pct) * (pctIsFraction ? 100 : 1) : null;
      const total = map.total >= 0 && r.total !== "" ? SHEET.num(r.total) : (pct !== null ? value * pct / 100 : 0);
      const balance = map.balance >= 0 && r.balance !== "" ? SHEET.num(r.balance) : value - total;
      let key = item || desc;
      if(seen[key]){ seen[key]++; key = key + " #" + seen[key]; } else seen[key] = 1;
      lines.push({ key, item, description:desc, group: map.group >= 0 ? r.group : group, value, total, balance,
                   retainage: map.retainage >= 0 ? SHEET.num(r.retainage) : 0, pct: value ? total / value * 100 : 0 });
    });
    if(!lines.length) throw new Error("No SOV lines found under the header row.");

    const names = { item:"Item", description:"Description", value:"Scheduled value", total:"Completed to date", pct:"% complete", balance:"Balance", retainage:"Retainage", group:"Group" };
    state.sov = {
      fileName:file.name, sheet:pick.sh.name, headerRow:headerRow + 1, uploadedAt:new Date().toLocaleString(), lines, dropped,
      matched: Object.keys(names).filter(k => map[k] >= 0).map(k => names[k] + " ← “" + String(headers[map[k]]).trim() + "”"),
      missing: Object.keys(names).filter(k => map[k] < 0).map(k => names[k])
    };
    const t = sovTotals();
    addAudit("SOV Intake","Schedule of Values Uploaded",
      `${file.name} — ${lines.length} line(s), ${money(t.value)} scheduled, ${money(t.total)} completed to date (${pct1(t.pct)}).` + (dropped ? ` ${dropped} total/subtotal row(s) left out.` : ""));
    save(); renderAll(); navigate("sov");
    toast(`SOV loaded: ${lines.length} lines, ${money(t.value)} scheduled.`);
  }catch(err){
    toast("SOV upload failed: " + err.message, "bad");
    addAudit("SOV Intake","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}

function clearSov(){
  if(!confirmAction("Clear the uploaded Schedule of Values? Node money slots go empty until you load one again. Your node assignments are kept.")) return;
  state.sov = { fileName:null, sheet:null, headerRow:0, uploadedAt:null, lines:[], matched:[], missing:[], dropped:0 };

    `<div class="grid four">

      <div class="card kpi"><span>Balance to Finish</span><strong>${money(t.balance)}</strong></div>
    </div>

    <div class="card panel upload-card" style="margin-top:18px">
      <h2>Upload Schedule of Values</h2>
      <p class="sub">Accepts .xlsx or .csv — an AIA G703 continuation sheet, a Textura or Procore export, or your own breakdown. Needs a description column and a scheduled-value column; completed-to-date, balance, and a group or area column are used when present.</p>
      <div class="field full"><input id="sovFile" type="file" accept=".xlsx,.xlsm,.csv,.tsv,.txt"></div>
      <div class="takeoff-row-actions">
        <button class="action dark" onclick="handleSovUpload()">Load SOV</button>
        ${sv.fileName ? `<button class="action danger" onclick="clearSov()">Clear Loaded SOV</button>` : ""}
      </div>
      ${sv.fileName ? `<p class="sub" style="margin-top:10px">Loaded: <b>${esc(sv.fileName)}</b> · tab "${esc(sv.sheet)}" · header row ${sv.headerRow} · ${lines.length} lines · ${esc(sv.uploadedAt)}${sv.dropped ? ` · ${sv.dropped} total/subtotal row(s) left out` : ""}</p>
        <p class="sub"><b>Columns read:</b> ${esc((sv.matched || []).join(" · "))}${(sv.missing || []).length ? `<br><b>Not found:</b> ${esc(sv.missing.join(", "))}${sv.missing.includes("Completed to date") ? " — billed-to-date will read $0 until that column is in the file." : ""}` : ""}</p>` : ""}
    </div>

    ${t.n ? `<div class="card panel" style="margin-top:18px"><h2>Cross-check against the contract</h2>
      <p class="sub">${finDemo()
        ? `Job figures are still demo numbers, so there is nothing real to check this against. <button class="action" data-view="jobSetup">Open Job Setup</button>`
        : (Math.abs(gap) < 1
            ? `SOV total ${money(t.value)} matches the revised contract (${money(f.revised)}).`
            : `SOV total ${money(t.value)} vs revised contract ${money(f.revised)} — <b class="t-bad">${money(Math.abs(gap))} ${gap > 0 ? "over" : "under"}</b>. Usually an approved change order that is not on the SOV yet, or one on the SOV that is not in Job Setup.`)}</p></div>` : ""}

    <table class="log-table" style="margin-top:18px"><thead><tr><th>Item</th><th>Description</th><th>Scheduled</th><th>Completed</th><th>%</th><th>Balance</th><th>Node</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="7">No SOV loaded. Upload one above.</td></tr>'}</tbody></table>
    ${lines.length > 400 ? `<p class="sub">Showing first 400 of ${lines.length} lines.</p>` : ""}`);
}

    ["Closeout & As-Builts", ["as-built","O&M","closeout","punch","warranty"]]
  ]]
];

const GEN = { basis:null, areaLevel:null, sysLevel:null, statsKey:"", stats:{} };

function wbsStats(basis){
  const key = (state.schedule.uploadedAt || "") + "|" + (state.schedule.activities || []).length;
  if(GEN.statsKey !== key){ GEN.statsKey = key; GEN.stats = {}; }
  if(GEN.stats[basis]) return GEN.stats[basis];
  const acts = state.schedule.activities || [], paths = new Map(), nameOf = {};
  let sample = "";
  acts.forEach(a => {
    const raw = a[basis], segs = wbsSplit(raw);
    if(!segs.length) return;
    if(!sample) sample = String(raw);
    const k = segs.join("\u001f").toLowerCase();
    const e = paths.get(k) || { segs, count:0 };
    e.count++; paths.set(k, e);
    if(basis === "wbs" && a.wbsName && wbsSplit(a.wbsName).length === 1) nameOf[k] = String(a.wbsName).trim();
  });
  let depth = 0;
  paths.forEach(p => { if(p.segs.length > depth) depth = p.segs.length; });
  const distinct = [];
  for(let d = 1; d <= depth; d++){
    const s = new Set();
    paths.forEach(p => { if(p.segs.length >= d) s.add(p.segs.slice(0,d).join("\u001f").toLowerCase()); });
    distinct.push(s.size);
  }
  let withWbs = 0; paths.forEach(p => { withWbs += p.count; });
  return (GEN.stats[basis] = { paths, depth, distinct, withWbs, total:acts.length, nameOf, sample });
}

function genSettings(){
  const acts = state.schedule.activities || [];
  const hasCode = acts.some(a => a.wbs), hasName = acts.some(a => a.wbsName);
  if(!hasCode && !hasName) return null;
  let basis = GEN.basis;
  if(!(basis === "wbs" && hasCode) && !(basis === "wbsName" && hasName)){
    basis = hasCode && hasName ? (wbsStats("wbs").depth >= wbsStats("wbsName").depth ? "wbs" : "wbsName") : (hasCode ? "wbs" : "wbsName");
  }
  const st = wbsStats(basis);
  let aL = GEN.areaLevel, sL = GEN.sysLevel;
  if(!aL || aL > st.depth){ aL = st.distinct.findIndex(n => n >= 2) + 1 || 1; }
  if(!sL || sL > st.depth || sL < aL){ sL = Math.min(st.depth, aL + 1); }
  return { basis, hasCode, hasName, st, aL, sL };
}

function wbsPlan(g){
  const { st, aL, sL, basis } = g, areas = new Map();
  let shallow = 0;
  const nm = (segs) => (basis === "wbs" && st.nameOf[segs.join("\u001f").toLowerCase()]) || segs[segs.length - 1];
  st.paths.forEach(p => {
    if(p.segs.length < aL){ shallow += p.count; return; }
    const aSegs = p.segs.slice(0, aL), ak = aSegs.join("\u001f").toLowerCase();
    let A = areas.get(ak);
    if(!A){ A = { segs:aSegs, name:nm(aSegs), count:0, systems:new Map() }; areas.set(ak, A); }
    A.count += p.count;
    if(sL > aL && p.segs.length >= sL){
      const sSegs = p.segs.slice(0, sL), sk = sSegs.join("\u001f").toLowerCase();
      let S = A.systems.get(sk);
      if(!S){ S = { segs:sSegs, name:nm(sSegs), count:0 }; A.systems.set(sk, S); }
      S.count += p.count;
    }
  });
  return { areas:[...areas.values()], shallow };
}

function findNodeByName(name, parent){
  const k = String(name).trim().toLowerCase();
  return mapNodes().find(n => (n.parent || null) === (parent || null) && n.name.trim().toLowerCase() === k) || null;
}
function findNodeByWbs(prefix, parent){
  const k = wbsSplit(prefix).join("\u001f").toLowerCase();
  return mapNodes().find(n => (n.parent || null) === (parent || null) && (n.wbs || []).some(w => wbsSplit(w).join("\u001f").toLowerCase() === k)) || null;
}

function applyWbsPlan(){
  const g = genSettings();
  if(!g){ toast("The loaded schedule has no WBS column to build from.","bad"); return; }
  const plan = wbsPlan(g);
  const nSys = plan.areas.reduce((s,a) => s + a.systems.size, 0);
  if(!plan.areas.length){ toast("No WBS values at that level.","bad"); return; }
  if(!confirmAction(`Build the project map from the schedule WBS?\n\n${plural(plan.areas.length,"area")} and ${plural(nSys,"system")} will be added. Nodes that already exist are kept, and nothing is deleted.`)) return;
  let added = 0;
  plan.areas.forEach(A => {
    const aPrefix = wbsJoin(A.segs, g.st.sample);
    let area = findNodeByWbs(aPrefix, null) || findNodeByName(A.name, null);
    if(!area){ area = newNode(A.name, null); state.map.nodes.push(area); added++; }
    if(!findNodeByWbs(aPrefix, null)) area.wbs.push(aPrefix);
    A.systems.forEach(S => {
      const sPrefix = wbsJoin(S.segs, g.st.sample);
      let sys = findNodeByWbs(sPrefix, area.id) || findNodeByName(S.name, area.id);
      if(!sys){ sys = newNode(S.name, area.id); state.map.nodes.push(sys); added++; }
      if(!findNodeByWbs(sPrefix, area.id)) sys.wbs.push(sPrefix);
    });
  });
  mapTouch();
  addAudit("Project Map","Map Built From Schedule WBS", `${state.schedule.fileName || "schedule"} — ${plural(plan.areas.length,"area")}, ${plural(nSys,"system")}; ${added} new node(s).`);
  save(); renderAll(); navigate("mapSetup");
  toast(`Map built: ${added} node(s) added.`);
}

function sovPlan(){
  const groups = new Map();
  (state.sov.lines || []).forEach(l => {
    const g = (l.group || "").trim() || "Contract Scope";
    if(!groups.has(g)) groups.set(g, []);
    groups.get(g).push(l);
  });
  return groups;
}
function applySovPlan(){
  const groups = sovPlan();
  if(!groups.size){ toast("Load a Schedule of Values first.","bad"); return; }
  const nLines = (state.sov.lines || []).length;
  if(!confirmAction(`Build the project map from the SOV?\n\n${plural(groups.size,"area")} and ${plural(nLines,"system")} — one system per SOV line, each line pinned to its node. Existing nodes are kept.`)) return;
  let added = 0;
  groups.forEach((lines, gname) => {
    let area = findNodeByName(gname, null);
    if(!area){ area = newNode(gname, null); state.map.nodes.push(area); added++; }
    lines.forEach(l => {
      const name = clip(l.description || l.item || "SOV line", 60);
      let sys = findNodeByName(name, area.id);
      if(!sys){ sys = newNode(name, area.id); state.map.nodes.push(sys); added++; }
      state.links["sov:" + l.key] = sys.id;
    });
  });
  mapTouch();
  addAudit("Project Map","Map Built From SOV", `${state.sov.fileName || "SOV"} — ${plural(groups.size,"area")}, ${nLines} line(s); ${added} new node(s).`);
  save(); renderAll(); navigate("mapSetup");
  toast(`Map built: ${added} node(s) added.`);
}
function applyTemplate(){
  if(!confirmAction(`Load the data center electrical starter map?\n\n${DC_TEMPLATE.length} areas and ${DC_TEMPLATE.reduce((s,a) => s + a[2].length, 0)} systems with matching keywords. It is a generic starting point — rename, delete, and add until it matches this job.\n\nExisting nodes are kept. A node that already has the same name picks up the starter's keywords.`)) return;
  let added = 0, merged = 0;
  const union = (node, keys) => {
    const have = new Set((node.keywords || []).map(k => k.toLowerCase()));
    const add = keys.filter(k => !have.has(k.toLowerCase()));
    if(add.length){ node.keywords = (node.keywords || []).concat(add); merged++; }
  };
  DC_TEMPLATE.forEach(([aName, aKeys, systems]) => {
    let area = findNodeByName(aName, null);
    if(!area){ area = newNode(aName, null, { keywords:aKeys.slice() }); state.map.nodes.push(area); added++; }
    else union(area, aKeys);
    systems.forEach(([sName, sKeys]) => {
      const sys = findNodeByName(sName, area.id);
      if(!sys){ state.map.nodes.push(newNode(sName, area.id, { keywords:sKeys.slice() })); added++; }
      else union(sys, sKeys);
    });
  });
  mapTouch();
  addAudit("Project Map","Starter Map Loaded", `Data center electrical starter — ${added} node(s) added, keywords added to ${merged} existing node(s).`);
  save(); renderAll(); navigate("mapSetup");
  toast(`Starter map loaded: ${added} added, ${merged} existing node(s) given keywords.`);
}

function deleteNode(id){
  const n = mapNode(id);
  if(!n) return;
  const kids = n.parent ? [] : mapSystems(id);
  if(!confirmAction(`Delete ${n.parent ? "system" : "area"} "${n.name}"${kids.length ? ` and its ${plural(kids.length,"system")}` : ""}?\n\nRecords filed here go back to automatic matching. Drill history for the node is removed.`)) return;
  const gone = new Set([id].concat(kids.map(k => k.id)));
  state.map.nodes = state.map.nodes.filter(x => !gone.has(x.id));
  Object.keys(state.links).forEach(k => { if(gone.has(state.links[k])) delete state.links[k]; });
  Object.keys(state.training.cards).forEach(k => { if(gone.has(k.split("|")[0])) delete state.training.cards[k]; });
  if(gone.has(selectedNodeId)) selectedNodeId = null;
  mapTouch();
  addAudit("Project Map","Node Deleted", `${n.name}${kids.length ? ` and ${plural(kids.length,"system")}` : ""} removed by PM.`);
  save(); renderAll();
}
function moveNode(id, dir){
  const n = mapNode(id);
  if(!n) return;
  const sibs = mapNodes().filter(x => (x.parent || null) === (n.parent || null));
  const i = sibs.indexOf(n), other = sibs[i + dir];
  if(!other) return;
  const all = state.map.nodes, a = all.indexOf(n), b = all.indexOf(other);
  all[a] = other; all[b] = n;
  mapTouch(); save(); renderAll();
}
function setNodeProp(id, prop, raw){
  const n = mapNode(id);
  if(!n) return;
  if(prop === "keywords") n.keywords = String(raw).split(",").map(s => s.trim()).filter(Boolean);
  else if(prop === "wbs") n.wbs = String(raw).split(";").map(s => s.trim()).filter(Boolean);
  else if(prop === "codes") n.codes = String(raw).split(";").map(s => s.trim()).filter(Boolean);
  else if(prop === "name"){ const v = String(raw).trim(); if(v && v !== n.name){ n.name = v; delete n.noNameMatch; } }   // a name you chose is a real keyword
  else n[prop] = String(raw).trim();
  mapTouch(); save();
}

async function importMap(){
  const el = $("mapFile"), file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a project-map.json file first.","bad"); return; }
  try{
    const data = JSON.parse(await file.text());
    const nodes = data && data.ohmboy === "project-map" && Array.isArray(data.nodes) ? data.nodes : null;
    if(!nodes) throw new Error("That file is not a project-map.json.");
    /* Ids end up inside onclick handlers, so anything that is not a plain
       token is replaced rather than trusted. Parents are remapped to match. */
    const safe = (v) => /^[A-Za-z0-9_-]{1,64}$/.test(String(v ?? ""));
    const idMap = new Map();
    nodes.forEach(n => { if(n && n.id !== undefined && n.name && !idMap.has(String(n.id))) idMap.set(String(n.id), safe(n.id) ? String(n.id) : nid()); });
    const seen = new Set();
    const clean = nodes.filter(n => {
      if(!n || !n.name || !idMap.has(String(n.id)) || seen.has(String(n.id))) return false;
      if(n.parent && !idMap.has(String(n.parent))) return false;
      seen.add(String(n.id)); return true;
    }).map(n => newNode(n.name, n.parent ? idMap.get(String(n.parent)) : null, {
      id:idMap.get(String(n.id)), keywords:Array.isArray(n.keywords) ? n.keywords.map(String) : [], wbs:Array.isArray(n.wbs) ? n.wbs.map(String) : [],
      codes:Array.isArray(n.codes) ? n.codes.map(String) : [],
      noNameMatch:n.noNameMatch ? true : undefined,
      strip:n.strip && typeof n.strip === "object" ? { lead:Array.isArray(n.strip.lead) ? n.strip.lead.map(String) : [], tail:Array.isArray(n.strip.tail) ? n.strip.tail.map(String) : [] } : undefined,
      owner:String(n.owner || ""), lead:String(n.lead || ""), counterpart:String(n.counterpart || ""),
      scopeIn:String(n.scopeIn || ""), scopeOut:String(n.scopeOut || ""),
      risks:Array.isArray(n.risks) ? n.risks.filter(r => r && r.text).map(r => ({ id:safe(r.id) ? String(r.id) : uid("W"), text:String(r.text), level:["High","Medium","Low"].includes(r.level) ? r.level : "Medium" })) : []
    }));
    // The map is two levels. A node whose parent is itself a system is dropped.
    const areaIds = new Set(clean.filter(n => !n.parent).map(n => n.id));
    for(let i = clean.length - 1; i >= 0; i--) if(clean[i].parent && !areaIds.has(clean[i].parent)) clean.splice(i, 1);
    if(!clean.length) throw new Error("No usable nodes in that file.");
    if(mapNodes().length && !confirmAction(`Replace the current map (${mapNodes().length} nodes) with ${clean.length} nodes from ${file.name}?`)) return;
    state.map.nodes = clean;
    const live = new Set(clean.map(n => n.id));          // drop hand links and drill cards that point at nodes no longer here
    Object.keys(state.links).forEach(k => { if(state.links[k] !== "none" && !live.has(state.links[k])) delete state.links[k]; });
    Object.keys(state.training.cards).forEach(k => { if(!live.has(k.split("|")[0])) delete state.training.cards[k]; });
    if(!live.has(selectedNodeId)) selectedNodeId = null;
    mapTouch();
    addAudit("Project Map","Map Imported", `${file.name} — ${clean.length} node(s).`);
    save(); renderAll(); navigate("mapSetup");
    toast(`Map imported: ${clean.length} nodes.`);
  }catch(err){ toast("Import failed: " + err.message, "bad"); }
}
function clearMap(){
  if(!mapNodes().length) return;
  if(!confirmAction(`Delete the whole project map (${mapNodes().length} nodes)?\n\nNode notes, owners, watch items, hand assignments, and drill history go with it. Download project-map.json first if you might want it back.`)) return;
  state.map.nodes = []; state.links = {}; state.training.cards = {};
  selectedNodeId = null;
  mapTouch();
  addAudit("Project Map","Map Cleared","All nodes removed by PM.");
  save(); renderAll(); navigate("mapSetup");
}

const LINKVIEW = { type:"all", onlyUnfiled:true };

function assignWbs(wbsValue, nodeId){
  const n = mapNode(nodeId);
  if(!n || !wbsValue) return;
  if(!(n.wbs || []).includes(wbsValue)) n.wbs.push(wbsValue);
  mapTouch();
  addAudit("Project Map","WBS Assigned", `${wbsValue} → ${nodePath(n)}.`);
  save(); renderAll();
}

function renderMapLinks(){
  const idx = mapIndex(), sets = recordSets(), has = mapNodes().length > 0;
  const acts = sets.act, unfiledActs = idx.unmapped.act;

  const groups = new Map();
  unfiledActs.forEach(a => {
    const k = String(a.wbs || a.wbsName || "").trim();
    const e = groups.get(k) || { wbs:k, count:0, sample:a.name };
    e.count++; groups.set(k, e);
  });
  const groupRows = [...groups.values()].sort((a,b) => b.count - a.count).slice(0,60).map(gr => `<tr>

    <td>${gr.wbs && has ? `<select class="mini-select wbs-select" data-wbs="${esc(gr.wbs)}">${nodeOptions("", "File this WBS under…", true)}</select>` : "<small>add a keyword on the right node</small>"}</td></tr>`).join("");

  const rows = [];
  let shown = 0, matching = 0;
  for(const type of ["cr","wbs","ckt","sov","po","rfi","co","pkt","dwg","to"]){

      const key = recKey(type, rec, i), lk = type + ":" + key;
      const nodeId = idx.of[lk], node = nodeId ? mapNode(nodeId) : null;

      matching++;

      shown++;
      rows.push(`<tr><td><span class="badge">${esc(LINK_TYPES[type])}</span></td>

        <td><small>${esc(idx.how[lk] || (has ? (type === "cr" || type === "wbs" ? "no node lists a prefix of this code" : (type === "ckt" ? "group not placed — see Circuit Tracker" : "no keyword matched")) : "no map yet"))}</small></td>
        <td>${has ? `<select class="mini-select link-select" data-ltype="${type}" data-lkey="${esc(key)}">${nodeOptions(state.links[lk] || "", "— auto —")}</select>` : "—"}</td></tr>`);
    });
  }
  const unfiled = (t) => idx.unmapped[t].length;
  const typeOpts = [["all","All record types"]].concat(["cr","wbs","ckt","sov","po","rfi","co","pkt","dwg","to"].map(t => [t, LINK_TYPES[t] + "s"]))
    .map(([v,l]) => `<option value="${v}"${LINKVIEW.type === v ? " selected" : ""}>${esc(l)}</option>`).join("");

  renderPage("mapLinks","Map Links","Every record and the node it filed under, with the reason. Anything not filed is listed here so nothing drops out of view.",
    `<div class="grid four">
      <div class="card kpi"><span>Records</span><strong>${idx.total.toLocaleString()}</strong></div>
      <div class="card kpi"><span>Filed</span><strong>${idx.mapped.toLocaleString()}</strong></div>
      <div class="card kpi"><span>Not Filed</span><strong class="${idx.total - idx.mapped ? "neg" : ""}">${(idx.total - idx.mapped).toLocaleString()}</strong></div>
      <div class="card kpi"><span>Filed %</span><strong>${idx.total ? Math.round(idx.mapped / idx.total * 100) : 0}%</strong></div>
    </div>
    ${has ? "" : `<div class="item" style="margin-top:18px"><h3>No project map yet</h3><p>Nothing can file until there are nodes to file under.</p><div class="takeoff-row-actions"><button class="action dark" data-view="mapSetup">Build the Project Map</button></div></div>`}

    <div class="card panel" style="margin-top:18px">
      <h2>Schedule activities</h2>
      <p class="sub">${acts.length
        ? `${(acts.length - unfiledActs.length).toLocaleString()} of ${acts.length.toLocaleString()} filed — ${idx.actBy.wbs.toLocaleString()} by WBS, ${idx.actBy.keyword.toLocaleString()} by keyword. Activities file by rule, not one at a time: give a WBS a home below and every activity under it follows.`
        : "No schedule loaded."}</p>
      ${groupRows ? `<table class="log-table" style="margin-top:12px"><thead><tr><th>Unfiled WBS</th><th>Activities</th><th>Example</th><th>File under</th></tr></thead><tbody>${groupRows}</tbody></table>
        ${groups.size > 60 ? `<p class="sub">Showing the 60 largest of ${groups.size} unfiled WBS groups.</p>` : ""}` : (acts.length ? `<p class="sub t-good" style="margin-top:8px">Every activity is filed.</p>` : "")}
    </div>

    <div class="card panel" style="margin-top:18px">
      <h2>Everything else</h2>

      <div class="takeoff-row-actions">
