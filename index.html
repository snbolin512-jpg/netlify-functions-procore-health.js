/* ===========================================================================
   Circuit Tracker — the field's circuit completion workbook
   ---------------------------------------------------------------------------
   Reads the tracker workbook: a Feeders tab where each feeder is stepped
   through weighted milestones (layout, conduit, wire pull, terminations,
   equipment set, test), a Branch Circuits tab kept as a single percent, and a
   Spares & Spaces tab that is reference only.

   A feeder's overall percent is its milestones times their weights, exactly
   as the workbook's formula has it, and the Feeders figure here is the one on
   the workbook's Dashboard tab. Everywhere, a circuit with nothing entered
   counts as zero. That is where this page parts from the Dashboard for branch
   circuits: its AVERAGE() skips blank cells, so its Branch and Combined
   figures read high until every circuit has a value. The page says so, with
   both numbers, whenever they differ.

   On top of that it adds what the Dashboard does not have: percent by
   milestone (so "where are we on terminations" is one number), a way to find
   any circuit, and what changed since the last workbook was loaded.

   Progress can also be entered here. Such entries are marked, and when a
   newer workbook is loaded an entry is only kept where the workbook is still
   behind it — so the field's file stays the base and nothing typed here is
   lost in between.
   =========================================================================== */

const CKT_STEPS = [0, 25, 50, 75, 100];
/* What a feeder is called while a milestone is under way — the workbook's own
   status wording, matched by the milestone's heading. */
const CKT_PHASE_WORDS = [
  [/layout|trench/i, "In Layout / Trenching"], [/conduit|rough|raceway/i, "Running Conduit"], [/pull/i, "Pulling Wire"],
  [/term|land/i, "Terminating"], [/equip|set|device/i, "Setting Equipment"], [/test|energ|megg|commission/i, "Testing / Energizing"]
];
const CKTVIEW = { q:"", scope:"all", phase:"", board:"", hi:"" };

function cktEmpty(){
  return { fileName:null, uploadedAt:null, title:"", ms:[], feeders:[], branch:[], spares:{}, spareTotal:0, edits:{}, last:null, dashAvg:null, tags:{}, rev:0 };
}
function cktHas(){ const c = state.ckt; return (c.feeders.length + c.branch.length) > 0; }
function cktNum(v){
  if(v === "" || v === null || v === undefined) return null;
  const n = typeof v === "number" ? v : parseFloat(String(v).replace(/[%,\s]/g,""));
  return isFinite(n) ? n : null;
}
function cktPct(v){ return (Number(v) || 0).toFixed(1) + "%"; }
function cktTag(name){ const m = /(\d+\.\d+)/.exec(String(name)); return m ? m[1] : ""; }
function cktEditKey(kind, key, i){ return kind + "~" + i + "~" + key; }
function cktEditParts(ek){ const a = ek.indexOf("~"), b = ek.indexOf("~", a + 1); return { kind:ek.slice(0, a), i:Number(ek.slice(a + 1, b)), key:ek.slice(b + 1) }; }

/* ---------------------------------------------------------------------------
   Reading the workbook
   --------------------------------------------------------------------------- */

function cktHeader(rows){
  for(let r = 0; r < Math.min(rows.length, 20); r++){
    const norm = (rows[r] || []).map(c => String(c ?? "").toLowerCase().replace(/[^a-z0-9%]/g,""));
    const src = norm.findIndex(c => /^(board|panel|panelboard|source|fedfrom|gear|equipment|swbd|switchboard)$/.test(c));
    const ckt = norm.findIndex(c => /^(ckt|cktno|ckt#|circuit|circuitno|cct|bkr|breaker|pole|position)$/.test(c));
    if(src >= 0 && ckt >= 0) return { r, norm, src, ckt, raw:rows[r] };
  }
  return null;
}

function parseCircuitTracker(sheets){
  let F = null, B = null, S = null, title = "";
  for(const sh of sheets){
    if(/instruction|read\s*me/i.test(sh.name) && !title){ const first = (sh.rows[0] || [])[0]; if(first) title = String(first).trim(); }
    const H = cktHeader(sh.rows);
    if(!H) continue;
    const find = (re) => H.norm.findIndex(c => re.test(c));
    const overall = find(/^overall/), type = find(/^type$/), pct = find(/^(%complete|complete|pctcomplete|percentcomplete|%done|progress|%)$/);
    /* Milestones are the columns that carry a weight in a row just above the
       headings. With no weights row, they are the columns between the last
       describing column and "Overall %", weighted equally. */
    let ms = [];
    for(let up = 1; up <= 3 && H.r - up >= 0 && !ms.length; up++){
      const w = sh.rows[H.r - up] || [], cols = [];
      w.forEach((v, c) => { const n = cktNum(v); if(n !== null && n > 0 && String(H.raw[c] ?? "").trim() && c !== H.src && c !== H.ckt) cols.push([c, n]); });
      const sum = cols.reduce((s, x) => s + x[1], 0);
      if(cols.length >= 2 && (Math.abs(sum - 1) < 0.02 || Math.abs(sum - 100) < 2)) ms = cols.map(([c, n]) => ({ c, w:n / sum, label:String(H.raw[c]).trim() }));
    }
    if(!ms.length && overall > 0){
      const stop = Math.max(H.src, H.ckt, find(/desc|feed|load/), find(/^amps?$|amperage/), find(/^kva$/), type);
      const cols = []; for(let c = stop + 1; c < overall; c++) if(String(H.raw[c] ?? "").trim()) cols.push(c);
      if(cols.length >= 2) ms = cols.map(c => ({ c, w:1 / cols.length, label:String(H.raw[c]).trim() }));
    }
    const isSpare = /spare|space/i.test(sh.name);
    if(isSpare){ if(!S) S = { sh, H, type }; }
    else if(ms.length){ if(!F) F = { sh, H, ms, find }; }
    else if(pct >= 0){ if(!B) B = { sh, H, pct, find }; }
  }
  if(!F && !B) throw new Error("couldn't find a Feeders or Branch Circuits tab — a tab needs Board (or Panel) and Ckt columns, and either milestone columns with a weights row above them or a % Complete column.");

  const text = (row, c) => c >= 0 ? String(row[c] ?? "").trim() : "";
  const keyOf = (seen, src, ckt) => { let k = src + "|" + ckt; if(seen[k]){ seen[k]++; k += "#" + seen[k]; } else seen[k] = 1; return k; };
  const feeders = [], branch = [], spares = {}, seenF = {}, seenB = {}, all = [];
  let msDefs = [];

  if(F){
    const { sh, H, ms, find } = F;
    const desc = find(/desc|feedid|load/), amps = find(/^amps?$|amperage|^trip$/), kva = find(/^kva$/), type = find(/^type$/), ref = find(/^(ref|page|pg|sheet|dwg)$/), note = find(/note|comment|remark/);
    msDefs = ms.map(m => ({ label:m.label, w:m.w, phase:(CKT_PHASE_WORDS.find(p => p[0].test(m.label)) || [0, "In " + m.label])[1] }));
    for(let r = H.r + 1; r < sh.rows.length; r++){
      const row = sh.rows[r] || [], src = text(row, H.src), ckt = text(row, H.ckt);
      if(!src || (!ckt && !text(row, desc))) continue;
      const m = ms.map(x => cktNum(row[x.c]));
      m.forEach(v => { if(v !== null) all.push(v); });
      feeders.push({ k:keyOf(seenF, src, ckt), b:src, c:ckt, d:text(row, desc), a:cktNum(row[amps]), kva:cktNum(row[kva]), t:text(row, type), m, r:text(row, ref), n:text(row, note) });
    }
  }
  if(B){
    const { sh, H, pct, find } = B;
    const desc = find(/desc|load/), amps = find(/^amps?$|amperage|^trip$/), poles = find(/^poles?$/), volts = find(/volt/), cat = find(/categ|^type$|^use$/), ref = find(/^(ref|page|pg|sheet|dwg)$/), note = find(/note|comment|remark/);
    for(let r = H.r + 1; r < sh.rows.length; r++){
      const row = sh.rows[r] || [], src = text(row, H.src), ckt = text(row, H.ckt);
      if(!src || (!ckt && !text(row, desc))) continue;
      const v = cktNum(row[pct]);
      if(v !== null) all.push(v);
      branch.push({ k:keyOf(seenB, src, ckt), b:src, c:ckt, d:text(row, desc), a:cktNum(row[amps]), p:text(row, poles), v:text(row, volts), g:text(row, cat), m:v, r:text(row, ref), n:text(row, note) });
    }
  }
  let spareTotal = 0;
  if(S){
    const { sh, H, type } = S;
    for(let r = H.r + 1; r < sh.rows.length; r++){
      const row = sh.rows[r] || [], src = text(row, H.src);
      if(!src || !text(row, H.ckt)) continue;
      const e = spares[src] = spares[src] || [0, 0];
      e[/space/i.test(text(row, type)) ? 1 : 0]++; spareTotal++;
    }
  }
  if(!feeders.length && !branch.length) throw new Error("the tabs were found but no circuit rows could be read under the headings.");

  /* A workbook kept as fractions (0.5 shown as 50%) is brought to 0–100. */
  const fractions = all.length > 0 && Math.max(...all) <= 1 && all.some(v => v > 0);
  const fix = (v) => v === null ? null : Math.max(0, Math.min(100, fractions ? v * 100 : v));
  feeders.forEach(f => { f.m = f.m.map(fix); });
  branch.forEach(b => { b.m = fix(b.m); });

  /* What the workbook's own Dashboard held for branch circuits when it was
     saved, if it has one. Used only to tell whether that Dashboard skips blanks. */
  let dashBranch = null;
  const dashSheet = sheets.find(sh => /dashboard|summary/i.test(sh.name));
  if(dashSheet && branch.length){
    const row = dashSheet.rows.slice(0, 80).find(r => (r || []).some(c => /^\s*branch/i.test(String(c ?? ""))));
    const nums = (row || []).map(cktNum).filter(n => n !== null && n !== branch.length);
    if(nums.length) dashBranch = fractions ? nums[0] * 100 : nums[0];
  }
  return { title, ms:msDefs, feeders, branch, spares, spareTotal, sheetF:F ? F.sh.name : "", sheetB:B ? B.sh.name : "", dashBranch };
}

/* ---------------------------------------------------------------------------
   Roll-ups. Worked out once per change to the tracker.
   --------------------------------------------------------------------------- */

function cktOverall(m, ms){ let s = 0; for(let i = 0; i < ms.length; i++) s += (m[i] || 0) * ms[i].w; return s; }
function cktPhaseOf(m, ov, ms){
  if(!m.some(v => v !== null)) return "Not Started";
  if(ov >= 99.9999) return "COMPLETE";
  for(let i = m.length - 1; i >= 0; i--) if((m[i] || 0) > 0) return ms[i].phase;
  return "Not Started";
}
function cktPhaseList(ms){ return ["Not Started"].concat(ms.map(m => m.phase), ["COMPLETE"]); }

let CKTIDX = { ref:null, rev:-1, out:null };
function cktIndex(){
  const c = state.ckt;
  if(CKTIDX.ref === c && CKTIDX.rev === c.rev && CKTIDX.out) return CKTIDX.out;
  const ms = c.ms || [], by = new Map(), boards = [];
  const termI = ms.findIndex(m => /term|land/i.test(m.label)), pullI = ms.findIndex(m => /pull/i.test(m.label));
  const board = (name, kind) => {
    let b = by.get(name);
    if(!b){ b = { id:name, name, kind, tag:cktTag(name), feeders:[], branch:[], refs:[] }; by.set(name, b); boards.push(b); }
    return b;
  };
  const phases = cktPhaseList(ms), phaseN = Object.fromEntries(phases.map(p => [p, 0]));
  const msStat = ms.map(() => ({ sum:0, done:0, part:0 }));
  let sumF = 0;
  const frows = c.feeders.map(f => {
    const ov = cktOverall(f.m, ms), ph = cktPhaseOf(f.m, ov, ms), row = { f, ov, ph };
    board(f.b, "F").feeders.push(row);
    sumF += ov; phaseN[ph] = (phaseN[ph] || 0) + 1;
    f.m.forEach((v, i) => { const x = v || 0; msStat[i].sum += x; if(x >= 100) msStat[i].done++; else if(x > 0) msStat[i].part++; });
    return row;
  });
  let sumB = 0, doneB = 0, partB = 0, entB = 0;
  c.branch.forEach(b => { const x = b.m || 0; sumB += x; if(b.m !== null) entB++; if(x >= 100) doneB++; else if(x > 0) partB++; board(b.b, "B").branch.push(b); });

  boards.forEach(b => {
    const nf = b.feeders.length, nb = b.branch.length;
    b.n = nf + nb;
    b.pctF = nf ? b.feeders.reduce((s, r) => s + r.ov, 0) / nf : 0;
    b.pctB = nb ? b.branch.reduce((s, x) => s + (x.m || 0), 0) / nb : 0;
    b.pct = b.n ? (b.pctF * nf + b.pctB * nb) / b.n : 0;
    b.ms = ms.map((_, i) => nf ? b.feeders.reduce((s, r) => s + (r.f.m[i] || 0), 0) / nf : 0);
    b.refs = [...new Set(b.feeders.map(r => r.f.r).concat(b.branch.map(x => x.r)).filter(Boolean))];
    b.spare = c.spares[b.name] || [0, 0];
  });
  /* Groups: boards and panels that share a number in their name (SWBD-1.2,
     UDB-1.2A, LP-1.2-01 → "1.2"). Anything without one is grouped last. */
  const gmap = new Map();
  boards.forEach(b => { if(!gmap.has(b.tag)) gmap.set(b.tag, { tag:b.tag, boards:[] }); gmap.get(b.tag).boards.push(b); });
  const groups = [...gmap.values()].sort((x, y) => (x.tag === "") - (y.tag === "") || x.tag.localeCompare(y.tag, undefined, { numeric:true }));
  groups.forEach(g => {
    const fs = g.boards.flatMap(b => b.feeders), bs = g.boards.flatMap(b => b.branch);
    g.nF = fs.length; g.nB = bs.length;
    g.pctF = fs.length ? fs.reduce((s, r) => s + r.ov, 0) / fs.length : 0;
    g.pctB = bs.length ? bs.reduce((s, x) => s + (x.m || 0), 0) / bs.length : 0;
    g.term = termI >= 0 && fs.length ? fs.reduce((s, r) => s + (r.f.m[termI] || 0), 0) / fs.length : 0;
  });

  const nF = c.feeders.length, nB = c.branch.length;
  const out = {
    ms, termI, pullI, boards, by, groups, frows, phases, phaseN, nF, nB,
    pctF: nF ? sumF / nF : 0, pctB: nB ? sumB / nB : 0,
    combined: (nF + nB) ? (sumF + sumB) / (nF + nB) : 0,
    msStat: msStat.map(s => ({ avg:nF ? s.sum / nF : 0, done:s.done, part:s.part, none:nF - s.done - s.part })),
    doneB, partB, entB,
    /* the workbook's Dashboard: AVERAGE() over the branch cells that have an entry */
    dashB: entB ? sumB / entB : 0,
    dashCombined: (nF + nB) ? ((nF ? sumF / nF : 0) * nF + (entB ? sumB / entB : 0) * nB) / (nF + nB) : 0,
    term: termI >= 0 && nF ? msStat[termI].sum / nF : null,
    landed: termI >= 0 ? msStat[termI].done : 0,
    ready: termI >= 0 && pullI >= 0 ? frows.filter(r => (r.f.m[pullI] || 0) >= 100 && (r.f.m[termI] || 0) < 100) : [],
    edited: Object.keys(c.edits || {}).length
  };
  CKTIDX = { ref:c, rev:c.rev, out };
  return out;
}
function cktTouch(){ state.ckt.rev = (state.ckt.rev || 0) + 1; }

/* What a set of boards and panels adds up to — used by node cards. */
function cktRoll(list){
  if(!list || !list.length) return null;
  const X = cktIndex(), fs = list.flatMap(b => b.feeders), bs = list.flatMap(b => b.branch);
  const avg = (arr, f) => arr.length ? arr.reduce((s, x) => s + f(x), 0) / arr.length : 0;
  return {
    boards:list, nF:fs.length, nB:bs.length,
    pctF:avg(fs, r => r.ov), pctB:avg(bs, x => x.m || 0),
    term:X.termI >= 0 ? avg(fs, r => r.f.m[X.termI] || 0) : null,
    landed:X.termI >= 0 ? fs.filter(r => (r.f.m[X.termI] || 0) >= 100).length : 0,
    pull:X.pullI >= 0 ? avg(fs, r => r.f.m[X.pullI] || 0) : null,
    ready:X.ready.filter(r => list.some(b => b.name === r.f.b)).length
  };
}

/* ---------------------------------------------------------------------------
   Loading, updating, clearing
   --------------------------------------------------------------------------- */

async function handleCircuitUpload(){
  const el = $("cktFile"), file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose the circuit tracker workbook first.","bad"); return; }
  toast("Reading circuit tracker…");
  try{
    if(!/\.(xlsx|xlsm)$/i.test(file.name)) throw new Error("the circuit tracker is read from the .xlsx workbook itself, with its Feeders and Branch Circuits tabs.");
    const { dashBranch, ...parsed } = parseCircuitTracker(await SHEET.readFile(file));
    const old = state.ckt, had = cktHas(), before = had ? cktIndex() : null;

    /* Does this workbook's Dashboard average only the circuits with an entry?
       Told from the figure it was saved with; left as it was when that can't be told. */
    let dashAvg = had && old.sheetB === parsed.sheetB && typeof old.dashAvg === "boolean" ? old.dashAvg : null;
    {
      const ent = parsed.branch.filter(b => b.m !== null), sum = parsed.branch.reduce((t, b) => t + (b.m || 0), 0);
      if(dashBranch !== null && ent.length && ent.length < parsed.branch.length){
        const avgEnt = sum / ent.length, avgAll = sum / parsed.branch.length;
        if(Math.abs(avgEnt - avgAll) >= 0.05) dashAvg = Math.abs(dashBranch - avgEnt) < 0.06 ? true : (Math.abs(dashBranch - avgAll) < 0.06 ? false : dashAvg);
      }
    }
    const sameMs = had && old.ms.length === parsed.ms.length && old.ms.every((m, i) => m.label === parsed.ms[i].label);
    const newF = new Map(parsed.feeders.map(f => [f.k, f])), newB = new Map(parsed.branch.map(b => [b.k, b]));

    /* Entries made here are kept only where the workbook is still behind them. */
    const edits = {}; let kept = 0;
    if(had) for(const [ek, e] of Object.entries(old.edits || {})){
      const p = cktEditParts(ek);
      if(p.kind === "F"){
        const f = sameMs ? newF.get(p.key) : null;
        if(f && (f.m[p.i] || 0) < e.v){ edits[ek] = { v:e.v, f:f.m[p.i], t:e.t }; f.m[p.i] = e.v; kept++; }
      } else {
        const b = newB.get(p.key);
        if(b && (b.m || 0) < e.v){ edits[ek] = { v:e.v, f:b.m, t:e.t }; b.m = e.v; kept++; }
      }
    }

    /* What this workbook changed, against what OhmBoy was showing. */
    let last = null;
    if(had){
      const changes = [], downs = [], byBoard = {}; let n = 0, down = 0, added = 0;
      const note = (kind, key, i, from, to) => {
        n++;
        const bn = key.split("|")[0], e = byBoard[bn] = byBoard[bn] || [0, 0];
        e[0]++;
        if((to || 0) < (from || 0)){ down++; e[1]++; if(downs.length < 100) downs.push([kind, key, i, from, to]); }
        else if(changes.length < 150) changes.push([kind, key, i, from, to]);
      };
      const oldF = new Map(old.feeders.map(f => [f.k, f])), oldB = new Map(old.branch.map(b => [b.k, b]));
      parsed.feeders.forEach(f => { const o = oldF.get(f.k); if(!o){ added++; return; } if(sameMs) f.m.forEach((v, i) => { if((v || 0) !== (o.m[i] || 0)) note("F", f.k, i, o.m[i], v); }); });
      parsed.branch.forEach(b => { const o = oldB.get(b.k); if(!o){ added++; return; } if((b.m || 0) !== (o.m || 0)) note("B", b.k, 0, o.m, b.m); });
      const removed = old.feeders.filter(f => !newF.has(f.k)).length + old.branch.filter(b => !newB.has(b.k)).length;
      const r2 = (v) => Math.round(v * 100) / 100;
      last = { prevFile:old.fileName, prevAt:old.uploadedAt, n, down, added, removed, kept, changes, downs, byBoard, sameMs,
               was:{ pctF:before.pctF, pctB:before.pctB, combined:before.combined, ms:before.msStat.map(s => s.avg),
                     board:Object.fromEntries(before.boards.map(b => [b.name, [r2(b.pct), before.termI >= 0 && b.feeders.length ? r2(b.ms[before.termI]) : null]])) } };
    }
    state.ckt = { ...cktEmpty(), ...parsed, fileName:file.name, uploadedAt:new Date().toLocaleString(), edits, last, dashAvg, tags:old.tags || {}, rev:(old.rev || 0) + 1 };
    const X = cktIndex();
    addAudit("Circuit Tracker","Circuit Tracker Uploaded",
      `${file.name} — ${X.nF.toLocaleString()} feeders at ${cktPct(X.pctF)}, ${X.nB.toLocaleString()} branch circuits at ${cktPct(X.pctB)}` +
      (X.term !== null ? `; terminations ${cktPct(X.term)}` : "") + "." +
      (last ? ` ${last.n} value(s) changed since ${last.prevFile || "the last load"}${last.down ? `, ${last.down} went down` : ""}${kept ? `; ${kept} entered here kept` : ""}.` : ""));
    save(); renderAll(); navigate("circuits");
    toast(`Circuit tracker loaded: ${X.nF.toLocaleString()} feeders, ${X.nB.toLocaleString()} branch circuits.` + (last ? ` ${last.n} value(s) changed.` : ""));
  }catch(err){
    toast("Circuit tracker upload failed: " + err.message, "bad");
    addAudit("Circuit Tracker","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}

function clearCircuits(){
  if(!confirmAction("Clear the loaded circuit tracker? Progress entered here that is not in the workbook is lost — download the tracker first if there is any. Where boards are filed on the project map is kept.")) return;
  const tags = state.ckt.tags || {}, rev = (state.ckt.rev || 0) + 1;
  state.ckt = { ...cktEmpty(), tags, rev };
  CKTVIEW.board = ""; CKTVIEW.q = ""; CKTVIEW.phase = "";
  addAudit("Circuit Tracker","Circuit Tracker Cleared","Circuit tracker removed by PM.");
  save(); renderAll(); toast("Circuit tracker cleared.");
}

/* One line in the audit trail per board per day, not one per click. */
function cktAudit(boardName, n){
  const today = new Date().toLocaleDateString(), last = state.audit[state.audit.length - 1];
  if(last && last.type === "Circuit Tracker" && last.title === "Progress Entered" && last.board === boardName && last.day === today){
    last.count += n; last.summary = `${boardName} — ${last.count} value(s) entered in OhmBoy.`; last.time = new Date().toLocaleString();
    return;
  }
  addAudit("Circuit Tracker","Progress Entered", `${boardName} — ${n} value(s) entered in OhmBoy.`);
  Object.assign(state.audit[state.audit.length - 1], { board:boardName, day:today, count:n });
}

/* Set one value. kind "F" = a feeder milestone, "B" = a branch circuit's percent. */
function cktApply(kind, key, i, value){
  const c = state.ckt, rec = kind === "F" ? c.feeders.find(f => f.k === key) : c.branch.find(b => b.k === key);
  if(!rec) return false;
  const cur = kind === "F" ? rec.m[i] : rec.m;
  if((cur ?? null) === (value ?? null)) return false;
  const ek = cktEditKey(kind, key, i), e = c.edits[ek];
  const fileVal = e ? e.f : (cur ?? null);
  if((fileVal ?? null) === (value ?? null)) delete c.edits[ek];           // back to what the workbook says
  else c.edits[ek] = { v:value, f:fileVal, t:todayISO() };
  if(kind === "F") rec.m[i] = value; else rec.m = value;
  return true;
}
function cktSetCell(kind, key, i, raw){
  const value = raw === "" ? null : Number(raw);
  if(!cktApply(kind, key, i, value)) return;
  cktTouch();
  cktAudit(key.split("|")[0], 1);
  save();
}
function cktSetAll(boardName, i, raw){
  const X = cktIndex(), b = X.by.get(boardName);
  if(!b || raw === "") return;
  const value = raw === "clear" ? null : Number(raw), isF = b.feeders.length > 0;
  const what = isF ? X.ms[i].label : "% complete", n = isF ? b.feeders.length : b.branch.length;
  if(!confirmAction(`Set ${what} to ${value === null ? "blank" : value + "%"} for all ${n} ${isF ? "feeders" : "circuits"} on ${boardName}?`)) return;
  let changed = 0;
  if(isF) b.feeders.forEach(r => { if(cktApply("F", r.f.k, i, value)) changed++; });
  else b.branch.forEach(x => { if(cktApply("B", x.k, 0, value)) changed++; });
  if(!changed){ toast("Nothing to change — they were already there."); return; }
  cktTouch(); cktAudit(boardName, changed);
  save(); renderAll(); toast(`${changed} value(s) set on ${boardName}.`);
}
/* Drop what was entered here and go back to the loaded workbook's values. */
function cktUseWorkbook(){
  const c = state.ckt, keys = Object.keys(c.edits || {});
  if(!keys.length) return;
  if(!confirmAction(`Replace the ${keys.length} value(s) entered in OhmBoy with what ${c.fileName || "the workbook"} says?`)) return;
  keys.forEach(ek => {
    const p = cktEditParts(ek), e = c.edits[ek];
    if(p.kind === "F"){ const f = c.feeders.find(x => x.k === p.key); if(f) f.m[p.i] = e.f; }
    else { const b = c.branch.find(x => x.k === p.key); if(b) b.m = e.f; }
  });
  c.edits = {}; cktTouch();
  addAudit("Circuit Tracker","Entries Dropped", `${keys.length} value(s) entered in OhmBoy replaced with the workbook's.`);
  save(); renderAll(); toast("Back to the workbook's values.");
}
/* File every board and panel that shares a number under one map node. */
function cktSetTag(tag, value){
  const t = state.ckt.tags = state.ckt.tags || {};
  if(!value) delete t[tag || "—"]; else t[tag || "—"] = value;
  save(); renderAll();
}

/* ---------------------------------------------------------------------------
   Download: the tracker as a workbook, in the same columns it was read from,
   so the milestone block can be pasted straight into the field's file.
   --------------------------------------------------------------------------- */

function cktColName(i){ let s = ""; i++; while(i > 0){ const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function cktSheetXml(rows){
  const cell = (v, c, r) => {
    const ref = cktColName(c) + (r + 1);
    if(v === null || v === undefined || v === "") return "";
    if(typeof v === "object"){
      const cached = v.v === null || v.v === undefined ? "" : (typeof v.v === "number" ? `<v>${v.v}</v>` : `<v>${xmlEscape(v.v)}</v>`);
      return `<c r="${ref}"${typeof v.v === "string" ? ' t="str"' : ""}><f>${xmlEscape(v.f)}</f>${cached}</c>`;
    }
    if(typeof v === "number") return `<c r="${ref}"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(v)}</t></is></c>`;
  };
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>` +
    rows.map((row, r) => row && row.length ? `<row r="${r + 1}">${row.map((v, c) => cell(v, c, r)).join("")}</row>` : "").join("") + `</sheetData></worksheet>`;
}
function cktWorkbookFiles(sheets){
  const esc1 = xmlEscape;
  return [
    { name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}</Types>` },
    { name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${esc1(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("")}</sheets><calcPr fullCalcOnLoad="1"/></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join("")}</Relationships>` }
  ].concat(sheets.map((s, i) => ({ name:`xl/worksheets/sheet${i + 1}.xml`, data:cktSheetXml(s.rows) })));
}
function cktExportSheets(){
  const c = state.ckt, X = cktIndex(), ms = X.ms, out = [];
  const num = (v) => v === null || v === undefined ? null : v;
  if(c.feeders.length){
    const m0 = 6, ovC = m0 + ms.length, phC = ovC + 1, first = 6, lastRow = first + c.feeders.length - 1;
    const L = cktColName, rows = [];
    rows.push(["Feeders - Phased Completion"]);
    rows.push(["Feeders:", c.feeders.length, null, null, "Overall % complete:"].concat(new Array(ovC - 5).fill(null), [{ f:`IFERROR(AVERAGE(${L(ovC)}${first}:${L(ovC)}${lastRow}),0)`, v:X.pctF }]));
    rows.push([]);
    rows.push(new Array(m0).fill(null).concat(ms.map(m => m.w)));
    rows.push(["Board","Ckt","Feed ID / Load Description","Amps","kVA","Type"].concat(ms.map(m => m.label), ["Overall %","Current Phase","Ref","Field Notes"]));
    X.frows.forEach((r, i) => {
      const n = first + i, f = r.f, cells = ms.map((_, j) => `${L(m0 + j)}${n}`);
      const ov = `IFERROR((${cells.map((cl, j) => `${cl}*$${L(m0 + j)}$4`).join("+")}),0)`;
      let ph = `"Not Started"`;
      ms.forEach((m, j) => { ph = `IF(${cells[j]}>0,"${m.phase}",${ph})`; });
      ph = `IF(COUNT(${cells.join(",")})=0,"Not Started",IF(${L(ovC)}${n}>=100,"COMPLETE",${ph}))`;
      const ckt = /^\d+$/.test(f.c) ? Number(f.c) : f.c;
      rows.push([f.b, ckt, f.d, num(f.a), num(f.kva), f.t || null].concat(f.m.map(num), [{ f:ov, v:r.ov }, { f:ph, v:r.ph }, f.r || null, f.n || null]));
    });
    out.push({ name:"Feeders", rows });
  }
  if(c.branch.length){
    const first = 5, lastRow = first + c.branch.length - 1, rows = [];
    rows.push(["Branch Circuits"]);
    rows.push(["Circuits:", c.branch.length, null, null, null, "Overall %:", null, { f:`IFERROR(SUM(H${first}:H${lastRow})/COUNTA(A${first}:A${lastRow}),0)`, v:X.pctB }]);
    rows.push([]);
    rows.push(["Panel","Ckt","Circuit Description","Amps","Poles","Voltage","Category","% Complete","Ref","Field Notes"]);
    c.branch.forEach(b => rows.push([b.b, /^\d+$/.test(b.c) ? Number(b.c) : b.c, b.d, num(b.a), /^\d+$/.test(b.p) ? Number(b.p) : (b.p || null), b.v || null, b.g || null, num(b.m), b.r || null, b.n || null]));
    out.push({ name:"Branch Circuits", rows });
  }
  const eks = Object.keys(c.edits || {});
  const rows = [["Entered in OhmBoy since " + (c.fileName || "the workbook") + " was loaded" + (c.uploadedAt ? " (" + c.uploadedAt + ")" : "")], [],
                ["Tab","Board / Panel","Ckt","Description","Milestone","Workbook value","Entered value","Entered on"]];
  eks.forEach(ek => {
    const p = cktEditParts(ek), e = c.edits[ek], rec = p.kind === "F" ? c.feeders.find(f => f.k === p.key) : c.branch.find(b => b.k === p.key);
    if(rec) rows.push([p.kind === "F" ? "Feeders" : "Branch Circuits", rec.b, rec.c, rec.d, p.kind === "F" ? ms[p.i].label : "% Complete", num(e.f), num(e.v), e.t]);
  });
  if(!eks.length) rows.push(["Nothing entered here — every value is as the workbook had it."]);
  out.push({ name:"Entered in OhmBoy", rows });
  return out;
}
function exportCircuits(){
  if(!cktHas()){ toast("Load a circuit tracker first.","bad"); return; }
  const bytes = zipStore(cktWorkbookFiles(cktExportSheets()));
  const blob = new Blob([bytes], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `Circuit_Tracker_${todayISO()}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  addAudit("Circuit Tracker","Tracker Downloaded", `${state.ckt.feeders.length} feeders, ${state.ckt.branch.length} branch circuits, ${Object.keys(state.ckt.edits || {}).length} value(s) entered here.`);
  save(); toast("Tracker downloaded.");
}

   Small pieces of the screens
   --------------------------------------------------------------------------- */

function cktBar(pct, cls){ const p = Math.max(0, Math.min(100, pct || 0)); return `<span class="pbar ${cls || ""}"><i style="width:${p.toFixed(1)}%"></i></span>`; }
function cktDots(m){ return `<span class="ms-dots">${m.map(v => `<i class="${(v || 0) >= 100 ? "d100" : ((v || 0) > 0 ? "dpart" : "")}"></i>`).join("")}</span>`; }
function cktPhaseCls(ph){ return ph === "COMPLETE" ? "ph-done" : (ph === "Not Started" ? "ph-none" : "ph-run"); }
function cktSelect(kind, key, i, v, edited, title){
  const opts = CKT_STEPS.includes(v) || v === null ? CKT_STEPS : CKT_STEPS.concat([v]).sort((a, b) => a - b);
  return `<select class="ms-sel ${v === null ? "" : (v >= 100 ? "v100" : (v > 0 ? "vpart" : "v0"))}${edited ? " mine" : ""}" data-ckind="${kind}" data-ckey="${esc(key)}" data-ci="${i}" title="${esc(title || "")}" aria-label="${esc(title || "percent complete")}">` +
    `<option value=""${v === null ? " selected" : ""}>—</option>` + opts.map(o => `<option value="${o}"${o === v ? " selected" : ""}>${o}</option>`).join("") + `</select>`;
}
function cktNodeFor(b){ const id = mapIndex().of["ckt:" + b.name]; return id ? mapNode(id) : null; }
/* Other boards and panels a description mentions, longest name first. */
function cktNamedIn(desc, self){
  const X = cktIndex(), d = " " + String(desc).toUpperCase().replace(/[^A-Z0-9.]+/g," ").trim() + " ";
  let hit = null;
  X.boards.forEach(b => { if(b.name !== self && (!hit || b.name.length > hit.name.length) && d.includes(" " + b.name.toUpperCase().replace(/[^A-Z0-9.]+/g," ").trim() + " ")) hit = b; });
  return hit;
}
function cktDescHtml(desc, self){
  const hit = cktNamedIn(desc, self);
  return esc(desc) + (hit ? ` <button class="linklike ckt-go" data-board="${esc(hit.name)}" title="Open ${esc(hit.name)}">→ ${esc(hit.name)}</button>` : "");
}

/* ---------------------------------------------------------------------------
   Find: boards, panels and circuits by any words in their name or description
   --------------------------------------------------------------------------- */

function cktFind(){
  const X = cktIndex(), q = CKTVIEW.q.trim().toLowerCase(), words = q.split(/\s+/).filter(Boolean), ph = CKTVIEW.phase, scope = CKTVIEW.scope;
  if(!words.length && !ph) return null;
  const hit = (s) => words.every(w => s.includes(w));
  const boards = words.length && !ph ? X.boards.filter(b => hit(b.name.toLowerCase())) : [];
  const rows = [];
  if(scope !== "B") X.frows.forEach(r => {
    if(ph === "ready"){ if(!X.ready.includes(r)) return; }
    else if(ph === "open"){ if(r.ph === "COMPLETE") return; }
    else if(ph && r.ph !== ph) return;
    if(words.length && !hit(`${r.f.b} ${r.f.c} ${r.f.d} ${r.f.t}`.toLowerCase())) return;
    rows.push({ kind:"F", r });
  });
  if(scope !== "F" && (!ph || ph === "open" || ph === "COMPLETE" || ph === "Not Started")) state.ckt.branch.forEach(b => {
    const x = b.m || 0;
    if(ph === "open" && x >= 100) return;
    if(ph === "COMPLETE" && x < 100) return;
    if(ph === "Not Started" && x > 0) return;
    if(words.length && !hit(`${b.b} ${b.c} ${b.d} ${b.g}`.toLowerCase())) return;
    rows.push({ kind:"B", b });
  });
  return { boards, rows };
}
/* Things to type, taken from the loaded tracker: a board, the leading word of a
   feed ID, and a panel written with a space to show the dash is not needed. */
function cktExamples(){
  const X = cktIndex(), out = [];
  const b = X.boards.find(x => x.feeders.length); if(b) out.push(b.name);
  const w = state.ckt.feeders.map(f => (String(f.d).match(/^[A-Za-z]{3,}/) || [""])[0].toUpperCase()).find(x => x && !out.some(o => o.toUpperCase().startsWith(x)));
  if(w) out.push(w);
  const p = X.boards.find(x => !x.feeders.length && /[-_]/.test(x.name)); if(p) out.push(p.name.replace(/[-_]+/g," "));
  return out;
}
function cktResultsHtml(){
  const X = cktIndex(), res = cktFind();
  if(!res){
    const eg = cktExamples();
    return `<p class="sub ckt-hint">Type any part of a board, panel, feed ID or load${eg.length ? " — " + eg.map(e => `<b>${esc(e)}</b>`).join(", ") + " —" : ","} or pick a status to list every circuit in it.</p>`;
  }
  const max = 80, shown = res.rows.slice(0, max);
  const boardRow = res.boards.slice(0, 12).map(b => `<button class="bd-chip" data-board="${esc(b.name)}"><b>${esc(b.name)}</b><small>${b.feeders.length ? plural(b.feeders.length,"feeder") : plural(b.branch.length,"circuit")}</small>${cktBar(b.pct)}<em>${cktPct(b.pct)}</em></button>`).join("");
  const trs = shown.map(x => x.kind === "F"
    ? `<tr class="ckt-row" data-board="${esc(x.r.f.b)}" data-hi="${esc(x.r.f.k)}" tabindex="0"><td><b>${esc(x.r.f.b)}</b></td><td>${esc(x.r.f.c)}</td><td>${esc(x.r.f.d)}</td><td>${x.r.f.a === null ? "—" : x.r.f.a}</td><td>${cktDots(x.r.f.m)} <span class="ckt-ov">${cktPct(x.r.ov)}</span></td><td><span class="ph ${cktPhaseCls(x.r.ph)}">${esc(x.r.ph)}</span></td></tr>`
    : `<tr class="ckt-row" data-board="${esc(x.b.b)}" data-hi="${esc(x.b.k)}" tabindex="0"><td><b>${esc(x.b.b)}</b></td><td>${esc(x.b.c)}</td><td>${esc(x.b.d)}</td><td>${x.b.a === null ? "—" : x.b.a}</td><td>${cktBar(x.b.m || 0, "mini")} <span class="ckt-ov">${cktPct(x.b.m || 0)}</span></td><td><small>branch · ${esc(x.b.g || "")}</small></td></tr>`).join("");
  return (boardRow ? `<div class="bd-row" style="margin-bottom:12px">${boardRow}</div>` : "") +
    (res.rows.length ? `<table class="log-table ckt-table"><thead><tr><th>Board / Panel</th><th>Ckt</th><th>Feed ID / Description</th><th>Amps</th><th>Progress</th><th>Status</th></tr></thead><tbody>${trs}</tbody></table>
      <p class="sub" style="margin-top:8px">${res.rows.length > max ? `Showing the first ${max} of ${res.rows.length.toLocaleString()} circuits — add a word to narrow it.` : plural(res.rows.length,"circuit") + "."} Open a row to see it on its board.</p>`
      : (boardRow ? "" : `<p class="sub ckt-hint">Nothing matches${CKTVIEW.q.trim() ? ` “${esc(CKTVIEW.q.trim())}”` : ""}${CKTVIEW.phase ? " with that status" : ""}.</p>`));
}
function cktRenderResults(){
  const el = $("cktResults"); if(el) el.innerHTML = cktResultsHtml();
  const clr = $("cktClear"); if(clr) clr.hidden = !(CKTVIEW.q || CKTVIEW.phase);      // typing does not redraw the page, so the button is shown from here
}
function cktSetPhase(ph){ CKTVIEW.phase = CKTVIEW.phase === ph ? "" : ph; renderCircuits(); const el = $("cktFindBox"); if(el) el.scrollIntoView({ block:"nearest" }); }

function openBoard(name, hi){
  if(!cktIndex().by.has(name)) return;
  CKTVIEW.board = name; CKTVIEW.hi = hi || "";
  renderCircuitBoard();
  navigate("circuitBoard");
  if(hi) setTimeout(() => { const el = document.querySelector("#circuitBoard tr.hi"); if(el) el.scrollIntoView({ block:"center" }); }, 60);

function renderCircuits(){
  const c = state.ckt;
  if(!cktHas()){
    renderPage("circuits","Circuit Tracker","Feeder and branch-circuit completion from the field's tracker workbook: where every circuit stands, and how far along terminations are.",

  /* Blank branch circuits: OhmBoy counts them as zero. Where the workbook's own

        <td>${m.b.feeders.length && X.termI >= 0 && L.sameMs ? `${m.wasT === null ? "—" : cktPct(m.wasT)} → <b>${cktPct(m.b.ms[X.termI])}</b>` : "—"}</td></tr>`).join("");
    lastHtml = `<div class="card panel" style="margin-top:18px"><h2>Since ${esc(L.prevFile || "the last load")}</h2>
      <p class="sub">${L.n ? `<b>${L.n.toLocaleString()}</b> value${L.n === 1 ? "" : "s"} changed on ${plural(moved.length,"board or panel","boards and panels")}.` : "No values changed."} Feeders ${cktPct(L.was.pctF)} → <b>${cktPct(X.pctF)}</b>, branch ${cktPct(L.was.pctB)} → <b>${cktPct(X.pctB)}</b>${X.termI >= 0 && L.sameMs ? `, terminations ${cktPct(L.was.ms[X.termI])} → <b>${cktPct(X.term)}</b>` : ""}.${L.added ? ` ${plural(L.added,"circuit")} new.` : ""}${L.removed ? ` ${plural(L.removed,"circuit")} no longer in the workbook.` : ""}${L.kept ? ` ${L.kept} entered here were kept because the workbook is still behind them.` : ""}${L.sameMs ? "" : " The milestone columns changed, so feeder steps were not compared one by one."}</p>
      ${(L.downs || []).length ? `<div class="li" style="margin-top:10px"><span class="lvl High">Ask</span><b>${plural(L.down,"value")} went down.</b> Progress does not usually go backwards — rework, a correction, or a slip of the hand.

        <table class="log-table" style="margin-top:8px">${cellHead}<tbody>${L.changes.map(cellRow).join("")}</tbody></table></details>` : ""}</div>`;

  const unfiled = idx.unmapped.ckt.length;

  renderPage("circuits","Circuit Tracker",`${c.title || c.fileName || "Circuit tracker"} · loaded ${c.uploadedAt || ""}. Milestone-based percent complete; a circuit with nothing entered counts as zero.`,

    </div>
    ${dashNote}

    <div class="card panel ckt-find" id="cktFindBox" style="margin-top:18px">

        <input id="cktQ" class="ckt-q" type="search" placeholder="Find a board, panel, feed ID or load…" value="${esc(CKTVIEW.q)}" oninput="CKTVIEW.q=this.value;cktRenderResults()" autocomplete="off" spellcheck="false" aria-label="Find a circuit">
        <select class="mini-select" onchange="CKTVIEW.scope=this.value;cktRenderResults()" aria-label="Which circuits">
          <option value="all"${CKTVIEW.scope === "all" ? " selected" : ""}>Feeders and branch</option><option value="F"${CKTVIEW.scope === "F" ? " selected" : ""}>Feeders only</option><option value="B"${CKTVIEW.scope === "B" ? " selected" : ""}>Branch only</option></select>
        <select class="mini-select" onchange="CKTVIEW.phase=this.value;renderCircuits()" aria-label="Status">${phaseOpts}</select>
        <button class="action" id="cktClear" onclick="CKTVIEW.q='';CKTVIEW.phase='';renderCircuits();const q=$('cktQ');if(q)q.focus()"${CKTVIEW.q || CKTVIEW.phase ? "" : " hidden"}>Clear</button>

        <p class="sub">Average across all ${X.nF.toLocaleString()} feeders; a blank counts as zero. ${X.ready.length ? `<button class="linklike" data-cphase="ready">${plural(X.ready.length,"feeder")} pulled and not yet terminated</button>.` : ""}</p>

  if(!b){
    renderPage("circuitBoard","Board","No board or panel selected.",
      `<div class="item"><h3>Pick a board or panel</h3><p>Open one from the Circuit Tracker.</p><div class="takeoff-row-actions"><button class="action dark" data-view="circuits">Open Circuit Tracker</button></div></div>`);

  $("circuitBoard").innerHTML = `<div class="page">

          ${node ? ` · filed under <button class="linklike" data-node="${esc(node.id)}">${esc(nodePath(node))}</button>` : (mapNodes().length ? ` · <span class="t-bad">not filed under a map node</span>` : "")}</p>

document.addEventListener("click", e => {
  const t = e.target.closest ? e.target : null;
  if(!t) return;
  const ph = t.closest("[data-cphase]");
  if(ph){ cktSetPhase(ph.dataset.cphase); return; }
  const el = t.closest("[data-board]");
  if(el && !el.disabled && !t.closest("select")) openBoard(el.dataset.board, el.dataset.hi || "");
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if(e.key === "Enter" && t && t.matches && t.matches("tr.ckt-row")){ e.preventDefault(); openBoard(t.dataset.board, t.dataset.hi || ""); return; }
  /* "/" jumps to the find box from anywhere on the Circuit Tracker page. */
  if(e.key === "/" && $("circuits").classList.contains("active") && !(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))){ const q = $("cktQ"); if(q){ e.preventDefault(); q.focus(); q.select(); } }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(!t || !t.matches) return;
  if(t.matches(".ms-sel")){
    cktSetCell(t.dataset.ckind, t.dataset.ckey, Number(t.dataset.ci), t.value);
    const keep = [t.dataset.ckind, t.dataset.ckey, t.dataset.ci];
    /* Redraw after the browser has finished with the control, then put focus
       back on the same cell so a keyboard run down the column keeps going. */
    setTimeout(() => {
      renderAll();
      const el = [...document.querySelectorAll("#circuitBoard .ms-sel")].find(s => s.dataset.ckind === keep[0] && s.dataset.ckey === keep[1] && s.dataset.ci === keep[2]);
      if(el) el.focus();
    }, 0);
  }
  else if(t.matches(".ms-all")){ const v = t.value; t.value = ""; cktSetAll(t.dataset.cboard, Number(t.dataset.ci), v); }
  else if(t.matches(".tag-select")) cktSetTag(t.dataset.ctag === "—" ? "" : t.dataset.ctag, t.value);
});

/* ===========================================================================
   The one-line — the project map drawn as a single-line diagram
   ---------------------------------------------------------------------------
   Contract at the source, a riser down the left, one bus per area, one feeder
   per system. A feeder's breaker shows the node's state:
     closed / teal    nothing open
     closed / copper  open items
     open   / red     needs action (overdue RFI, critical slip, high packet)
     grey             nothing filed here yet
   The drawing is the navigation: every node opens its six-slot card.
   =========================================================================== */

function compactMoney(v){
  const n = Number(v) || 0, a = Math.abs(n), s = n < 0 ? "-" : "";
  if(a >= 1e6) return s + "$" + (a / 1e6).toFixed(a >= 1e8 ? 0 : (a >= 1e7 ? 1 : 2)) + "M";
  if(a >= 1e3) return s + "$" + Math.round(a / 1e3) + "K";
  return s + "$" + Math.round(a);
}
function compactNum(v){
  const a = Math.abs(Number(v) || 0);
  if(a >= 1e6) return (a / 1e6).toFixed(2) + "M";
  if(a >= 1e4) return (a / 1e3).toFixed(1) + "K";
  return Math.round(a).toLocaleString();
}
function nodeSubline(f){
  const bits = [];
  if(f.schedule.acts.length) bits.push(Math.round(f.schedule.pctAvg) + "%");
  const bud = f.money.budget, lab = bud.byType.L;
  if(lab && lab.hoursProj) bits.push(compactNum(lab.hoursProj) + " hrs");
  else if(bud.n && bud.costProj) bits.push(compactMoney(bud.costProj));
  else if(f.money.sovValue) bits.push(compactMoney(f.money.sovValue));
  if(f.openCount) bits.push(f.openCount + " open");
  return bits.length ? bits.join(" · ") : (f.status === "none" ? "nothing filed" : "clear");
}
function olWrap(s, max){
  const words = String(s).split(/\s+/).filter(Boolean), lines = [""];
  for(let i = 0; i < words.length; i++){
    const cur = lines[lines.length - 1], next = (cur + " " + words[i]).trim();
    if(next.length <= max) lines[lines.length - 1] = next;
    else if(lines.length < 2) lines.push(words[i]);
    else { lines[1] = clip(lines[1] + " " + words.slice(i).join(" "), max); break; }
  }
  return lines.map(l => clip(l, max)).filter(Boolean);
}

function oneLineSvg(){
  const areas = mapAreas(), f0 = finance();
  const W = 1400, RX = 58, BUSX = 118, X0 = 140, DX = 154, BW = 140, PER = 8, ROWH = 124;
  const p = [];
  const brk = (x, y, st) => st === "trip"
    ? `<rect x="${x-6}" y="${y}" width="12" height="12" rx="2" class="ol-brk open"/><path d="M${x-9} ${y+15} L${x+9} ${y-3}" class="ol-slash"/>`
    : `<rect x="${x-6}" y="${y}" width="12" height="12" rx="2" class="ol-brk"/>`;

  /* source */
  const nSys = mapNodes().length - areas.length;
  p.push(`<circle cx="${RX}" cy="40" r="18" class="ol-src"/><path d="M${RX-9} 40 q4.5 -9 9 0 t9 0" class="ol-wire"/>`);
  p.push(`<text x="${RX+32}" y="36" class="ol-title">${esc(state.job.name || "Project")}</text>`);
  p.push(`<text x="${RX+32}" y="54" class="ol-meta">${finDemo() ? "Contract not set" : "Revised contract " + money(f0.revised)} · ${plural(areas.length,"area")} · ${plural(nSys,"system")}</text>`);
  p.push(`<path d="M${RX} 58 V70" class="ol-wire"/><rect x="${RX-7}" y="70" width="14" height="14" rx="2" class="ol-main"/>`);

  let y = 104, lastBus = 84;
  areas.forEach(a => {
    const fa = nodeFacts(a.id), sys = mapSystems(a.id);
    const rows = []; for(let i = 0; i < sys.length; i += PER) rows.push(sys.slice(i, i + PER));
    const busY = y + 34;
    lastBus = busY;
    const firstEnd = rows.length ? X0 + (rows[0].length - 1) * DX + BW + 14 : BUSX + 260;

    p.push(`<g class="ol-node ol-area ol-st-${fa.status}" data-node="${esc(a.id)}" tabindex="0" role="button" aria-label="${esc(a.name)} — ${esc(STATUS_WORD[fa.status])}">
      <title>${esc(a.name)} — ${esc(STATUS_WORD[fa.status])}${fa.why.length ? ": " + esc(fa.why.join(", ")) : ""}</title>
      <rect x="${BUSX-30}" y="${busY-28}" width="${W-BUSX}" height="36" class="ol-hit"/>
      <path d="M${RX} ${busY} H${BUSX-24}" class="ol-wire"/>${brk(BUSX-18, busY-6, fa.status)}<path d="M${BUSX-12} ${busY} H${BUSX}" class="ol-wire"/>
      <path d="M${BUSX} ${busY} H${firstEnd}" class="ol-bus"/>
      <text x="${BUSX+6}" y="${busY-11}" class="ol-area-name">${esc(clip(a.name, 60))}</text>
      <text x="${W-28}" y="${busY-11}" text-anchor="end" class="ol-meta">${esc(sys.length ? plural(sys.length,"system") : "single node")} · ${esc(nodeSubline(fa))}</text>
    </g>`);

    rows.forEach((row, r) => {
      const by = busY + r * ROWH;
      if(r > 0){
        const end = X0 + (row.length - 1) * DX + BW + 14;
        p.push(`<path d="M${BUSX} ${by-ROWH} V${by} H${end}" class="ol-bus thin"/>`);
      }
      row.forEach((s, j) => {
        const fs = nodeFacts(s.id), cx = X0 + j * DX + BW / 2, lines = olWrap(s.name, 20);
        p.push(`<g class="ol-node ol-st-${fs.status}" data-node="${esc(s.id)}" tabindex="0" role="button" aria-label="${esc(s.name)} — ${esc(STATUS_WORD[fs.status])}">
          <title>${esc(nodePath(s))} — ${esc(STATUS_WORD[fs.status])}${fs.why.length ? ": " + esc(fs.why.join(", ")) : ""}</title>
          <path d="M${cx} ${by} V${by+14}" class="ol-wire"/>${brk(cx, by+14, fs.status)}
          <path d="M${cx} ${by+26} V${by+40}" class="ol-wire ol-feed"/>
          <rect x="${cx-BW/2}" y="${by+40}" width="${BW}" height="62" rx="10" class="ol-box"/>
          <rect x="${cx-BW/2-2.5}" y="${by+50}" width="5" height="42" rx="2.5" class="ol-tab"/>
          ${lines.map((l, k) => `<text x="${cx+2}" y="${by + (lines.length === 1 ? 66 : 59) + k * 14}" text-anchor="middle" class="ol-name">${esc(l)}</text>`).join("")}
          <text x="${cx+2}" y="${by+92}" text-anchor="middle" class="ol-sub">${esc(nodeSubline(fs))}</text>
        </g>`);
      });
    });
    y = busY + (rows.length ? rows.length * ROWH - 6 : 30);
  });
  p.unshift(`<path d="M${RX} 84 V${lastBus}" class="ol-wire ol-riser"/>`);
  const H = y + 14;
  return `<svg class="ol-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMinYMin meet" aria-label="Project one-line diagram">${p.join("")}</svg>`;
}

function fieldBody(n, key, f){
  const b = f.bucket;
  switch(key){
    case "scope": {
      const sIn = (n.scopeIn || "").trim(), sOut = (n.scopeOut || "").trim();
      let h = `<div class="six-lead">${sIn ? esc(sIn).replace(/\n/g,"<br>") : '<span class="nil">In-scope not written yet.</span>'}</div>`;
      h += kv("Out", sOut ? esc(sOut).replace(/\n/g,"<br>") : '<span class="nil">not written</span>');
      if(f.kids.length) h += kv("Systems", esc(f.kids.map(k => k.name).join(", ")));
      const pl = f.money.budget.lines;
      if(pl.length){
        if(f.kids.length) h += kv("Phase codes", `${pl.length} across ${plural(f.kids.length,"system")}`);
        else {
          const names = pl.slice(0,6).map(l => clip(wbsShort(l, n), 30));
          h += kv("Phase codes", `${pl.length} — ${esc(names.join(", "))}` + (pl.length > 6 ? ` <small>+${pl.length - 6} more</small>` : ""));
        }
      }
      if(b.sov.length) h += kv("SOV lines", esc(b.sov.slice(0,3).map(l => clip(l.description, 38)).join("; ")) + (b.sov.length > 3 ? ` <small>+${b.sov.length - 3} more</small>` : ""));
      if(b.dwg.length) h += kv("Drawings", esc(b.dwg.slice(0,6).map(d => (d.sheetNumber || d.fileName) + (d.currentRevision ? " r" + d.currentRevision : "")).join(", ")) + (b.dwg.length > 6 ? ` <small>+${b.dwg.length - 6}</small>` : ""));
      if(b.to.length) h += kv("Takeoffs", `${plural(b.to.length,"row")} · ${feet(sumOf(b.to,"totalConduit"))}`);
      return h;
    }
    case "money": {
      const m = f.money, bud = m.budget;
      if(!bud.n && !b.sov.length && !b.po.length && !b.co.length) return nil("No budget lines, SOV lines, POs, or change orders filed here.");
      let h = "";
      if(bud.n){
        const lab = bud.byType.L, others = WBS_TYPE_ORDER.concat(Object.keys(bud.byType).filter(t => !WBS_TYPE_ORDER.includes(t))).filter(t => t !== "L" && bud.byType[t]);
        const delta = (dh, dc) => (dh || Math.abs(dc) >= 1) ? ` <small class="${(dh || dc) > 0 ? "t-bad" : "t-good"}">${dh ? signed(dh, hrs0) + " hrs · " : ""}${signed(dc, money)} vs estimate</small>` : "";
        const cr = bud.src === "cr", mon = crMonthName();
        const share = (a, b2) => b2 > 0 ? ` · ${pct1(a / b2 * 100)}` : "";
        if(lab && lab.hoursProj){
          h += `<div class="six-big">${hrs0(lab.hoursProj)}<small>labor hours projected · ${money(lab.costProj)} · ${plural(lab.n,"phase code")}</small></div>`;
          if(cr){
            h += kv("Used to date", lab.hoursJtd || lab.costJtd
              ? `<span class="${lab.hoursJtd > lab.hoursProj ? "t-bad" : ""}">${hrs0(lab.hoursJtd)} hrs${share(lab.hoursJtd, lab.hoursProj)}</span> · ${money(lab.costJtd)}`
              : '<span class="nil">no hours charged yet</span>');
            if(lab.hoursMonth || lab.costMonth) h += kv(mon, `${hrs0(lab.hoursMonth)} hrs · ${money(lab.costMonth)}`);
            if(lab.hoursJtd) h += kv("Left to spend", `${hrs0(lab.hoursProj - lab.hoursJtd)} hrs`, lab.hoursProj - lab.hoursJtd < 0 ? "bad" : "");
          }
          const same = !(lab.hoursProj - lab.hoursEst) && Math.abs(lab.costProj - lab.costEst) < 1;
          h += kv("Original estimate", same ? "same as projection" : `${hrs0(lab.hoursEst)} hrs · ${money(lab.costEst)}` + delta(lab.hoursProj - lab.hoursEst, lab.costProj - lab.costEst));
          h += kv("Blended rate", "$" + (lab.costProj / lab.hoursProj).toFixed(2) + " / hr");
          if(!f.kids.length){
            const top = bud.lines.filter(l => l.type === "L" && l.hoursProj).sort((x,y) => y.hoursProj - x.hoursProj).slice(0,3);
            if(top.length > 1) h += kv("Biggest codes", top.map(l => `${esc(clip(wbsShort(l, n), 30))} <small>${cr && l.hoursJtd ? hrs0(l.hoursJtd) + " of " : ""}${hrs0(l.hoursProj)}</small>`).join("<br>"));
          } else {
            const top = f.kids.map(k => ({ k, h:(nodeFacts(k.id).money.budget.byType.L || {}).hoursProj || 0 })).filter(x => x.h).sort((x,y) => y.h - x.h).slice(0,3);
            if(top.length > 1) h += kv("Biggest systems", top.map(x => `${esc(clip(x.k.name, 30))} <small>${hrs0(x.h)}</small>`).join("<br>"));
          }
        } else {
          h += `<div class="six-big">${money(bud.costProj)}<small>projected cost · ${plural(bud.n,"line")}</small></div>`;
          if(lab) h += kv("Labor", money(lab.costProj) + delta(0, lab.costProj - lab.costEst));
          if(cr){
            /* The report's cost column is spent plus open commitments. */
            const spent = bud.costJtd - bud.commit;
            h += kv("Spent + committed", bud.costJtd ? `<span class="${bud.costProj > 0 && bud.costJtd > bud.costProj + 1 ? "t-bad" : ""}">${money(bud.costJtd)}${share(bud.costJtd, bud.costProj)}</span>` : '<span class="nil">nothing yet</span>');
            if(bud.costJtd){ h += kv("Spent to date", money(spent)); h += kv("Open commitments", money(bud.commit)); }
            if(bud.costMonth) h += kv(mon, money(bud.costMonth));
            if(bud.hoursProj || bud.hoursJtd) h += kv("Hours", `${hrs0(bud.hoursJtd)} of ${hrs0(bud.hoursProj)} projected`, bud.hoursJtd > bud.hoursProj + 0.5 ? "bad" : "");
          }
        }
        if(lab || others.length > 1) others.forEach(t => { const x = bud.byType[t]; h += kv(wbsTypeName(t), `${money(x.costProj)} · ${plural(x.n,"line")}` + (cr && x.costJtd ? ` <small>${money(x.costJtd)} spent + committed</small>` : "") + delta(0, x.costProj - x.costEst)); });
        else if(others.length === 1){ const x = bud.byType[others[0]], d = x.costProj - x.costEst; h += kv("Original estimate", Math.abs(d) < 1 ? "same as projection" : money(x.costEst) + delta(0, d)); }
        if(lab && lab.hoursProj && others.length) h += kv("All cost types", money(bud.costProj));
        if(!lab && !f.kids.length && bud.n > 1){
          const top = bud.lines.slice().sort((x,y) => Math.abs(y.costProj) - Math.abs(x.costProj)).slice(0,4);
          h += kv("Biggest lines", top.map(l => `${esc(clip(l.description || "(no code or description)", 30))} <small>${money(l.costProj)}</small>`).join("<br>"));
        }
        if(bud.overHours.length) h += kv("Over projected hours", bud.overHours.slice(0,3).map(l => `${esc(clip(wbsShort(l, n), 28))} <small>${hrs0(l.hoursJtd)} of ${hrs0(l.hoursProj)}</small>`).join("<br>") + (bud.overHours.length > 3 ? `<br><small>+${bud.overHours.length - 3} more</small>` : ""), "bad");
        if(bud.overCost.length) h += kv("Over projected cost", bud.overCost.slice(0,3).map(l => `${esc(clip(wbsShort(l, n), 28))} <small>${money(l.costJtd)} of ${money(l.costProj)}</small>`).join("<br>") + (bud.overCost.length > 3 ? `<br><small>+${bud.overCost.length - 3} more</small>` : ""), "bad");
        if(bud.alt){
          const dH = (lab ? lab.hoursProj : 0) - bud.alt.hoursProj, dC = bud.costProj - bud.alt.costProj, agree = Math.abs(dH) < 0.5 && Math.abs(dC) < 1;
          h += kv("WBS workbook", agree ? "agrees with the cost report" : `${bud.alt.hoursProj ? hrs0(bud.alt.hoursProj) + " hrs · " : ""}${money(bud.alt.costProj)} <small class="t-bad">booked is ${Math.abs(dH) >= 0.5 ? signed(dH, hrs0) + " hrs · " : ""}${signed(dC, money)}</small>`);
        }
      }
      if(b.sov.length){
        h += bud.n ? kv("SOV scheduled value", `${money(m.sovValue)} · ${plural(b.sov.length,"line")}`)
                   : `<div class="six-big">${money(m.sovValue)}<small>scheduled value · ${plural(b.sov.length,"line")}</small></div>`;
        h += kv("Completed to date", `${money(m.billed)} · ${pct1(m.billedPct)}`) + kv("Balance to finish", money(m.balance));
      }
      if(b.po.length) h += kv("Open PO remaining", `${money(m.poOpen)} · ${plural(b.po.length,"PO line")}`);
      if(m.coApproved.length) h += kv("COs approved", `${money(sumOf(m.coApproved,"value"))} · ${m.coApproved.length}`);
      if(m.coPending.length) h += kv("COs pending", `${money(sumOf(m.coPending,"value"))} · ${m.coPending.length}`);
      return h;
    }
    case "schedule": {
      const s = f.schedule, ck = f.circuits;
      if(!s.acts.length && !ck) return nil("No schedule activities or circuits filed here.");
      /* Installed progress from the circuit tracker: what is actually pulled and landed. */
      let ckHtml = "";
      if(ck){
        if(ck.nF){
          ckHtml += kv("Feeders", `<b>${cktPct(ck.pctF)}</b> complete · ${ck.nF.toLocaleString()}`);
          if(ck.term !== null) ckHtml += kv("Terminations", `<b>${cktPct(ck.term)}</b> · ${ck.landed} of ${ck.nF} landed` + (ck.ready ? ` <small>${ck.ready} pulled, ready to land</small>` : ""));
          if(ck.pull !== null) ckHtml += kv("Wire pulled", cktPct(ck.pull));
        }
        if(ck.nB) ckHtml += kv("Branch circuits", `${cktPct(ck.pctB)} complete · ${ck.nB.toLocaleString()}`);
        ckHtml += kv("Boards & panels", ck.boards.slice(0, 5).map(x => `<button class="linklike" data-board="${esc(x.name)}">${esc(x.name)}</button>`).join(", ") + (ck.boards.length > 5 ? ` <small>+${ck.boards.length - 5} more</small>` : ""));
      }
      if(!s.acts.length) return `<div class="six-big">${cktPct(ck.nF ? ck.pctF : ck.pctB)}<small>${ck.nF ? "feeders" : "branch circuits"} complete · circuit tracker</small></div>` + ckHtml + `<p class="nil" style="margin-top:8px">No schedule activities filed here.</p>`;
      let h = `<div class="six-big">${Math.round(s.pctAvg)}%<small>${esc(s.stand)} · ${s.done.length} of ${s.acts.length} activities done</small></div>`;
      h += kv("Window", `${esc(shortDate(s.start))} → ${esc(shortDate(s.finish))}`);
      if(s.driving) h += kv("Driving", `${esc(clip(s.driving.name, 60))} <small>(${esc(s.drivingWhy)})</small>`);
      if(s.slipped.length) h += kv("Slipped vs prior", `${s.slipped.length} · worst +${s.slipped[0].slipDays}d ${esc(clip(s.slipped[0].name, 40))}`, "bad");
      if(s.late.length) h += kv("Past finish, not done", String(s.late.length), "bad");
      if(s.crit.length) h += kv("Critical, still open", String(s.crit.length));
      if(s.nextUp.length) h += kv("Next up", s.nextUp.map(a => `${esc(clip(a.name, 44))} <small>${esc(shortDate(fmtDate(a.start)))}${a.pct > 0 ? " · " + a.pct + "%" : ""}</small>`).join("<br>"));
      return h + ckHtml;
    }
    case "people": {
      const p = f.people, list = (o) => Object.entries(o).sort((x,y) => y[1] - x[1]).map(([k,c]) => `${esc(k)} (${c})`).join(", ");
      let h = kv("Ours", n.owner ? esc(n.owner) : '<span class="nil">not set</span>');
      h += kv("Field lead", n.lead ? esc(n.lead) : '<span class="nil">not set</span>');
      h += kv("Theirs", n.counterpart ? esc(n.counterpart) : '<span class="nil">not set</span>');
      if(Object.keys(p.balls).length) h += kv("RFI ball in court", list(p.balls));
      if(Object.keys(p.coWith).length) h += kv("Pending COs with", list(p.coWith));
      return h;
    }
    case "risks": {
      const r = f.risks;
      if(!r.watch.length && !r.packets.length) return nil("No watch items or open packets on this node.");
      let h = r.watch.slice(0,5).map(w => `<div class="li"><span class="lvl ${esc(w.level)}">${esc(w.level)}</span>${esc(w.text)}${w.where ? ` <small>(${esc(w.where)})</small>` : ""}</div>`).join("");
      if(r.watch.length > 5) h += `<div class="li"><small>+${r.watch.length - 5} more watch items</small></div>`;
      h += r.packets.slice(0,3).map(p => `<div class="li"><span class="lvl pk">Score ${p.score}</span>${packetLink(p)}</div>`).join("");
      if(r.packets.length > 3) h += `<div class="li"><small>+${r.packets.length - 3} more open packets</small></div>`;
      if(r.moneyAtRisk) h += kv("Money at risk (packets)", money(r.moneyAtRisk));
      return h;
    }
    case "open": {
      const o = f.open;
      if(!f.openCount) return nil("Nothing open on this node.");
      let h = "";
      if(o.openRfis.length){
        h += kv("RFIs open", `${o.openRfis.length}${o.overdueRfis.length ? ` · <span class="t-bad">${o.overdueRfis.length} overdue</span>` : ""}`);
        h += o.openRfis.slice(0,3).map(r => `<div class="li"><b>${esc(r.number || "RFI")}</b> ${esc(clip(r.title, 52))}${r.dueDate ? ` <small class="${isPastDue(r.dueDate) ? "bad" : ""}">due ${esc(shortDate(fmtDate(r.dueDate)))}</small>` : ""}</div>`).join("");
      }
      if(o.coPending.length){
        h += kv("COs pending", `${o.coPending.length} · ${money(sumOf(o.coPending,"value"))}`);
        h += o.coPending.slice(0,2).map(c => `<div class="li"><b>${esc(c.number || "CO")}</b> ${esc(clip(c.title, 52))} <small>${esc(c.status)}</small></div>`).join("");
      }
      if(o.dwgPending.length) h += kv("Drawings to review", esc(o.dwgPending.slice(0,5).map(d => d.sheetNumber || d.fileName).join(", ")));
      if(o.poLate.length) h += kv("Deliveries late", o.poLate.slice(0,3).map(p => `${esc(clip(p.vendor || p.poNumber, 26))} <small>was ${esc(shortDate(fmtDate(p.eta)))}</small>`).join("<br>"), "bad");
      if(o.poNext.length) h += kv("Next deliveries", o.poNext.map(p => `${esc(clip(p.vendor || p.poNumber, 26))} <small>${esc(shortDate(fmtDate(p.eta)))}</small>`).join("<br>"));
      if(f.risks.packets.length) h += kv("Open packets", String(f.risks.packets.length));
      return h;
    }
  }
  return "";
}

function fieldSource(key){
  return {
    scope:"Node notes · " + (state.cr.lines.length ? "Cost Report" : "WBS + Cost") + " · Schedule of Values · Drawing Intel · Takeoffs",
    money:(state.cr.lines.length ? "Cost Report" + (state.cr.asOfText ? " as of " + state.cr.asOfText : "") + (state.wbs.lines.length ? " · WBS + Cost" : "") : "WBS + Cost") + " · Schedule of Values · Open PO Report · Change Order Log",
    schedule:"Schedule Intake" + (state.schedule.fileName ? " · " + state.schedule.fileName : "") + (cktHas() ? " · Circuit Tracker" : ""),
    people:"Node notes · RFI Log · Change Order Log",
    risks:"Node watch items · Packet Triage",
    open:"RFI Log · Change Order Log · Drawing Intel · Open PO Report · Packet Triage"
  }[key] || "";
}

  return `<div class="card six-card" data-field="${fd.key}">
    <div class="six-head"><span class="six-n">${fd.n}</span><h3>${esc(fd.label)}</h3></div>
    <p class="six-ask">${esc(fd.ask)}</p>
    ${fieldBody(n, fd.key, f)}
    <div class="six-src">${esc(fieldSource(fd.key))}</div>
  </div>`;
}

function statusPill(f){
  return `<span class="st-pill st-${f.status}"><i class="st-dot st-${f.status}"></i>${esc(STATUS_WORD[f.status])}</span>`;
}

        <h1>${esc(n.name)}</h1>
        <p class="sub">${statusPill(f)} ${f.why.length ? esc(f.why.join(" · ")) : (f.status === "none" ? "Nothing is filed under this node yet." : "")}</p>
      </div>
      <div class="node-nav">

        <button class="action" ${next ? `data-node="${esc(next.id)}"` : "disabled"} title="${next ? esc(nodePath(next)) : ""}">${next ? esc(clip(next.name, 22)) : "End of line"} →</button>

    <div class="six-grid">${FIELDS.map(fd => sixCard(n, fd, f)).join("")}</div>

            <div class="field full"><label>Watch item</label><input id="ndWatchText" placeholder="Switchgear ship date depends on approved submittal by 10/20" onkeydown="if(event.key==='Enter')addWatch('${esc(n.id)}')"></div>
            <div class="field"><label>Level</label><select id="ndWatchLevel"><option>High</option><option selected>Medium</option><option>Low</option></select></div>
          </div>
          <div class="takeoff-row-actions"><button class="action" onclick="addWatch('${esc(n.id)}')">Add Watch Item</button></div>
          <table class="log-table" style="margin-top:12px"><tbody>${watchRows || '<tr><td>No watch items on this node.</td></tr>'}</tbody></table>
        </div>
      </div>
    </details>
  </div>`;
}

function saveNode(id){
  const n = mapNode(id);
  if(!n) return;
  n.owner = val("ndOwner","").trim(); n.lead = val("ndLead","").trim(); n.counterpart = val("ndCounterpart","").trim();
  n.scopeIn = val("ndScopeIn","").trim(); n.scopeOut = val("ndScopeOut","").trim();
  n.keywords = val("ndKeywords","").split(",").map(s => s.trim()).filter(Boolean);
  n.wbs = val("ndWbs","").split(";").map(s => s.trim()).filter(Boolean);
  n.codes = val("ndCodes","").split(";").map(s => s.trim()).filter(Boolean);
  mapTouch();
  addAudit("Project Map","Node Updated", `${nodePath(n)} — owner, scope, or matching rules edited.`);
  save(); renderAll();
  toast("Node saved.");
}
function addWatch(id){
  const n = mapNode(id), text = val("ndWatchText","").trim();
  if(!n) return;
  if(!text){ toast("Write the watch item first.","bad"); return; }
  n.risks = n.risks || [];
  n.risks.push({ id:uid("W"), text, level:val("ndWatchLevel","Medium") });
  mapTouch();
  addAudit("Project Map","Watch Item Added", `${nodePath(n)} — ${text}`);
  NODE_EDIT_OPEN = true;
  save(); renderAll();
}
function deleteWatch(id, rid){
  const n = mapNode(id);
  if(!n) return;
  n.risks = (n.risks || []).filter(r => r.id !== rid);
  mapTouch(); NODE_EDIT_OPEN = true;
  save(); renderAll();
}

  const hi = risks.filter(r => r.score >= 75).length;
