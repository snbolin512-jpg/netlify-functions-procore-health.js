<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ωboy V0.21.5 — Packet Treatment + XLSX Export</title>
<style>
:root{
  --ivory:#fffff6; --white:#fff; --black:#070707; --gray:#565656;
  --copper:#b87333; --copper-dark:#7a3f16; --teal:#0f766e; --red:#c92525;
  --shadow:0 22px 54px rgba(20,16,10,.07); --shadow-soft:0 12px 28px rgba(20,16,10,.048);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Avenir Next LT Pro","Avenir Next","Avenir",Helvetica,Arial,sans-serif;font-weight:300;color:var(--black);background:radial-gradient(circle at 92% 0%,rgba(184,115,51,.055),transparent 30%),linear-gradient(180deg,#fff 0%,var(--ivory) 64%,#fffef9 100%)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;padding:12px}
.shell{width:min(1680px,calc(100vw - 24px));min-height:calc(100vh - 24px);margin:0 auto;border:1px solid rgba(184,115,51,.22);background:linear-gradient(180deg,rgba(255,255,255,.985),rgba(255,255,246,.985));border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.topbar{height:52px;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid rgba(184,115,51,.14)}
.datepill{display:inline-flex;align-items:center;gap:8px;color:#111;font-size:13px}
.bell{position:relative;width:34px;height:34px;display:grid;place-items:center}.bell b{position:absolute;top:2px;right:3px;width:15px;height:15px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
svg{stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.floating-home{position:fixed;left:18px;top:18px;z-index:1000;border:1px solid rgba(184,115,51,.55);background:rgba(255,255,255,.9);backdrop-filter:blur(12px);color:#111;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow-soft)}
.view{display:none}.view.active{display:block}
.hero{display:grid;grid-template-columns:340px minmax(0,1fr);gap:34px;align-items:start;padding:18px 44px 30px;border-bottom:1px solid rgba(184,115,51,.14)}
.jackson-area{display:flex;justify-content:center;align-items:flex-start;min-height:300px}.jackson{width:285px;max-height:310px;object-fit:contain;filter:drop-shadow(0 24px 22px rgba(20,16,10,.12))}
.title{margin:0;padding-top:2px;font-size:62px;line-height:1.03;font-weight:300;letter-spacing:-.065em;color:var(--black)}.subtitle{margin:9px 0 26px;max-width:720px;font-size:17px;line-height:1.45;color:#303030}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{border:1px solid rgba(184,115,51,.50);border-radius:14px;background:rgba(255,255,255,.88);box-shadow:var(--shadow-soft)}
.daily-card{min-height:168px;padding:22px 20px;display:grid;grid-template-columns:54px 1fr;gap:14px;align-items:start;text-align:left;color:var(--black)}
.daily-card:hover,.module:hover,.action:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(20,16,10,.07)}
.icon{width:50px;height:50px;border:1.5px solid var(--copper);border-radius:999px;display:grid;place-items:center;color:var(--copper-dark)}.icon svg{width:25px;height:25px}.daily-card.red .icon{border-color:var(--red);color:var(--red)}.daily-card.teal .icon{border-color:var(--teal);color:var(--teal)}
.daily-card h3{margin:0;font-size:15px;font-weight:700;color:#111}.num{display:block;font-size:38px;line-height:1;margin:10px 0 7px;color:#111;font-weight:300;letter-spacing:-.04em}.num.teal{color:var(--teal)}.daily-card small{display:block;color:#3f3f3f;line-height:1.35;font-size:13px;min-height:35px}.link{display:inline-flex;align-items:center;gap:8px;margin-top:13px;font-size:12px;color:#111}
.ops-row{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;padding:0 44px 26px;border-bottom:1px solid rgba(184,115,51,.14)}
.ops-panel{border:1px solid rgba(184,115,51,.38);border-radius:14px;background:rgba(255,255,255,.88);box-shadow:var(--shadow-soft);padding:18px 20px}.ops-panel h2{margin:0 0 6px;font-size:21px;font-weight:700}.ops-panel p{margin:0 0 14px;color:#555;font-size:13px}.ops-actions{display:flex;flex-wrap:wrap;gap:10px}
.mascot-note{display:flex;gap:14px;align-items:center}.mascot-note img{width:86px;height:86px;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(20,16,10,.09))}.mascot-note strong{display:block;font-size:16px;margin-bottom:4px}
.action{border:1px solid rgba(184,115,51,.55);background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;color:#111}.action.primary,.action.dark{background:#111;color:#fff;border-color:#111}
.section{padding:26px 42px 18px}.section h2{font-size:22px;margin:0;color:#111;font-weight:700}.section p{margin:5px 0 0;color:#555;font-size:13px}
.map-wrap{position:relative;min-height:430px;margin-top:12px;overflow:hidden}.map-lines{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}.map-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 1.28fr 1.28fr 1.38fr 1.28fr 1.28fr 1.05fr;grid-template-rows:90px 90px 90px 90px;gap:14px 18px;align-items:center}
.bubble{border:1.2px solid rgba(184,115,51,.68);background:rgba(255,255,255,.92);border-radius:999px;min-height:74px;box-shadow:var(--shadow-soft);display:grid;place-items:center;text-align:center;padding:13px 22px;position:relative}.bubble label{font-size:12px;font-weight:700;color:#111;display:block}.bubble strong{display:block;margin-top:7px;color:#090909;font-size:22px;line-height:1.05;font-weight:400}.bubble strong.teal{color:var(--teal)}.bubble strong.red{color:var(--red)}.info{position:absolute;right:13px;top:12px;width:16px;height:16px;border:1px solid var(--copper);border-radius:999px;color:var(--copper-dark);font-size:10px;font-weight:700;display:grid;place-items:center;background:#fff}
.b-contract{grid-column:2;grid-row:1}.b-co{grid-column:3;grid-row:1}.b-revised{grid-column:4;grid-row:1}.b-cost{grid-column:5;grid-row:1}.b-po{grid-column:3;grid-row:2}.b-eac{grid-column:4 / span 2;grid-row:2}.b-left{grid-column:6;grid-row:2}.b-gain{grid-column:2;grid-row:3}.b-margin{grid-column:4;grid-row:3}.b-aging{grid-column:5;grid-row:3}
.callout{border:1px solid rgba(184,115,51,.34);background:rgba(255,255,255,.9);border-radius:10px;padding:11px 13px;box-shadow:0 12px 26px rgba(20,16,10,.055);font-size:12px;line-height:1.45;color:#111}.callout b{display:block;margin-bottom:4px;font-weight:700}.c-revised{grid-column:1;grid-row:2}.c-left{grid-column:6;grid-row:1}.c-po{grid-column:4;grid-row:3}.c-aging{grid-column:6;grid-row:3}
.modules{margin:8px 30px 26px;border:1px solid rgba(184,115,51,.28);background:rgba(255,255,255,.88);border-radius:14px;box-shadow:var(--shadow-soft);padding:17px 18px 19px}.modules h2{margin:0;color:#111;font-size:21px;font-weight:700}.modules p{margin:4px 0 14px;color:#555;font-size:13px}
.module-strip{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));border:1px solid rgba(184,115,51,.28);border-radius:12px;background:#fff;overflow:hidden}.module{min-height:96px;background:#fff;border:0;border-right:1px solid rgba(184,115,51,.22);display:grid;place-items:center;gap:6px;padding:11px 7px;position:relative}.module:last-child{border-right:0}.module svg{width:32px;height:32px;stroke:#111}.module span{font-size:12px;color:#111;font-weight:400}.dot{position:absolute;width:8px;height:8px;border-radius:999px;background:var(--red);right:18px;top:18px}
.page{padding:32px 42px}.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}.page h1{margin:0;font-size:42px;font-weight:300;letter-spacing:-.05em}.page .sub{margin:6px 0 0;color:#555}
.grid{display:grid;gap:16px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi{padding:18px}.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#555}.kpi strong{display:block;margin-top:8px;font-size:30px;font-weight:700}.panel{padding:20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.list{display:grid;gap:12px;margin-top:16px}.item{padding:16px;border:1px solid rgba(184,115,51,.36);border-radius:14px;background:#fff;box-shadow:var(--shadow-soft)}.item h3{margin:0 0 8px;font-size:18px}.item p{margin:0;color:#444;line-height:1.45}.badge{display:inline-flex;border:1px solid rgba(184,115,51,.4);background:#fff8ef;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;margin-right:6px}pre{background:#111;color:#fffdf5;border-radius:14px;padding:14px;max-height:360px;overflow:auto;white-space:pre-wrap}
.log-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid rgba(184,115,51,.28);border-radius:14px;background:#fff}.log-table th,.log-table td{text-align:left;padding:12px 13px;border-bottom:1px solid rgba(184,115,51,.18);font-size:13px;vertical-align:top}.log-table th{background:#fffdf8;font-weight:700;color:#111}.log-table tr:last-child td{border-bottom:0}
.takeoff-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.takeoff-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:700;color:#333}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(184,115,51,.34);background:#fff;border-radius:12px;padding:10px 11px;color:#111}.field.full{grid-column:1/-1}.takeoff-results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result-card{border:1px solid rgba(184,115,51,.34);border-radius:14px;background:#fff;box-shadow:var(--shadow-soft);padding:15px}.result-card span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.10em;color:#555}.result-card strong{display:block;margin-top:7px;font-size:25px;font-weight:700}.takeoff-row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
@media(max-width:1300px){.hero{grid-template-columns:270px 1fr}.jackson{width:235px}.title{font-size:48px}.summary{grid-template-columns:repeat(2,1fr)}.map-lines{display:none}.map-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.bubble,.callout{grid-column:auto!important;grid-row:auto!important}.module-strip{grid-template-columns:repeat(4,1fr)}.grid.four{grid-template-columns:repeat(2,1fr)}.ops-row,.takeoff-layout{grid-template-columns:1fr}.ops-row{padding:0 18px 20px}}
@media(max-width:760px){.app{padding:6px}.shell{width:calc(100vw - 12px)}.hero{grid-template-columns:1fr;padding:18px}.jackson-area{min-height:210px}.title{font-size:38px}.summary,.grid.four,.grid.three,.takeoff-form,.takeoff-results{grid-template-columns:1fr}.section,.page{padding:20px 18px}.module-strip{grid-template-columns:repeat(2,1fr)}}

/* Ωboy V0.21.5 — packet treatment, detail views, xlsx export */
.pipeline-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pipeline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pipeline-actions .action{padding:8px 11px;font-size:12px}
.pipeline-actions .action.rfi{border-color:#0f766e;color:#0f766e}
.pipeline-actions .action.co{border-color:#c92525;color:#c92525}
.pipeline-actions .action.watch{border-color:#b87333;color:#7a3f16}
.pipeline-actions .action.procure{border-color:#6d4aa8;color:#513586}
.pipeline-actions .action.schedule{border-color:#0f5d80;color:#0f5d80}
.packet-detail-layout{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
.detail-hero{padding:20px}
.detail-hero h2{margin:8px 0 10px;font-size:30px;line-height:1.08;letter-spacing:-.04em}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.detail-section{padding:17px;margin-top:14px}
.detail-section h3{margin:0 0 8px;font-size:18px}
.detail-list{margin:0;padding-left:18px;color:#333;line-height:1.55}
.pipeline-status{display:grid;gap:10px;margin-top:12px}
.pipeline-status .item{margin:0}
.trace-box{background:#fff;border:1px solid rgba(184,115,51,.30);border-radius:14px;padding:14px;line-height:1.5;color:#333}
.export-row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.xlsx-badge{display:inline-flex;border:1px solid rgba(15,118,110,.45);background:#eefbf8;color:#0f766e;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700}
@media(max-width:1000px){.pipeline-grid,.packet-detail-layout{grid-template-columns:1fr}}


/* Ωboy V0.21.6 — asset hardening, equation popovers, manual intake, feature linkage */
.eq-popover{
  position:fixed;
  z-index:99999;
  max-width:min(460px,86vw);
  background:#101010;
  color:#fffdf5;
  border:1px solid var(--copper);
  border-radius:16px;
  padding:14px 15px;
  box-shadow:0 24px 54px rgba(0,0,0,.24);
  font-size:12px;
  line-height:1.48;
  white-space:pre-line;
}
.eq-popover b{display:block;margin-bottom:5px;color:#fff}
.eq-popover button{
  margin-top:10px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);
  color:#fff;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
}
.info{cursor:pointer}
.info:hover{background:#fff8ef}
.upload-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.upload-card{
  padding:20px;
}
.upload-card input[type=file]{
  width:100%;
  border:1px dashed rgba(184,115,51,.45);
  background:#fffdf8;
  border-radius:14px;
  padding:18px;
}
.upload-card textarea{
  min-height:130px;
}
.feature-map{
  display:grid;
  gap:14px;
}
.feature-row{
  display:grid;
  grid-template-columns:220px 1fr 1fr 180px;
  gap:10px;
  align-items:stretch;
  border:1px solid rgba(184,115,51,.30);
  background:#fff;
  border-radius:16px;
  padding:12px;
  box-shadow:var(--shadow-soft);
}
.feature-row h3{
  margin:0;
  font-size:15px;
}
.feature-row p{
  margin:0;
  color:#444;
  line-height:1.45;
  font-size:13px;
}
.health-pill{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  padding:6px 9px;
  font-size:12px;
  font-weight:700;
  border:1px solid rgba(15,118,110,.35);
  color:#0f766e;
  background:#eefbf8;
}
.health-pill.warn{
  border-color:rgba(201,37,37,.35);
  color:#c92525;
  background:#fff0f0;
}
.mascot-fallback{
  width:285px;
  height:310px;
  display:grid;
  place-items:center;
  border:1px solid rgba(184,115,51,.30);
  border-radius:28px;
  background:#fff;
  color:#7a3f16;
  font-weight:700;
  text-align:center;
  padding:20px;
}
@media(max-width:1000px){
  .upload-grid,.feature-row{grid-template-columns:1fr}
}

</style>
</head>
<body>
<button class="floating-home" id="homeBtn">← Cockpit</button>
<div class="app"><main class="shell">
  <div class="topbar"><span class="datepill" id="datePill"></span><span class="bell" id="bell"></span></div>
  <section id="cockpit" class="view active"></section><section id="triage" class="view"></section><section id="finance" class="view"></section><section id="openPOReport" class="view"></section><section id="agingReport" class="view"></section><section id="colog" class="view"></section><section id="rfilog" class="view"></section><section id="audit" class="view"></section><section id="procore" class="view"></section><section id="packetDetail" class="view"></section><section id="manualIntake" class="view"></section><section id="featureMap" class="view"></section><section id="drawingTakeoff" class="view"></section><section id="manualCompare" class="view"></section><section id="riskRegister" class="view"></section><section id="schedule" class="view"></section>
</main></div>
<script>
const JACKSON_SRC = "assets/jackson-ohmboy-mascot.png";
const API = {health:"/.netlify/functions/procore-health",mockDrawing:"/.netlify/functions/procore-mock-event",mockSchedule:"/.netlify/functions/procore-mock-event?kind=schedule"};
const STORAGE_KEY = "ohmboy_v0214_state";
const state = loadState();
function seedState(){return {packets:[],rawEvents:[],normalized:[],audit:[],rfi:[],co:[],pmDays:[],takeoffs:[],financial:{originalContract:24750000,approvedCO:1325000,pendingCO:0,costToDate:11842000,eac:26480000,openPO:2150000,aging:{net30:340000,net60:420000,net90:310000,net120:220000}}};}
function loadState(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(!saved)return seedState();const base=seedState();return {...base,...saved,financial:{...base.financial,...(saved.financial||{}),aging:{...base.financial.aging,...((saved.financial||{}).aging||{})}}};}catch(e){return seedState();}}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function $(id){return document.getElementById(id);}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function money(v){return "$"+Math.round(Number(v||0)).toLocaleString();}
function feet(v){return Math.round(Number(v||0)).toLocaleString()+" LF";}
function qty(v){return Math.round(Number(v||0)).toLocaleString();}
function pct(v){return (Number(v)>=0?"+":"")+Number(v||0).toFixed(1)+"%";}
function uid(prefix){return prefix+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(16).slice(2,6).toUpperCase();}
function icon(name){const I={flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h12l-2 4 2 4H5"/></svg>',shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>',clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>',dollar:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M16 7.5c-1-1-2.4-1.5-4-1.5-2.2 0-4 1.1-4 2.8 0 4.2 8 1.8 8 6.4 0 1.7-1.8 2.8-4 2.8-1.7 0-3.1-.5-4.2-1.5"/></svg>',gauge:'<svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M6 16h12"/></svg>',tray:'<svg viewBox="0 0 24 24"><path d="M5 4h14l2 10v5H3v-5L5 4z"/><path d="M3 14h6l2 3h2l2-3h6"/></svg>',cart:'<svg viewBox="0 0 24 24"><path d="M5 6h16l-2 8H7L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>',aging:'<svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.2 10.2"/><path d="M12 8v5h4"/><path d="M4 5v5h5"/></svg>',doc:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>',rfi:'<svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/><path d="M12 12c0-2 3-2 3-4 0-1.4-1.2-2.2-3-2.2S9 6.7 9 8"/><path d="M12 15h.01"/></svg>',shield2:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 4.6-3.2 7.5-8 9-4.8-1.5-8-4.4-8-9V7z"/><path d="M9.5 12.5l1.8 1.8 3.8-4"/></svg>',cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h11a4 4 0 0 0 0-8 6 6 0 0 0-11.5-1.5A4.8 4.8 0 0 0 7 18z"/><path d="M12 12v8"/><path d="M9 17l3 3 3-3"/></svg>',scales:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M4 7h16"/><path d="M7 7l-3 6h6z"/><path d="M17 7l-3 6h6z"/><path d="M8 21h8"/></svg>',drawing:'<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8"/><path d="M8 12h5"/><path d="M16 16l3 3"/><path d="M16 19l3-3"/></svg>'};return I[name]||I.doc;}
function finance(){const f=state.financial;const revised=f.originalContract+f.approvedCO+f.pendingCO;const left=f.eac-f.costToDate;const agingTotal=f.aging.net30+f.aging.net60+f.aging.net90+f.aging.net120;const gainFade=revised-f.eac;const margin=revised?gainFade/revised*100:0;return {...f,revised,left,agingTotal,gainFade,margin};}

function treatmentEntry(type,label,summary,value){
  return {id:uid(type.toUpperCase()), type, label, summary, value:value||0, status:"Draft Candidate", createdAt:new Date().toLocaleString()};

function treatPacket(packetId,type){
  const p = getPacket(packetId);
  if(!p) return;
  const t = ensureTreatments(p);
  const baseSummary = p.summary || "";
  if(type==="rfi"){
    if(!t.rfi){
      const r = treatmentEntry("rfi","Submit RFI","Clarify drawing/schedule conflict, scope impact, routing, procurement, or sequence issue tied to this packet.");
      t.rfi = r.id;
      state.rfi.push({id:r.id,title:"RFI — " + p.title,status:"Draft Candidate",discipline:"Electrical",summary:r.summary,sourcePacketId:p.id,sourcePacketTitle:p.title});
      addAudit("Treat Packet","Packet pushed to RFI",p.title + " → RFI Log");
    }
  }
  if(type==="co"){
    if(!t.co){
      const value = p.moneyAtRisk || 0;
      const c = treatmentEntry("co","Potential Change Order","Track commercial exposure tied to this packet. Confirm entitlement, price impact, schedule impact, and backup.",value);
      t.co = c.id;
      state.co.push({id:c.id,title:"Potential CO — " + p.title,status:"Candidate",value,summary:c.summary,sourcePacketId:p.id,sourcePacketTitle:p.title});
      addAudit("Treat Packet","Packet pushed to Potential CO",p.title + " → Change Order Log");
    }
  }
  if(type==="watch"){
    t.watch = t.watch || new Date().toLocaleString();
    addAudit("Treat Packet","Packet added to Watchlist",p.title + " will stay visible in priority review.");
  }
  if(type==="procurement"){
    t.procurement = t.procurement || new Date().toLocaleString();
    addAudit("Treat Packet","Packet flagged for Procurement Review",p.title + " requires PO/buyout/long-lead review.");
  }
  if(type==="schedule"){
    t.schedule = t.schedule || new Date().toLocaleString();
    addAudit("Treat Packet","Packet flagged for Schedule Impact",p.title + " requires critical path/sequence review.");
  }
  save();
  renderAll();
  renderPacketDetail(p.id);
  navigate("packetDetail");
}

function csvEscape(v){ return '"' + String(v ?? "").replace(/"/g,'""') + '"'; }
function xmlEscape(v){ return String(v ?? "").replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c])); }
function crc32(str){
  let table = crc32.table;
  if(!table){
    table = crc32.table = Array.from({length:256},(_,n)=>{
      let c=n;
      for(let k=0;k<8;k++) c = c&1 ? 0xedb88320 ^ (c>>>1) : c>>>1;
      return c>>>0;
    });
  }
  let crc = -1;
  for(let i=0;i<str.length;i++) crc = (crc>>>8) ^ table[(crc ^ str.charCodeAt(i)) & 255];
  return (crc ^ -1) >>> 0;
}
function u16(n){ return String.fromCharCode(n&255,(n>>>8)&255); }
function u32(n){ return String.fromCharCode(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255); }
function zipStore(files){
  let out="", central="", offset=0;
  for(const f of files){
    const name=f.name, data=f.data;
    const crc=crc32(data), size=data.length;
    const local="PK\\x03\\x04"+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u16(0)+u32(crc)+u32(size)+u32(size)+u16(name.length)+u16(0)+name+data;
    out+=local;
    central+="PK\\x01\\x02"+u16(20)+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u16(0)+u32(crc)+u32(size)+u32(size)+u16(name.length)+u16(0)+u16(0)+u16(0)+u16(0)+u32(0)+u32(offset)+name;
    offset+=local.length;
  }
  return out+central+"PK\\x05\\x06"+u16(0)+u16(0)+u16(files.length)+u16(files.length)+u32(central.length)+u32(out.length)+u16(0);
}
function sheetXml(rows){
  const cellRef=(c,r)=>String.fromCharCode(65+c)+(r+1);
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>`<c r="${cellRef(c,r)}" t="inlineStr"><is><t>${xmlEscape(v)}</t></is></c>`).join("")}</row>`).join("")}</sheetData></worksheet>`;
}
function exportTakeoffsXlsx(){
  const rows = [
    ["ID","Drawing","Scope","Area","Route ID","Route Length LF","Conduit Runs","Total Conduit LF","Turns","Stub-Ups","Sweeps / 90s","Trench Width FT","Trench Depth FT","Backfill CY","Notes"]
  ];
  state.takeoffs.forEach(t=>rows.push([t.id,t.drawing,t.scope,t.area,t.route,t.length,t.conduits,t.totalConduit,t.turns,t.stubs,t.sweeps,t.width,t.depth,t.backfill.toFixed(2),t.notes]));
  const files = [
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",data:'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Drawing Takeoffs" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},
    {name:"xl/worksheets/sheet1.xml",data:sheetXml(rows)}
  ];
  const zip = zipStore(files);
  const bytes = new Uint8Array(zip.length);
  for(let i=0;i<zip.length;i++) bytes[i]=zip.charCodeAt(i)&255;
  const blob = new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="OhmBoy_Drawing_Takeoffs.xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  addAudit("Export","Drawing Takeoff XLSX Exported",`${state.takeoffs.length} takeoff row(s) exported to XLSX.`);
  save();
}

function normalizeManualIntake(kind, name, text){
  const isSchedule = kind === "schedule";
  const title = isSchedule ? `Manual Schedule Upload — ${name || "Schedule File"}` : `Manual Drawing Upload — ${name || "Drawing File"}`;
  const score = isSchedule ? 82 : 88;
  const summary = isSchedule
    ? "Manual schedule upload received. Review activity changes, critical path movement, resequence exposure, and manpower compression."
    : "Manual drawing upload received. Review revision deltas, scope conflicts, procurement exposure, RFI need, and potential CO impact.";
  const packet = {
    id: uid("PKT"),
    type: isSchedule ? "schedule" : "drawing",
    title,
    summary,
    score,
    moneyAtRisk: isSchedule ? 25000 : 35000,
    status: "open",
    createdAt: new Date().toLocaleString(),
    treatments: {},
    raw: { manualUpload: true, fileName: name || "", extractedText: text || "" }
  };
  state.packets.push(packet);
  state.rawEvents.push({ eventType: isSchedule ? "manual.schedule.upload" : "manual.drawing.upload", title, summary, raw: packet.raw });
  state.normalized.push(packet);
  addAudit(isSchedule ? "Manual Schedule Upload" : "Manual Drawing Upload", title, summary);
  if(!isSchedule){
    state.rfi.push({id:uid("RFI"), title:"RFI Candidate — " + title, status:"Draft Candidate", discipline:"Electrical", summary:"Manual drawing upload requires clarification review.", sourcePacketId:packet.id, sourcePacketTitle:title});
  }
  save();
  renderAll();
  renderPacketDetail(packet.id);
  navigate("packetDetail");
}
function handleManualUpload(kind){
  const fileEl = kind==="schedule" ? $("manualScheduleFile") : $("manualDrawingFile");
  const notesEl = kind==="schedule" ? $("manualScheduleNotes") : $("manualDrawingNotes");
  const file = fileEl && fileEl.files ? fileEl.files[0] : null;
  const notes = notesEl ? notesEl.value : "";
  if(!file){
    normalizeManualIntake(kind, "manual entry", notes);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const text = String(reader.result || "").slice(0, 6000);
    normalizeManualIntake(kind, file.name, notes + "\n\n" + text);
  };
  if(/\.(txt|csv|json|xml|log)$/i.test(file.name)){
    reader.readAsText(file);
  }else{
    normalizeManualIntake(kind, file.name, notes + "\nBinary/PDF/DWG placeholder captured. Use Manual Compare or Drawing Takeoff to enter measured deltas.");
  }
}

  renderPage("featureMap","Feature Link Map","Cross-reference of operational/PM features and what each one feeds.",`
    <div class="feature-map">
      ${rows.map(r=>`<div class="feature-row"><div><h3>${esc(r[0])}</h3></div><p><b>Input:</b><br>${esc(r[1])}</p><p><b>Output / Linkage:</b><br>${esc(r[2])}</p><span class="health-pill">${esc(r[3])}</span></div>`).join("")}
    </div>
    <div class="card panel" style="margin-top:18px">
      <h2>Potential PM-Level Adds Worth Discussing</h2>
      <ul class="detail-list">
        <li><b>Decision Path Owner Assignment:</b> assign each packet/treatment to PM, APM, PX, procurement, or schedule owner.</li>
        <li><b>Due-Date / Aging Logic:</b> show how long packets, RFIs, COs, and procurement flags have been open.</li>
        <li><b>Meeting Mode:</b> generate a vendor/GC meeting agenda from open packets, RFIs, COs, and takeoff gaps.</li>
        <li><b>Entitlement Checklist:</b> for each CO candidate, track notice, backup, pricing, schedule impact, and approval status.</li>
        <li><b>Export PM Daily Report:</b> one-click PDF/XLSX summary of the daily dashboard, packet queue, and risk items.</li>
      </ul>
    </div>`);
}
function showEquationPopover(el, title, text){
  closeEquationPopover();
  const pop = document.createElement("div");
  pop.className = "eq-popover";
  pop.id = "eqPopover";
  pop.innerHTML = `<b>${esc(title)}</b>${esc(text)}<br><button onclick="closeEquationPopover()">Close</button>`;
  document.body.appendChild(pop);
  const r = el.getBoundingClientRect();
  const left = Math.min(window.innerWidth - 480, Math.max(16, r.left));
  const top = Math.min(window.innerHeight - 220, r.bottom + 10);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}
function closeEquationPopover(){
  const old = $("eqPopover");
  if(old) old.remove();
}
function installEquationHandlers(){
  document.querySelectorAll(".bubble").forEach(b=>{
    const tip = b.getAttribute("title") || b.dataset.rollupTip || "";
    const label = (b.querySelector("label") || {}).textContent || "Financial Roll-Up";
    if(tip){
      b.removeAttribute("title");
      const info = b.querySelector(".info");
      if(info){
        info.onclick = (e) => {
          e.stopPropagation();
          showEquationPopover(info,label,tip);
        };
      }
    }
  });
}

function renderAll(){setTopbar();renderCockpit();const active=state.packets.filter(p=>p.status!=="closed");const f=finance();renderPage("triage","Packet Triage","Highest priority packets first.",`<div class="list">${active.length?active.sort((a,b)=>b.score-a.score).map(packetItem).join(""):'<div class="item"><h3>No packets yet</h3><p>Run a drawing or schedule REV simulation from the cockpit or API Intake Monitor.</p></div>'}</div>`);renderPage("finance","Financial Command","High-level commercial control.",`<div class="grid four"><div class="card kpi"><span>Revised Contract</span><strong>${money(f.revised)}</strong></div><div class="card kpi"><span>EAC</span><strong>${money(f.eac)}</strong></div><div class="card kpi"><span>Left To Spend</span><strong>${money(f.left)}</strong></div><div class="card kpi"><span>Margin</span><strong>${pct(f.margin)}</strong></div></div>${financialMap()}`);renderPage("openPOReport","Open PO Report","Open commitment exposure and buyout pressure.",`<div class="grid four"><div class="card kpi"><span>Open PO Exposure</span><strong>${money(f.openPO)}</strong></div><div class="card kpi"><span>Pending Buyout</span><strong>${money(390000)}</strong></div><div class="card kpi"><span>Vendor Risk</span><strong>${money(126000)}</strong></div><div class="card kpi"><span>Procurement Gap</span><strong>${money(516000)}</strong></div></div>`);renderPage("agingReport","Aging Report","A/R aging and cash exposure.",`<div class="grid four"><div class="card kpi"><span>NET 30</span><strong>${money(f.aging.net30)}</strong></div><div class="card kpi"><span>NET 60</span><strong>${money(f.aging.net60)}</strong></div><div class="card kpi"><span>NET 90</span><strong>${money(f.aging.net90)}</strong></div><div class="card kpi"><span>NET 120+</span><strong>${money(f.aging.net120)}</strong></div></div>`);renderCOLog();renderRFILog();renderPage("audit","Audit Trail","Trace of simulated REV intake and packet creation.",`<div class="list">${state.audit.length?state.audit.slice().reverse().map(a=>`<div class="item"><span class="badge">${esc(a.type)}</span><h3>${esc(a.title)}</h3><p>${esc(a.time)} — ${esc(a.summary)}</p></div>`).join(""):'<div class="item"><h3>No audit entries yet</h3><p>Run a simulation to start the trail.</p></div>'}</div>`);renderPage("riskRegister","Risk Register","High-risk items and weighted exposure.",`<div class="grid three"><div class="card kpi"><span>High Risk Items</span><strong>${metrics().high}</strong></div><div class="card kpi"><span>Money at Risk</span><strong>${money(state.packets.reduce((s,p)=>s+(p.moneyAtRisk||0),0))}</strong></div><div class="card kpi"><span>Open Packets</span><strong>${metrics().top}</strong></div></div>`);renderPage("schedule","Schedule Impacts","Critical path and sequencing exposures.",`<div class="grid three"><div class="card kpi"><span>Schedule Packets</span><strong>${metrics().schedule}</strong></div><div class="card kpi"><span>Potential Delay</span><strong>${metrics().schedule*5}d</strong></div><div class="card kpi"><span>Mode</span><strong>Review</strong></div></div>`);if(selectedPacketId) renderPacketDetail(selectedPacketId); else renderPage("packetDetail","Packet Detail","No packet selected.",`<div class="item"><h3>No Packet Selected</h3><p>Open a packet from triage first.</p></div>`); renderManualIntake();renderFeatureMap();renderTakeoff();renderPage("manualCompare","Manual Compare","Upload/compare flow placeholder.",`<div class="item"><h3>Manual Compare Ready</h3><p>This module is reserved for drawing/schedule diff ingestion.</p></div>`);renderProcore();installEquationHandlers();}
function renderCOLog(){const rows=state.co.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.title)}</td><td>${esc(c.status||"Candidate")}</td><td>${money(c.value||0)}</td><td>${esc(c.summary)}<br>${c.sourcePacketId ? detailLink({id:c.sourcePacketId},"Open Source Packet") : ""}</td></tr>`).join("");renderPage("colog","Change Order Log","CO candidates, submitted changes, and approved relief.",`<table class="log-table"><thead><tr><th>#</th><th>Item</th><th>Status</th><th>Value</th><th>Summary</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No CO log entries yet. Drawing REV simulations can create CO exposure candidates.</td></tr>'}</tbody></table>`);}
function renderRFILog(){const rows=state.rfi.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.title)}</td><td>${esc(r.status||"Draft Candidate")}</td><td>${esc(r.discipline||"Electrical")}</td><td>${esc(r.summary)}<br>${r.sourcePacketId ? detailLink({id:r.sourcePacketId},"Open Source Packet") : ""}</td></tr>`).join("");renderPage("rfilog","RFI Log","Questions, clarifications, and document conflicts.",`<table class="log-table"><thead><tr><th>#</th><th>Question / Issue</th><th>Status</th><th>Discipline</th><th>Summary</th></tr></thead><tbody>${rows||'<tr><td colspan="5">No RFIs yet. Drawing REV simulations can create RFI candidates.</td></tr>'}</tbody></table>`);}
function renderProcore(){$("procore").innerHTML=`<div class="page"><div class="page-head"><div><h1>API Intake Monitor</h1><p class="sub">Simulate drawing and schedule revisions through the Procore-style intake path.</p></div></div><div class="card panel"><h2>Controls</h2><div class="actions"><button class="action primary" id="healthBtn">Procore Health</button><button class="action" id="pmDayBtn2">Simulate PM Day</button><button class="action" id="simDrawingBtn">Sim Drawing REV</button><button class="action" id="simScheduleBtn">Sim Schedule REV</button><button class="action" id="clearBtn">Clear Local State</button></div><pre id="apiOutput">Ready.</pre></div><div class="list">${state.rawEvents.slice().reverse().map(e=>`<div class="item"><span class="badge">${esc(e.eventType||e.type)}</span><h3>${esc(e.title||'Inbound Event')}</h3><p>${esc(e.summary||'Stored in local OhmBoy event queue.')}</p></div>`).join("")}</div></div>`;$("healthBtn").onclick=checkHealth;$("pmDayBtn2").onclick=simPMDay;$("simDrawingBtn").onclick=()=>simRev("drawing");$("simScheduleBtn").onclick=()=>simRev("schedule");$("clearBtn").onclick=()=>{localStorage.removeItem(STORAGE_KEY);location.reload();};}
function renderTakeoff(){const rows=state.takeoffs.slice().reverse().map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.drawing)}</td><td>${esc(t.scope)}</td><td>${feet(t.totalConduit)}</td><td>${qty(t.sweeps)}</td><td>${t.backfill.toFixed(1)} CY</td></tr>`).join("");renderPage("drawingTakeoff","Drawing Takeoff","Fast drawing-based takeoff page modeled after the CMH-232 MV workflow.",`<div class="takeoff-layout"><div class="card panel"><h2>Takeoff Input</h2><div class="takeoff-form"><div class="field"><label>Drawing / Sheet</label><input id="toDrawing" value="E6.0 One-Line / Gear Schedule"></div><div class="field"><label>Scope Type</label><select id="toScope"><option>MV Duct Bank</option><option>Feeder</option><option>Lighting</option><option>Branch Power</option><option>Grounding</option><option>Controls</option></select></div><div class="field"><label>Building / Area</label><input id="toArea" value="Building 5 / 6"></div><div class="field"><label>Route ID</label><input id="toRoute" value="MV-LOOP-01"></div><div class="field"><label>Measured Route Length (LF)</label><input id="toLength" type="number" value="420"></div><div class="field"><label>Conduits / Parallel Runs</label><input id="toConduits" type="number" value="4"></div><div class="field"><label>Turns</label><input id="toTurns" type="number" value="6"></div><div class="field"><label>Stub-Ups</label><input id="toStubs" type="number" value="8"></div><div class="field"><label>Trench Width (ft)</label><input id="toWidth" type="number" step="0.1" value="3.0"></div><div class="field"><label>Trench Depth (ft)</label><input id="toDepth" type="number" step="0.1" value="4.0"></div><div class="field full"><label>Assumptions / Notes</label><textarea id="toNotes">Budget takeoff. Verify exact routing, bends, stub-up locations, and duct bank section details against latest drawings.</textarea></div></div><div class="takeoff-row-actions"><button class="action dark" id="calcTakeoffBtn">Calculate Takeoff</button><button class="action" id="saveTakeoffBtn">Save Takeoff Row</button><button class="action" id="exportTakeoffBtn">Export Takeoffs .xlsx</button><span class="xlsx-badge">Microsoft Excel compatible</span></div></div><div class="card panel"><h2>Calculated Roll-Up</h2><div class="takeoff-results" id="takeoffResults"></div></div></div><div class="card panel" style="margin-top:18px"><h2>Saved Takeoff Rows</h2><table class="log-table"><thead><tr><th>ID</th><th>Drawing</th><th>Scope</th><th>Total Conduit</th><th>90s / Sweeps</th><th>Backfill</th></tr></thead><tbody>${rows||'<tr><td colspan="6">No saved takeoff rows yet.</td></tr>'}</tbody></table></div>`);$("calcTakeoffBtn").onclick=calcTakeoff;$("saveTakeoffBtn").onclick=saveTakeoff; const ex=$("exportTakeoffBtn"); if(ex) ex.onclick=exportTakeoffsXlsx; calcTakeoff();}
function currentTakeoff(){const length=Number($("toLength")?.value||0),conduits=Number($("toConduits")?.value||0),turns=Number($("toTurns")?.value||0),stubs=Number($("toStubs")?.value||0),width=Number($("toWidth")?.value||0),depth=Number($("toDepth")?.value||0);return {id:uid("TO"),drawing:$("toDrawing")?.value||"",scope:$("toScope")?.value||"",area:$("toArea")?.value||"",route:$("toRoute")?.value||"",length,conduits,turns,stubs,width,depth,totalConduit:length*conduits,sweeps:turns*conduits+stubs,backfill:length*width*depth/27,notes:$("toNotes")?.value||""};}
function calcTakeoff(){const t=currentTakeoff();$("takeoffResults").innerHTML=`<div class="result-card"><span>Route Length</span><strong>${feet(t.length)}</strong></div><div class="result-card"><span>Total Conduit / Cable Path</span><strong>${feet(t.totalConduit)}</strong></div><div class="result-card"><span>90° Sweeps / Stub-Ups</span><strong>${qty(t.sweeps)}</strong></div><div class="result-card"><span>Backfill / Spoils Basis</span><strong>${t.backfill.toFixed(1)} CY</strong></div><div class="result-card"><span>Conduit Runs</span><strong>${qty(t.conduits)}</strong></div><div class="result-card"><span>Route ID</span><strong>${esc(t.route)}</strong></div>`;}
function saveTakeoff(){const t=currentTakeoff();state.takeoffs.push(t);addAudit("Takeoff","Drawing Takeoff Saved",`${t.scope} / ${t.route} — ${feet(t.totalConduit)} total conduit, ${qty(t.sweeps)} sweeps, ${t.backfill.toFixed(1)} CY.`);save();renderAll();navigate("drawingTakeoff");}
function addAudit(type,title,summary){state.audit.push({type,title,summary,time:new Date().toLocaleString()});}
async function checkHealth(){let out=$("apiOutput");if(out)out.textContent="Checking...";try{const r=await fetch(API.health);const j=await r.json();if(out)out.textContent=JSON.stringify(j,null,2);addAudit("Health","Procore Health Check",j.ok?"Backend health returned OK.":"Backend health returned issue.");}catch(e){if(out)out.textContent=JSON.stringify({ok:false,error:e.message},null,2);addAudit("Health","Procore Health Check Failed",e.message);}save();renderAll();}
function simPMDay(){if(state.packets.length===0){simRev("drawing",true);simRev("schedule",true);}const top=state.packets.slice().sort((a,b)=>b.score-a.score).slice(0,3);state.pmDays.push({time:new Date().toLocaleString(),top:top.map(p=>p.title)});addAudit("PM Day","PM Day Simulated",`Reviewed ${top.length} top packets, confirmed branch path, and flagged schedule/financial exposure.`);save();renderAll();navigate("cockpit");}
async function simRev(kind,silent){let raw=null;try{const r=await fetch(kind==="schedule"?API.mockSchedule:API.mockDrawing);raw=await r.json();}catch(e){raw={ok:false,error:e.message};}const isSchedule=kind==="schedule";const title=isSchedule?"Procore Schedule Update: Mission Critical Baseline Schedule":"Procore Drawing REV: E6.0 — One-Line / Gear Schedule";const packet={id:uid("PKT"),type:isSchedule?"schedule":"drawing",title,summary:isSchedule?"Energize MSB-1 shifted by five days. Startup sequence and L2 QA/QC walkdown need review.":"REV-04 detected from Procore. Review for scope, procurement, schedule, and CO exposure.",score:isSchedule?91:100,moneyAtRisk:isSchedule?30000:42000,status:"open",createdAt:new Date().toLocaleString(),treatments:{},raw};state.packets.push(packet);state.rawEvents.push({eventType:isSchedule?"schedule.update.created":"drawing.revision.created",title,summary:packet.summary,raw});state.normalized.push(packet);if(!isSchedule){state.co.push({id:uid("CO"),title:"CO Candidate — "+title,status:"Candidate",value:42000,summary:"Drawing revision may carry scope/procurement exposure."});state.rfi.push({id:uid("RFI"),title:"RFI Candidate — "+title,status:"Draft Candidate",discipline:"Electrical",summary:"Confirm scope, gear schedule, routing, and procurement impact."});}addAudit(isSchedule?"Schedule REV":"Drawing REV",title,packet.summary);save();if(!silent){renderAll();navigate("cockpit");}}
function navigate(view){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));const el=$(view)||$("cockpit");el.classList.add("active");window.scrollTo({top:0,behavior:"smooth"});}
document.addEventListener("click",e=>{const nav=e.target.closest("[data-view]");if(nav)navigate(nav.dataset.view);});
$("homeBtn").onclick=()=>navigate("cockpit");
renderAll();
</script>
