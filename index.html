/* ===========================================================================
   Morning Walk — recall the whole line before opening anything
   ---------------------------------------------------------------------------
   Step through every node, say its six slots from memory, then reveal the
   real data and mark what you missed. Misses become today's study list and
   go to the front of the Cold Drill queue.
   =========================================================================== */

let WALK = null;

function trainCard(nodeId, field){
  const k = nodeId + "|" + field;
  return state.training.cards[k] || (state.training.cards[k] = { box:0, due:todayISO(), seen:0, hits:0, ms:[] });
}

function walkStart(){
  const scope = val("walkScope","all");
  /* "areas" walks the roll-up level only — one stop per area. On a job with
     ninety systems that is the ten-minute version of the walk. */
  const leaves = scope === "areas" ? mapAreas() : mapLeaves().filter(n => scope === "all" || n.id === scope || n.parent === scope);
  if(!leaves.length){ toast("No nodes to walk in that selection.","bad"); return; }
  WALK = { order:leaves.map(n => n.id), i:0, revealed:false, grades:{}, startedAt:Date.now() };
  renderMorningWalk();
  window.scrollTo({ top:0 });
}
function walkReveal(){ if(WALK && !WALK.done){ WALK.revealed = true; renderMorningWalk(); } }
function walkGrade(field, hit){
  if(!WALK || WALK.done) return;
  const id = WALK.order[WALK.i], g = WALK.grades[id] = WALK.grades[id] || {};
  if(g[field] === hit) delete g[field]; else g[field] = hit;
  renderMorningWalk();
}
function walkStep(dir){
  if(!WALK || WALK.done) return;
  const j = WALK.i + dir;
  if(j < 0) return;
  if(j >= WALK.order.length){ walkFinish(); return; }
  WALK.i = j;
  WALK.revealed = !!WALK.grades[WALK.order[j]];
  renderMorningWalk();
  window.scrollTo({ top:0 });
}
function walkFinish(){
  if(!WALK || WALK.done) return;
  const misses = [];
  let graded = 0, hits = 0, nodes = 0;
  WALK.order.forEach(id => {
    const g = WALK.grades[id];
    if(!g || !Object.keys(g).length) return;
    nodes++;
    Object.entries(g).forEach(([field, hit]) => {
      graded++;
      if(hit) hits++;
      else {
        misses.push({ nodeId:id, field });
        const c = trainCard(id, field);
        c.box = 0; c.due = todayISO();
      }
    });
  });
  if(!graded){ WALK = null; renderMorningWalk(); toast("Walk ended — nothing was marked, so nothing was logged."); return; }
  const rec = { date:todayISO(), at:new Date().toLocaleString(), nodes, of:WALK.order.length, graded, hits, misses, minutes:Math.max(1, Math.round((Date.now() - WALK.startedAt) / 60000)) };
  state.training.walks.push(rec);
  state.training.walks = state.training.walks.slice(-90);
  addAudit("Morning Walk","Walk Logged", `${nodes} of ${WALK.order.length} nodes, ${hits} of ${graded} slots recalled, ${misses.length} on the study list.`);
  WALK = { done:true, rec };
  save(); renderAll(); navigate("morningWalk");
}
function walkQuit(){
  if(!WALK) return;
  if(WALK.done){ WALK = null; renderMorningWalk(); return; }
  if(Object.keys(WALK.grades).length){ walkFinish(); return; }
  WALK = null; renderMorningWalk();
}

function studyListHtml(misses){
  if(!misses.length) return `<p class="sub t-good" style="margin-top:8px">Nothing missed.</p>`;
  const byNode = new Map();
  misses.forEach(m => { if(!byNode.has(m.nodeId)) byNode.set(m.nodeId, []); byNode.get(m.nodeId).push(m.field); });
  const rows = [...byNode.entries()].map(([id, fields]) => {
    const n = mapNode(id);
    if(!n) return "";
    return `<tr><td><button class="linklike" data-node="${esc(id)}">${esc(nodePath(n))}</button></td>
      <td>${FIELDS.filter(fd => fields.includes(fd.key)).map(fd => `<span class="badge">${fd.n} ${esc(fd.label)}</span>`).join("")}</td></tr>`;
  }).join("");
  return `<table class="log-table" style="margin-top:12px"><thead><tr><th>Node</th><th>Slots missed</th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderMorningWalk(){
  if(!mapNodes().length){
    renderPage("morningWalk","Morning Walk","Recall the whole job before you open anything.",
      `<div class="item"><h3>The walk needs a project map</h3><p>Build the map first — the walk steps through its nodes in order.</p><div class="takeoff-row-actions"><button class="action dark" data-view="mapSetup">Build the Project Map</button></div></div>`);
    return;
  }

  /* finished */
  if(WALK && WALK.done){
    const r = WALK.rec;
    renderPage("morningWalk","Morning Walk","Walk logged.",
      `<div class="grid four">
        <div class="card kpi"><span>Nodes Walked</span><strong>${r.nodes}<small> / ${r.of}</small></strong></div>
        <div class="card kpi"><span>Slots Recalled</span><strong>${r.hits}<small> / ${r.graded}</small></strong></div>
        <div class="card kpi"><span>Recall</span><strong class="${r.hits / r.graded >= 0.8 ? "pos" : ""}">${Math.round(r.hits / r.graded * 100)}%</strong></div>
        <div class="card kpi"><span>Time</span><strong>${r.minutes}<small> min</small></strong></div>
      </div>
      <div class="card panel" style="margin-top:18px"><h2>Today's study list</h2>
        <p class="sub">Open each node, read the slot you missed, and say it back. These are first in line on the next Cold Drill.</p>
        ${studyListHtml(r.misses)}</div>
      <div class="takeoff-row-actions" style="margin-top:16px">
        <button class="action dark" data-view="coldDrill">Go to Cold Drill</button>
        <button class="action" onclick="walkQuit()">Done</button>
      </div>`);
    return;
  }

  /* in progress */
  if(WALK){
    const id = WALK.order[WALK.i], n = mapNode(id);
    if(!n){ WALK.order.splice(WALK.i, 1); if(!WALK.order.length){ WALK = null; } else if(WALK.i >= WALK.order.length) WALK.i = WALK.order.length - 1; renderMorningWalk(); return; }
    const f = nodeFacts(id), g = WALK.grades[id] || {}, last = WALK.i === WALK.order.length - 1;
    const area = n.parent ? mapNode(n.parent) : null;
    const body = WALK.revealed
      ? `<div class="six-grid">${FIELDS.map(fd => `<div class="card six-card ${g[fd.key] === true ? "g-hit" : (g[fd.key] === false ? "g-miss" : "")}" data-field="${fd.key}">
            <div class="six-head"><span class="six-n">${fd.n}</span><h3>${esc(fd.label)}</h3></div>
            <p class="six-ask">${esc(fd.ask)}</p>
            ${fieldBody(n, fd.key, f)}
            <div class="grade-row">
              <button class="grade hit${g[fd.key] === true ? " on" : ""}" onclick="walkGrade('${fd.key}',true)">Had it</button>
              <button class="grade miss${g[fd.key] === false ? " on" : ""}" onclick="walkGrade('${fd.key}',false)">Missed</button>
            </div></div>`).join("")}</div>`
      : `<div class="card panel walk-ask">
          <p class="sub">Say each of these out loud, from memory. Then reveal.</p>
          <ol class="walk-list">${FIELDS.map(fd => `<li><b>${esc(fd.label)}</b><span>${esc(fd.ask)}</span></li>`).join("")}</ol>
          <div class="takeoff-row-actions"><button class="action dark big" id="walkRevealBtn" onclick="walkReveal()">Reveal</button></div>
        </div>`;

    $("morningWalk").innerHTML = `<div class="page">
      <div class="walk-top">
        <div class="walk-prog"><i style="width:${((WALK.i + (WALK.revealed ? 1 : 0)) / WALK.order.length * 100).toFixed(1)}%"></i></div>
        <span>Node ${WALK.i + 1} of ${WALK.order.length}</span>
        <button class="action" onclick="walkQuit()">End walk</button>
      </div>
      <div class="node-head" style="margin-top:14px">
        <div><div class="crumb">${area ? esc(area.name) : "Area"}</div><h1>${esc(n.name)}</h1></div>
      </div>
      ${body}
      <div class="takeoff-row-actions" style="margin-top:18px">
        <button class="action" onclick="walkStep(-1)" ${WALK.i === 0 ? "disabled" : ""}>← Back</button>
        ${WALK.revealed ? `<button class="action dark big" onclick="walkStep(1)">${last ? "Finish walk" : "Next node →"}</button>` : `<button class="action" onclick="walkStep(1)">${last ? "Skip and finish" : "Skip"}</button>`}
      </div>
    </div>`;
    return;
  }

  /* idle */
  const walks = state.training.walks || [], today = todayISO();
  const todays = walks.filter(w => w.date === today);
  const lastToday = todays[todays.length - 1];
  const areaOpts = mapAreas().map(a => `<option value="${esc(a.id)}">${esc(a.name)} only</option>`).join("");
  const hist = walks.slice(-7).reverse().map(w => `<tr><td>${esc(w.at)}</td><td>${w.nodes} / ${w.of}</td><td>${w.hits} / ${w.graded}</td>
    <td class="${w.hits / w.graded >= 0.8 ? "cell-good" : ""}">${Math.round(w.hits / w.graded * 100)}%</td><td>${w.misses.length}</td><td>${w.minutes} min</td></tr>`).join("");

  renderPage("morningWalk","Morning Walk","Before you open anything: walk the line, say each node's six slots from memory, then check yourself against the real data.",
    `<div class="takeoff-layout">
      <div class="card panel">
        <h2>Start a walk</h2>
        <p class="sub">For each node: say the six slots out loud, reveal, mark each slot <b>Had it</b> or <b>Missed</b>. Start with <b>Areas only</b> to learn the roll-ups, then take one area at a time for its systems.</p>
        <div class="takeoff-form" style="margin-top:12px">
          <div class="field full"><label>Walk</label><select id="walkScope"><option value="all">The whole line — ${plural(mapLeaves().length,"node")}</option><option value="areas">Areas only — ${plural(mapAreas().length,"roll-up")}</option>${areaOpts}</select></div>
        </div>
        <div class="takeoff-row-actions"><button class="action dark big" onclick="walkStart()">Start Walk</button></div>
      </div>
      <div class="card panel">
        <h2>Today's study list</h2>
        ${lastToday ? `<p class="sub">From the walk logged ${esc(lastToday.at)}.</p>${studyListHtml(lastToday.misses)}` : `<p class="sub">No walk logged today. What you miss on a walk lists here.</p>`}
      </div>
    </div>
    <div class="card panel" style="margin-top:18px">
      <h2>Recent walks</h2>
      <table class="log-table" style="margin-top:12px"><thead><tr><th>When</th><th>Nodes</th><th>Slots recalled</th><th>Recall</th><th>Missed</th><th>Time</th></tr></thead>
      <tbody>${hist || '<tr><td colspan="6">No walks logged yet.</td></tr>'}</tbody></table>
    </div>`);
}

/* ===========================================================================
   Cold Drill — a random node and slot, thirty seconds, out loud
   ---------------------------------------------------------------------------
   Self-graded. A card you hit inside the clock moves up a box and comes back
   later (1, 3, 7, 14 days); a miss drops it to the front; a hit that ran past
   thirty seconds stays where it is — right but not yet automatic.
   =========================================================================== */

const DRILL_SECONDS = 30, DRILL_LEN = 10, LEITNER = [0, 1, 3, 7, 14];
let DRILL = null;

function drillable(n, field, f){
  const b = f.bucket;
  switch(field){
    case "scope":    return !!((n.scopeIn || "").trim() || f.money.budget.n || b.sov.length || b.dwg.length);
    case "money":    return !!(f.money.budget.n || b.sov.length || b.po.length || b.co.length);
    case "schedule": return b.act.length > 0 || b.ckt.length > 0;
    case "people":   return !!(n.owner || n.lead || n.counterpart || Object.keys(f.people.balls).length);
    case "risks":    return !!(f.risks.watch.length || f.risks.packets.length);
    case "open":     return f.openCount > 0;
  }
  return false;
}
function drillPool(){
  const pool = [];
  mapOrder().forEach(n => {                     // systems and area roll-ups both get drilled
    const f = nodeFacts(n.id);
    FIELDS.forEach(fd => { if(drillable(n, fd.key, f)) pool.push({ nodeId:n.id, field:fd.key }); });
  });
  return pool;
}
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function drillStart(){
  const pool = drillPool(), today = todayISO(), cards = state.training.cards;
  if(!pool.length){ toast("Nothing to drill yet — file some records under the map first.","bad"); return; }
  const key = (c) => c.nodeId + "|" + c.field;
  const due = pool.filter(c => cards[key(c)] && cards[key(c)].seen && cards[key(c)].due <= today)
    .sort((a,b) => (cards[key(a)].box - cards[key(b)].box) || cards[key(a)].due.localeCompare(cards[key(b)].due));
  const flagged = pool.filter(c => cards[key(c)] && !cards[key(c)].seen);            // missed on a walk, never drilled
  const fresh = shuffle(pool.filter(c => !cards[key(c)]));
  const later = shuffle(pool.filter(c => cards[key(c)] && cards[key(c)].seen && cards[key(c)].due > today));
  const queue = [], take = (list, n) => { for(const c of list){ if(queue.length >= DRILL_LEN || n-- <= 0) break; if(!queue.includes(c)) queue.push(c); } };
  take(flagged, 4); take(due, 4); take(fresh, DRILL_LEN); take(due, DRILL_LEN); take(flagged, DRILL_LEN); take(later, DRILL_LEN);
  DRILL = { queue:shuffle(queue), i:0, phase:"ask", t0:Date.now(), ms:0, over:false, results:[] };
  drillClockStart();
  renderColdDrill();
  window.scrollTo({ top:0 });
}
function drillClockStart(){
  clearInterval(drillClockStart.t);
  drillClockStart.t = setInterval(() => {
    if(!DRILL || DRILL.phase !== "ask"){ clearInterval(drillClockStart.t); return; }
    const left = DRILL_SECONDS - (Date.now() - DRILL.t0) / 1000;
    if(left <= 0){ DRILL.over = true; drillReveal(); return; }
    const c = $("drillClock"), r = $("drillRing");
    if(c) c.textContent = Math.ceil(left);
    if(r) r.style.strokeDashoffset = String(289 * (1 - left / DRILL_SECONDS));
  }, 150);
}
function drillReveal(){
  if(!DRILL || DRILL.phase !== "ask") return;
  clearInterval(drillClockStart.t);
  DRILL.ms = Math.min(Date.now() - DRILL.t0, DRILL_SECONDS * 1000);
  DRILL.phase = "reveal";
  renderColdDrill();
}
function drillGrade(hit){
  if(!DRILL || DRILL.phase !== "reveal") return;
  const q = DRILL.queue[DRILL.i], c = trainCard(q.nodeId, q.field);
  c.seen++; if(hit) c.hits++;
  c.ms = (c.ms || []).concat(DRILL.ms).slice(-8);
  c.box = !hit ? 0 : (DRILL.over ? c.box : Math.min(LEITNER.length - 1, c.box + 1));
  c.due = isoAdd(todayISO(), LEITNER[c.box]);
  c.last = todayISO();
  DRILL.results.push({ nodeId:q.nodeId, field:q.field, hit, ms:DRILL.ms, over:DRILL.over });
  if(DRILL.i + 1 >= DRILL.queue.length){ drillFinish(); return; }
  DRILL.i++; DRILL.phase = "ask"; DRILL.t0 = Date.now(); DRILL.over = false; DRILL.ms = 0;
  save();
  drillClockStart();
  renderColdDrill();
}
function drillFinish(){
  clearInterval(drillClockStart.t);
  if(!DRILL) return;
  const r = DRILL.results;
  if(r.length){
    const hits = r.filter(x => x.hit).length;
    state.training.sessions.push({ date:todayISO(), at:new Date().toLocaleString(), n:r.length, hits,
      avgMs:Math.round(r.reduce((s,x) => s + x.ms, 0) / r.length), slow:r.filter(x => x.over).length });
    state.training.sessions = state.training.sessions.slice(-120);
    addAudit("Cold Drill","Drill Logged", `${hits} of ${r.length} hit, ${(r.reduce((s,x) => s + x.ms, 0) / r.length / 1000).toFixed(1)}s average.`);
  }
  DRILL = r.length ? { done:true, results:r } : null;
  save(); renderAll(); navigate("coldDrill");
}
function drillQuit(){
  if(!DRILL) return;
  if(DRILL.done){ DRILL = null; renderColdDrill(); return; }
  drillFinish();
}

function drillStats(){
  const cards = state.training.cards, today = todayISO(), since = isoAdd(today, -6);
  const sess = (state.training.sessions || []).filter(s => s.date >= since);
  const n = sumOf(sess,"n"), hits = sumOf(sess,"hits");
  const avgMs = n ? sess.reduce((s,x) => s + x.avgMs * x.n, 0) / n : 0;
  const pool = drillPool(), key = (c) => c.nodeId + "|" + c.field;
  const dueNow = pool.filter(c => cards[key(c)] && cards[key(c)].due <= today).length;
  const fresh = pool.filter(c => !cards[key(c)]).length;

  const byNode = new Map(), byField = {};
  Object.entries(cards).forEach(([k, c]) => {
    if(!c.seen) return;
    const [nodeId, field] = k.split("|");
    if(!mapNode(nodeId)) return;
    const e = byNode.get(nodeId) || { nodeId, seen:0, hits:0, ms:[] };
    e.seen += c.seen; e.hits += c.hits; e.ms = e.ms.concat(c.ms || []); byNode.set(nodeId, e);
    const fe = byField[field] = byField[field] || { seen:0, hits:0 };
    fe.seen += c.seen; fe.hits += c.hits;
  });
  const slow = [...byNode.values()].filter(e => e.seen >= 2).map(e => ({
    ...e, miss:1 - e.hits / e.seen, avg:e.ms.length ? e.ms.reduce((s,x) => s + x, 0) / e.ms.length : 0
  })).sort((a,b) => (b.miss * 30000 + b.avg) - (a.miss * 30000 + a.avg)).slice(0,6);
  return { n, hits, avgMs, dueNow, fresh, pool:pool.length, slow, byField };
}

function renderColdDrill(){
  if(!mapNodes().length){
    renderPage("coldDrill","Cold Drill","A random node, a random slot, thirty seconds.",
      `<div class="item"><h3>The drill needs a project map</h3><p>Build the map first — drills are drawn from its nodes.</p><div class="takeoff-row-actions"><button class="action dark" data-view="mapSetup">Build the Project Map</button></div></div>`);
    return;
  }

  /* finished */
  if(DRILL && DRILL.done){
    const r = DRILL.results, hits = r.filter(x => x.hit).length;
    const rows = r.map(x => { const n = mapNode(x.nodeId), fd = FIELDS.find(f => f.key === x.field);
      return `<tr><td>${n ? `<button class="linklike" data-node="${esc(n.id)}">${esc(nodePath(n))}</button>` : "—"}</td><td>${fd.n} ${esc(fd.label)}</td>
        <td class="${x.hit ? "cell-good" : "cell-late"}">${x.hit ? "Hit" : "Miss"}</td><td class="${x.over ? "cell-late" : ""}">${x.over ? "30s+" : (x.ms / 1000).toFixed(1) + "s"}</td></tr>`; }).join("");
    renderPage("coldDrill","Cold Drill","Drill logged.",
      `<div class="grid four">
        <div class="card kpi"><span>Hit</span><strong>${hits}<small> / ${r.length}</small></strong></div>
        <div class="card kpi"><span>Hit Rate</span><strong class="${hits / r.length >= 0.8 ? "pos" : ""}">${Math.round(hits / r.length * 100)}%</strong></div>
        <div class="card kpi"><span>Average</span><strong>${(r.reduce((s,x) => s + x.ms, 0) / r.length / 1000).toFixed(1)}<small> s</small></strong></div>
        <div class="card kpi"><span>Ran Past 30s</span><strong class="${r.some(x => x.over) ? "neg" : ""}">${r.filter(x => x.over).length}</strong></div>
      </div>
      <table class="log-table" style="margin-top:18px"><thead><tr><th>Node</th><th>Slot</th><th>Result</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="takeoff-row-actions" style="margin-top:16px"><button class="action dark big" onclick="drillStart()">Drill Again</button><button class="action" onclick="drillQuit()">Done</button></div>`);
    return;
  }

  /* in progress */
  if(DRILL){
    const q = DRILL.queue[DRILL.i], n = mapNode(q.nodeId), fd = FIELDS.find(f => f.key === q.field);
    if(!n){ DRILL.queue.splice(DRILL.i, 1); if(DRILL.i >= DRILL.queue.length){ drillFinish(); return; } renderColdDrill(); return; }
    const area = n.parent ? mapNode(n.parent) : null;
    const left = Math.max(0, DRILL_SECONDS - (Date.now() - DRILL.t0) / 1000);
    $("coldDrill").innerHTML = `<div class="page">
      <div class="walk-top">
        <div class="walk-prog"><i style="width:${((DRILL.i + (DRILL.phase === "reveal" ? 1 : 0)) / DRILL.queue.length * 100).toFixed(1)}%"></i></div>
        <span>Question ${DRILL.i + 1} of ${DRILL.queue.length}</span>
        <button class="action" onclick="drillQuit()">End drill</button>
      </div>
      <div class="card drill-stage">
        <div class="drill-q">
          <div class="crumb">${area ? esc(area.name) : "Area"}</div>
          <h1>${esc(n.name)}</h1>
          <div class="drill-slot"><span class="six-n">${fd.n}</span><b>${esc(fd.label)}</b><span>${esc(fd.ask)}</span></div>
        </div>
        ${DRILL.phase === "ask"
          ? `<div class="drill-clock"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" class="trk"/><circle id="drillRing" cx="50" cy="50" r="46" class="run" style="stroke-dasharray:289;stroke-dashoffset:${(289 * (1 - left / DRILL_SECONDS)).toFixed(1)}"/></svg><b id="drillClock">${Math.ceil(left)}</b></div>`
          : `<div class="drill-time ${DRILL.over ? "bad" : ""}">${DRILL.over ? "Ran past 30s" : (DRILL.ms / 1000).toFixed(1) + "s"}</div>`}
      </div>
      ${DRILL.phase === "ask"
        ? `<div class="takeoff-row-actions drill-actions"><button class="action dark big" id="drillRevealBtn" onclick="drillReveal()">Reveal <kbd>Space</kbd></button></div>
           <p class="sub drill-hint">Answer out loud, then reveal.</p>`
        : `<div class="card six-card drill-answer" data-field="${fd.key}">${fieldBody(n, q.field, nodeFacts(n.id))}<div class="six-src">${esc(fieldSource(q.field))}</div></div>
           <div class="takeoff-row-actions drill-actions">
             <button class="grade hit big" id="drillHitBtn" onclick="drillGrade(true)">Hit <kbd>1</kbd></button>
             <button class="grade miss big" id="drillMissBtn" onclick="drillGrade(false)">Miss <kbd>2</kbd></button>
           </div>
           <p class="sub drill-hint">Hit only if you had the substance before the reveal.</p>`}
    </div>`;
    return;
  }

  /* idle */
  const st = drillStats(), sess = (state.training.sessions || []).slice(-7).reverse();
  const slowRows = st.slow.map(e => { const n = mapNode(e.nodeId); return `<tr><td><button class="linklike" data-node="${esc(n.id)}">${esc(nodePath(n))}</button></td>
    <td>${e.seen}</td><td class="${e.miss > 0.34 ? "cell-late" : ""}">${Math.round((1 - e.miss) * 100)}%</td><td class="${e.avg > 20000 ? "cell-late" : ""}">${(e.avg / 1000).toFixed(1)}s</td></tr>`; }).join("");
  const fieldRows = FIELDS.map(fd => { const e = st.byField[fd.key]; return `<tr><td>${fd.n} ${esc(fd.label)}</td><td>${e ? e.seen : 0}</td><td>${e && e.seen ? Math.round(e.hits / e.seen * 100) + "%" : "—"}</td></tr>`; }).join("");
  const sessRows = sess.map(s => `<tr><td>${esc(s.at)}</td><td>${s.hits} / ${s.n}</td><td>${Math.round(s.hits / s.n * 100)}%</td><td>${(s.avgMs / 1000).toFixed(1)}s</td><td>${s.slow}</td></tr>`).join("");

  renderPage("coldDrill","Cold Drill","A random node, a random slot, thirty seconds, out loud. This is what makes the answer come fast in a meeting.",
    `<div class="grid four">
      <div class="card kpi"><span>Answered, 7 Days</span><strong>${st.n}</strong></div>
      <div class="card kpi"><span>Hit Rate, 7 Days</span><strong class="${st.n && st.hits / st.n >= 0.8 ? "pos" : ""}">${st.n ? Math.round(st.hits / st.n * 100) + "%" : "—"}</strong></div>
      <div class="card kpi"><span>Average Response</span><strong>${st.n ? (st.avgMs / 1000).toFixed(1) : "—"}<small>${st.n ? " s" : ""}</small></strong></div>
      <div class="card kpi"><span>Due Today</span><strong>${st.dueNow}<small> · ${st.fresh} new</small></strong></div>
    </div>
    <div class="card panel" style="margin-top:18px">
      <h2>Run a drill</h2>
      <p class="sub">${DRILL_LEN} questions from ${st.pool} drillable node-slots. Slots you missed come first, then ones that are due, then new ones. Grade yourself honestly: <b>Hit</b> means you had the substance before the reveal.</p>
      <div class="takeoff-row-actions"><button class="action dark big" onclick="drillStart()"${st.pool ? "" : " disabled"}>Start Drill</button></div>
      ${st.pool ? "" : `<p class="sub" style="margin-top:8px">No node has anything filed under it yet, so there is nothing to ask. Load the schedule and SOV, then check <button class="linklike" data-view="mapLinks">Map Links</button>.</p>`}
    </div>
    <div class="takeoff-layout" style="margin-top:18px">
      <div class="card panel"><h2>Where you're slow</h2>
        <p class="sub">Nodes with the most misses and the longest response times. Two answers minimum to show here.</p>
        <table class="log-table" style="margin-top:12px"><thead><tr><th>Node</th><th>Asked</th><th>Hit rate</th><th>Avg time</th></tr></thead>
        <tbody>${slowRows || '<tr><td colspan="4">Not enough drills yet.</td></tr>'}</tbody></table></div>
      <div class="card panel"><h2>By slot</h2>
        <table class="log-table" style="margin-top:12px"><thead><tr><th>Slot</th><th>Asked</th><th>Hit rate</th></tr></thead><tbody>${fieldRows}</tbody></table></div>
    </div>
    <div class="card panel" style="margin-top:18px"><h2>Recent drills</h2>
      <table class="log-table" style="margin-top:12px"><thead><tr><th>When</th><th>Hit</th><th>Rate</th><th>Average</th><th>Past 30s</th></tr></thead>
      <tbody>${sessRows || '<tr><td colspan="5">No drills logged yet.</td></tr>'}</tbody></table></div>`);
}

/* ===========================================================================
   Prediction Log — forecasts with a percentage and a date, scored later
   ---------------------------------------------------------------------------
   Scoring is the Brier score: the average squared gap between the stated
   probability and what happened (1 or 0). 0 is perfect; always saying 50%
   scores 0.25. The calibration table is the useful part — it shows whether
   "80%" from you actually happens 80% of the time.
   =========================================================================== */

function addPrediction(){
  const text = val("pdText","").trim(), p = Math.round(Number(val("pdProb",0))), by = val("pdBy","");
  if(!text){ toast("Write the forecast as a statement that will be clearly true or false.","bad"); return; }
  if(!(p >= 1 && p <= 99)){ toast("Probability must be between 1 and 99.","bad"); return; }
  if(!isISO(by)){ toast("Pick the date this will be scored on.","bad"); return; }
  state.predictions.push({ id:uid("PRD"), text, p, by, nodeId:val("pdNode","") || "", actId:val("pdAct","").trim(),
    created:todayISO(), outcome:null, resolved:"", note:"" });
  addAudit("Prediction Log","Forecast Logged", `${p}% by ${by} — ${text}`);
  save(); renderAll(); navigate("predictions");
  toast("Forecast logged.");
}
function resolvePrediction(id, outcome){
  const pr = state.predictions.find(x => x.id === id);
  if(!pr) return;
  pr.outcome = outcome; pr.resolved = todayISO();
  addAudit("Prediction Log","Forecast Scored", `${pr.p}% — ${pr.text} → ${outcome ? "happened" : "did not happen"}.`);
  save(); renderAll(); navigate("predictions");
}
function reopenPrediction(id){
  const pr = state.predictions.find(x => x.id === id);
  if(!pr) return;
  pr.outcome = null; pr.resolved = "";
  save(); renderAll(); navigate("predictions");
}
function deletePrediction(id){
  const pr = state.predictions.find(x => x.id === id);
  if(!pr || !confirmAction(`Delete this forecast?\n\n${pr.p}% by ${pr.by} — ${pr.text}`)) return;
  state.predictions = state.predictions.filter(x => x.id !== id);
  save(); renderAll(); navigate("predictions");
}

/* If a forecast names a schedule activity, show what the schedule currently
   says. It is a pointer only — the PM scores the forecast. */
function predictionHint(pr){
  if(!pr.actId) return "";
  const a = (state.schedule.activities || []).find(x => String(x.actId || "").toLowerCase() === pr.actId.toLowerCase());
  if(!a) return `<small>Activity ${esc(pr.actId)} is not in the loaded schedule.</small>`;
  const fin = fmtDate(a.finish);
  let lean = "";
  if(a.pct >= 100 && isISO(fin)) lean = fin <= pr.by ? " — points to <b>happened</b> if the forecast was “done by the date”" : " — finished after the date";
  else if(todayISO() > pr.by && a.pct < 100) lean = " — points to <b>did not happen</b> if the forecast was “done by the date”";
  return `<small>Schedule: ${esc(clip(a.name, 50))} · ${a.pct}% · finish ${esc(shortDate(fin))}${lean}</small>`;
}

function predictionScore(){
  const done = state.predictions.filter(p => p.outcome !== null);
  const brier = done.length ? done.reduce((s,p) => s + Math.pow(p.p / 100 - (p.outcome ? 1 : 0), 2), 0) / done.length : null;
  const bins = [[1,39,"Under 40%"],[40,59,"40–59%"],[60,79,"60–79%"],[80,99,"80% and up"]].map(([lo, hi, label]) => {
    const g = done.filter(p => p.p >= lo && p.p <= hi);
    const said = g.length ? g.reduce((s,p) => s + p.p, 0) / g.length : 0;
    const got = g.length ? g.filter(p => p.outcome).length / g.length * 100 : 0;
    let read = g.length < 5 ? "need 5 to read" : (Math.abs(said - got) <= 10 ? "calibrated" : (said > got ? "overconfident" : "underconfident"));
    return { label, n:g.length, said, got, read };
  });
  return { done, brier, bins };
}

function renderPredictions(){
  const today = todayISO(), sc = predictionScore();
  const open = state.predictions.filter(p => p.outcome === null).sort((a,b) => a.by.localeCompare(b.by));
  const dueNow = open.filter(p => p.by <= today);
  const where = (p) => { const n = p.nodeId ? mapNode(p.nodeId) : null; return n ? `<button class="linklike" data-node="${esc(n.id)}">${esc(nodePath(n))}</button>` : "—"; };

  const openRows = open.map(p => `<tr>
    <td><b>${p.p}%</b></td>
    <td>${esc(p.text)}${predictionHint(p) ? "<br>" + predictionHint(p) : ""}</td>
    <td class="${p.by <= today ? "cell-late" : ""}">${esc(p.by)}${p.by <= today ? "<br><small>READY TO SCORE</small>" : `<br><small>in ${isoDays(today, p.by)}d</small>`}</td>
    <td>${where(p)}</td>
    <td class="map-row-act"><button class="grade hit" onclick="resolvePrediction('${esc(p.id)}',true)">Happened</button><button class="grade miss" onclick="resolvePrediction('${esc(p.id)}',false)">Didn't</button>
        <button class="action danger" onclick="deletePrediction('${esc(p.id)}')">✕</button></td></tr>`).join("");

  const doneRows = sc.done.slice().sort((a,b) => String(b.resolved).localeCompare(String(a.resolved))).slice(0,60).map(p => `<tr>
    <td><b>${p.p}%</b></td><td>${esc(p.text)}</td>
    <td class="${p.outcome ? "cell-good" : "cell-late"}">${p.outcome ? "Happened" : "Didn't"}</td>
    <td>${Math.pow(p.p / 100 - (p.outcome ? 1 : 0), 2).toFixed(2)}</td><td>${esc(p.resolved)}</td>
    <td><button class="action" onclick="reopenPrediction('${esc(p.id)}')">Reopen</button></td></tr>`).join("");

  const binRows = sc.bins.map(b => `<tr><td>${esc(b.label)}</td><td>${b.n}</td><td>${b.n ? Math.round(b.said) + "%" : "—"}</td><td>${b.n ? Math.round(b.got) + "%" : "—"}</td>
    <td class="${b.read === "calibrated" ? "cell-good" : (b.read.endsWith("confident") ? "cell-late" : "")}">${b.n ? esc(b.read) : "—"}</td></tr>`).join("");

  renderPage("predictions","Prediction Log","Write the forecast down with a percentage and a date. Score it when the date comes. Your hit rate at each confidence level is the feedback that sharpens judgment.",
    `<div class="grid four">
      <div class="card kpi"><span>Open Forecasts</span><strong>${open.length}</strong></div>
      <div class="card kpi"><span>Ready to Score</span><strong class="${dueNow.length ? "neg" : ""}">${dueNow.length}</strong></div>
      <div class="card kpi"><span>Scored</span><strong>${sc.done.length}</strong></div>
      <div class="card kpi"><span>Brier Score</span><strong class="${sc.brier !== null && sc.brier < 0.2 ? "pos" : ""}">${sc.brier === null ? "—" : sc.brier.toFixed(3)}</strong></div>
    </div>

    <div class="takeoff-layout" style="margin-top:18px">
      <div class="card panel">
        <h2>Log a forecast</h2>
        <p class="sub">State it so it will be plainly true or false on the date. "Switchgear ships by the 15th", not "switchgear is looking tight".</p>
        <div class="takeoff-form" style="margin-top:12px">
          <div class="field full"><label>Forecast</label><input id="pdText" placeholder="MV switchgear ships from the factory on or before Oct 15"></div>
          <div class="field"><label>Probability it happens (%)</label><input id="pdProb" type="number" min="1" max="99" step="5" value="70"></div>
          <div class="field"><label>Score it on</label><input id="pdBy" type="date"></div>
          <div class="field"><label>Node (optional)</label><select id="pdNode">${nodeOptions("", "— none —", true)}</select></div>
          <div class="field"><label>Schedule Activity ID (optional)</label><input id="pdAct" placeholder="A-1020"></div>
        </div>
        <div class="takeoff-row-actions"><button class="action dark" onclick="addPrediction()">Log Forecast</button></div>
      </div>
      <div class="card panel">
        <h2>Calibration</h2>
        <p class="sub">${sc.brier === null ? "Nothing scored yet." : `Brier ${sc.brier.toFixed(3)} across ${sc.done.length} scored forecast${sc.done.length === 1 ? "" : "s"}. Lower is better: 0 is perfect, and saying 50% every time scores 0.250.`}</p>
        <table class="log-table" style="margin-top:12px"><thead><tr><th>When you said</th><th>Count</th><th>Average stated</th><th>Actually happened</th><th>Read</th></tr></thead><tbody>${binRows}</tbody></table>
      </div>
    </div>

    <table class="log-table" style="margin-top:18px"><thead><tr><th>Odds</th><th>Open forecast</th><th>Score on</th><th>Node</th><th></th></tr></thead>
    <tbody>${openRows || '<tr><td colspan="5">No open forecasts. Log the calls you are already making in your head.</td></tr>'}</tbody></table>

    ${sc.done.length ? `<table class="log-table" style="margin-top:18px"><thead><tr><th>Odds</th><th>Scored forecast</th><th>Outcome</th><th>Brier</th><th>Scored</th><th></th></tr></thead><tbody>${doneRows}</tbody></table>` : ""}`);
}

/* ===========================================================================
   Render hook + delegated events
   =========================================================================== */

function renderCommandMap(){
  renderVitals();
  renderOneLine();
  renderNodeCard();
  renderMapSetup();
  renderMapLinks();
  renderWbs();
  renderCostReport();
  renderCircuits();
  renderCircuitBoard();
  renderSov();
  renderJobSetup();
  renderMorningWalk();
  renderColdDrill();
  renderPredictions();
}

/* Any element carrying data-node opens that node's card. */
document.addEventListener("click", e => {
  const el = e.target.closest ? e.target.closest("[data-node]") : null;
  if(el && !el.disabled) openNode(el.dataset.node);
});
document.addEventListener("keydown", e => {
  const t = e.target;
  if((e.key === "Enter" || e.key === " ") && t && t.matches && t.matches("g[data-node]")){ e.preventDefault(); openNode(t.dataset.node); return; }
  /* Drill keys: Space reveals, 1 = hit, 2 = miss. Only while the drill is on
     screen and focus is not on a form control or a button. */
  if(DRILL && !DRILL.done && $("coldDrill").classList.contains("active") && !(t && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName))){
    if(DRILL.phase === "ask" && (e.key === " " || e.key === "Enter")){ e.preventDefault(); drillReveal(); }
    else if(DRILL.phase === "reveal" && e.key === "1"){ e.preventDefault(); drillGrade(true); }
    else if(DRILL.phase === "reveal" && e.key === "2"){ e.preventDefault(); drillGrade(false); }
  }
});
document.addEventListener("change", e => {
  const t = e.target;
  if(!t || !t.matches) return;
  if(t.matches(".link-select")) setLink(t.dataset.ltype, t.dataset.lkey, t.value);
  else if(t.matches(".wbs-select")){ if(t.value) assignWbs(t.dataset.wbs, t.value); }
  else if(t.matches(".map-in[data-node-id]")){
    setNodeProp(t.dataset.nodeId, t.dataset.prop, t.value);
    /* The change fires as focus leaves the box, often straight into the next
       one. Re-render after the browser has moved focus, then put it back. */
    setTimeout(() => {
      const a = document.activeElement;
      const keep = a && a.dataset && a.dataset.nodeId ? [a.dataset.nodeId, a.dataset.prop] : null;
      renderAll();
      if(keep){
        const el = document.querySelector(`.map-in[data-node-id="${keep[0]}"][data-prop="${keep[1]}"]`);
        if(el) el.focus();
      }
    }, 0);
  }
});


renderAll();
</script>
