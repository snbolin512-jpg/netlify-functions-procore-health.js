<style>
:root{--ivory:#fffff6;--white:#fff;--black:#070707;--gray:#555;--copper:#b87333;--copper-dark:#7a3f16;--teal:#0f766e;--red:#c92525;--blue:#0f5d80;--purple:#6040a0;--shadow:0 22px 54px rgba(20,16,10,.07);--soft:0 12px 28px rgba(20,16,10,.05)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Avenir Next LT Pro","Avenir Next","Avenir",Helvetica,Arial,sans-serif;background:radial-gradient(circle at 92% 0%,rgba(184,115,51,.055),transparent 30%),linear-gradient(180deg,#fff 0%,var(--ivory) 66%,#fffef9);color:var(--black)}button,input,textarea,select{font:inherit}button{cursor:pointer}svg{stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.app{padding:12px}.shell{max-width:1720px;margin:auto;border:1px solid rgba(184,115,51,.22);background:rgba(255,255,255,.96);border-radius:18px;box-shadow:var(--shadow);overflow:hidden;min-height:calc(100vh - 24px)}.topbar{height:52px;display:flex;justify-content:flex-end;align-items:center;gap:16px;padding:0 28px;border-bottom:1px solid rgba(184,115,51,.16)}.floating-home{position:fixed;left:18px;top:18px;z-index:999;border:1px solid rgba(184,115,51,.55);background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:999px;padding:9px 14px;font-weight:700;box-shadow:var(--soft)}.view{display:none}.view.active{display:block}.hero{display:grid;grid-template-columns:330px 1fr;gap:34px;padding:22px 44px 32px;border-bottom:1px solid rgba(184,115,51,.14)}.jackson{width:285px;max-height:315px;object-fit:contain;filter:drop-shadow(0 24px 22px rgba(20,16,10,.13))}.title{margin:0;font-size:60px;line-height:1.03;font-weight:300;letter-spacing:-.065em}.subtitle{margin:10px 0 26px;color:#303030;font-size:17px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{border:1px solid rgba(184,115,51,.46);border-radius:14px;background:rgba(255,255,255,.9);box-shadow:var(--soft)}.daily-card{min-height:160px;padding:20px;display:grid;grid-template-columns:54px 1fr;gap:14px;text-align:left;color:#111}.daily-card:hover,.module:hover,.action:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(20,16,10,.07)}.icon{width:50px;height:50px;border:1.5px solid var(--copper);border-radius:999px;display:grid;place-items:center;color:var(--copper-dark)}.icon svg{width:25px;height:25px}.red .icon{border-color:var(--red);color:var(--red)}.teal .icon{border-color:var(--teal);color:var(--teal)}.daily-card h3{margin:0;font-size:15px;font-weight:700}.num{display:block;font-size:38px;line-height:1;margin:10px 0 7px;font-weight:300}.num.teal{color:var(--teal)}.daily-card small{display:block;color:#444;font-size:13px;line-height:1.35;min-height:34px}.link{display:inline-block;margin-top:12px;font-size:12px}.ops-row{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;padding:0 44px 26px;border-bottom:1px solid rgba(184,115,51,.14)}.panel{padding:20px}.panel h2,.modules h2,.section h2{margin:0 0 6px;font-size:21px;font-weight:700}.sub,.panel p,.section p,.modules p{color:#555;font-size:13px;margin:5px 0 14px}.actions,.pipeline-actions,.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.action{border:1px solid rgba(184,115,51,.55);background:#fff;border-radius:999px;padding:9px 13px;font-weight:700;color:#111;text-decoration:none}.action.dark,.action.primary{background:#111;color:#fff;border-color:#111}.action.red{color:var(--red);border-color:rgba(201,37,37,.55)}.action.teal{color:var(--teal);border-color:rgba(15,118,110,.55)}.action.blue{color:var(--blue);border-color:rgba(15,93,128,.5)}.badge{display:inline-flex;border:1px solid rgba(184,115,51,.38);background:#fff8ef;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;margin:0 6px 6px 0}.mascot-note{display:flex;gap:14px;align-items:center}.mascot-note img{width:92px;height:92px;object-fit:contain}.section{padding:26px 42px 18px}.map-wrap{position:relative;min-height:420px;margin-top:12px;overflow:hidden}.map-lines{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}.map-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 1.28fr 1.28fr 1.38fr 1.28fr 1.28fr 1.05fr;grid-template-rows:90px 90px 90px 90px;gap:14px 18px;align-items:center}.bubble{border:1.2px solid rgba(184,115,51,.68);background:rgba(255,255,255,.94);border-radius:999px;min-height:74px;display:grid;place-items:center;text-align:center;padding:13px 22px;position:relative;box-shadow:var(--soft)}.bubble label{font-size:12px;font-weight:700}.bubble strong{display:block;margin-top:7px;font-size:22px;font-weight:400}.bubble strong.teal{color:var(--teal)}.bubble strong.red{color:var(--red)}.info{position:absolute;right:13px;top:12px;width:18px;height:18px;border:1px solid var(--copper);border-radius:999px;color:var(--copper-dark);font-size:11px;font-weight:700;display:grid;place-items:center;background:#fff;cursor:pointer}.callout{border:1px solid rgba(184,115,51,.34);background:#fff;border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.45;box-shadow:var(--soft)}.b-contract{grid-column:2;grid-row:1}.b-co{grid-column:3;grid-row:1}.b-revised{grid-column:4;grid-row:1}.b-cost{grid-column:5;grid-row:1}.b-po{grid-column:3;grid-row:2}.b-eac{grid-column:4/span 2;grid-row:2}.b-left{grid-column:6;grid-row:2}.b-gain{grid-column:2;grid-row:3}.b-margin{grid-column:4;grid-row:3}.b-aging{grid-column:5;grid-row:3}.b-labor{grid-column:6;grid-row:4}.c-revised{grid-column:1;grid-row:2}.c-left{grid-column:6;grid-row:1}.c-po{grid-column:4;grid-row:3}.c-aging{grid-column:6;grid-row:3}.modules{margin:8px 30px 26px;border:1px solid rgba(184,115,51,.28);background:#fff;border-radius:14px;box-shadow:var(--soft);padding:17px 18px 19px}.module-strip{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));border:1px solid rgba(184,115,51,.28);border-radius:12px;overflow:hidden}.module{min-height:92px;background:#fff;border:0;border-right:1px solid rgba(184,115,51,.20);display:grid;place-items:center;gap:6px;padding:10px 6px;position:relative}.module svg{width:30px;height:30px;color:#111}.module span{font-size:11px;color:#111;text-align:center}.page{padding:32px 42px}.page h1{margin:0;font-size:42px;font-weight:300;letter-spacing:-.05em}.grid{display:grid;gap:16px}.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:18px}.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#555}.kpi strong{display:block;margin-top:8px;font-size:30px}.item{padding:16px;border:1px solid rgba(184,115,51,.35);border-radius:14px;background:#fff;box-shadow:var(--soft);margin-bottom:12px}.item h3{margin:0 0 8px;font-size:18px}.item p{margin:0;color:#444;line-height:1.45}.log-table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid rgba(184,115,51,.28);border-radius:14px;overflow:hidden;background:#fff}.log-table th,.log-table td{text-align:left;padding:12px;border-bottom:1px solid rgba(184,115,51,.18);font-size:13px;vertical-align:top}.log-table th{background:#fffdf8;font-weight:700}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;font-weight:700;color:#333}.field input,.field select,.field textarea{width:100%;border:1px solid rgba(184,115,51,.34);border-radius:12px;padding:10px;background:#fff;color:#111}textarea{min-height:90px}pre{background:#111;color:#fffdf5;border-radius:14px;padding:14px;overflow:auto;white-space:pre-wrap;max-height:360px}.eq-popover{position:fixed;z-index:9999;max-width:min(480px,86vw);background:#111;color:#fffdf5;border:1px solid var(--copper);border-radius:16px;padding:14px 15px;box-shadow:0 24px 54px rgba(0,0,0,.24);font-size:12px;line-height:1.48;white-space:pre-line}.eq-popover b{display:block;margin-bottom:5px}.chart-wrap{overflow:auto;background:#fff;border:1px solid rgba(184,115,51,.28);border-radius:14px;padding:12px}.feature-row{display:grid;grid-template-columns:220px 1fr 1fr 170px;gap:10px;border:1px solid rgba(184,115,51,.30);background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--soft)}.health-pill{border-radius:999px;padding:6px 9px;font-size:12px;font-weight:700;border:1px solid rgba(15,118,110,.35);color:var(--teal);background:#eefbf8;text-align:center}.warn{border-color:rgba(201,37,37,.35);color:var(--red);background:#fff0f0}.small{font-size:12px;color:#555}@media(max-width:1300px){.hero,.ops-row,.grid.two,.feature-row{grid-template-columns:1fr}.summary,.grid.four,.grid.three{grid-template-columns:repeat(2,1fr)}.map-lines{display:none}.map-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto}.bubble,.callout{grid-column:auto!important;grid-row:auto!important}.module-strip{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.app{padding:6px}.page,.section{padding:20px 18px}.summary,.grid.four,.grid.three{grid-template-columns:1fr}.title{font-size:38px}.hero{padding:18px}}

const STORE = "ohmboy_v0217_consolidated";
const API={health:"/.netlify/functions/procore-health",mockDrawing:"/.netlify/functions/procore-mock-event",mockSchedule:"/.netlify/functions/procore-mock-event?kind=schedule"};
const seed=()=>({packets:[],reports:{openPO:[],aging:[],cost:[],procurement:[]},rfi:[],co:[],takeoffs:[],schedule:{baseline:[],current:[],impacts:[]},manpower:[],drawings:[],audit:[],rawEvents:[],procore:{status:"Not connected"}});
let state=load();let selectedPacketId=null;
function load(){try{return Object.assign(seed(),JSON.parse(localStorage.getItem(STORE))||{})}catch(e){return seed()}}
function save(){localStorage.setItem(STORE,JSON.stringify(state))}
function $(id){return document.getElementById(id)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(v){return "$"+Math.round(Number(v||0)).toLocaleString()}function pct(v){return (Number(v)>=0?"+":"")+Number(v||0).toFixed(1)+"%"}function num(v){return Math.round(Number(v||0)).toLocaleString()}function uid(p){return p+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(16).slice(2,6).toUpperCase()}function audit(type,title,summary){state.audit.push({id:uid("AUD"),type,title,summary,time:new Date().toLocaleString()});save()}
function icon(n){const I={flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h12l-2 4 2 4H5"/></svg>',shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>',clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>',dollar:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M16 7.5c-1-1-2.4-1.5-4-1.5-2.2 0-4 1.1-4 2.8 0 4.2 8 1.8 8 6.4 0 1.7-1.8 2.8-4 2.8-1.7 0-3.1-.5-4.2-1.5"/></svg>',doc:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>',cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h11a4 4 0 0 0 0-8 6 6 0 0 0-11.5-1.5A4.8 4.8 0 0 0 7 18z"/><path d="M12 12v8"/><path d="M9 17l3 3 3-3"/></svg>',chart:'<svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 16c3-8 7-8 10 0"/></svg>',draw:'<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 8h8"/><path d="M8 12h5"/><path d="M16 16l3 3"/><path d="M16 19l3-3"/></svg>',gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>',list:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>'};return I[n]||I.doc}
function financial(){const approved=state.co.filter(c=>c.status==="Approved").reduce((s,c)=>s+Number(c.approved||0),0),pending=state.co.filter(c=>!["Approved","Rejected","Void"].includes(c.status)).reduce((s,c)=>s+Number(c.requested||0),0),openPO=state.reports.openPO.reduce((s,r)=>s+Number(r.openAmount||r.amount||0),0)||2150000,aging=state.reports.aging.reduce((s,r)=>s+Number(r.amount||0),0)||1290000,cost=state.reports.cost.reduce((s,r)=>s+Number(r.amount||0),0)||11842000,original=24750000,revised=original+approved,eac=26480000+Math.max(0,pending*.35),left=eac-cost,gain=revised-eac,margin=revised?gain/revised*100:0;return{original,approved,pending,revised,openPO,aging,cost,eac,left,gain,margin}}
function metrics(){const active=state.packets.filter(p=>p.status!=="closed"),f=financial(),high=active.filter(p=>p.score>=75).length,sched=active.filter(p=>p.type==="schedule").length+state.schedule.impacts.length;const labor=laborHealth();return{top:active.length,high,sched,margin:f.margin,labor}}
function laborHealth(){if(!state.manpower.length)return{status:"No Data",pi:0,peak:0,overrun:0};let est=0,earned=0,actual=0,peak=0;state.manpower.forEach(w=>{est+=+w.estimated||0;earned+=+w.earned||0;actual+=+w.actual||0;peak=Math.max(peak,+w.crew||0)});const pi=actual?earned/actual:0,forecast=pi?actual+(est-earned)/pi:actual+(est-earned),overrun=forecast-est;return{status:pi>=.95?"Healthy":pi>=.85?"Watch":"Risk",pi,peak,overrun}}
function card(cls,ic,title,n,body,view){return `<button class="card daily-card ${cls}" data-view="${view}"><span class="icon">${icon(ic)}</span><span><h3>${esc(title)}</h3><b class="num ${cls==="teal"?"teal":""}">${n}</b><small>${esc(body)}</small><span class="link">View Details →</span></span></button>`}
function setTop(){$("datePill").innerHTML=icon("clock")+" "+new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});$("bell").innerHTML=icon("shield")+`<b>${metrics().high||0}</b>`}
function module(label,ic,view){return `<button class="module" data-view="${view}">${icon(ic)}<span>${esc(label)}</span></button>`}
function modules(){return `<section class="modules"><h2>Command Modules</h2><p>Every PM action feeds packet detail, relevant module, cockpit rollup, and audit trail.</p><div class="module-strip">${module("Cockpit","chart","cockpit")}${module("Triage","list","triage")}${module("RFI Log","doc","rfilog")}${module("CO Log","dollar","colog")}${module("Takeoff","draw","drawingTakeoff")}${module("Reports","cloud","reportUploads")}${module("Schedule","clock","scheduleControl")}${module("Manpower","chart","manpower")}${module("Drawings","draw","drawingIntelligence")}${module("Procore","gear","procoreSetup")}${module("Finance","dollar","finance")}${module("Feature Map","list","featureMap")}${module("API","cloud","api")}${module("Audit","shield","audit")}</div></section>`}
function bubble(cls,label,val,vcls,eq){return `<div class="bubble ${cls}"><i class="info" onclick="showEq('${esc(label)}','${esc(eq)}')">i</i><label>${esc(label)}</label><strong class="${vcls||""}">${val}</strong></div>`}

function renderCockpit(){const m=metrics(),l=laborHealth();$("cockpit").innerHTML=`<section class="hero"><div>${imgTag("jackson")}</div><div><h1 class="title">OhmBoy PM Daily Update</h1><p class="subtitle">Your daily command center for proactive project control.</p><div class="summary">${card("","flag","Top Priorities",m.top,"Action items require your attention","triage")}${card("red","shield","High-Risk Items",m.high,"Items need immediate mitigation","triage")}${card("teal","clock","Schedule Impacts",m.sched,"Potential delays identified","scheduleControl")}${card("teal","chart","Labor Health",l.status,"Earned vs actual + peak crew","manpower")}</div></div></section><section class="ops-row"><div class="card panel"><h2>PM Simulation Controls</h2><p>Run PM day, drawing REV, schedule REV, or health check.</p><div class="actions"><button class="action dark" onclick="simPMDay()">Simulate PM Day</button><button class="action" onclick="simRev('drawing')">Sim Drawing REV</button><button class="action" onclick="simRev('schedule')">Sim Schedule REV</button><button class="action" onclick="health()">Procore Health</button></div></div><div class="card panel mascot-note">${imgTag("")}<div><b>Jackson is online.</b><p>Watching packets, RFIs, COs, reports, schedules, drawings, and manpower.</p></div></div></section>${sourceMap()}${modules()}`}
function imgTag(cls){return `<img class="${cls||"jackson"}" src="${JACKSON_SRC}" alt="Jackson, OhmBoy mascot">`}
function page(id,title,sub,body){$ (id).innerHTML=`<div class="page"><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>${body}</div>`}
function packetItem(p,i){return `<div class="item"><span class="badge">Score ${p.score}</span><span class="badge">${esc(p.type)}</span><span class="badge">${esc(p.status||"open")}</span><h3>#${i+1} — ${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="pipeline-actions"><button class="action" onclick="openPacket('${p.id}')">Open Details</button><button class="action teal" onclick="suggestTreatment('${p.id}','RFI')">Suggest RFI</button><button class="action red" onclick="suggestTreatment('${p.id}','CO')">Suggest CO</button><button class="action blue" onclick="suggestTreatment('${p.id}','Schedule')">Schedule Impact</button></div></div>`}
function renderTriage(){const active=state.packets.filter(p=>p.status!=="closed").sort((a,b)=>b.score-a.score);page("triage","Packet Triage","Treat packets, open details, and close with resolution note.",`<div class="list">${active.length?active.map(packetItem).join(""):'<div class="item"><h3>No active packets</h3><p>Run a REV simulation, upload a drawing/schedule, or import a report.</p></div>'}</div><h2>Closed Packets</h2>${state.packets.filter(p=>p.status==="closed").map((p,i)=>packetItem(p,i)).join("")||'<p class="small">No closed packets yet.</p>'}`)}
function openPacket(id){selectedPacketId=id;renderPacketDetail();nav("packetDetail")}function currentPacket(){return state.packets.find(p=>p.id===selectedPacketId)||state.packets[0]}
function suggestTreatment(id,type){const p=state.packets.find(x=>x.id===id);if(!p)return;p.treatments=p.treatments||[];p.treatments.push({type,time:new Date().toLocaleString(),note:`Suggested ${type} treatment. PM must create official log entry manually.`});audit("Packet Treatment",`${type} suggested`,p.title);save();renderAll();openPacket(id)}
function closePacket(id){const p=state.packets.find(x=>x.id===id);const note=$("resolutionNote")?.value.trim();if(!p)return;if(!note){alert("Add a resolution note before closing the packet.");return}p.status="closed";p.resolutionNote=note;p.resolvedAt=new Date().toLocaleString();audit("Packet Closed",p.title,note);save();renderAll();openPacket(id)}function reopenPacket(id){const p=state.packets.find(x=>x.id===id);if(p){p.status="open";audit("Packet Reopened",p.title,"Packet returned to active triage.");save();renderAll();openPacket(id)}}
function renderPacketDetail(){const p=currentPacket();if(!p) return page("packetDetail","Packet Detail","No packet selected.","<div class='item'>Create or open a packet first.</div>");page("packetDetail","Packet Detail","Resolution, treatments, and source trace.",`<div class="grid two"><div class="card panel"><span class="badge">Score ${p.score}</span><span class="badge">${p.type}</span><span class="badge">${p.status||"open"}</span><h2>${esc(p.title)}</h2><p>${esc(p.summary)}</p><h3>Treatment Suggestions</h3>${(p.treatments||[]).map(t=>`<div class="item"><b>${esc(t.type)}</b><p>${esc(t.note)} — ${esc(t.time)}</p></div>`).join("")||"<p>No treatments suggested yet.</p>"}<div class="pipeline-actions"><button class="action teal" onclick="suggestTreatment('${p.id}','RFI')">Suggest RFI</button><button class="action red" onclick="suggestTreatment('${p.id}','CO')">Suggest CO</button><button class="action blue" onclick="suggestTreatment('${p.id}','Schedule')">Schedule Impact</button></div></div><div class="card panel"><h2>Closeout</h2><div class="field"><label>Resolution Note</label><textarea id="resolutionNote">${esc(p.resolutionNote||"")}</textarea></div><button class="action dark" onclick="closePacket('${p.id}')">Close Packet</button><button class="action" onclick="reopenPacket('${p.id}')">Reopen Packet</button><h3>Source Trace</h3><pre>${esc(JSON.stringify(p.raw||{},null,2))}</pre></div></div>`)} 
function renderRFI(){const suggestions=state.packets.filter(p=>(p.treatments||[]).some(t=>t.type==="RFI"));const rows=state.rfi.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.number)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.due||"")}</td><td>${esc(r.notes||"")}</td><td><button class="action red" onclick="deleteRFI('${r.id}')">Delete</button></td></tr>`).join("");page("rfilog","RFI Log","Official RFI log is PM-controlled. Packet triage only suggests RFIs.",`<div class="grid two"><div class="card panel"><h2>Manual RFI Entry</h2>${formFields([["rfiNo","RFI Number","RFI-001"],["rfiTitle","Title / Question","Clarify gear schedule revision"],["rfiStatus","Status","Draft"],["rfiDue","Response Due Date",""],["rfiNotes","Notes",""]])}<button class="action dark" onclick="addRFI()">Add RFI</button></div><div class="card panel"><h2>Packet Suggestions</h2>${suggestions.map(p=>`<div class="item"><b>${esc(p.title)}</b><p>Suggested only. Create official RFI manually.</p><button class="action" onclick="$('rfiTitle').value='${esc(p.title)}';nav('rfilog')">Use Title</button></div>`).join("")||"<p>No RFI suggestions.</p>"}</div></div><table class="log-table"><thead><tr><th>#</th><th>RFI #</th><th>Title</th><th>Status</th><th>Due</th><th>Notes</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=7>No manual RFIs entered.</td></tr>'}</tbody></table>`)}function addRFI(){state.rfi.push({id:uid("RFI"),number:$("rfiNo").value,title:$("rfiTitle").value,status:$("rfiStatus").value,due:$("rfiDue").value,notes:$("rfiNotes").value});audit("RFI Added",$("rfiNo").value,$("rfiTitle").value);save();renderAll()}function deleteRFI(id){state.rfi=state.rfi.filter(x=>x.id!==id);audit("RFI Deleted",id,"Manual RFI removed.");save();renderAll()}
function renderCO(){const suggestions=state.packets.filter(p=>(p.treatments||[]).some(t=>t.type==="CO"));const rows=state.co.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.number)}</td><td>${esc(c.title)}</td><td>${esc(c.status)}</td><td>${money(c.requested)}</td><td>${money(c.approved)}</td><td><button class="action red" onclick="deleteCO('${c.id}')">Delete</button></td></tr>`).join("");page("colog","Change Order Log","Official CO log is PM-controlled. Packet triage only suggests COs.",`<div class="grid two"><div class="card panel"><h2>Manual CO Entry</h2>${formFields([["coNo","CO Number","CO-001"],["coTitle","Title","Potential gear revision"],["coStatus","Status","Draft"],["coRequested","Requested Amount","42000"],["coApproved","Approved Amount","0"],["coNotes","Notes",""]])}<button class="action dark" onclick="addCO()">Add CO</button></div><div class="card panel"><h2>Packet Suggestions</h2>${suggestions.map(p=>`<div class="item"><b>${esc(p.title)}</b><p>Suggested only. Create official CO manually.</p><button class="action" onclick="$('coTitle').value='${esc(p.title)}';$('coRequested').value='${p.moneyAtRisk||0}';nav('colog')">Use Title/Amount</button></div>`).join("")||"<p>No CO suggestions.</p>"}</div></div><table class="log-table"><thead><tr><th>#</th><th>CO #</th><th>Title</th><th>Status</th><th>Requested</th><th>Approved</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=7>No manual COs entered.</td></tr>'}</tbody></table>`)}function addCO(){state.co.push({id:uid("CO"),number:$("coNo").value,title:$("coTitle").value,status:$("coStatus").value,requested:+$("coRequested").value||0,approved:+$("coApproved").value||0,notes:$("coNotes").value});audit("CO Added",$("coNo").value,$("coTitle").value);save();renderAll()}function deleteCO(id){state.co=state.co.filter(x=>x.id!==id);audit("CO Deleted",id,"Manual CO removed.");save();renderAll()}
function formFields(rows){return rows.map(r=>`<div class="field"><label>${r[1]}</label><input id="${r[0]}" value="${esc(r[2])}"></div>`).join("")}
function renderTakeoff(){const rows=state.takeoffs.map((t,i)=>`<tr><td>${esc(t.id)}</td><td>${esc(t.drawing)}</td><td>${esc(t.scope)}</td><td>${num(t.totalConduit)} LF</td><td>${num(t.sweeps)}</td><td>${(+t.backfill).toFixed(1)} CY</td><td><button class="action" onclick="dupTakeoff('${t.id}')">Duplicate</button><button class="action red" onclick="deleteTakeoff('${t.id}')">Delete</button></td></tr>`).join("");page("drawingTakeoff","Drawing Takeoff","Save, duplicate, delete, and export takeoff rows.",`<div class="grid two"><div class="card panel">${formFields([["toDrawing","Drawing / Sheet","E6.0 One-Line / Gear Schedule"],["toScope","Scope Type","MV Duct Bank"],["toLength","Route Length LF","420"],["toConduits","Conduits / Runs","4"],["toTurns","Turns","6"],["toStubs","Stub-Ups","8"],["toWidth","Trench Width FT","3"],["toDepth","Trench Depth FT","4"]])}<button class="action dark" onclick="saveTakeoff()">Save Takeoff Row</button><button class="action" onclick="exportTakeoffsXlsx()">Export Takeoffs .xlsx</button></div><div class="card panel"><h2>Takeoff Equations</h2><p>Total Conduit LF = Route Length × Conduit Runs</p><p>Sweeps = Turns × Runs + Stub-Ups</p><p>Backfill CY = Length × Width × Depth ÷ 27</p></div></div><table class="log-table"><thead><tr><th>ID</th><th>Drawing</th><th>Scope</th><th>Total Conduit</th><th>Sweeps</th><th>Backfill</th><th>Actions</th></tr></thead><tbody>${rows||'<tr><td colspan=7>No takeoff rows saved.</td></tr>'}</tbody></table>`)}function saveTakeoff(){const l=+$("toLength").value||0,c=+$("toConduits").value||0,t=+$("toTurns").value||0,s=+$("toStubs").value||0,w=+$("toWidth").value||0,d=+$("toDepth").value||0;const row={id:uid("TO"),drawing:$("toDrawing").value,scope:$("toScope").value,length:l,conduits:c,turns:t,stubs:s,width:w,depth:d,totalConduit:l*c,sweeps:t*c+s,backfill:l*w*d/27};state.takeoffs.push(row);audit("Takeoff Saved",row.id,`${row.totalConduit} LF conduit`);save();renderAll();nav("drawingTakeoff")}function deleteTakeoff(id){const t=state.takeoffs.find(x=>x.id===id);if(!t||!confirm("Delete takeoff row "+id+"?"))return;state.takeoffs=state.takeoffs.filter(x=>x.id!==id);audit("Takeoff Row Deleted",id,`${t.totalConduit} LF, ${t.sweeps} sweeps, ${(+t.backfill).toFixed(1)} CY`);save();renderAll();nav("drawingTakeoff")}function dupTakeoff(id){const t=state.takeoffs.find(x=>x.id===id);if(t){state.takeoffs.push({...t,id:uid("TO")});audit("Takeoff Duplicated",id,"Duplicated takeoff row.");save();renderAll();nav("drawingTakeoff")}}
function renderReports(){page("reportUploads","Report Upload Center","Upload Open PO, Aging, Cost, Procurement, RFI, CO, Manpower, or Schedule reports. CSV/JSON rows are parsed; XLSX files are captured with manual rollup fields.",`<div class="grid two"><div class="card panel"><div class="field"><label>Report Type</label><select id="reportType"><option value="openPO">Open PO Report</option><option value="aging">Aging Report</option><option value="cost">Cost Report</option><option value="procurement">Procurement Log</option></select></div><div class="field"><label>File (.xlsx, .csv, .json, .txt, .xml)</label><input id="reportFile" type="file" accept=".xlsx,.csv,.json,.txt,.xml"></div><div class="field"><label>Manual Total / Amount Override</label><input id="reportAmount" placeholder="Optional amount"></div><button class="action dark" onclick="uploadReport()">Import Report</button></div><div class="card panel"><h2>Current Rollups</h2><p>Open PO Exposure: ${money(financial().openPO)}</p><p>Aging Exposure: ${money(financial().aging)}</p><p>Cost to Date: ${money(financial().cost)}</p></div></div>${reportTables()}`)}function reportTables(){return Object.keys(state.reports).map(k=>`<h2>${esc(k)}</h2><table class="log-table"><tbody>${state.reports[k].map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name||"manual")}</td><td>${money(r.amount||r.openAmount||0)}</td><td>${esc(r.note||"")}</td></tr>`).join("")||'<tr><td>No rows.</td></tr>'}</tbody></table>`).join("")}function uploadReport(){const type=$("reportType").value,file=$("reportFile").files[0],amt=+$("reportAmount").value||0;if(!file){addReport(type,"manual entry",amt,"Manual amount override");return}const reader=new FileReader();reader.onload=()=>{const text=String(reader.result||"");let rows=[];if(file.name.endsWith(".json")){try{rows=JSON.parse(text)}catch(e){rows=[]}}else if(file.name.endsWith(".csv")||file.name.endsWith(".txt")){rows=parseCSV(text).slice(1).map(r=>({name:r[0],amount:+String(r[1]||r[2]||0).replace(/[^0-9.-]/g,""),note:r.slice(2).join(" ")}))}addReport(type,file.name,amt||rows.reduce((s,r)=>s+(+r.amount||0),0),file.name.endsWith(".xlsx")?"XLSX captured. Add manual mapping/amount as needed.":"Parsed rows: "+rows.length);};file.name.match(/\.(csv|txt|json|xml)$/i)?reader.readAsText(file):addReport(type,file.name,amt,"XLSX/binary report captured; manual amount feeds cockpit.");}function addReport(type,name,amount,note){const key=state.reports[type]?type:"openPO";state.reports[key].push({id:uid("REP"),name,amount,openAmount:amount,note});audit("Report Imported",name,`${type} amount ${money(amount)}`);save();renderAll();nav("reportUploads")}
function renderSchedule(){const activities=[...state.schedule.baseline,...state.schedule.current];page("scheduleControl","Schedule Control","Upload baseline/current schedules, manipulate activities, and create schedule impact packets.",`<div class="grid two"><div class="card panel"><div class="field"><label>Schedule Type</label><select id="schedType"><option value="baseline">Baseline Schedule</option><option value="current">Updated Schedule</option></select></div><div class="field"><label>Schedule File (.xlsx,.csv,.xml,.json,.txt,.xer)</label><input id="schedFile" type="file" accept=".xlsx,.csv,.xml,.json,.txt,.xer"></div>${formFields([["actId","Activity ID","A-1020"],["actName","Activity Name","Energize MSB-1"],["actOrig","Original Finish","2026-09-01"],["actCurr","Current Finish","2026-09-06"],["actCrit","Critical Path","true"]])}<button class="action dark" onclick="uploadSchedule()">Upload / Add Activity</button><button class="action" onclick="compareSchedule()">Compare + Create Impact Packet</button></div><div class="card panel"><h2>Detected Activities</h2><table class="log-table"><tbody>${activities.map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td>${esc(a.original||"")}</td><td>${esc(a.current||"")}</td><td>${esc(a.critical)}</td></tr>`).join("")||"<tr><td>No schedule rows yet.</td></tr>"}</tbody></table></div></div>`)}function uploadSchedule(){const type=$("schedType").value;const row={id:$("actId").value,name:$("actName").value,original:$("actOrig").value,current:$("actCurr").value,critical:$("actCrit").value};state.schedule[type].push(row);audit("Schedule Uploaded/Edited",row.id,`${type} schedule row stored.`);save();renderAll();nav("scheduleControl")}function compareSchedule(){const impacts=state.schedule.current.filter(c=>c.current!==c.original||String(c.critical).toLowerCase()==="true");state.schedule.impacts=impacts;impacts.forEach(a=>makePacket("schedule","Schedule Impact — "+a.name,`Activity ${a.id} shifted or marked critical. PM schedule review required.`,88,25000,a));audit("Schedule Compared","Schedule Control",`${impacts.length} impact(s) detected.`);save();renderAll();nav("triage")}
function renderManpower(){page("manpower","Manpower Loading","Bell curve orientation with estimated, earned, actual, and productivity health.",`<div class="grid two"><div class="card panel">${formFields([["mpWeek","Week","2026-W31"],["mpCrew","Crew Count","12"],["mpEstimated","Estimated Hours","480"],["mpEarned","Earned Hours","430"],["mpActual","Actual Hours","500"]])}<button class="action dark" onclick="addManpower()">Add Week</button><div class="field"><label>Upload Manpower CSV</label><input id="mpFile" type="file" accept=".csv,.txt,.xlsx"></div><button class="action" onclick="uploadManpower()">Import Manpower</button></div><div class="card panel"><h2>Equations</h2><p>Earned Hours = Budgeted Hours × % Complete</p><p>Productivity Index = Earned Hours ÷ Actual Hours</p><p>Forecast Hours = Actual + Remaining ÷ PI</p></div></div><div class="chart-wrap">${manpowerChart()}</div><table class="log-table"><thead><tr><th>Week</th><th>Crew</th><th>Estimated</th><th>Earned</th><th>Actual</th><th>PI</th></tr></thead><tbody>${state.manpower.map(w=>`<tr><td>${w.week}</td><td>${w.crew}</td><td>${w.estimated}</td><td>${w.earned}</td><td>${w.actual}</td><td>${w.actual?(w.earned/w.actual).toFixed(2):"0.00"}</td></tr>`).join("")||"<tr><td colspan=6>No manpower rows.</td></tr>"}</tbody></table>`)}function addManpower(){state.manpower.push({week:$("mpWeek").value,crew:+$("mpCrew").value||0,estimated:+$("mpEstimated").value||0,earned:+$("mpEarned").value||0,actual:+$("mpActual").value||0});audit("Manpower Added",$("mpWeek").value,"Weekly labor row added.");save();renderAll();nav("manpower")}function uploadManpower(){const f=$("mpFile").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{parseCSV(String(r.result||"")).slice(1).forEach(row=>state.manpower.push({week:row[0],crew:+row[1]||0,estimated:+row[2]||0,earned:+row[3]||0,actual:+row[4]||0}));audit("Manpower Imported",f.name,"Manpower CSV imported.");save();renderAll();nav("manpower")};f.name.endsWith(".csv")||f.name.endsWith(".txt")?r.readAsText(f):(audit("Manpower Uploaded",f.name,"XLSX captured; enter rows manually for now."),save(),renderAll())}
function manpowerChart(){const rows=state.manpower.length?state.manpower:[{week:"W1",estimated:100,earned:80,actual:95,crew:4},{week:"W2",estimated:220,earned:180,actual:210,crew:9},{week:"W3",estimated:360,earned:300,actual:340,crew:14},{week:"W4",estimated:220,earned:180,actual:240,crew:9}];const W=900,H=280,max=Math.max(...rows.flatMap(r=>[+r.estimated||0,+r.earned||0,+r.actual||0]));const pts=k=>rows.map((r,i)=>`${60+i*(780/(rows.length-1||1))},${240-(+r[k]||0)/max*190}`).join(" ");return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="300"><path d="M50 240 H850 M60 40 V250" stroke="#ddd"/><polyline points="${pts("estimated")}" stroke="#b87333" fill="none" stroke-width="3"/><polyline points="${pts("earned")}" stroke="#0f766e" fill="none" stroke-width="3"/><polyline points="${pts("actual")}" stroke="#c92525" fill="none" stroke-width="3"/><text x="70" y="24">Estimated (copper) / Earned (teal) / Actual (red)</text>${rows.map((r,i)=>`<text x="${45+i*(780/(rows.length-1||1))}" y="265" font-size="11">${esc(r.week)}</text>`).join("")}</svg>`}
function renderDrawings(){page("drawingIntelligence","Drawing Intelligence","Upload drawings so OhmBoy extracts likely metadata and creates PM review packets.",`<div class="grid two"><div class="card panel"><div class="field"><label>Drawing File PDF/PNG/JPG/TXT/CSV/JSON</label><input id="dwgFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.txt,.csv,.json"></div><div class="field"><label>Manual Notes</label><textarea id="dwgNotes" placeholder="Paste revision cloud notes, sheet description, or scope concern."></textarea></div><button class="action dark" onclick="intakeDrawing()">Extract Metadata + Create Review Packet</button></div><div class="card panel"><h2>Detected Drawings</h2>${state.drawings.map(d=>`<div class="item"><b>${esc(d.number)} ${esc(d.revision)}</b><p>${esc(d.title)} — ${esc(d.fileName)}</p></div>`).join("")||"<p>No drawings uploaded.</p>"}</div></div>`)}function intakeDrawing(){const f=$("dwgFile").files[0];const name=f?f.name:"manual-drawing-note";const notes=$("dwgNotes").value;const m=name.match(/([A-Z]+[-_ ]?\d+(?:\.\d+)?)/i);const rev=name.match(/rev[-_ ]?([A-Z0-9]+)/i);const d={id:uid("DWG"),fileName:name,number:m?m[1].replace(/[_ ]/g,"-"):"UNKNOWN",revision:rev?"REV-"+rev[1]:"REV-REVIEW",title:name.replace(/\.[^.]+$/,""),notes};state.drawings.push(d);makePacket("drawing","Drawing Review — "+d.number,`Detected ${d.revision} from ${name}. Review metadata, scope impact, RFI/CO triggers, procurement, and schedule exposure.`,86,35000,d);audit("Drawing Intake",d.number,`Metadata extracted from ${name}`);save();renderAll();nav("triage")}
function renderProcore(){page("procoreSetup","Procore Integration Setup","Read-only metadata-first connection plan. Secrets stay backend-only.",`<div class="grid two"><div class="card panel"><h2>Environment Variables</h2><pre>PROCORE_CLIENT_ID\nPROCORE_CLIENT_SECRET\nPROCORE_REDIRECT_URI\nPROCORE_COMPANY_ID\nPROCORE_PROJECT_ID\nOHMBOY_WEBHOOK_SECRET</pre><p>Do not store secrets in frontend code.</p><button class="action dark" onclick="health()">Test Backend Health</button><button class="action" onclick="simRev('drawing')">Test Drawing Webhook</button><button class="action" onclick="simRev('schedule')">Test Schedule Webhook</button></div><div class="card panel"><h2>Webhook / OAuth Notes</h2><p>Backend source from uploaded package is included under <b>/backend_source</b>. Flow: OAuth token exchange → subscribe to metadata webhooks → normalize into OhmBoy packet.</p><pre>/.netlify/functions/procore-webhook\n/.netlify/functions/procore-health</pre></div></div>`)}function renderAPI(){page("api","API Intake Monitor","Mock Procore events and raw event log.",`<div class="card panel"><button class="action dark" onclick="health()">Procore Health</button><button class="action" onclick="simRev('drawing')">Sim Drawing REV</button><button class="action" onclick="simRev('schedule')">Sim Schedule REV</button><pre id="apiOut">Ready.</pre></div>`)}function renderFinance(){const f=financial();page("finance","Financial Command","COs and uploaded reports drive cockpit rollups.",`<div class="grid four"><div class="card kpi"><span>Revised Contract</span><strong>${money(f.revised)}</strong></div><div class="card kpi"><span>Open PO</span><strong>${money(f.openPO)}</strong></div><div class="card kpi"><span>Aging</span><strong>${money(f.aging)}</strong></div><div class="card kpi"><span>Margin</span><strong>${pct(f.margin)}</strong></div></div>${sourceMap()}`)}function renderFeatureMap(){const rows=[["Jackson Asset","Embedded data URI + asset copy","Visible in cockpit/mascot card","Linked"],["Takeoff","Manual rows","Delete/Duplicate/XLSX/Audit","Linked"],["Packets","REV/manual/upload","Treatment suggestions + closeout note","Linked"],["Reports","Open PO/Aging/Cost uploads","Financial rollups/cockpit","Linked"],["RFI/CO Logs","PM manual entry","Official logs + financial values","Linked"],["Schedule","CSV/XLSX/XML/XER/manual","Impact packets + cockpit","Linked"],["Manpower","Weekly estimated/earned/actual","Bell curve + labor health","Linked"],["Drawings","Drawing upload/metadata","Drawing Review packet","Linked"],["Procore","Backend source + functions","Webhook/mock/health endpoints","Setup"]];page("featureMap","Feature Link Map","Cross-reference of module inputs and outputs.",rows.map(r=>`<div class="feature-row"><b>${r[0]}</b><p>${r[1]}</p><p>${r[2]}</p><span class="health-pill">${r[3]}</span></div>`).join(""))}
function renderAudit(){page("audit","Audit Trail","All major PM actions are recorded.",`<div class="list">${state.audit.slice().reverse().map(a=>`<div class="item"><span class="badge">${esc(a.type)}</span><h3>${esc(a.title)}</h3><p>${esc(a.time)} — ${esc(a.summary)}</p></div>`).join("")||"<div class=item>No audit entries yet.</div>"}</div>`)}
function makePacket(type,title,summary,score,moneyAtRisk,raw){state.packets.push({id:uid("PKT"),type,title,summary,score,moneyAtRisk,status:"open",createdAt:new Date().toLocaleString(),raw,treatments:[]})}async function simRev(kind){let raw={};try{const r=await fetch(kind==="schedule"?API.mockSchedule:API.mockDrawing);raw=await r.json()}catch(e){raw={error:e.message}}if(kind==="schedule")makePacket("schedule","Procore Schedule Update — Mission Critical Baseline","Activity movement detected. Review critical path, manpower, and sequence exposure.",91,30000,raw);else makePacket("drawing","Procore Drawing REV — E6.0 One-Line / Gear Schedule","Drawing revision detected. Review scope, procurement, schedule, RFI, and CO exposure.",100,42000,raw);audit(kind==="schedule"?"Schedule REV":"Drawing REV","Simulation",`Created ${kind} packet.`);save();renderAll();nav("triage")}function simPMDay(){if(!state.packets.length){simRev("drawing");simRev("schedule");return}audit("PM Day","Simulated PM Day",`Reviewed ${metrics().top} active packets, ${metrics().high} high risk items.`);renderAll();nav("cockpit")}async function health(){const out=$("apiOut");if(out)out.textContent="Checking...";try{const r=await fetch(API.health);const j=await r.json();if(out)out.textContent=JSON.stringify(j,null,2);audit("Health","Procore Health",j.ok?"OK":"Issue")}catch(e){if(out)out.textContent=JSON.stringify({ok:false,error:e.message},null,2);audit("Health","Procore Health Failed",e.message)}save();renderAll()}
function parseCSV(text){const lines=text.split(/\r?\n/).filter(Boolean);return lines.map(line=>line.split(",").map(x=>x.trim().replace(/^"|"$/g,"")))}function showEq(title,text){closeEq();const p=document.createElement("div");p.id="eqPop";p.className="eq-popover";p.innerHTML=`<b>${title}</b>${text}<br><br><button class="action" onclick="closeEq()">Close</button>`;document.body.appendChild(p);p.style.left="40px";p.style.top="80px"}function closeEq(){const p=$("eqPop");if(p)p.remove()}
function xlsxRows(){return [["ID","Drawing","Scope","Length LF","Conduits","Total Conduit LF","Sweeps","Backfill CY"],...state.takeoffs.map(t=>[t.id,t.drawing,t.scope,t.length,t.conduits,t.totalConduit,t.sweeps,(+t.backfill).toFixed(2)])]}function xmlEsc(v){return String(v??"").replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c]))}function crc32(str){let t=crc32.t;if(!t)t=crc32.t=Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0});let crc=-1;for(let i=0;i<str.length;i++)crc=(crc>>>8)^t[(crc^str.charCodeAt(i))&255];return(crc^-1)>>>0}function u16(n){return String.fromCharCode(n&255,(n>>>8)&255)}function u32(n){return String.fromCharCode(n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255)}function zipStore(files){let out="",cen="",off=0;for(const f of files){const n=f.name,d=f.data,c=crc32(d),s=d.length,local="PK\x03\x04"+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u16(0)+u32(c)+u32(s)+u32(s)+u16(n.length)+u16(0)+n+d;out+=local;cen+="PK\x01\x02"+u16(20)+u16(20)+u16(0)+u16(0)+u16(0)+u16(0)+u16(0)+u32(c)+u32(s)+u32(s)+u16(n.length)+u16(0)+u16(0)+u16(0)+u16(0)+u32(0)+u32(off)+n;off+=local.length}return out+cen+"PK\x05\x06"+u16(0)+u16(0)+u16(files.length)+u16(files.length)+u32(cen.length)+u32(out.length)+u16(0)}function exportTakeoffsXlsx(){const rows=xlsxRows(),sheet=`<?xml version="1.0"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>`<c r="${String.fromCharCode(65+j)}${i+1}" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`).join("")}</row>`).join("")}</sheetData></worksheet>`,files=[{name:"[Content_Types].xml",data:'<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},{name:"_rels/.rels",data:'<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},{name:"xl/workbook.xml",data:'<?xml version="1.0"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Takeoffs" sheetId="1" r:id="rId1"/></sheets></workbook>'},{name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},{name:"xl/worksheets/sheet1.xml",data:sheet}],zip=zipStore(files),bytes=new Uint8Array(zip.length);for(let i=0;i<zip.length;i++)bytes[i]=zip.charCodeAt(i)&255;const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="OhmBoy_Takeoffs.xlsx";a.click();audit("XLSX Export","Drawing Takeoffs",`${state.takeoffs.length} row(s) exported.`);save()}
function renderAll(){setTop();renderCockpit();renderTriage();renderPacketDetail();renderRFI();renderCO();renderTakeoff();renderReports();renderSchedule();renderManpower();renderDrawings();renderProcore();renderFeatureMap();renderFinance();renderAudit();renderAPI()}function nav(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));($(id)||$("cockpit")).classList.add("active");scrollTo({top:0,behavior:"smooth"})}document.addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(b)nav(b.dataset.view)});$("homeBtn").onclick=()=>nav("cockpit");renderAll();
