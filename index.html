    </div>`}`);
}

/* ===========================================================================
   Ωboy V0.26.0 — Command Center mod 3
   Schedule Intake: 12-week Gantt, milestone-driven risk, external variables,
   and a risk assessment that writes a real report per affected activity.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   External variables — the things outside your control that the CPM doesn't
   model. The PM enters them; the assessment tests each against the schedule.
   --------------------------------------------------------------------------- */

const EXT_TYPES = [
  ["weatherWindow", "Weather Window",      "range",  "Work of a given type can't happen between these dates."],
  ["vendorSlip",    "Vendor / Delivery Slip","date",  "A delivery now expected on a date later than planned."],
  ["accessBlock",   "Access Restriction",  "range",  "An area unavailable — another trade, occupancy, or owner event."],
  ["outageWindow",  "Outage Window",       "range",  "The only period an outage is permitted."],
  ["permitDelay",   "Permit / Approval Delay","date", "Approval not expected before this date."],
  ["laborShortage", "Labor Availability",  "range",  "Crew constrained across this period."],
  ["ownerEvent",    "Owner Milestone / Event","date", "An owner-driven fixed date the work must respect."],
  ["utilityDate",   "Utility Availability","date",   "Permanent power, service, or POCO switching date."]
];

const EXT_IMPACTS = [["blocks","Blocks work entirely"],["slows","Slows productivity"],["gates","Gates the start"]];

function addExtVar(){
  const label = val("evLabel","").trim();
  if(!label){ toast("Give the variable a name.","bad"); return; }
  const type = val("evType","weatherWindow");
  const def = EXT_TYPES.find(t => t[0] === type);
  const v = {
    id: uid("EXT"),
    type, label,
    from: val("evFrom",""),
    to: val("evTo",""),
    matchTerm: val("evMatch","").trim(),
    scope: val("evScope","").trim(),
    impact: val("evImpact","blocks"),
    severity: val("evSeverity","high"),
    confidence: val("evConfidence","likely"),
    daysImpact: Number(val("evDays",0)) || 0,
    source: val("evSource","").trim(),
    notes: val("evNotes","").trim(),
    createdAt: new Date().toLocaleString()
  };
  if(def && def[2] === "range" && (!v.from || !v.to)){
    toast("A window needs both a start and an end date.","bad"); return;
  }
  if(def && def[2] === "date" && !v.from){
    toast("Enter the date this variable takes effect.","bad"); return;
  }
  state.extVars = state.extVars || [];
  state.extVars.push(v);
  addAudit("External Variables","Variable Added", `${v.label} (${def?def[1]:type}).`);
  save(); renderAll(); navigate("schedule");
  toast("Variable added. Run Risk Assessment to test it against the schedule.");
}

function deleteExtVar(id){
  const v = (state.extVars||[]).find(x => x.id === id);
  if(!v) return;
  if(!confirmAction(`Delete "${v.label}"?`)) return;
  state.extVars = state.extVars.filter(x => x.id !== id);
  addAudit("External Variables","Variable Deleted", v.label);
  save(); renderAll(); navigate("schedule");
}

/* ---------------------------------------------------------------------------
   Milestones — the activities that actually drive risk. Zero-duration tasks
   and anything the PM marks, plus keyword detection for the usual suspects.
   --------------------------------------------------------------------------- */

const MILESTONE_TERMS = /energize|substantial completion|turnover|milestone|complete|acceptance|commission|cutover|tie-?in|permanent power|beneficial occupancy|final inspection/i;

function isMilestone(a){
  if(a.milestoneOverride === true) return true;
  if(a.milestoneOverride === false) return false;
  if(a.start && a.finish && a.start === a.finish) return true;   // zero duration
  return MILESTONE_TERMS.test(a.name || "");
}

function scheduleMilestones(){
  return ((state.schedule||{}).activities || []).filter(isMilestone)
    .sort((a,b) => (parseDate(a.finish)||0) - (parseDate(b.finish)||0));
}

function toggleMilestone(actKey){
  const acts = (state.schedule||{}).activities || [];
  const a = acts.find(x => (x.actId||x.name) === actKey);
  if(!a) return;
  a.milestoneOverride = !isMilestone(a);
  addAudit("Schedule","Milestone Flag Changed",
    `${a.name} ${a.milestoneOverride?"marked as":"cleared from"} milestone.`);
  save(); renderAll(); navigate("schedule");
}

/* ---------------------------------------------------------------------------
   Risk assessment — tests every external variable against every activity and
   writes a finding with outcomes and mitigations rather than a bare flag.
   --------------------------------------------------------------------------- */

function overlapDays(aStart, aFinish, bStart, bFinish){
  const s = Math.max(aStart.getTime(), bStart.getTime());
  const e = Math.min(aFinish.getTime(), bFinish.getTime());
  return e < s ? 0 : Math.round((e - s) / 86400000) + 1;
}

function daysBetween(a, b){ return Math.round((b - a) / 86400000); }

function matchesScope(v, a){
  // No match term means it applies to everything.
  if(!v.matchTerm) return true;
  const hay = [a.name, a.resource, a.actId].filter(Boolean).join(" ");
  try{ return new RegExp(v.matchTerm, "i").test(hay); }
  catch(e){ return hay.toLowerCase().includes(v.matchTerm.toLowerCase()); }
}

function outcomesFor(v, a, days, driversMilestone){
  const o = [];
  const label = (EXT_TYPES.find(t => t[0] === v.type) || [,v.type])[1];
  if(v.impact === "blocks"){
    o.push(`${days} working day(s) of ${a.name} fall inside the ${label.toLowerCase()} — that work cannot proceed during the window.`);
    o.push(a.critical
      ? `This activity is on the critical path, so the finish date moves day for day unless the work is resequenced.`
      : `Float absorbs some of this${a.float !== null ? ` — ${a.float} day(s) available` : ""}; beyond that the finish date moves.`);
  } else if(v.impact === "slows"){
    o.push(`Productivity is degraded for ${days} day(s) of ${a.name}. Expect the same scope to consume more hours.`);
    o.push(`Labor cost rises even if the dates hold. Watch performance factor on the affected cost codes.`);
  } else {
    o.push(`${a.name} cannot start until ${v.from}. Planned start is ${a.start}, a gate of ${days} day(s).`);
    o.push(`Downstream logic shifts by the same amount unless the sequence changes.`);
  }
  if(driversMilestone) o.push(`A milestone depends on this activity, so the impact carries through to a date the owner is watching.`);
  if(v.confidence === "certain") o.push(`This is a known certainty, not a forecast — plan around it rather than hoping.`);
  return o;
}

function mitigationsFor(v, a, days){
  const m = [];
  switch(v.type){
    case "weatherWindow":
      m.push("Resequence weather-exposed scope outside the window; pull indoor or prefab work forward into it.");
      m.push("Confirm the contract's weather provisions — most treat this as excusable but non-compensable, so document the days as they happen.");
      m.push("Price temporary protection (heat, enclosure, dewatering) and compare against the cost of the delay.");
      break;
    case "vendorSlip":
      m.push("Get written confirmation of the revised ship date, then reprice expediting or partial release against the delay cost.");
      m.push("Ask whether a partial shipment covers the first work front — often the whole lineup isn't needed to start.");
      m.push("Check whether an alternate manufacturer or a rental/temporary unit bridges the gap.");
      break;
    case "accessBlock":
      m.push("Escalate to the GC in writing with the specific area, dates, and the work it blocks. Access is a GC obligation.");
      m.push("Identify an alternate work front for the crew so the manpower curve doesn't collapse.");
      m.push("Start the notice clock — access delays are typically compensable if documented promptly.");
      break;
    case "outageWindow":
      m.push("Lock the outage in writing now; windows are scarce and get taken.");
      m.push("Build the switching order and pre-stage everything so the window isn't spent on setup.");
      m.push("Confirm the fallback if the window is missed — usually the next one is weeks out.");
      break;
    case "permitDelay":
      m.push("Confirm the review status directly with the AHJ rather than relying on the GC's read.");
      m.push("Ask about a partial or phased permit that releases the work that isn't in question.");
      m.push("Document the submission date — permit delay entitlement usually turns on whether you submitted on time.");
      break;
    case "laborShortage":
      m.push("Reforecast the manpower curve against the constrained period; the bell curve won't hold.");
      m.push("Evaluate travelers, overtime, or a second shift, and price each against the delay.");
      m.push("Protect the critical path first — let float-rich work absorb the shortage.");
      break;
    case "ownerEvent":
      m.push("Treat the date as fixed and work backwards; owner milestones rarely move.");
      m.push("Confirm in writing what 'complete' means for that event — partial turnover is often acceptable.");
      break;
    case "utilityDate":
      m.push("Confirm the utility date in writing and track it weekly; POCO dates drift quietly.");
      m.push("Price temporary power to bridge the gap and keep commissioning moving.");
      break;
    default:
      m.push("Resequence to protect the critical path, then document the impact.");
  }
  if(a.critical) m.push("Because this is on the critical path, raise it at the next OAC and get the GC's position on record.");
  if(days >= 10) m.push(`At ${days} days, a time extension request is likely warranted — start assembling the backup now.`);
  return m;
}

function runRiskAssessment(){
  const acts = ((state.schedule||{}).activities || []).filter(a => a.pct < 100);
  const vars = state.extVars || [];
  if(!acts.length){ toast("Load a schedule first.","bad"); return; }
  if(!vars.length){ toast("Add at least one external variable to assess against.","bad"); return; }

  const findings = [];
  const milestones = scheduleMilestones();

  for(const v of vars){
    const vFrom = parseDate(v.from);
    const vTo = v.to ? parseDate(v.to) : vFrom;
    if(!vFrom) continue;

    for(const a of acts){
      if(!matchesScope(v, a)) continue;
      const aStart = parseDate(a.start), aFin = parseDate(a.finish);
      if(!aFin) continue;
      const start = aStart || aFin;

      let days = 0, kind = "";
      if(v.impact === "gates"){
        // Gate: does the variable's date land after the planned start?
        if(vFrom > start){ days = daysBetween(start, vFrom); kind = "gate"; }
      } else {
        days = overlapDays(start, aFin, vFrom, vTo || vFrom);
        kind = "overlap";
      }
      if(days <= 0) continue;
      if(v.daysImpact > 0) days = Math.min(days, v.daysImpact) || days;

      // A milestone finishing after this activity inherits the exposure.
      const downstream = milestones.filter(ms => {
        const m = parseDate(ms.finish);
        return m && m >= aFin;
      }).slice(0,2);

      const netDays = a.float !== null && a.float > 0 && v.impact !== "gates"
        ? Math.max(0, days - a.float) : days;

      let severity = v.severity;
      if(a.critical || netDays >= 10) severity = "high";
      else if(netDays === 0) severity = "low";

      findings.push({
        id: uid("FND"),
        varId: v.id, varLabel: v.label, varType: v.type,
        actKey: a.actId || a.name, actName: a.name, actId: a.actId,
        critical: a.critical, float: a.float,
        start: a.start, finish: a.finish,
        days, netDays, kind, severity,
        confidence: v.confidence,
        milestone: isMilestone(a),
        downstream: downstream.map(d => ({ name:d.name, finish:d.finish })),
        outcomes: outcomesFor(v, a, days, downstream.length > 0),
        mitigations: mitigationsFor(v, a, days),
        source: v.source, notes: v.notes
      });
    }
  }

  const order = { high:0, medium:1, low:2 };
  findings.sort((x,y) => (order[x.severity]-order[y.severity]) || (y.netDays - x.netDays));

  state.assessment = {
    ranAt: new Date().toLocaleString(),
    findings,
    variableCount: vars.length,
    activityCount: acts.length,
    milestoneCount: milestones.length
  };

  // Tag activities so the Gantt and tables can show the flag.
  const byKey = {};
  findings.forEach(f => { (byKey[f.actKey] = byKey[f.actKey] || []).push(f); });
  ((state.schedule||{}).activities||[]).forEach(a => {
    a.riskFindings = byKey[a.actId || a.name] || [];
  });

  const high = findings.filter(f => f.severity === "high");
  addAudit("Risk Assessment","Assessment Run",
    `${vars.length} variable(s) against ${acts.length} activities — ${findings.length} finding(s), ${high.length} high severity.`);

  if(high.length){
    state.packets.push({
      id: uid("PKT"), type:"schedule",
      title: `Risk Assessment — ${high.length} high-severity exposure(s)`,
      summary: high.slice(0,3).map(f => `${f.actName}: ${f.varLabel} (${f.netDays}d net)`).join("; ") +
        (high.length>3?` and ${high.length-3} more.`:".") +
        " Full findings, outcomes, and mitigations on Schedule Intake.",
      score: high.some(f=>f.critical) ? 97 : 85,
      moneyAtRisk: 0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
      raw:{ riskAssessment:true, findings: high.slice(0,10) }
    });
  }

  save(); renderAll(); navigate("schedule");
  toast(`${findings.length} finding(s), ${high.length} high severity.`, high.length ? "bad" : "");
}

function exportAssessment(){
  const a = state.assessment;
  if(!a || !a.findings.length){ toast("Run the assessment first.","bad"); return; }
  const rows = [["OhmBoy Schedule Risk Assessment"],[],
    ["Run", a.ranAt],["Variables", a.variableCount],["Activities assessed", a.activityCount],
    ["Findings", a.findings.length],[],
    ["Severity","Activity","Activity ID","Critical","Float","Start","Finish","Variable","Impact Days","Net Days","Milestone","Outcomes","Mitigations","Source"]];
  a.findings.forEach(f => rows.push([
    f.severity.toUpperCase(), f.actName, f.actId||"", f.critical?"YES":"", f.float===null?"":f.float,
    f.start, f.finish, f.varLabel, f.days, f.netDays, f.milestone?"YES":"",
    f.outcomes.join("  |  "), f.mitigations.join("  |  "), f.source||""
  ]));
  exportRowsXlsx(rows, "Risk Assessment", "OhmBoy_Risk_Assessment.xlsx");
  addAudit("Risk Assessment","Assessment Exported", `${a.findings.length} finding(s).`);
  save();
  toast("Assessment exported.");
}

/* ---------------------------------------------------------------------------
   Gantt — 12 weeks forward, SVG, no dependencies.
   --------------------------------------------------------------------------- */

function ganttSvg(weeks){
  weeks = weeks || 12;
  const acts = ((state.schedule||{}).activities || []);
  if(!acts.length) return `<div class="item"><h3>No schedule loaded</h3><p>Upload a schedule to see the ${weeks}-week view.</p></div>`;

  const today = new Date(); today.setHours(0,0,0,0);
  const winStart = new Date(today.getTime() - 7 * 86400000);        // a week of context
  const winEnd = new Date(today.getTime() + weeks * 7 * 86400000);
  const span = winEnd - winStart;

  // Only what's live in the window, incomplete first, criticals at the top.
  const inWindow = acts.filter(a => {
    const s = parseDate(a.start) || parseDate(a.finish);
    const f = parseDate(a.finish);
    return s && f && f >= winStart && s <= winEnd && a.pct < 100;
  }).sort((a,b) => {
    if(a.critical !== b.critical) return a.critical ? -1 : 1;
    return (parseDate(a.start)||0) - (parseDate(b.start)||0);
  }).slice(0, 40);

  if(!inWindow.length) return `<div class="item"><h3>Nothing scheduled in the next ${weeks} weeks</h3><p>All loaded activities finish before the window or start after it.</p></div>`;

  const rowH = 26, padL = 210, padT = 46, padR = 20;
  const W = 1080, iw = W - padL - padR;
  const H = padT + inWindow.length * rowH + 26;
  const x = d => padL + ((d - winStart) / span) * iw;

  // Week gridlines and labels
  let grid = "", labels = "";
  for(let i = 0; i <= weeks + 1; i++){
    const d = new Date(winStart.getTime() + i * 7 * 86400000);
    const px = x(d);
    if(px > W - padR) break;
    grid += `<line x1="${px.toFixed(1)}" y1="${padT-10}" x2="${px.toFixed(1)}" y2="${H-18}" stroke="rgba(184,115,51,.14)"/>`;
    labels += `<text x="${px.toFixed(1)}" y="${padT-18}" font-size="10" fill="#666" text-anchor="middle">${d.toISOString().slice(5,10)}</text>`;
  }

  const todayX = x(today);
  const rows = inWindow.map((a, i) => {
    const y = padT + i * rowH;
    const s = parseDate(a.start) || parseDate(a.finish);
    const f = parseDate(a.finish);
    const x1 = Math.max(padL, x(s)), x2 = Math.min(W - padR, x(f));
    const w = Math.max(3, x2 - x1);
    const ms = isMilestone(a);
    const risk = (a.riskFindings||[]).length;
    const worst = risk ? (a.riskFindings.some(r=>r.severity==="high") ? "high" : "medium") : null;
    const fill = a.critical ? "rgba(201,37,37,.30)" : "rgba(184,115,51,.28)";
    const stroke = a.critical ? "rgba(201,37,37,.75)" : "rgba(184,115,51,.7)";
    const name = (a.name||"").length > 30 ? (a.name||"").slice(0,29) + "…" : (a.name||"");
    const title = `${a.name}\n${a.start} → ${a.finish}${a.float!==null?`\nFloat ${a.float}d`:""}${a.critical?"\nCRITICAL PATH":""}${risk?`\n${risk} risk finding(s)`:""}`;

    return `<g>
      <text x="10" y="${y+17}" font-size="11" fill="${a.critical?"#c92525":"#222"}">${esc(name)}</text>
      ${a.pct>0?`<text x="${padL-8}" y="${y+17}" font-size="10" fill="#777" text-anchor="end">${a.pct}%</text>`:""}
      ${ms
        ? `<polygon points="${x2},${y+6} ${x2+8},${y+14} ${x2},${y+22} ${x2-8},${y+14}" fill="#0f766e" stroke="#0f766e"><title>${esc(title)}</title></polygon>`
        : `<rect x="${x1.toFixed(1)}" y="${y+6}" width="${w.toFixed(1)}" height="16" rx="3" fill="${fill}" stroke="${stroke}"><title>${esc(title)}</title></rect>
           ${a.pct>0?`<rect x="${x1.toFixed(1)}" y="${y+6}" width="${(w*a.pct/100).toFixed(1)}" height="16" rx="3" fill="${stroke}" opacity=".5"/>`:""}`}
      ${worst?`<circle cx="${(x2+ (ms?16:10)).toFixed(1)}" cy="${y+14}" r="4.5" fill="${worst==="high"?"#c92525":"#b87333"}"><title>${(a.riskFindings||[]).map(r=>r.varLabel).join(", ")}</title></circle>`:""}
    </g>`;
  }).join("");

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="gantt" preserveAspectRatio="xMidYMid meet">
    ${grid}${labels}
    <line x1="${todayX.toFixed(1)}" y1="${padT-14}" x2="${todayX.toFixed(1)}" y2="${H-18}" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="4 3"/>
    <text x="${(todayX+5).toFixed(1)}" y="${padT-26}" font-size="10" fill="#0f766e">today</text>
    ${rows}
  </svg></div>
  <div class="legend">
    <span><i class="sw" style="background:rgba(184,115,51,.35);border:1px solid rgba(184,115,51,.7)"></i>Activity</span>
    <span><i class="sw" style="background:rgba(201,37,37,.35);border:1px solid rgba(201,37,37,.75)"></i>Critical path</span>
    <span><i class="sw" style="background:#0f766e;transform:rotate(45deg)"></i>Milestone</span>
    <span><i class="sw" style="background:#c92525;border-radius:50%"></i>Risk finding</span>
  </div>

/* ===========================================================================
   Ωboy V0.27.0 — Lead Time Registers
   ---------------------------------------------------------------------------
   Three named registers on Schedule Intake: Vendor, Innovation Center (prefab
   shop), and Subcontractor.

   These deliberately share the constraint engine rather than duplicating it.
   The Constraints page already walks backwards from an activity's start date
   to a must-release-by date; splitting that into a second implementation would
   mean two sets of arithmetic drifting apart. So a lead time IS a constraint
   with a category, and everything downstream — the risk board, the assessment,
   the Gantt dots — sees it without extra wiring.

   What each register adds over a generic constraint is the attribute field:
   the thing that actually determines the lead time. For a vendor that's the
   manufacturer and equipment class. For the shop it's the assembly type and
   whether the drawings are released. For a sub it's the trade and crew size.
   =========================================================================== */

const LEAD_REGISTERS = [
  { key:"vendor",     title:"Vendor Lead Time",
    blurb:"Gear, switchgear, transformers, cable, devices — anything bought and shipped.",
    attrLabel:"Manufacturer / Equipment Class",
    attrPlaceholder:"Eaton — 2500A switchgear lineup",
    namePlaceholder:"MSB-1 switchgear",
    typicalNote:"Long-lead electrical gear commonly runs 30-50+ weeks. Confirm against a current quote rather than last year's." },
  { key:"innovation", title:"Innovation Center Lead Time",
    blurb:"Prefab and shop assembly time before anything ships to site.",
    attrLabel:"Assembly Type / Release Status",
    attrPlaceholder:"Overhead rack spools — pending IFC release",
    namePlaceholder:"Level 2 corridor rack assemblies",
    typicalNote:"Shop time starts when drawings are released, not when the order is placed. If the release date slips, so does everything after it." },
  { key:"sub",        title:"Subcontractor Lead Time",
    blurb:"Notice a sub needs to mobilise crew, equipment, or specialty scope.",
    attrLabel:"Trade / Scope",
    attrPlaceholder:"Core drilling — 4-man crew",
    namePlaceholder:"Concrete coring — Bldg 5 penetrations",
    typicalNote:"Mobilisation notice is not the same as availability. A sub who needs 3 weeks' notice may still be booked out 8." }
];

const LEAD_STATUS = [
  ["planned",  "Planned"],
  ["quoted",   "Quoted"],
  ["released", "Released / Ordered"],
  ["confirmed","Confirmed Date"],
  ["received", "Received / Mobilised"]
];

function leadDefaults(o){
  o = o || {};
  return {
    id: o.id || uid("LT"),
    category: o.category || "vendor",
    name: o.name || "",
    attribute: o.attribute || "",
    leadWeeks: Number(o.leadWeeks) || 0,
    activityId: o.activityId || "",
    matchTerm: o.matchTerm || "",
    status: o.status || "planned",
    releasedDate: o.releasedDate || "",
    confirmedDate: o.confirmedDate || "",
    poNumber: o.poNumber || "",
    contact: o.contact || "",
    notes: o.notes || "",
    createdAt: new Date().toLocaleString()
  };
}

function addLeadTime(cat){
  const p = cat;
  const name = val("lt_" + p + "_name","").trim();
  if(!name){ toast("Give it a name.","bad"); return; }
  const weeks = Number(val("lt_" + p + "_weeks",0)) || 0;
  if(weeks <= 0){ toast("Lead time needs to be greater than zero weeks.","bad"); return; }
  const lt = leadDefaults({
    category: cat,
    name,
    attribute: val("lt_"+p+"_attr","").trim(),
    leadWeeks: weeks,
    activityId: val("lt_"+p+"_act","").trim(),
    matchTerm: val("lt_"+p+"_match","").trim(),
    status: val("lt_"+p+"_status","planned"),
    confirmedDate: val("lt_"+p+"_confirmed",""),
    poNumber: val("lt_"+p+"_po","").trim(),
    contact: val("lt_"+p+"_contact","").trim(),
    notes: val("lt_"+p+"_notes","").trim()
  });
  state.leadTimes = state.leadTimes || [];
  state.leadTimes.push(lt);
  const reg = LEAD_REGISTERS.find(r => r.key === cat);
  addAudit("Lead Times", (reg?reg.title:"Lead Time") + " Added",
    `${lt.name} — ${lt.leadWeeks} week lead${lt.attribute?` (${lt.attribute})`:""}.`);
  save(); renderAll(); navigate("schedule");

  const e = evaluateLead(lt);
  toast(e.orderBy
    ? (e.slackDays !== null && e.slackDays < 0
        ? `Added — release date was ${e.orderBy}, ${Math.abs(e.slackDays)} days ago.`
        : `Added — must release by ${e.orderBy}${e.slackDays!==null?` (${e.slackDays} days of slack)`:""}.`)
    : "Added. Link it to a schedule activity to get a release-by date.",
    e.slackDays !== null && e.slackDays < 0 ? "bad" : "");
}

function updateLeadTime(id, field, value){
  const lt = (state.leadTimes||[]).find(x => x.id === id);
  if(!lt) return;
  if(field === "leadWeeks") value = Number(value) || 0;
  const before = lt[field];
  lt[field] = value;
  if(field === "status"){
    if(value === "released" && !lt.releasedDate) lt.releasedDate = todayISO();
    addAudit("Lead Times","Status Changed", `${lt.name}: ${before} → ${value}.`);
  }
  save(); renderAll(); navigate("schedule");
}

function deleteLeadTime(id){
  const lt = (state.leadTimes||[]).find(x => x.id === id);
  if(!lt) return;
  if(!confirmAction(`Delete "${lt.name}"?`)) return;
  state.leadTimes = state.leadTimes.filter(x => x.id !== id);
  addAudit("Lead Times","Deleted", lt.name);
  save(); renderAll(); navigate("schedule");
}

/* Same backward-walk as the constraint engine: find the work this feeds, take
   its start date, subtract the lead time, compare to today. */
function leadActivity(lt){
  const acts = (state.schedule || {}).activities || [];
  if(lt.activityId){
    const byId = acts.find(a => a.actId && a.actId.toLowerCase() === lt.activityId.toLowerCase());
    if(byId) return byId;
  }
  if(lt.matchTerm){
    const t = lt.matchTerm.toLowerCase();
    const hits = acts.filter(a => (a.name||"").toLowerCase().includes(t) && (a.start || a.finish));
    if(hits.length) return hits.sort((x,y) => (parseDate(x.start||x.finish)||0) - (parseDate(y.start||y.finish)||0))[0];
  }
  return null;
}

function evaluateLead(lt){
  const act = leadActivity(lt);
  const needBy = act ? parseDate(act.start || act.finish) : null;
  const out = { activity:act, needBy: act ? (act.start||act.finish) : "",
                orderBy:"", slackDays:null, status:"unlinked",
                critical: !!(act && act.critical), milestone: !!(act && typeof isMilestone === "function" && isMilestone(act)) };
  if(!needBy) return out;

  const orderBy = new Date(needBy.getTime() - lt.leadWeeks * 7 * 86400000);
  out.orderBy = orderBy.toISOString().slice(0,10);

  if(lt.status === "received"){ out.status = "received"; return out; }

  // A confirmed date beats the calculation — if the vendor has committed to a date,
  // compare that to the need-by rather than the theoretical release window (calculation).
  if(lt.confirmedDate){
    const conf = parseDate(lt.confirmedDate);
    if(conf){
      out.confirmedVsNeed = Math.round((needBy - conf) / 86400000);
      out.status = out.confirmedVsNeed < 0 ? "late" : "confirmed-ok";
      if(out.confirmedVsNeed < 0) out.lateDays = Math.abs(out.confirmedVsNeed);
      return out;
    }
  }

  if(lt.status === "released"){ out.status = "released"; return out; }

  const today = new Date(); today.setHours(0,0,0,0);
  out.slackDays = Math.round((orderBy - today) / 86400000);
  out.status = out.slackDays < 0 ? "overdue" : (out.slackDays <= 21 ? "urgent" : "ok");
  return out;
}

function leadRollup(cat){
  const list = (state.leadTimes||[]).filter(l => !cat || l.category === cat);
  const r = { total:list.length, overdue:0, urgent:0, late:0, ok:0, released:0, received:0, unlinked:0, criticalAtRisk:0, worstDays:0 };
  for(const lt of list){
    const e = evaluateLead(lt);
    if(e.status === "overdue"){ r.overdue++; r.worstDays = Math.max(r.worstDays, Math.abs(e.slackDays||0)); }
    else if(e.status === "urgent") r.urgent++;
    else if(e.status === "late"){ r.late++; r.worstDays = Math.max(r.worstDays, e.lateDays||0); }
    else if(e.status === "released") r.released++;
    else if(e.status === "received") r.received++;
    else if(e.status === "unlinked") r.unlinked++;
    else r.ok++;
    if((e.status === "overdue" || e.status === "urgent" || e.status === "late") && (e.critical || e.milestone)) r.criticalAtRisk++;
  }
  return r;
}

/* Lead times join the same risk board as constraints and delays. */
function leadRiskItems(){
  const items = [];
  for(const lt of (state.leadTimes||[])){
    const e = evaluateLead(lt);
    const reg = LEAD_REGISTERS.find(r => r.key === lt.category);
    const kind = reg ? reg.title.replace(" Lead Time","") : lt.category;
    if(e.status === "overdue"){
      items.push({ severity:"high", kind,
        title:`${lt.name} — release date passed`,
        detail:`${lt.leadWeeks} week lead${lt.attribute?` (${lt.attribute})`:""}. Should have been released ${e.orderBy}, ${Math.abs(e.slackDays)} days ago. Needed for ${e.activity.name} on ${e.needBy}${e.critical?", which is on the critical path":""}.`,
        action:"navigate('schedule')" });
    } else if(e.status === "urgent"){
      items.push({ severity: (e.critical||e.milestone) ? "high" : "medium", kind,
        title:`${lt.name} — release within ${e.slackDays} day(s)`,
        detail:`${lt.leadWeeks} week lead. Release by ${e.orderBy} to hold the ${e.needBy} start on ${e.activity.name}.`,
        action:"navigate('schedule')" });
    } else if(e.status === "late"){
      items.push({ severity:"high", kind,
        title:`${lt.name} — confirmed date lands after it's needed`,
        detail:`Confirmed ${lt.confirmedDate}; ${e.activity.name} starts ${e.needBy}. That's ${e.lateDays} days short${e.critical?" on a critical-path activity":""}.`,
        action:"navigate('schedule')" });
    }
  }
  return items;
}

/* Folded into the existing board so there's one place to look.
   NOTE: this must be a function-expression assignment, not a declaration.
   A `function riskBoard(){}` declaration hoists above the const that captures
   the original, so the "base" reference resolves to this same function and it
   recurses forever. Capturing at assignment time is what makes it safe. */
const _riskBoardBase = riskBoard;
riskBoard = function(){
  const base = _riskBoardBase ? _riskBoardBase() : [];
  const all = base.concat(leadRiskItems());
  const order = { high:0, medium:1, low:2 };
  return all.sort((a,b) => order[a.severity] - order[b.severity]);
};

/* ---------- render ---------- */

function leadRow(lt){
  const e = evaluateLead(lt);
  const badge = {
    overdue:'<span class="badge badge-warn">RELEASE OVERDUE</span>',
    urgent:'<span class="badge badge-warn">RELEASE NOW</span>',
    late:'<span class="badge badge-warn">ARRIVES LATE</span>',
    "confirmed-ok":'<span class="badge badge-ok">CONFIRMED OK</span>',
    released:'<span class="badge badge-ok">RELEASED</span>',
    received:'<span class="badge badge-ok">RECEIVED</span>',
    ok:'<span class="badge">ON TRACK</span>',
    unlinked:'<span class="badge">NOT LINKED</span>'
  }[e.status] || "";
  const slack = e.status === "late"
    ? `<span class="cell-late">${e.lateDays}d SHORT</span>`
    : (e.slackDays === null ? "—" : (e.slackDays < 0

/* ===========================================================================
   Ωboy V0.28.0 — Sequencing Analysis
   ---------------------------------------------------------------------------
   Reads the loaded schedule and checks it against known electrical
   construction sequencing. A CPM schedule enforces whatever logic somebody
   typed into it; it does not know that you can't pull wire through conduit
   that hasn't been inspected, or that concrete needs to cure before you set
   gear on it. Those omissions look fine in P6 and fail in the field.

   The engine matches activities to sequencing roles by keyword, then tests the
   actual start and finish dates for four failure modes:

     INVERTED    successor finishes before the predecessor starts — the work is
                 scheduled in the wrong order entirely
     OVERLAP     successor starts before the predecessor finishes, where the
                 overlap is physically impossible rather than merely tight
     LAG         the gap between them is shorter than the required cure,
                 inspection, or energisation hold
     MISSING     a successor exists with no matching predecessor anywhere in
                 the schedule — usually scope that was never scheduled

   Every rule carries its own impacts and resolutions, because "these overlap"
   is not actionable and "rough-in can't be covered before inspection, here is
   what that costs you and here are three ways out" is.

   This is a checklist, not a scheduler. It does not rebuild logic or compute a
   new critical path. Findings are for PM judgement — some overlaps are
   deliberate and correct.
   =========================================================================== */

/* Each rule: what has to happen first, what follows, the minimum gap in
   calendar days, and whether partial overlap is ever legitimate. */

function seqMatcher(pattern){
  try{ return new RegExp(pattern, "i"); }
  catch(e){
    const esc2 = pattern.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(esc2, "i");
  }
}

function addSeqRule(){
  const pred = val("sqPred","").trim(), succ = val("sqSucc","").trim();
  if(!pred || !succ){ toast("Both the predecessor and successor patterns are needed.","bad"); return; }
  state.seqRules = state.seqRules || [];
  state.seqRules.push({
    id: uid("SEQ"), enabled:true,
    severity: val("sqSeverity","medium"),
    pred, succ,
    minLag: Number(val("sqLag",0)) || 0,
    allowOverlap: val("sqOverlap","no") === "yes",
    why: val("sqWhy","").trim() || "Custom sequencing rule.",
    impacts: val("sqImpacts","").split("|").map(s=>s.trim()).filter(Boolean),
    fixes: val("sqFixes","").split("|").map(s=>s.trim()).filter(Boolean)
  });
  addAudit("Sequencing","Rule Added", `"${pred}" must precede "${succ}".`);
  save(); renderAll(); navigate("scheduleRisk");
  toast("Rule added. Run the sequencing analysis to apply it.");
}

function updateSeqRule(id, field, value){
  const r = (state.seqRules||[]).find(x => x.id === id);
  if(!r) return;
  r[field] = field === "enabled" ? !!value : (field === "minLag" ? (Number(value)||0) : value);
  save(); renderAll(); navigate("scheduleRisk");
}

function deleteSeqRule(id){
  const r = (state.seqRules||[]).find(x => x.id === id);
  if(!r) return;
  if(!confirmAction(`Delete the rule "${r.pred}" → "${r.succ}"?`)) return;
  state.seqRules = state.seqRules.filter(x => x.id !== id);
  addAudit("Sequencing","Rule Deleted", `${r.pred} → ${r.succ}`);
  save(); renderAll(); navigate("scheduleRisk");
}

function resetSeqRules(){
  if(!confirmAction("Replace all sequencing rules with the default electrical set? Custom rules will be lost.")) return;
  state.seqRules = defaultSequenceRules();
  addAudit("Sequencing","Rules Reset","Restored the default electrical sequencing set.");
  save(); renderAll(); navigate("scheduleRisk");
}

/* ---------- the analysis ---------- */

function runSequenceAnalysis(){
  const acts = ((state.schedule||{}).activities || []).filter(a => a.finish);
  if(!acts.length){ toast("Load a schedule first.","bad"); return; }
  const rules = (state.seqRules && state.seqRules.length ? state.seqRules : defaultSequenceRules())
    .filter(r => r.enabled !== false);

  const findings = [];
  const today = new Date(); today.setHours(0,0,0,0);

  for(const rule of rules){
    const pRe = seqMatcher(rule.pred), sRe = seqMatcher(rule.succ);
    const preds = acts.filter(a => pRe.test(a.name||""));
    const succs = acts.filter(a => sRe.test(a.name||"") && !pRe.test(a.name||""));
    if(!succs.length) continue;

    // Successor scheduled with no predecessor anywhere — usually missing scope.
    if(!preds.length){
      for(const s of succs){
        if(s.pct >= 100) continue;
        findings.push(seqFinding(rule, null, s, "missing", 0, today));
      }
      continue;
    }

    for(const s of succs){
      if(s.pct >= 100) continue;
      const sStart = parseDate(s.start || s.finish);
      if(!sStart) continue;

      // Compare against the predecessor that finishes last — that's the one
      // actually gating this successor.
      let gating = null, gatingFin = null;
      for(const pr of preds){
        const pFin = parseDate(pr.finish);
        if(!pFin) continue;
        if(!gatingFin || pFin > gatingFin){ gatingFin = pFin; gating = pr; }
      }
      if(!gating) continue;

      const pStart = parseDate(gating.start || gating.finish);
      const sFin = parseDate(s.finish);
      const gapDays = Math.round((sStart - gatingFin) / 86400000);

      if(sFin && pStart && sFin < pStart){
        findings.push(seqFinding(rule, gating, s, "inverted",
          Math.round((pStart - sFin) / 86400000), today));
      } else if(gapDays < 0){
        const overlap = Math.abs(gapDays);
        // Overlap is legitimate for some pairs (branch work by area, pulls by
        // run). Only flag it when the rule says it cannot overlap, or when the
        // successor starts before the predecessor is even half done.
        const pDur = pStart ? Math.round((gatingFin - pStart)/86400000) : 0;
        const deep = pDur > 0 && overlap > pDur * 0.5;
        if(!rule.allowOverlap || deep){
          findings.push(seqFinding(rule, gating, s, "overlap", overlap, today));
        }
      } else if(rule.minLag > 0 && gapDays < rule.minLag){
        findings.push(seqFinding(rule, gating, s, "lag", rule.minLag - gapDays, today));
      }
    }
  }

  const order = { high:0, medium:1, low:2 };
  findings.sort((a,b) => (order[a.severity]-order[b.severity]) || (b.days - a.days));

  state.seqAnalysis = {
    ranAt: new Date().toLocaleString(),
    findings,
    ruleCount: rules.length,
    activityCount: acts.length
  };

  // Tag activities so the Gantt and tables can show it.
  const byKey = {};
  findings.forEach(f => { (byKey[f.succKey] = byKey[f.succKey] || []).push(f); });
  ((state.schedule||{}).activities||[]).forEach(a => {
    a.seqFindings = byKey[a.actId || a.name] || [];
  });

  const high = findings.filter(f => f.severity === "high");
  addAudit("Sequencing","Analysis Run",
    `${rules.length} rule(s) against ${acts.length} activities — ${findings.length} finding(s), ${high.length} high severity.`);

  if(high.length){
    state.packets.push({
      id: uid("PKT"), type:"schedule",
      title: `Sequencing — ${high.length} high-severity issue(s)`,
      summary: high.slice(0,3).map(f => `${f.succName}: ${f.headline}`).join("; ") +
        (high.length>3?` and ${high.length-3} more.`:".") +
        " Full findings with impacts and resolutions on Schedule Risk.",
      score: high.some(f => f.critical) ? 96 : 86,
      moneyAtRisk: 0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
      raw:{ sequenceAnalysis:true, findings: high.slice(0,10) }
    });
  }

  save(); renderAll(); navigate("scheduleRisk");
  toast(`${findings.length} sequencing finding(s), ${high.length} high severity.`, high.length ? "bad" : "");
}

function seqFinding(rule, pred, succ, kind, days, today){
  const sStart = parseDate(succ.start || succ.finish);
  const daysOut = sStart ? Math.round((sStart - today)/86400000) : null;
  const imminent = daysOut !== null && daysOut <= 21;

  let severity = rule.severity;
  if(succ.critical || (kind === "inverted")) severity = "high";
  else if(kind === "missing" && rule.severity === "high") severity = "medium";

  const headline = {
    inverted: pred ? `finishes before ${pred.name} even starts` : "scheduled out of order",
    overlap:  pred ? `starts ${days} day(s) before ${pred.name} finishes` : `starts too early`,
    lag:      pred ? `follows ${pred.name} by ${rule.minLag - days} day(s), ${days} short of the ${rule.minLag}-day minimum` : "insufficient lag",
    missing:  `has no matching predecessor anywhere in the schedule`
  }[kind];

  const extraImpacts = [];
  if(succ.critical) extraImpacts.push("This activity is on the critical path — any rework here moves the finish date directly.");
  if(imminent) extraImpacts.push(`Work starts in ${daysOut} day(s), so there is limited time to resequence.`);
  if(kind === "missing") extraImpacts.push("Either the predecessor scope was never scheduled, or it is named differently than this rule expects — check before treating it as a gap.");

  const extraFixes = [];
  if(kind === "missing") extraFixes.push("Confirm whether the work exists under another name; if it genuinely isn't scheduled, raise it with the GC before it becomes your delay.");
  if(kind !== "missing") extraFixes.push("If the overlap is deliberate and by area or by run, split both activities in the schedule so the logic reads correctly.");

  return {
    id: uid("SQF"),
    ruleId: rule.id, kind, severity, days,
    headline,
    predName: pred ? pred.name : "", predId: pred ? pred.actId : "",
    predStart: pred ? pred.start : "", predFinish: pred ? pred.finish : "",
    succName: succ.name, succId: succ.actId, succKey: succ.actId || succ.name,
    succStart: succ.start, succFinish: succ.finish,
    critical: !!succ.critical,
    milestone: typeof isMilestone === "function" ? isMilestone(succ) : false,
    float: succ.float,
    daysOut,
    why: rule.why,
    impacts: (rule.impacts||[]).concat(extraImpacts),
    fixes: (rule.fixes||[]).concat(extraFixes)
  };
}

function exportSeqAnalysis(){
  const a = state.seqAnalysis;
  if(!a || !a.findings.length){ toast("Run the sequencing analysis first.","bad"); return; }
  const rows = [["OhmBoy Sequencing Analysis"],[],
    ["Run", a.ranAt],["Rules applied", a.ruleCount],["Activities checked", a.activityCount],
    ["Findings", a.findings.length],[],
    ["Severity","Issue","Successor","Successor ID","Starts","Predecessor","Pred Finishes","Days","Critical","Float","Why It Matters","Impacts","Resolutions"]];
  a.findings.forEach(f => rows.push([
    f.severity.toUpperCase(), f.kind.toUpperCase(), f.succName, f.succId||"", f.succStart||"",
    f.predName||"(none found)", f.predFinish||"", f.days, f.critical?"YES":"",
    f.float===null||f.float===undefined?"":f.float,
    f.why, f.impacts.join("  |  "), f.fixes.join("  |  ")
  ]));
  exportRowsXlsx(rows, "Sequencing Analysis", "OhmBoy_Sequencing_Analysis.xlsx");
  addAudit("Sequencing","Analysis Exported", `${a.findings.length} finding(s).`);
  save();
  toast("Sequencing analysis exported.");
}

/* ---------- render ---------- */

const SEQ_KIND_LABEL = {
  inverted:"OUT OF ORDER", overlap:"IMPOSSIBLE OVERLAP",
  lag:"INSUFFICIENT LAG", missing:"NO PREDECESSOR"
};

function seqFindingCard(f){
  return `<div class="item risk-${esc(f.severity)}">
    <span class="badge ${f.severity==="high"?"badge-warn":""}">${esc(f.severity.toUpperCase())}</span>
    <span class="badge">${esc(SEQ_KIND_LABEL[f.kind]||f.kind)}</span>
    ${f.critical?'<span class="badge badge-warn">CRITICAL PATH</span>':""}
    ${f.milestone?'<span class="badge badge-ok">MILESTONE</span>':""}
    <h3>${esc(f.succName)}${f.succId?` (${esc(f.succId)})`:""} ${esc(f.headline)}</h3>
    <p><b>${esc(f.why)}</b></p>
    <p class="sub">
      ${f.predName?`Predecessor: <b>${esc(f.predName)}</b> ${esc(f.predStart||"?")} → ${esc(f.predFinish||"?")}<br>`:""}
      Successor: <b>${esc(f.succName)}</b> ${esc(f.succStart||"?")} → ${esc(f.succFinish||"?")}
      ${f.float!==null&&f.float!==undefined?` · ${f.float}d float`:""}
      ${f.daysOut!==null?` · starts in ${f.daysOut}d`:""}
    </p>
    <div class="finding-cols">
      <div><b>Impacts if it stands</b><ul class="detail-list">${f.impacts.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>
      <div><b>Resolution</b><ul class="detail-list">${f.fixes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
    </div>
  </div>`;
}

function seqRuleRow(r){
  const hits = state.seqAnalysis ? state.seqAnalysis.findings.filter(f => f.ruleId === r.id).length : null;
  return `<tr>
    <td><input class="cell-input wide" value="${esc(r.pred)}" onchange="updateSeqRule('${esc(r.id)}','pred',this.value)"></td>
    <td><input class="cell-input wide" value="${esc(r.succ)}" onchange="updateSeqRule('${esc(r.id)}','succ',this.value)"></td>
    <td><input class="cell-input" type="number" min="0" step="1" value="${r.minLag||0}"
        onchange="updateSeqRule('${esc(r.id)}','minLag',this.value)"> d</td>
    <td><select class="mini-select" onchange="updateSeqRule('${esc(r.id)}','allowOverlap',this.value==='yes')">
        <option value="no"${!r.allowOverlap?" selected":""}>No</option>
        <option value="yes"${r.allowOverlap?" selected":""}>By area/run</option></select></td>
    <td><select class="mini-select" onchange="updateSeqRule('${esc(r.id)}','severity',this.value)">
        ${SEVERITIES.map(([k,l])=>`<option value="${k}"${k===r.severity?" selected":""}>${esc(l)}</option>`).join("")}</select></td>
    <td class="${hits?"cell-late":""}">${hits===null?"—":hits}</td>
    <td><label class="chk"><input type="checkbox" ${r.enabled!==false?"checked":""}
        onchange="updateSeqRule('${esc(r.id)}','enabled',this.checked)"> on</label></td>
    <td><button class="action danger" onclick="deleteSeqRule('${esc(r.id)}')">Delete</button></td>
  </tr>`;
}

function sequencingSection(){
  const rules = state.seqRules || [];
  const a = state.seqAnalysis;
  const acts = (state.schedule||{}).activities || [];
  const counts = a ? {
    high: a.findings.filter(f=>f.severity==="high").length,
    med:  a.findings.filter(f=>f.severity==="medium").length,
    low:  a.findings.filter(f=>f.severity==="low").length,
    inverted: a.findings.filter(f=>f.kind==="inverted").length,
    overlap:  a.findings.filter(f=>f.kind==="overlap").length,
    lag:      a.findings.filter(f=>f.kind==="lag").length,
    missing:  a.findings.filter(f=>f.kind==="missing").length
  } : null;

  return `<div class="card panel" style="margin-top:18px">
    <div class="setup-head">
      <div><h2>Construction Sequencing Analysis</h2>
      <p class="sub">Checks the loaded schedule against known electrical sequencing. A CPM schedule enforces whatever logic was typed into it — this checks whether that logic matches how the work actually goes in.</p></div>
      <div class="takeoff-row-actions" style="margin:0">
        <button class="action dark ${acts.length?"":"is-blocked"}" onclick="runSequenceAnalysis()">Run Sequencing Analysis</button>
        ${a&&a.findings.length?`<button class="action" onclick="exportSeqAnalysis()">Export</button>`:""}
      </div>
    </div>

    ${!acts.length?`<p class="sub">No schedule loaded. Upload one on Schedule Intake first.</p>`:""}

    ${counts?`<div class="grid four" style="margin-top:14px">
      <div class="card kpi"><span>Out of Order</span><strong class="${counts.inverted?"neg":""}">${counts.inverted}</strong></div>
      <div class="card kpi"><span>Impossible Overlap</span><strong class="${counts.overlap?"neg":""}">${counts.overlap}</strong></div>
      <div class="card kpi"><span>Insufficient Lag</span><strong class="${counts.lag?"neg":""}">${counts.lag}</strong></div>
      <div class="card kpi"><span>No Predecessor</span><strong>${counts.missing}</strong></div>
    </div>
    <p class="sub" style="margin-top:12px">Run ${esc(a.ranAt)} — ${a.ruleCount} rule(s) against ${a.activityCount} activities.
      ${counts.high} high, ${counts.med} medium, ${counts.low} low.
      ${counts.high?`<b>Start with the high-severity findings; those are the ones that produce destructive rework.</b>`:`Nothing high-severity — the sequencing logic holds against these rules.`}</p>`:""}

    ${a?`<div class="list" style="margin-top:14px">
      ${a.findings.length ? a.findings.slice(0,20).map(seqFindingCard).join("")
        : '<div class="item"><h3>No sequencing issues found</h3><p>Every successor follows its predecessor with adequate lag. That is a real result — but check the rule patterns below if you expected findings, since matching is by keyword and your activity names may differ.</p></div>'}
    </div>
    ${a.findings.length>20?`<p class="sub">Showing 20 of ${a.findings.length}. Export for the full set.</p>`:""}`:""}
  </div>

  <div class="card panel" style="margin-top:18px">
    <h2>Sequencing Rules</h2>
    <p class="sub">Each rule says what must happen before what, and the minimum gap between them. Patterns accept regex — <code>rough[- ]?in|conduit</code> matches either. "By area/run" means partial overlap is legitimate and only deep overlap is flagged.</p>
    <div class="takeoff-form" style="margin-top:12px">
      <div class="field"><label>Predecessor Pattern</label><input id="sqPred" placeholder="rough[- ]?in|conduit"></div>
      <div class="field"><label>Successor Pattern</label><input id="sqSucc" placeholder="inspect|cover"></div>
      <div class="field"><label>Minimum Gap (days)</label><input id="sqLag" type="number" min="0" step="1" value="0"></div>
      <div class="field"><label>Overlap Allowed</label><select id="sqOverlap"><option value="no">No</option><option value="yes">By area/run</option></select></div>
      <div class="field"><label>Severity</label><select id="sqSeverity">${SEVERITIES.map(([k,l])=>`<option value="${k}"${k==="medium"?" selected":""}>${esc(l)}</option>`).join("")}</select></div>
      <div class="field full"><label>Why It Matters</label><input id="sqWhy" placeholder="Shown on every finding this rule produces"></div>
      <div class="field full"><label>Impacts (separate with |)</label><input id="sqImpacts" placeholder="Rework at your cost | Schedule slips | Crew standby"></div>
      <div class="field full"><label>Resolutions (separate with |)</label><input id="sqFixes" placeholder="Add inspection activity | Split by area | Notify GC in writing"></div>
    </div>
    <div class="takeoff-row-actions">
      <button class="action dark" onclick="addSeqRule()">Add Rule</button>
      <button class="action" onclick="resetSeqRules()">Restore Defaults</button>
    </div>
    <div class="sov-scroll"><table class="log-table" style="margin-top:14px"><thead><tr>
      <th>Must Happen First</th><th>Before This</th><th>Min Gap</th><th>Overlap</th><th>Severity</th><th>Findings</th><th>On</th><th></th>
    </tr></thead><tbody>
      ${rules.length ? rules.map(seqRuleRow).join("") : '<tr><td colspan="8">No rules. Restore Defaults loads the electrical set.</td></tr>'}
    </tbody></table></div>
    <p class="sub" style="margin-top:10px">This is a checklist, not a scheduler — it does not rebuild logic or recompute the critical path. Some overlaps are deliberate and correct; findings are for your judgement.</p>
  </div>`;
}

/* Append to Schedule Risk. Assignment rather than declaration — a function
   declaration would hoist above the const capturing the original and recurse. */
const _renderScheduleRiskBase = renderScheduleRisk;
renderScheduleRisk = function(){
  _renderScheduleRiskBase();
  const el = $("scheduleRisk");
  if(!el) return;
  el.innerHTML = el.innerHTML + sequencingSection();
};


renderAll();
</script>
</body>
</html>
