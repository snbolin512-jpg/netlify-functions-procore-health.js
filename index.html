<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ωboy V0.21.3 — Clean Luxe UI Shell</title>
<style>
:root{
  --ivory:#fffff6;
  --white:#ffffff;
  --black:#070707;
  --gray:#565656;
  --line:#eadfd2;
  --copper:#b87333;
  --copper-dark:#7a3f16;
  --copper-soft:#d6a06d;
  --teal:#0f766e;
  --red:#c92525;
  --amber:#c27a2c;
  --shadow:0 22px 54px rgba(20,16,10,.07);
  --shadow-soft:0 12px 28px rgba(20,16,10,.048);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:"Avenir Next LT Pro","Avenir Next","Avenir",Helvetica,Arial,sans-serif;
  font-weight:300;
  color:var(--black);
  background:
    radial-gradient(circle at 92% 0%,rgba(184,115,51,.055),transparent 30%),
    radial-gradient(circle at 2% 4%,rgba(15,118,110,.035),transparent 26%),
    linear-gradient(180deg,#fff 0%,var(--ivory) 64%,#fffef9 100%);
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;padding:12px}
.shell{
  width:min(1680px,calc(100vw - 24px));
  min-height:calc(100vh - 24px);
  margin:0 auto;
  border:1px solid rgba(184,115,51,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.985),rgba(255,255,246,.985));
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.topbar{
  height:52px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:16px;
  padding:0 28px;
  border-bottom:1px solid rgba(184,115,51,.14);
}
.datepill{
  display:inline-flex;align-items:center;gap:8px;color:#111;font-size:13px;
}
.bell{position:relative;width:34px;height:34px;display:grid;place-items:center}
.bell svg,.icon svg,.module svg{stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.bell svg{width:22px;height:22px}
.bell b{position:absolute;top:2px;right:3px;width:15px;height:15px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.floating-home{
  position:fixed;left:18px;top:18px;z-index:1000;border:1px solid rgba(184,115,51,.55);background:rgba(255,255,255,.9);
  backdrop-filter:blur(12px);color:#111;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px;box-shadow:var(--shadow-soft)
}
.view{display:none}
.view.active{display:block}
.hero{
  display:grid;
  grid-template-columns:340px minmax(0,1fr);
  gap:34px;
  align-items:start;
  padding:18px 44px 30px;
  border-bottom:1px solid rgba(184,115,51,.14);
}
.jackson-area{display:flex;justify-content:center;align-items:flex-start;min-height:300px}
.jackson{width:285px;max-height:310px;object-fit:contain;filter:drop-shadow(0 24px 22px rgba(20,16,10,.12))}
.title{margin:0;padding-top:2px;font-size:62px;line-height:1.03;font-weight:300;letter-spacing:-.065em;color:var(--black)}
.subtitle{margin:9px 0 26px;max-width:720px;font-size:17px;line-height:1.45;color:#303030}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.card{
  border:1px solid rgba(184,115,51,.68);
  border-radius:14px;
  background:rgba(255,255,255,.86);
  box-shadow:var(--shadow-soft);
}
.daily-card{
  min-height:168px;
  padding:22px 20px;
  display:grid;
  grid-template-columns:54px 1fr;
  gap:14px;
  align-items:start;
  text-align:left;
  color:var(--black);
}
.daily-card:hover,.module:hover,.action:hover{transform:translateY(-1px);box-shadow:0 18px 40px rgba(20,16,10,.07)}
.icon{width:50px;height:50px;border:1.5px solid var(--copper);border-radius:999px;display:grid;place-items:center;color:var(--copper-dark)}
.icon svg{width:25px;height:25px}
.daily-card.red .icon{border-color:var(--red);color:var(--red)}
.daily-card.teal .icon{border-color:var(--teal);color:var(--teal)}
.daily-card h3{margin:0;font-size:15px;font-weight:700;color:#111;letter-spacing:-.025em}
.num{display:block;font-size:38px;line-height:1;margin:10px 0 7px;color:#111;font-weight:300;letter-spacing:-.04em}
.num.teal{color:var(--teal)}
.daily-card small{display:block;color:#3f3f3f;line-height:1.35;font-size:13px;min-height:35px}
.link{display:inline-flex;align-items:center;gap:8px;margin-top:13px;font-size:12px;color:#111}
.section{padding:26px 42px 18px}
.section h2{font-size:22px;margin:0;color:#111;font-weight:700;letter-spacing:-.035em}
.section p{margin:5px 0 0;color:#555;font-size:13px}
.map-wrap{position:relative;min-height:430px;margin-top:12px;overflow:hidden}
.map-lines{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
.map-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr 1.28fr 1.28fr 1.38fr 1.28fr 1.28fr 1.05fr;grid-template-rows:90px 90px 90px 90px;gap:14px 18px;align-items:center}
.bubble{
  border:1.2px solid rgba(184,115,51,.68);
  background:rgba(255,255,255,.92);
  border-radius:999px;
  min-height:74px;
  box-shadow:var(--shadow-soft);
  display:grid;
  place-items:center;
  text-align:center;
  padding:13px 22px;
  position:relative;
}
.bubble label{font-size:12px;font-weight:700;color:#111;display:block}
.bubble strong{display:block;margin-top:7px;color:#090909;font-size:22px;line-height:1.05;font-weight:400;letter-spacing:-.035em}
.bubble strong.teal{color:var(--teal)} .bubble strong.red{color:var(--red)}
.info{position:absolute;right:13px;top:12px;width:16px;height:16px;border:1px solid var(--copper);border-radius:999px;color:var(--copper-dark);font-size:10px;font-weight:700;display:grid;place-items:center;background:#fff}
.b-contract{grid-column:2;grid-row:1} .b-co{grid-column:3;grid-row:1} .b-revised{grid-column:4;grid-row:1} .b-cost{grid-column:5;grid-row:1}
.b-po{grid-column:3;grid-row:2} .b-eac{grid-column:4 / span 2;grid-row:2} .b-left{grid-column:6;grid-row:2}
.b-gain{grid-column:2;grid-row:3} .b-margin{grid-column:4;grid-row:3} .b-aging{grid-column:5;grid-row:3}
.callout{border:1px solid rgba(184,115,51,.34);background:rgba(255,255,255,.9);border-radius:10px;padding:11px 13px;box-shadow:0 12px 26px rgba(20,16,10,.055);font-size:12px;line-height:1.45;color:#111}
.callout b{display:block;margin-bottom:4px;font-weight:700}
.c-revised{grid-column:1;grid-row:2} .c-left{grid-column:6;grid-row:1} .c-po{grid-column:4;grid-row:3;align-self:start} .c-aging{grid-column:6;grid-row:3}
.modules{margin:8px 30px 26px;border:1px solid rgba(184,115,51,.28);background:rgba(255,255,255,.88);border-radius:14px;box-shadow:var(--shadow-soft);padding:17px 18px 19px}
.modules h2{margin:0;color:#111;font-size:21px;font-weight:700;letter-spacing:-.035em}
.modules p{margin:4px 0 14px;color:#555;font-size:13px}
.module-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border:1px solid rgba(184,115,51,.28);border-radius:12px;background:#fff;overflow:hidden}
.module{min-height:96px;background:#fff;border:0;border-right:1px solid rgba(184,115,51,.22);display:grid;place-items:center;gap:6px;padding:11px 7px;position:relative}
.module:last-child{border-right:0}
.module svg{width:32px;height:32px;stroke:#111}
.module span{font-size:12px;color:#111;font-weight:400}
.module:hover{background:var(--ivory)}
.dot{position:absolute;width:8px;height:8px;border-radius:999px;background:var(--red);right:18px;top:18px}
.page{padding:32px 42px}
.page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:20px}
.page h1{margin:0;font-size:42px;font-weight:300;letter-spacing:-.05em}
.page .sub{margin:6px 0 0;color:#555}
.grid{display:grid;gap:16px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:18px}
.kpi span{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#555}
.kpi strong{display:block;margin-top:8px;font-size:30px;font-weight:700}
.panel{padding:20px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.action{border:1px solid rgba(184,115,51,.55);background:#fff;border-radius:999px;padding:10px 14px;font-weight:700;color:#111}
.action.primary{background:#111;color:#fff;border-color:#111}
.list{display:grid;gap:12px;margin-top:16px}
.item{padding:16px;border:1px solid rgba(184,115,51,.36);border-radius:14px;background:#fff;box-shadow:var(--shadow-soft)}
.item h3{margin:0 0 8px;font-size:18px}
.item p{margin:0;color:#444;line-height:1.45}
.badge{display:inline-flex;border:1px solid rgba(184,115,51,.4);background:#fff8ef;border-radius:999px;padding:5px 8px;font-size:12px;font-weight:700;margin-right:6px}
pre{background:#111;color:#fffdf5;border-radius:14px;padding:14px;max-height:360px;overflow:auto;white-space:pre-wrap}
.tooltip[data-rollup-tip]{cursor:help}
.tooltip[data-rollup-tip]:hover:after{content:attr(data-rollup-tip);position:absolute;z-index:9999;width:min(420px,82vw);background:#111;color:#fffdf5;border:1px solid var(--copper);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.45;white-space:pre-line;box-shadow:0 18px 40px rgba(0,0,0,.2)}
@media(max-width:1300px){
  .hero{grid-template-columns:270px 1fr} .jackson{width:235px} .title{font-size:48px} .summary{grid-template-columns:repeat(2,1fr)}
  .map-lines{display:none} .map-grid{grid-template-columns:repeat(2,1fr);grid-template-rows:auto} .bubble,.callout{grid-column:auto!important;grid-row:auto!important}
  .module-strip{grid-template-columns:repeat(5,1fr)} .grid.four{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .app{padding:6px} .shell{width:calc(100vw - 12px)} .hero{grid-template-columns:1fr;padding:18px} .jackson-area{min-height:210px} .title{font-size:38px}
  .summary,.grid.four,.grid.three{grid-template-columns:1fr} .section,.page{padding:20px 18px} .module-strip{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<button class="floating-home" id="homeBtn">← Cockpit</button>
<div class="app">
  <main class="shell">
    <div class="topbar">
      <span class="datepill" id="datePill"></span>
      <span class="bell" id="bell"></span>
    </div>

    <section id="cockpit" class="view active"></section>
    <section id="triage" class="view"></section>
    <section id="finance" class="view"></section>
    <section id="openPOReport" class="view"></section>
    <section id="agingReport" class="view"></section>
    <section id="colog" class="view"></section>
    <section id="rfilog" class="view"></section>
    <section id="audit" class="view"></section>
    <section id="procore" class="view"></section>
    <section id="manualCompare" class="view"></section>
    <section id="riskRegister" class="view"></section>
    <section id="schedule" class="view"></section>
  </main>
</div>

<script>
const JACKSON_SRC = "assets/jackson-v021-clean.png";
const API = {
  health: "/.netlify/functions/procore-health",
  mockDrawing: "/.netlify/functions/procore-mock-event",
  mockSchedule: "/.netlify/functions/procore-mock-event?kind=schedule",
  webhook: "/.netlify/functions/procore-webhook",
  events: "/.netlify/functions/ohmboy-events",
  clear: "/.netlify/functions/ohmboy-clear"
};
const STORAGE_KEY = "ohmboy_v0213_state";
const state = loadState();

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || seedState(); }
  catch(e){ return seedState(); }
}
function seedState(){
  return {
    packets: [],
    rawEvents: [],
    normalized: [],
    audit: [],
    rfi: [],
    co: [],
    financial: {
      originalContract: 24750000,
      approvedCO: 1325000,
      pendingCO: 0,
      costToDate: 11842000,
      eac: 26480000,
      openPO: 2150000,
      aging: {net30:340000, net60:420000, net90:310000, net120:220000}
    }
  };
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function $(id){ return document.getElementById(id); }
function esc(v){ return String(v ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(v){ return "$" + Math.round(Number(v||0)).toLocaleString(); }
function pct(v){ return (Number(v)>=0?"+":"") + Number(v||0).toFixed(1) + "%"; }
function icon(name){
  const I = {
    flag:'<svg viewBox="0 0 24 24"><path d="M5 21V4"/><path d="M5 5h12l-2 4 2 4H5"/></svg>',
    shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M12 8v5"/><path d="M12 17h.01"/></svg>',
    clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>',
    dollar:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M16 7.5c-1-1-2.4-1.5-4-1.5-2.2 0-4 1.1-4 2.8 0 4.2 8 1.8 8 6.4 0 1.7-1.8 2.8-4 2.8-1.7 0-3.1-.5-4.2-1.5"/></svg>',
    gauge:'<svg viewBox="0 0 24 24"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/><path d="M6 16h12"/></svg>',
    tray:'<svg viewBox="0 0 24 24"><path d="M5 4h14l2 10v5H3v-5L5 4z"/><path d="M3 14h6l2 3h2l2-3h6"/></svg>',
    cart:'<svg viewBox="0 0 24 24"><path d="M5 6h16l-2 8H7L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>',
    aging:'<svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.2 10.2"/><path d="M12 8v5h4"/><path d="M4 5v5h5"/></svg>',
    doc:'<svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>',
    rfi:'<svg viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4z"/><path d="M12 12c0-2 3-2 3-4 0-1.4-1.2-2.2-3-2.2S9 6.7 9 8"/><path d="M12 15h.01"/></svg>',
    shield2:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 4.6-3.2 7.5-8 9-4.8-1.5-8-4.4-8-9V7z"/><path d="M9.5 12.5l1.8 1.8 3.8-4"/></svg>',
    cloud:'<svg viewBox="0 0 24 24"><path d="M7 18h11a4 4 0 0 0 0-8 6 6 0 0 0-11.5-1.5A4.8 4.8 0 0 0 7 18z"/><path d="M12 12v8"/><path d="M9 17l3 3 3-3"/></svg>',
    scales:'<svg viewBox="0 0 24 24"><path d="M12 3v18"/><path d="M4 7h16"/><path d="M7 7l-3 6h6z"/><path d="M17 7l-3 6h6z"/><path d="M8 21h8"/></svg>'
  };
  return I[name] || I.doc;
}
function finance(){
  const f = state.financial;
  const revised = f.originalContract + f.approvedCO + f.pendingCO;
  const left = f.eac - f.costToDate;
  const agingTotal = f.aging.net30 + f.aging.net60 + f.aging.net90 + f.aging.net120;
  const gainFade = revised - f.eac;
  const margin = revised ? gainFade / revised * 100 : 0;
  return {...f,revised,left,agingTotal,gainFade,margin};
}
function metrics(){
  const active = state.packets.filter(p=>p.status!=="closed");
  const high = active.filter(p=>p.score>=75).length;
  const schedule = active.filter(p=>p.type==="schedule").length;
  const f = finance();
  return {top:active.length, high, schedule, margin:f.margin, bell:Math.max(1,high), f};
}
function setTopbar(){
  $("datePill").innerHTML = icon("clock") + new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}) + "⌄";
  $("bell").innerHTML = icon("shield") + `<b>${metrics().bell}</b>`;
}
function card(cls, iconName, title, number, body, view){
  return `<button class="card daily-card ${cls||""}" data-view="${esc(view)}" type="button"><span class="icon">${icon(iconName)}</span><span><h3>${esc(title)}</h3><b class="num ${cls==="tealText"?"teal":""}">${number}</b><small>${esc(body)}</small><span class="link">View Details →</span></span></button>`;
}
function bubble(cls,label,value,valCls,tip){
  return `<div class="bubble tooltip ${cls}" data-rollup-tip="${esc(tip||"")}"><i class="info">i</i><label>${esc(label)}</label><strong class="${valCls||""}">${value}</strong></div>`;
}
function financialMap(){
  const f = finance();
  return `<section class="section"><h2>Financial Source Map</h2><p>High-level financial rollups and relationships</p>
  <div class="map-wrap" id="financialSourceMap">
    <svg class="map-lines" viewBox="0 0 1400 430" preserveAspectRatio="none" aria-hidden="true">
      <path d="M340 80 H520 H710 H880" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2"/>
      <path d="M710 80 V170 H895" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2"/>
      <path d="M520 80 V170 H640 H710" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2"/>
      <path d="M895 170 H1055" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2"/>
      <path d="M790 170 V270 H700" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2"/>
      <path d="M700 270 H520 H340" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2"/>
      <path d="M895 270 H1050" fill="none" stroke="rgba(184,115,51,.58)" stroke-width="2" stroke-dasharray="6 6"/>
    </svg>
    <div class="map-grid">
      <div class="callout c-revised"><b>Revised Contract Value</b>• Base Contract<br>• Approved Change Orders<br>= ${money(f.originalContract)} + ${money(f.approvedCO)}<br>= ${money(f.revised)}</div>
      ${bubble("b-contract","Contract Value",money(f.originalContract),"","Current Contract = Original Contract + Approved COs")}
      ${bubble("b-co","Open Change Orders",money(f.approvedCO + f.pendingCO),"","Open Change Orders = Approved COs + Pending CO Forecast")}
      ${bubble("b-revised","Revised Contract Value",money(f.revised),"","Revised Contract Value = Contract Value + Open Change Orders")}
      ${bubble("b-cost","Cost to Date",money(f.costToDate),"","Cost to Date = Posted labor + material + subcontract + equipment + other cost")}
      <div class="callout c-left"><b>Left to Spend</b>= EAC - Cost to Date<br>= ${money(f.eac)} - ${money(f.costToDate)}<br>= ${money(f.left)}</div>
      ${bubble("b-po","Open PO Exposure",money(f.openPO),"","Open PO Exposure = Σ(Open PO remaining + pending buyout exposure)")}
      ${bubble("b-eac","EAC",money(f.eac),"","EAC = Cost to Date + Forecast to Complete + PO/Risk pressure")}
      ${bubble("b-left","Left to Spend",money(f.left),"","Left to Spend = EAC - Cost to Date")}
      ${bubble("b-gain","Gain / Fade",money(f.gainFade),"teal","Gain/Fade = Revised Contract Value - EAC")}
      ${bubble("b-margin","Margin",pct(f.margin),"teal","Margin % = Gain/Fade ÷ Revised Contract Value")}
      ${bubble("b-aging","Aging Exposure",money(f.agingTotal),"red","Aging Exposure = NET 30 + NET 60 + NET 90 + NET 120+")}
      <div class="callout c-po"><b>Open PO Exposure</b>rolls into Left to Spend<br>and EAC.</div>
      <div class="callout c-aging"><b>Aging Exposure</b>= NET 30 + NET 60<br>+ NET 90 + NET 120<br>= ${money(f.aging.net30)} + ${money(f.aging.net60)} + ${money(f.aging.net90)} + ${money(f.aging.net120)}<br>= ${money(f.agingTotal)}</div>
    </div>
  </div></section>`;
}
function module(label, iconName, view, dot){
  return `<button class="module" data-view="${esc(view)}" type="button">${dot?'<i class="dot"></i>':""}${icon(iconName)}<span>${esc(label)}</span></button>`;
}
function moduleStrip(){
  return `<section class="modules"><h2>Command Modules</h2><p>Execute, analyze, and stay ahead.</p><div class="module-strip">
  ${module("Cockpit","gauge","cockpit")}
  ${module("Packet Triage","tray","triage",true)}
  ${module("Financial Command","dollar","finance")}
  ${module("Open PO Report","cart","openPOReport")}
  ${module("Aging Report","aging","agingReport")}
  ${module("Change Order Log","doc","colog")}
  ${module("RFI Log","rfi","rfilog")}
  ${module("Audit Trail","shield2","audit")}
  ${module("API Intake Monitor","cloud","procore")}
  ${module("Manual Compare","scales","manualCompare")}
  </div></section>`;
}
function renderCockpit(){
  const m = metrics();
  $("cockpit").innerHTML = `<section class="hero"><div class="jackson-area"><img class="jackson" src="${JACKSON_SRC}" alt="Jackson, OhmBoy mascot"></div>
  <div><h1 class="title">OhmBoy PM Daily Update</h1><p class="subtitle">Your daily command center for proactive project control.</p>
  <div class="summary">
    ${card("","flag","Top Priorities",String(m.top),"Action items require your attention","triage")}
    ${card("red","shield","High-Risk Items",String(m.high),"Items need immediate mitigation","riskRegister")}
    ${card("teal","clock","Key Schedule Impacts",String(m.schedule),"Potential delays identified","schedule")}
    ${card("tealText","dollar","Financial Status",pct(m.margin),"Projected margin at completion","finance")}
  </div></div></section>${financialMap()}${moduleStrip()}`;
}
function renderPage(id,title,sub,body){
  $(id).innerHTML = `<div class="page"><div class="page-head"><div><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div></div>${body}</div>`;
}
function packetItem(p,i){
  return `<div class="item"><span class="badge">Score ${p.score}</span><span class="badge">${esc(p.type)}</span><h3>#${i+1} — ${esc(p.title)}</h3><p>${esc(p.summary)}</p></div>`;
}
function renderAll(){
  setTopbar();
  renderCockpit();
  const active = state.packets.filter(p=>p.status!=="closed");
  renderPage("triage","Packet Triage","Highest priority packets first.",`<div class="list">${active.length?active.sort((a,b)=>b.score-a.score).map(packetItem).join(""):'<div class="item"><h3>No packets yet</h3><p>Run a drawing or schedule REV simulation from API Intake Monitor.</p></div>'}</div>`);
  const f = finance();
  renderPage("finance","Financial Command","High-level commercial control.",`<div class="grid four"><div class="card kpi"><span>Revised Contract</span><strong>${money(f.revised)}</strong></div><div class="card kpi"><span>EAC</span><strong>${money(f.eac)}</strong></div><div class="card kpi"><span>Left To Spend</span><strong>${money(f.left)}</strong></div><div class="card kpi"><span>Margin</span><strong>${pct(f.margin)}</strong></div></div>${financialMap()}`);
  renderPage("openPOReport","Open PO Report","Open commitment exposure and buyout pressure.",`<div class="grid four"><div class="card kpi"><span>Open PO Exposure</span><strong>${money(f.openPO)}</strong></div><div class="card kpi"><span>Pending Buyout</span><strong>${money(390000)}</strong></div><div class="card kpi"><span>Vendor Risk</span><strong>${money(126000)}</strong></div><div class="card kpi"><span>Procurement Gap</span><strong>${money(516000)}</strong></div></div>`);
  renderPage("agingReport","Aging Report","A/R aging and cash exposure.",`<div class="grid four"><div class="card kpi"><span>NET 30</span><strong>${money(f.aging.net30)}</strong></div><div class="card kpi"><span>NET 60</span><strong>${money(f.aging.net60)}</strong></div><div class="card kpi"><span>NET 90</span><strong>${money(f.aging.net90)}</strong></div><div class="card kpi"><span>NET 120+</span><strong>${money(f.aging.net120)}</strong></div></div>`);
  renderPage("colog","Change Order Log","CO candidates, submitted changes, and approved relief.",`<div class="list">${state.co.length?state.co.map((c,i)=>`<div class="item"><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p></div>`).join(""):'<div class="item"><h3>No CO log entries yet</h3><p>Drawing REV simulations can create CO exposure candidates.</p></div>'}</div>`);
  renderPage("rfilog","RFI Log","Questions, clarifications, and document conflicts.",`<div class="list">${state.rfi.length?state.rfi.map((r,i)=>`<div class="item"><h3>${esc(r.title)}</h3><p>${esc(r.summary)}</p></div>`).join(""):'<div class="item"><h3>No RFIs yet</h3><p>Packet triage can promote conflicts into RFIs.</p></div>'}</div>`);
  renderPage("audit","Audit Trail","Trace of simulated REV intake and packet creation.",`<div class="list">${state.audit.length?state.audit.slice().reverse().map(a=>`<div class="item"><span class="badge">${esc(a.type)}</span><h3>${esc(a.title)}</h3><p>${esc(a.time)} — ${esc(a.summary)}</p></div>`).join(""):'<div class="item"><h3>No audit entries yet</h3><p>Run a simulation to start the trail.</p></div>'}</div>`);
  renderPage("riskRegister","Risk Register","High-risk items and weighted exposure.",`<div class="grid three"><div class="card kpi"><span>High Risk Items</span><strong>${metrics().high}</strong></div><div class="card kpi"><span>Money at Risk</span><strong>${money(state.packets.reduce((s,p)=>s+(p.moneyAtRisk||0),0))}</strong></div><div class="card kpi"><span>Open Packets</span><strong>${metrics().top}</strong></div></div>`);
  renderPage("schedule","Schedule Impacts","Critical path and sequencing exposures.",`<div class="grid three"><div class="card kpi"><span>Schedule Packets</span><strong>${metrics().schedule}</strong></div><div class="card kpi"><span>Potential Delay</span><strong>${metrics().schedule*5}d</strong></div><div class="card kpi"><span>Mode</span><strong>Review</strong></div></div>`);
  renderPage("manualCompare","Manual Compare","Upload/compare flow placeholder.",`<div class="item"><h3>Manual Compare Ready</h3><p>This module is reserved for drawing/schedule diff ingestion.</p></div>`);
  renderProcore();
}
function renderProcore(){
  $("procore").innerHTML = `<div class="page"><div class="page-head"><div><h1>API Intake Monitor</h1><p class="sub">Simulate drawing and schedule revisions through the Procore-style intake path.</p></div></div>
  <div class="card panel"><h2>Controls</h2><div class="actions"><button class="action primary" id="healthBtn">Backend Health</button><button class="action" id="simDrawingBtn">Sim Drawing REV</button><button class="action" id="simScheduleBtn">Sim Schedule REV</button><button class="action" id="clearBtn">Clear Local State</button></div><pre id="apiOutput">Ready.</pre></div>
  <div class="list">${state.rawEvents.slice().reverse().map(e=>`<div class="item"><span class="badge">${esc(e.eventType||e.type)}</span><h3>${esc(e.title||'Inbound Event')}</h3><p>${esc(e.summary||'Stored in local OhmBoy event queue.')}</p></div>`).join("")}</div></div>`;
  $("healthBtn").onclick = checkHealth;
  $("simDrawingBtn").onclick = () => simRev("drawing");
  $("simScheduleBtn").onclick = () => simRev("schedule");
  $("clearBtn").onclick = () => { localStorage.removeItem(STORAGE_KEY); location.reload(); };
}
function addAudit(type,title,summary){ state.audit.push({type,title,summary,time:new Date().toLocaleString()}); }
async function checkHealth(){
  const out = $("apiOutput");
  out.textContent = "Checking...";
  try{ const r = await fetch(API.health); const j = await r.json(); out.textContent = JSON.stringify(j,null,2); }
  catch(e){ out.textContent = JSON.stringify({ok:false,error:e.message},null,2); }
}
async function simRev(kind){
  const out = $("apiOutput");
  out.textContent = "Simulating " + kind + " REV...";
  let raw = null;
  try{ const r = await fetch(kind==="schedule"?API.mockSchedule:API.mockDrawing); raw = await r.json(); }
  catch(e){ raw = null; }
  const isSchedule = kind==="schedule";
  const title = isSchedule ? "Procore Schedule Update: Mission Critical Baseline Schedule" : "Procore Drawing REV: E6.0 — One-Line / Gear Schedule";
  const packet = {
    id: "PKT-" + Date.now(),
    type: isSchedule ? "schedule" : "drawing",
    title,
    summary: isSchedule ? "Energize MSB-1 shifted by five days. Startup sequence and L2 QA/QC walkdown need review." : "REV-04 detected from Procore. Review for scope, procurement, schedule, and CO exposure.",
    score: isSchedule ? 91 : 100,
    moneyAtRisk: isSchedule ? 30000 : 42000,
    status: "open",
    raw
  };
  state.packets.push(packet);
  state.rawEvents.push({eventType:isSchedule?"schedule.update.created":"drawing.revision.created",title,summary:packet.summary,raw});
  state.normalized.push(packet);
  if(!isSchedule){
    state.co.push({title:"CO Candidate — " + title, summary:"Drawing revision may carry scope/procurement exposure."});
    state.rfi.push({title:"RFI Candidate — " + title, summary:"Confirm scope, gear schedule, routing, and procurement impact."});
  }
  addAudit(isSchedule?"Schedule REV":"Drawing REV", title, packet.summary);
  save();
  out.textContent = JSON.stringify({ok:true,packet,raw},null,2);
  renderAll();
}
function navigate(view){
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const el = $(view) || $("cockpit");
  el.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-view]");
  if(nav){ navigate(nav.dataset.view); }
});
$("homeBtn").onclick = () => navigate("cockpit");
renderAll();
</script>
</body>
</html>
