      </div>
      <table class="log-table" style="margin-top:12px"><thead><tr><th>Type</th><th>Record</th><th>Filed under</th><th>Why</th><th>Place by hand</th></tr></thead>
      <tbody>${rows.join("") || `<tr><td colspan="5">${LINKVIEW.onlyUnfiled ? "Nothing unfiled in this view." : "No records yet."}</td></tr>`}</tbody></table>
      ${matching > shown ? `<p class="sub">Showing ${shown} of ${matching}.</p>` : ""}
    </div>`);
}

/* ===========================================================================
   Phase codes — the structure shared by the cost report and the WBS workbook
   ---------------------------------------------------------------------------
   A phase code is a cost-type letter plus seven digits. For labor the digits
   read  AA BB CCC  — area, sub-area, task (L0305161 = area 03, sub-area 05,
   task 161). The project map is built from that: AA becomes an area, BB a
   system inside it. Names come from the descriptions themselves
   ("R1 ER Tray RI" → area R1, system ER). Nothing is invented; anything that
   cannot be named from the lines is labelled with its code so it can be
   renamed by hand.

   The same reading also finds lines that look mis-keyed: a description that
   names one area or sub-area while the code sits in another's block.
   =========================================================================== */

const WBS_TYPES = { L:"Labor", M:"Material", S:"Subcontracts", E:"Equipment", O:"Other Direct", A:"Allowances" };
const WBS_TYPE_ORDER = ["L","M","S","E","O","A"];
/* Abbreviations that are safe to spell out. GY is confirmed by the reports'
   own "Gen Yd" lines; ER, DH and ZN are standard. Anything not listed here
   (MG, SEC, 98 …) is left exactly as written. */
const WBS_EXPAND = { GY:"Generator Yard", GEN:"Generator Yard", ER:"Electrical Room", DH:"Data Hall", ADM:"Admin", ZN:"Zone", "T&M/CHANGE":"T&M / Change Orders", "99":"Site 99" };
const WBS_KEYWORDS = { GY:["GY","Gen Yard","Gen Yd"], GEN:["GY","Gen Yard","Gen Yd"], ER:["ER"], DH:["DH"], ADM:["ADM"], "99":["Site"] };

function wbsTypeName(t){ return WBS_TYPES[t] || ("Cost type " + t); }
function wbsTok(s){ return String(s || "").trim().split(/\s+/).filter(Boolean); }
function wbsExpandName(tokens){ return tokens.map(t => WBS_EXPAND[t.toUpperCase()] || t).join(" "); }
function signed(n, fmt){ return (n >= 0 ? "+" : "−") + fmt(Math.abs(n)); }
function hrs0(v){ return Math.round(Number(v) || 0).toLocaleString(); }
function phaseParts(code){
  const m = /^([A-Z])(\d{2})(\d{2})(\d{3})$/.exec(String(code || "").toUpperCase());
  return m ? { aa:m[2], bb:m[3] } : { aa:"", bb:"" };
}

/* The cost report is the system of record for codes, so it is the source for
   the map when it is loaded; the WBS workbook otherwise. */
function phaseSource(){
  if((state.cr.lines || []).length) return { lines:state.cr.lines, label:"cost report", file:state.cr.fileName, view:"costReport" };
  if((state.wbs.lines || []).length) return { lines:state.wbs.lines, label:"WBS workbook", file:state.wbs.fileName, view:"wbs" };
  return null;
}

/* Labor lines grouped by area digits, the word each area's descriptions start
   with ("R1", "99"), and which area owns each such word. */
function phaseTokens(lines){
  const groups = new Map();
  lines.forEach(l => { if(l.type === "L" && l.aa){ if(!groups.has(l.aa)) groups.set(l.aa, []); groups.get(l.aa).push(l); } });
  const token = {}, owner = {};
  groups.forEach((list, aa) => {
    const cnt = {}, shown = {};
    list.forEach(l => { const t = wbsTok(l.description)[0]; if(t){ const T = t.toUpperCase(); cnt[T] = (cnt[T] || 0) + 1; shown[T] = shown[T] || t; } });
    const top = Object.entries(cnt).sort((a,b) => b[1] - a[1])[0];
    if(top && top[1] / list.length >= 0.6) token[aa] = shown[top[0]];
  });
  // Two blocks can start with the same word when one of them is a typo
  // (R6 keyed as area 19 as well as 10). The bigger block owns the word.
  Object.keys(token).forEach(aa => {
    const T = token[aa].toUpperCase();
    if(!owner[T] || groups.get(aa).length > groups.get(owner[T]).length) owner[T] = aa;
  });
  return { groups, token, owner };
}

function phasePlan(lines){
  if(!lines || !lines.length) return null;
  const { groups, token, owner } = phaseTokens(lines);
  const areas = [], strays = [], attach = [];

  /* 1. a description that starts with another area's word */
  lines.forEach(l => {
    if(l.type !== "L" || !l.aa) return;
    const first = wbsTok(l.description)[0] || "", home = owner[first.toUpperCase()];
    if(!home || home === l.aa) return;
    const mine = token[l.aa] && owner[token[l.aa].toUpperCase()] === l.aa ? token[l.aa] : "area " + l.aa + " (no other lines)";
    strays.push({ line:l, says:first, codedTo:mine, suggest:l.code.slice(0,1) + home + l.code.slice(3), level:"area" });
  });

  groups.forEach((list, aa) => {
    const aTok = token[aa] || "";
    const subs = new Map();
    list.forEach(l => { if(!subs.has(l.bb)) subs.set(l.bb, []); subs.get(l.bb).push(l); });
    if(aTok && owner[aTok.toUpperCase()] !== aa){
      // A stray block: its lines belong, by description, to another area. No
      // node of its own — its codes are attached to the owner's matching system.
      subs.forEach((ls, bb) => attach.push({ code:list[0].code.charAt(0) + aa + bb, toAA:owner[aTok.toUpperCase()], bb, n:ls.length }));
      return;
    }
    const area = { aa, token:aTok, generic:!aTok, name: aTok ? wbsExpandName([aTok]) : (aa === "00" ? "Project-Wide Labor" : "Labor " + aa),
                   code:list[0].code.charAt(0) + aa, keywords: aTok ? (WBS_KEYWORDS[aTok.toUpperCase()] || []).slice() : [], n:list.length, hours:sumOf(list,"hoursProj"), systems:[] };
    const rem = (l) => { const t = wbsTok(l.description); return aTok && t[0] && t[0].toUpperCase() === aTok.toUpperCase() ? t.slice(1) : t; };

    /* What each sub-area's lines have in common: leading words ("ER …"),
       trailing words ("… ZN 1"), or just a dominant first word. */
    const named = [];
    subs.forEach((ls, bb) => {
      const toks = ls.map(rem), firsts = toks.map(t => (t[0] || "").toUpperCase());
      const sys = { bb, code:area.code + bb, n:ls.length, hours:sumOf(ls,"hoursProj"), name:"", full:"", lead:[], tail:[], keywords:[], lines:ls, toks, p:0, s:0, top:"", gy:firsts.includes("GY") };
      if(ls.length > 1){
        let p = 0; while(toks.every(t => t[p] !== undefined && t[p].toUpperCase() === toks[0][p].toUpperCase())) p++;
        let sfx = 0; while(toks.every(t => t.length - 1 - sfx >= p && t[t.length-1-sfx].toUpperCase() === toks[0][toks[0].length-1-sfx].toUpperCase())) sfx++;
        const cnt = {}; firsts.forEach(f => { if(f) cnt[f] = (cnt[f] || 0) + 1; });
        const top = Object.entries(cnt).sort((x,y) => y[1] - x[1])[0];
        sys.p = p; sys.s = sfx; sys.top = top && top[1] / ls.length >= 0.55 ? top[0] : "";
      }
      named.push(sys);
    });

    /* A shared ending is only as long as the shortest one in the area:
       "Fiber Duct Bank ZN 3" and "MV Duct Bank ZN 3" share four words, but the
       area's pattern is the two-word zone tag. Its leading word ("ZN") is what
       marks a line as carrying that kind of tag at all. */
    const clean = named.filter(s => !s.gy && s.n > 1 && s.p === 0 && s.s > 0);
    let suffixLen = clean.length ? Math.min(...clean.map(s => s.s)) : 0;
    if(suffixLen < 2) suffixLen = 0;                 // one shared last word ("… Inst") is not a tag
    const tailKey = suffixLen ? clean[0].toks[0].slice(-suffixLen, -1).join(" ").toUpperCase() : "";
    const tailOf = (t) => (suffixLen && t.length > suffixLen && t.slice(-suffixLen, -1).join(" ").toUpperCase() === tailKey) ? t.slice(-suffixLen) : null;

    const byLead = (sys, t0) => {
      sys.name = wbsExpandName([t0]); sys.lead = [t0];
      sys.keywords = WBS_EXPAND[t0.toUpperCase()] ? (WBS_KEYWORDS[t0.toUpperCase()] || [t0]).slice() : [];
      // a fuller name, used only if two sub-areas would otherwise share one
      if(sys.p > 1) sys.full = wbsExpandName(sys.toks[0].slice(0, sys.p));
      else {
        const c2 = {}; sys.toks.forEach(t => { if((t[0] || "").toUpperCase() === t0.toUpperCase() && t[1]) c2[t[1]] = (c2[t[1]] || 0) + 1; });
        const second = Object.entries(c2).sort((x,y) => y[1] - x[1])[0];
        sys.full = wbsExpandName(second ? [t0, second[0]] : [t0]);
      }
    };
    const byTail = (sys, tail) => { sys.name = sys.full = wbsExpandName(tail); sys.tail = tail; sys.keywords = [tail.join(" ")]; };
    named.forEach(sys => {
      const t = sys.toks[0] || [];
      if(sys.gy){ byLead(sys, "GY"); return; }
      if(sys.n > 1 && sys.p > 0){ byLead(sys, t[0]); return; }
      if(suffixLen){
        // the tag most of this sub-area's lines carry; on a tie, the first line's
        const cnt = new Map();
        sys.toks.forEach(x => { const tl = tailOf(x); if(tl){ const k = tl.join(" ").toUpperCase(); cnt.set(k, { n:((cnt.get(k) || {}).n || 0) + 1, tail:(cnt.get(k) || {}).tail || tl }); } });
        const best = [...cnt.values()].sort((x,y) => y.n - x.n)[0];
        if(best && best.n / sys.n >= 0.5){ byTail(sys, best.tail); return; }
      }
      if(sys.n > 1 && sys.top){ byLead(sys, sys.toks.find(x => (x[0] || "").toUpperCase() === sys.top)[0]); return; }
      if(sys.n === 1) sys.name = sys.full = t.join(" ");
    });

    const unnamed = named.filter(s => !s.name);
    const allSingles = named.length > 3 && named.every(s => s.n === 1);
    if(allSingles || unnamed.length === named.length){
      area.leaf = true;                               // nothing to split it by — one node holding all its lines
    } else {
      unnamed.forEach(s => { s.name = s.full = s.bb === "00" ? "General" : area.name + " " + s.bb; s.generic = true; });
      const count = (k) => named.filter(s => s.name.toLowerCase() === k).length;
      named.filter(s => count(s.name.toLowerCase()) > 1).forEach(s => { s.name = s.full || s.name; });
      const used = {};
      named.forEach(s => { const k = s.name.toLowerCase(); if(used[k]) s.name += " " + s.bb; used[k] = 1; });

      /* 2. a description that carries a sibling sub-area's word or tag */
      named.forEach(sys => sys.lines.forEach((l, i) => {
        const t = sys.toks[i];
        let sib = null;
        if(sys.tail.length){ const tl = tailOf(t); if(tl && tl.join(" ").toUpperCase() !== sys.tail.join(" ").toUpperCase()) sib = named.find(o => o !== sys && o.tail.length && o.tail.join(" ").toUpperCase() === tl.join(" ").toUpperCase()); }
        else if(sys.lead.length && t[0] && t[0].toUpperCase() !== sys.lead[0].toUpperCase()) sib = named.find(o => o !== sys && o.lead.length && o.lead[0].toUpperCase() === t[0].toUpperCase());
        if(sib) strays.push({ line:l, says:sib.name, codedTo:sys.name, suggest:sib.code + l.code.slice(5), level:"system" });
      }));
      area.systems = named;
    }
    named.forEach(s => { delete s.lines; delete s.toks; delete s.p; delete s.s; delete s.top; delete s.gy; });
    areas.push(area);
  });

  /* The same sub-area code means the same place in every area that has it.
     Where most areas agree on a name, the stragglers take it. */
  const byBB = {};
  areas.forEach(a => a.systems.forEach(s => { (byBB[s.bb] = byBB[s.bb] || []).push(s); }));
  Object.values(byBB).forEach(list => {
    if(list.length < 3) return;
    const cnt = {}; list.forEach(s => { cnt[s.name] = (cnt[s.name] || 0) + 1; });
    const top = Object.entries(cnt).sort((a,b) => b[1] - a[1])[0];
    if(top[1] / list.length < 0.6) return;
    const model = list.find(s => s.name === top[0]);
    list.forEach(s => { if(s.name !== top[0]){ s.name = top[0]; s.keywords = model.keywords.slice(); s.lead = s.lead.length ? s.lead : model.lead.slice(); } });
  });

  /* Is the slip in the code or in the description? If the code the description
     points at is already another line, or two flagged lines point at the same
     code, the description is the likelier slip. */
  const codeSet = new Set(lines.map(l => l.code)), wanted = {};
  strays.forEach(s => { wanted[s.suggest] = (wanted[s.suggest] || 0) + 1; });
  strays.forEach(s => { s.taken = codeSet.has(s.suggest); s.shared = wanted[s.suggest] > 1; });

  /* Everything that is not labor is a job-wide bucket by cost type. */
  const other = WBS_TYPE_ORDER.filter(t => t !== "L" && lines.some(l => l.type === t))
    .concat([...new Set(lines.map(l => l.type))].filter(t => !WBS_TYPE_ORDER.includes(t)))
    .map(t => ({ type:t, name:wbsTypeName(t), codes:t === "O" ? ["D","O"] : [t], n:lines.filter(l => l.type === t).length, cost:sumOf(lines.filter(l => l.type === t),"costProj") }));
  return { areas, other, strays, attach, looseLabor:lines.filter(l => l.type === "L" && !l.aa).length,
           nSystems:areas.reduce((s,a) => s + a.systems.length, 0) + other.length };
}

function findNodeByCode(code, parent){
  const k = String(code).toUpperCase();
  return mapNodes().find(n => (n.parent || null) === (parent || null) && (n.codes || []).some(c => String(c).toUpperCase() === k)) || null;
}

function applyPhasePlan(){
  const src = phaseSource();
  const plan = src ? phasePlan(src.lines) : null;
  if(!plan){ toast("Load the cost report or the WBS + Cost workbook first.","bad"); return; }
  const nA = plan.areas.length + (plan.other.length ? 1 : 0);
  if(!confirmAction(`Build the project map from the ${src.label}?\n\n${plural(nA,"area")} and ${plural(plan.nSystems,"system")}, each tied to its phase-code prefix so budget and cost lines file themselves. Nodes that already exist are kept, and nothing is deleted.`)) return;
  let added = 0;
  const addKeys = (node, keys) => { const have = new Set((node.keywords || []).map(k => k.toLowerCase())); keys.forEach(k => { if(!have.has(k.toLowerCase())) node.keywords.push(k); }); };
  const ensure = (name, parent, code, extra) => {
    let n = findNodeByCode(code, parent) || findNodeByName(name, parent);
    if(!n){ n = newNode(name, parent, extra); state.map.nodes.push(n); added++; }
    n.codes = n.codes || [];
    if(!n.codes.some(c => c.toUpperCase() === code.toUpperCase())) n.codes.push(code);
    return n;
  };
  const areaNode = {};
  plan.areas.forEach(a => {
    const area = ensure(a.name, null, a.code, { keywords:a.keywords.slice(), noNameMatch:a.generic ? true : undefined });
    addKeys(area, a.keywords);
    area.strip = { lead:a.token ? [a.token] : [], tail:[] };
    areaNode[a.aa] = area;
    a.systems.forEach(s => {
      const sys = ensure(s.name, area.id, s.code, { keywords:s.keywords.slice(), noNameMatch:s.generic ? true : undefined });
      addKeys(sys, s.keywords);
      sys.strip = { lead:(a.token ? [a.token] : []).concat(s.lead), tail:s.tail.slice() };
    });
  });
  // codes from a mis-keyed block go to the node their descriptions point at
  plan.attach.forEach(x => {
    const area = areaNode[x.toAA];
    if(!area) return;
    const target = findNodeByCode(area.codes[0] + x.bb, area.id) || area;
    target.codes = target.codes || [];
    if(!target.codes.some(c => c.toUpperCase() === x.code.toUpperCase())) target.codes.push(x.code);
  });
  if(plan.other.length){
    let job = findNodeByName("Job-Wide Costs", null);
    if(!job){ job = newNode("Job-Wide Costs", null, { noNameMatch:true }); state.map.nodes.push(job); added++; }
    plan.other.forEach(o => { const n = ensure(o.name, job.id, o.codes[0], { noNameMatch:true }); o.codes.slice(1).forEach(c => { if(!n.codes.includes(c)) n.codes.push(c); }); });
  }
  mapTouch();
  addAudit("Project Map","Map Built From Phase Codes", `${src.file || src.label} — ${plural(nA,"area")}, ${plural(plan.nSystems,"system")}; ${added} new node(s).`);
  save(); renderAll(); navigate("oneLine");
  toast(`Map built from the ${src.label}: ${added} node(s) added.`);
}

/* A phase-code description with its node's area/system words taken off:
   "R1 ER Tray RI" under R1 › Electrical Room reads "Tray RI". */
function wbsShort(l, node){
  let t = wbsTok(l.description);
  const strip = (node && node.strip) || null;
  if(strip){
    const lead = (strip.lead || []).map(x => x.toUpperCase()), tail = (strip.tail || []).map(x => x.toUpperCase());
    while(t.length > 1 && lead.includes(t[0].toUpperCase())) t = t.slice(1);
    if(tail.length && t.length > tail.length && t.slice(-tail.length).map(x => x.toUpperCase()).join(" ") === tail.join(" ")) t = t.slice(0, -tail.length);
  }
  return t.join(" ") || l.description || l.code || "(uncoded line)";
}

/* One "Confirm" block listing lines whose description and code disagree. */
function phaseStraysHtml(strays){
  if(!strays.length) return "";
  return `<div class="li"><span class="lvl High">Confirm</span><b>${plural(strays.length,"line")} described as one place but coded to another.</b> Hours and cost charged to these codes post where the code belongs, not where the description says.
    <table class="log-table" style="margin-top:8px"><thead><tr><th>Phase code</th><th>Description</th><th>Code sits in</th><th>Description says</th><th>Likely fix</th></tr></thead><tbody>
    ${strays.slice(0,30).map(s => `<tr><td>${esc(s.line.code)}</td><td>${esc(s.line.description)}</td><td>${esc(s.codedTo)}</td><td>${esc(s.says)}</td><td>${s.taken ? `the description — ${esc(s.suggest)} is already its own line` : (s.shared ? `${esc(s.suggest)}, but more than one line points there — one may be a description slip` : esc(s.suggest))}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ===========================================================================
   WBS + Cost — the estimating / projection workbook
   ---------------------------------------------------------------------------
   Reads the workbook's "WBS + Cost" tab: one row per phase code with hours and
   dollars, each as Initial Projection and Original Estimate. Lines file under
   project-map nodes by phase-code prefix (see 24-phase.js).

   The cost report is the booked version of the same budget. When both are
   loaded the cost report drives the node figures and this workbook is the
   cross-check; on its own, this workbook drives them.
   =========================================================================== */

/* Find the header row and the columns. The real sheet has a two-row header:
   "HOURS" over "Initial Projection | Original Estimate", and the same for
   dollars. A simple one-row sheet with single Hours / Cost columns also reads. */
function wbsFindLayout(rows){
  for(let r = 0; r < Math.min(rows.length, 60); r++){
    const norm = (rows[r] || []).map(c => String(c ?? "").toLowerCase().replace(/[^a-z0-9]/g,""));
    const code = norm.findIndex(c => c === "phasecode" || c === "costcode" || c === "phase" || c === "code" || c === "wbscode" || c === "wbs");
    const desc = norm.findIndex(c => c.startsWith("description") || c === "desc");
    if(code < 0 || desc < 0) continue;
    const find = (re) => norm.findIndex(c => re.test(c));
    const sub = (rows[r+1] || []).map(c => String(c ?? "").toLowerCase());
    const pair = (col) => {
      if(col < 0) return { proj:-1, est:-1, two:false };
      const a = sub[col] || "", b = sub[col+1] || "", lab = /proj|est|orig|init|curr|budget/;
      if(lab.test(a) && lab.test(b)){
        const aIsEst = /est|orig/.test(a) && !/proj/.test(a);
        return aIsEst ? { est:col, proj:col+1, two:true } : { proj:col, est:col+1, two:true };
      }
      return { proj:col, est:-1, two:false };
    };
    const H = pair(find(/^(hours|hrs|laborhours|manhours)/)), C = pair(find(/^(dollarvalue|dollars|cost|amount|value|budget)/));
    if(C.proj < 0 && H.proj < 0) continue;
    return { header:r, dataStart:r + ((H.two || C.two) ? 2 : 1), code, desc, type:code > 0 ? code - 1 : -1, H, C, rate:find(/^rates?/), note:find(/^(comments?|notes?)/) };
  }
  return null;
}

function parseWbs(sheets){
  const isCode = (v) => /^[A-Za-z]\d{3,}$/.test(String(v ?? "").trim());
  let best = null;
  for(const sh of sheets){
    const L = wbsFindLayout(sh.rows);
    if(!L) continue;
    let coded = 0;
    for(let r = L.dataStart; r < sh.rows.length; r++) if(isCode((sh.rows[r] || [])[L.code])) coded++;
    if(coded && (!best || coded > best.coded)) best = { sh, L, coded };
  }
  if(!best) throw new Error("Couldn't find a tab with Phase Code and Description columns and coded rows under them.");
  const { sh, L } = best, cell = (row, i) => i >= 0 ? (row[i] ?? "") : "";

  const raw = [];
  let sheetTotal = null;
  for(let r = L.dataStart; r < sh.rows.length; r++){
    const row = sh.rows[r] || [];
    const code = String(cell(row, L.code)).trim(), desc = String(cell(row, L.desc)).trim(), tcell = String(cell(row, L.type)).trim();
    const hp = SHEET.num(cell(row, L.H.proj)), he = L.H.est >= 0 ? SHEET.num(cell(row, L.H.est)) : hp;
    const cp = SHEET.num(cell(row, L.C.proj)), ce = L.C.est >= 0 ? SHEET.num(cell(row, L.C.est)) : cp;
    if(!isCode(code) && /^(grand\s+)?totals?$/i.test(desc)){ sheetTotal = { costProj:cp, costEst:ce }; continue; }
    const hasCode = isCode(code);
    let type = /^[A-Za-z]$/.test(tcell) ? tcell.toUpperCase() : (hasCode ? code.charAt(0).toUpperCase() : "");
    if(type === "D") type = "O";                       // "Other" lines carry D codes
    if(!type) continue;                                // label rows, notes, blank rows
    if(!hasCode && !hp && !he && !cp && !ce) continue; // empty filler rows inside a block
    const C = hasCode ? code.toUpperCase() : "";
    const m = /^([A-Z])(\d{2})(\d{2})(\d{3})$/.exec(C);
    raw.push({ type, code:C, description:desc, hoursProj:hp, hoursEst:he, costProj:cp, costEst:ce,
               rate: L.rate >= 0 ? SHEET.num(cell(row, L.rate)) : 0, note: String(cell(row, L.note)).trim(),
               aa: m ? m[2] : "", bb: m ? m[3] : "" });
  }

  /* The last uncoded row in a cost-type block is its subtotal. It is kept out
     of the lines (or every total would double) and kept aside as a check. */
  const subtotals = {}, lastOfType = {};
  raw.forEach((l, i) => { lastOfType[l.type] = i; });
  const drop = new Set();
  for(const t of Object.keys(lastOfType)){
    const i = lastOfType[t], last = raw[i];
    if(last.code) continue;
    const rest = raw.filter((l, j) => l.type === t && j !== i);
    const uncoded = rest.filter(l => !l.code).length, s = sumOf(rest, "costProj");
    if(rest.length && (Math.abs(s - last.costProj) <= Math.max(1, Math.abs(s) * 1e-9) || !uncoded)){
      subtotals[t] = { hoursProj:last.hoursProj, hoursEst:last.hoursEst, costProj:last.costProj, costEst:last.costEst };
      drop.add(i);
    }
  }
  const seen = {}, lines = [];
  raw.forEach((l, i) => {
    if(drop.has(i)) return;
    let key = (l.code || "uncoded-" + l.type) + "|" + l.description;
    if(seen[key]){ seen[key]++; key += " #" + seen[key]; } else seen[key] = 1;
    lines.push({ key, ...l });
  });
  if(!lines.length) throw new Error("No phase-code lines found under the header row.");
  return { sheet:sh.name, lines, subtotals, sheetTotal };
}

async function handleWbsUpload(){
  const el = $("wbsFile"), file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose the WBS + Cost workbook first.","bad"); return; }
  toast("Reading workbook…");
  try{
    const parsed = parseWbs(await SHEET.readFile(file));
    state.wbs = { fileName:file.name, uploadedAt:new Date().toLocaleString(), ...parsed };
    const c = wbsChecks(), lab = c.byType.L || { hoursProj:0, costProj:0 };
    addAudit("WBS Intake","WBS + Cost Uploaded",
      `${file.name} — ${parsed.lines.length} phase-code line(s) from tab "${parsed.sheet.trim()}"; ${hrs0(lab.hoursProj)} labor hours, ${money(c.total.costProj)} projected cost.` +
      (c.issues ? ` ${c.issues} item(s) to confirm on the WBS + Cost page.` : ""));
    save(); renderAll(); navigate("wbs");
    toast(`WBS loaded: ${parsed.lines.length} phase codes, ${hrs0(lab.hoursProj)} labor hours.`);
  }catch(err){
    toast("WBS upload failed: " + err.message, "bad");
    addAudit("WBS Intake","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}

function clearWbs(){
  if(!confirmAction("Clear the loaded WBS + Cost? Node budget figures go empty until you load it again. The project map and its phase-code rules are kept.")) return;
  state.wbs = { fileName:null, sheet:null, uploadedAt:null, lines:[], subtotals:{}, sheetTotal:null };
  addAudit("WBS Intake","WBS Cleared","WBS + Cost removed by PM.");
  save(); renderAll(); toast("WBS cleared.");
}

/* Things in the workbook a PM should confirm. None of these stop the import. */
function wbsChecks(){
  const lines = state.wbs.lines || [], byType = {};
  lines.forEach(l => {
    const t = byType[l.type] = byType[l.type] || { n:0, hoursProj:0, hoursEst:0, costProj:0, costEst:0 };
    t.n++; t.hoursProj += l.hoursProj; t.hoursEst += l.hoursEst; t.costProj += l.costProj; t.costEst += l.costEst;
  });
  const total = { costProj:sumOf(lines,"costProj"), costEst:sumOf(lines,"costEst") };
  const subBad = Object.keys(state.wbs.subtotals || {}).filter(t => byType[t] && Math.abs(byType[t].costProj - state.wbs.subtotals[t].costProj) > 1);
  const st = state.wbs.sheetTotal;
  const totalBad = !!st && Math.abs(st.costProj - total.costProj) > 1;

  const uncoded = lines.filter(l => !l.code);
  const byCode = new Map();
  lines.forEach(l => { if(l.code){ if(!byCode.has(l.code)) byCode.set(l.code, []); byCode.get(l.code).push(l); } });
  const dups = [...byCode.entries()].filter(([,v]) => v.length > 1).map(([code, v]) => ({ code, lines:v }));

  const plan = phasePlan(lines), strays = plan ? plan.strays : [];
  return { byType, total, subBad, totalBad, uncoded, dups, strays, issues:uncoded.length + dups.length + strays.length + subBad.length + (totalBad ? 1 : 0) };
}

function wbsUseLaborHours(){
  const lab = wbsChecks().byType.L;
  if(!lab || !lab.hoursProj){ toast("No labor hours in the loaded WBS.","bad"); return; }
  if(!confirmAction(`Set the Manpower Loading estimate to ${hrs0(lab.hoursProj)} hours?\n\nThat is every labor phase code in the WBS, supervision and support included. The current estimate is ${hrs0(state.manpower.estimatedHours)}.`)) return;
  state.manpower.estimatedHours = Math.round(lab.hoursProj);
  addAudit("Manpower","Estimate Set From WBS", `${hrs0(lab.hoursProj)} projected labor hours from ${state.wbs.fileName}.`);
  save(); renderAll(); toast("Manpower estimate set from the WBS.");
}

/* ===========================================================================
   PDFX — PDF text with positions
   ---------------------------------------------------------------------------
   Drawing Intel's reader pulls text out of a PDF as one run, which is enough
   to find a revision block. A cost report is a table: what a number means
   depends on which column it sits in, so each piece of text has to come back
   with where it was drawn.

   This reads the page tree properly rather than scanning for streams. A
   linearised PDF (which the accounting system writes) splits page 1 into
   several content streams that only make sense joined in order, and keeps its
   page objects inside compressed object streams.

   Limits: FlateDecode and unfiltered streams only; no encrypted files; text
   must be real text (no OCR). Widths are estimated, which is accurate enough
   to tell columns apart but not to measure anything.
   =========================================================================== */

const PDFX = (() => {

  const latin1 = (bytes) => {
    let s = ""; const chunk = 0x8000;
    for(let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    return s;
  };

  async function inflate(slice){
    for(const fmt of ["deflate","deflate-raw"]){
      try{
        const ds = new DecompressionStream(fmt);
        return new Uint8Array(await new Response(new Blob([slice]).stream().pipeThrough(ds)).arrayBuffer());
      }catch(e){ /* try the next container format */ }
    }
    return null;
  }

  /* Index just past the ">>" that closes the "<<" at i. Parentheses inside
     literal strings are skipped so a ">>" in a title cannot end the dict early. */
  function dictEnd(src, i){
    let depth = 0;
    for(let k = i; k < src.length; k++){
      const c = src[k];
      if(c === "("){
        let d = 1; k++;
        while(k < src.length && d > 0){ if(src[k] === "\\") k++; else if(src[k] === "(") d++; else if(src[k] === ")") d--; k++; }
        k--;
      }
      else if(c === "<" && src[k+1] === "<"){ depth++; k++; }
      else if(c === ">" && src[k+1] === ">"){ depth--; k++; if(depth === 0) return k + 1; }
    }
    return -1;
  }

  /* Every "N G obj" in the file → its dictionary text and, for a stream, where
     the stream bytes sit. Stream bytes are skipped over using /Length so that
     compressed data which happens to spell "obj" is never read as an object. */
  function scanObjects(src){
    const objs = new Map();
    const re = /(\d+)[ \t\r\n]+(\d+)[ \t\r\n]+obj\b/g;
    let m;
    while((m = re.exec(src))){
      const num = Number(m[1]);
      let i = re.lastIndex;
      while(i < src.length && src.charCodeAt(i) <= 32) i++;
      let dict = "", data = null;
      if(src[i] === "<" && src[i+1] === "<"){
        const e = dictEnd(src, i);
        if(e < 0) continue;
        dict = src.slice(i, e);
        let j = e;
        while(j < src.length && src.charCodeAt(j) <= 32) j++;
        if(src.startsWith("stream", j)){
          let s = j + 6;
          if(src[s] === "\r") s++;
          if(src[s] === "\n") s++;
          const lm = /\/Length\s+(\d+)\b(?!\s+\d+\s+R)/.exec(dict);
          let len = lm ? Number(lm[1]) : -1;
          let t = s + Math.max(len, 0);
          while(t < src.length && src.charCodeAt(t) <= 32) t++;
          if(len < 0 || !src.startsWith("endstream", t)){
            const en = src.indexOf("endstream", s);
            len = en < 0 ? 0 : en - s;
          }
          data = { start:s, len };
          re.lastIndex = s + len;
        }
      } else {
        const en = src.indexOf("endobj", i);
        dict = src.slice(i, en < 0 ? i : en);
      }
      objs.set(num, { dict, data });
    }
    return objs;
  }

  async function streamBytes(bytes, o){
    if(!o || !o.data) return null;
    const slice = bytes.subarray(o.data.start, o.data.start + o.data.len);
    const fm = /\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/.exec(o.dict);
    const filters = fm ? (fm[1].match(/\/([A-Za-z0-9]+)/g) || []).map(s => s.slice(1)) : [];
    let out = slice;
    for(const f of filters){
      if(f === "FlateDecode" || f === "Fl"){ out = await inflate(out); if(!out) return null; }
      else return null;
    }
    return out;
  }

  /* Objects packed inside /ObjStm streams (PDF 1.5+). */
  async function expandObjectStreams(bytes, objs){
    for(const [, o] of [...objs]){
      if(!o.data || !/\/Type\s*\/ObjStm\b/.test(o.dict)) continue;
      const n = Number((/\/N\s+(\d+)/.exec(o.dict) || [])[1] || 0), first = Number((/\/First\s+(\d+)/.exec(o.dict) || [])[1] || 0);
      const raw = await streamBytes(bytes, o);
      if(!raw || !n) continue;
      const txt = latin1(raw), head = txt.slice(0, first).trim().split(/\s+/).map(Number);
      for(let k = 0; k < n; k++){
        const id = head[2*k], off = head[2*k+1], next = k + 1 < n ? head[2*k+3] : txt.length - first;
        if(Number.isFinite(id) && !objs.has(id)) objs.set(id, { dict:txt.slice(first + off, first + next), data:null });
      }
    }
  }

  const refsIn = (s) => (String(s || "").match(/(\d+)\s+\d+\s+R/g) || []).map(r => Number(r.split(/\s+/)[0]));

  function pageOrder(objs){
    let root = null;
    for(const [, o] of objs){
      if(/\/Type\s*\/Catalog\b/.test(o.dict)){ root = refsIn((/\/Pages\s+(\d+\s+\d+\s+R)/.exec(o.dict) || [])[1])[0]; break; }
    }
    const out = [], seen = new Set();
    const walk = (n) => {
      if(n === undefined || n === null || seen.has(n)) return;
      seen.add(n);
      const o = objs.get(n);
      if(!o) return;
      if(/\/Type\s*\/Pages\b/.test(o.dict)){
        const k = /\/Kids\s*(\[[^\]]*\]|\d+\s+\d+\s+R)/.exec(o.dict);
        if(!k) return;
        let kids = refsIn(k[1]);
        if(k[1][0] !== "["){ const arr = objs.get(kids[0]); kids = arr ? refsIn(arr.dict) : []; }
        kids.forEach(walk);
      }
      else if(/\/Type\s*\/Page\b/.test(o.dict)) out.push(n);
    };
    walk(root);
    if(!out.length) for(const [n, o] of objs) if(/\/Type\s*\/Page\b/.test(o.dict)) out.push(n);   // no usable tree: file order
    return out;
  }

  async function pageContent(bytes, objs, n){
    const o = objs.get(n);
    const m = /\/Contents\s*(\[[^\]]*\]|\d+\s+\d+\s+R)/.exec(o.dict);
    if(!m) return "";
    let refs = refsIn(m[1]);
    if(m[1][0] !== "[" && refs.length === 1){
      const t = objs.get(refs[0]);
      if(t && !t.data && /^\s*\[/.test(t.dict)) refs = refsIn(t.dict);      // the reference was to an array of streams
    }
    let out = "";
    for(const r of refs){
      const b = await streamBytes(bytes, objs.get(r));
      if(b) out += latin1(b) + "\n";
    }
    return out;
  }

  function literal(raw){
    let out = "";
    for(let i = 0; i < raw.length; i++){
      const ch = raw[i];
      if(ch !== "\\"){ out += ch; continue; }
      const n = raw[++i];
      if(n === "n") out += "\n"; else if(n === "r") out += "\r"; else if(n === "t") out += "\t";
      else if(n === "b" || n === "f") out += " ";
      else if(n >= "0" && n <= "7"){ let oct = n; while(oct.length < 3 && raw[i+1] >= "0" && raw[i+1] <= "7") oct += raw[++i]; out += String.fromCharCode(parseInt(oct, 8)); }
      else if(n === "\r" || n === "\n"){ if(n === "\r" && raw[i+1] === "\n") i++; }       // line continuation
      else if(n !== undefined) out += n;
    }
    return out;
  }
  function hexString(raw){
    const h = raw.replace(/[^0-9A-Fa-f]/g,"");
    let s = "";
    for(let i = 0; i + 1 < h.length; i += 2) s += String.fromCharCode(parseInt(h.substr(i, 2), 16));
    return s;
  }

  /* Width in points, estimated from Verdana's metrics for the characters a
     number is made of. Other characters get an average. Good to a point or two. */
  const W = { " ":.352, ",":.364, ".":.364, "-":.454, "$":.636, "%":1.076, "(":.454, ")":.454, "/":.454, ":":.454 };
  function textWidth(str, size){
    let w = 0;
    for(const ch of str) w += W[ch] !== undefined ? W[ch] : (ch >= "0" && ch <= "9" ? .636 : .6);
    return w * size;
  }

  /* Walk a content stream and return each shown string with the point it was
     drawn at. Only the operators that move or show text are interpreted. */
  function textItems(content){
    const items = [], stack = [], saved = [];
    let ctm = [1,0,0,1,0,0], lm = [1,0,0,1,0,0], size = 0, leading = 0, last = null;
    const mul = (m, n) => [m[0]*n[0]+m[1]*n[2], m[0]*n[1]+m[1]*n[3], m[2]*n[0]+m[3]*n[2], m[2]*n[1]+m[3]*n[3], m[4]*n[0]+m[5]*n[2]+n[4], m[4]*n[1]+m[5]*n[3]+n[5]];
    const nums = (k) => stack.slice(-k).map(v => typeof v === "number" ? v : 0);
    const show = (s) => {
      if(!s) return;
      if(last){ last.str += s; return; }        // a second string with no move in between continues the first
      const x = lm[4]*ctm[0] + lm[5]*ctm[2] + ctm[4], y = lm[4]*ctm[1] + lm[5]*ctm[3] + ctm[5];
      last = { x, y, size:size * Math.hypot(lm[0]*ctm[0] + lm[1]*ctm[2], lm[0]*ctm[1] + lm[1]*ctm[3]) || size, str:s };
      items.push(last);
    };
    const run = (op) => {
      switch(op){
        case "q":  saved.push(ctm.slice()); break;
        case "Q":  if(saved.length) ctm = saved.pop(); break;
        case "cm": ctm = mul(nums(6), ctm); break;
        case "BT": lm = [1,0,0,1,0,0]; last = null; break;
        case "ET": last = null; break;
        case "Tm": lm = nums(6); last = null; break;
        case "Td": { const [tx, ty] = nums(2); lm = mul([1,0,0,1,tx,ty], lm); last = null; break; }
        case "TD": { const [tx, ty] = nums(2); leading = -ty; lm = mul([1,0,0,1,tx,ty], lm); last = null; break; }
        case "TL": leading = nums(1)[0]; break;
        case "T*": lm = mul([1,0,0,1,0,-leading], lm); last = null; break;
        case "Tf": size = nums(1)[0]; break;
        case "Tj": { const v = stack[stack.length-1]; show(v && v.s !== undefined ? v.s : ""); break; }
        case "TJ": { const v = stack[stack.length-1]; show(v && v.a ? v.a.map(e => e && e.s !== undefined ? e.s : "").join("") : ""); break; }
        case "'":  lm = mul([1,0,0,1,0,-leading], lm); last = null; { const v = stack[stack.length-1]; show(v && v.s !== undefined ? v.s : ""); } break;
        case '"':  lm = mul([1,0,0,1,0,-leading], lm); last = null; { const v = stack[stack.length-1]; show(v && v.s !== undefined ? v.s : ""); } break;
      }
    };
    const n = content.length;
    let i = 0;
    while(i < n){
      const c = content[i], code = content.charCodeAt(i);
      if(code <= 32){ i++; continue; }
      if(c === "%"){ while(i < n && content[i] !== "\n" && content[i] !== "\r") i++; continue; }
      if(c === "("){
        let d = 1, j = i + 1, s = "";
        while(j < n && d > 0){
          const ch = content[j];
          if(ch === "\\"){ s += ch + (content[j+1] || ""); j += 2; continue; }
          if(ch === "(") d++;
          else if(ch === ")"){ d--; if(d === 0) break; }
          s += ch; j++;
        }
        stack.push({ s:literal(s) }); i = j + 1; continue;
      }
      if(c === "<" && content[i+1] !== "<"){ const j = content.indexOf(">", i); if(j < 0) break; stack.push({ s:hexString(content.slice(i+1, j)) }); i = j + 1; continue; }
      if(c === "<" || c === ">"){ i += 2; continue; }
      if(c === "["){ stack.push("["); i++; continue; }
      if(c === "]"){ const arr = []; while(stack.length){ const t = stack.pop(); if(t === "[") break; arr.unshift(t); } stack.push({ a:arr }); i++; continue; }
      if(c === "/"){ let j = i + 1; while(j < n && !/[\s\/\[\]()<>]/.test(content[j])) j++; stack.push({ n:content.slice(i+1, j) }); i = j; continue; }
      if((code >= 48 && code <= 57) || c === "+" || c === "-" || c === "."){
        let j = i + 1; while(j < n && /[0-9.]/.test(content[j])) j++;
        stack.push(parseFloat(content.slice(i, j)) || 0); i = j; continue;
      }
      let j = i; while(j < n && /[A-Za-z'"*]/.test(content[j])) j++;
      if(j === i){ i++; continue; }
      run(content.slice(i, j)); stack.length = 0; i = j;
    }
    return items;
  }

  /* Text on one page grouped into rows by baseline, each row left to right. */
  function rows(items, tol){
    const sorted = items.slice().sort((a, b) => (b.y - a.y) || (a.x - b.x)), out = [];
    for(const it of sorted){
      const r = out[out.length - 1];
      if(r && Math.abs(r.y - it.y) <= (tol || 2.2)) r.items.push(it); else out.push({ y:it.y, items:[it] });
    }
    out.forEach(r => r.items.sort((a, b) => a.x - b.x));
    return out;
  }

  async function read(file){
    const bytes = new Uint8Array(await file.arrayBuffer());
    const src = latin1(bytes);
    if(src.slice(0, 5) !== "%PDF-") throw new Error("That file is not a PDF.");
    if(/\/Encrypt\s+\d+\s+\d+\s+R/.test(src)) throw new Error("This PDF is password-protected or encrypted and can't be read.");
    const objs = scanObjects(src);
    await expandObjectStreams(bytes, objs);
    const pages = [];
    for(const n of pageOrder(objs)) pages.push({ items:textItems(await pageContent(bytes, objs, n)) });
    return { pages, pageCount:pages.length, textItems:pages.reduce((s, p) => s + p.items.length, 0) };
  }

  return { read, rows, textWidth };
})();

/* ===========================================================================
   Cost Report — "Detail Job Overview by Cost Type" from accounting (PDF)
   ---------------------------------------------------------------------------
   The booked budget and the actuals against it, one row per phase code:
   hours this month / job to date / projected / estimate, cost this month /
   JTD + open / projected / estimate, and open commitments. The header block
   carries the job's contract, billing, earned and cash figures.

   This is the system of record. When it is loaded it drives the job figures
   on the cockpit, the budget and actuals on every node card, and the codes
   the project map is built from. The WBS workbook, if also loaded, becomes
   the cross-check.

   Parsing is by position: each number belongs to the column whose right edge
   it lines up with. The column edges are read from the report's own subtotal
   rows, which always print all eleven columns, so a re-spaced layout still
   reads. Every cost type's lines are then summed and compared to its subtotal
   row, and the grand total to the "Totals" row — if the parse is wrong, that
   comparison shows it.
   =========================================================================== */

const CR_COLS = ["hoursMonth","hoursJtd","hoursProj","hoursEst","hoursPct","costMonth","costJtd","costProj","costEst","costPct","commit"];
const CR_SUMS = ["hoursMonth","hoursJtd","hoursProj","hoursEst","costMonth","costJtd","costProj","costEst","commit"];
/* Right edge of each column on the page as v3.1 prints it. Only used if the
   report has no complete subtotal row to measure from. */
const CR_ANCHORS = [210,271,324,372,420,482,544,607,668,713,772];

/* The report heads its current-period columns with the month in capitals. */
function crMonthName(){
  const m = String(state.cr.month || "").trim();
  return /^[A-Za-z]{3,9}$/.test(m) ? m.charAt(0).toUpperCase() + m.slice(1).toLowerCase() : "This period";
}

function crNumber(str){
  const t = String(str ?? "").trim();
  if(!/^-?\$?[\d,]*\.?\d+%?$/.test(t)) return null;
  return parseFloat(t.replace(/[$,%]/g,""));
}

function parseCostReport(pdf){
  const all = [];
  pdf.pages.forEach((p, pi) => PDFX.rows(p.items).forEach(r => all.push({ page:pi, y:r.y, items:r.items })));
  let asOfText = "";
  for(const r of all){
    for(const it of r.items){
      const m = /Job Overview by Cost Type.*?as of\s+(\d{1,2}\/\d{1,2}\/\d{2,4})/i.exec(it.str);
      if(m){ asOfText = m[1]; break; }
    }
    if(asOfText) break;
  }
  if(!asOfText){
    /* Either a different document, or one whose text cannot be read as text:
       a scan, or a report re-printed through a PDF printer that re-encodes
       its fonts. Say which. */
    const words = all.reduce((n, r) => n + r.items.filter(it => /[A-Za-z]{4,}/.test(it.str)).length, 0);
    if(words < 20) throw new Error("no readable text was found in this PDF. Save the report as a PDF straight from the accounting system — a scan, or a copy made with Print to PDF, cannot be read.");
    throw new Error("this PDF isn't a \"Detail Job Overview by Cost Type\" report. That is the cost report OhmBoy reads; other report layouts are not supported yet.");
  }

  const numsOf = (r, from) => r.items.slice(from).map(it => ({ it, v:crNumber(it.str) })).filter(x => x.v !== null);
  const isSub = (r) => r.items[0] && r.items[0].str.trim() === "Subtotal for:";
  const isTot = (r) => r.items[0] && /^Job\s+\S+\s+Totals:/.test(r.items[0].str.trim());

  /* Column edges, measured from the rows that print every column. */
  const full = all.filter(r => (isSub(r) || isTot(r)) && numsOf(r, 1).length === 11);
  const edge = (it) => it.x + PDFX.textWidth(it.str, it.size);
  const anchors = full.length
    ? CR_COLS.map((_, k) => full.reduce((s, r) => s + edge(numsOf(r, 1)[k].it), 0) / full.length)
    : CR_ANCHORS.slice();
  const colOf = (it) => {
    const x = edge(it);
    let best = -1, d = 22;
    anchors.forEach((a, k) => { if(Math.abs(a - x) < d){ d = Math.abs(a - x); best = k; } });
    return best;
  };
  const read = (r, from) => {
    const rec = {}; CR_COLS.forEach(c => { rec[c] = 0; });
    numsOf(r, from).forEach(x => { const k = colOf(x.it); if(k >= 0) rec[CR_COLS[k]] = x.v; });
    return rec;
  };

  const lines = [], subtotals = {}, seen = new Set();
  let total = null, gp = null, composite = null, month = "";
  for(const r of all){
    const first = r.items[0] ? r.items[0].str.trim() : "";
    const m = /^([A-Z]\d{7})\s+(.*)$/.exec(first) || /^([A-Z]\d{7})$/.exec(first);
    if(m){
      const code = m[1];
      if(seen.has(code)) continue;                       // a row repeated across a page break
      seen.add(code);
      const rec = read(r, 1), type = code.charAt(0) === "D" ? "O" : code.charAt(0);
      // a description long enough to be drawn as its own piece of text
      let desc = (m[2] || "").trim();
      if(!desc && r.items[1] && crNumber(r.items[1].str) === null) desc = r.items[1].str.trim();
      lines.push({ key:code, code, type, description:desc, ...phaseParts(code),
        hoursMonth:rec.hoursMonth, hoursJtd:rec.hoursJtd, hoursProj:rec.hoursProj, hoursEst:rec.hoursEst,
        costMonth:rec.costMonth, costJtd:rec.costJtd, costProj:rec.costProj, costEst:rec.costEst, commit:rec.commit });
    }
    else if(isSub(r)){
      const label = r.items[1] ? r.items[1].str.trim() : "";
      const t = /^([A-Z])\s/.exec(label);
      if(t) subtotals[t[1]] = read(r, 2);
    }
    else if(isTot(r)) total = read(r, 1);
    else if(first === "Gross Profit:"){ const g = read(r, 1); gp = { jtd:g.costJtd, proj:g.costProj, est:g.costEst }; }
    else if(first === "Labor Composite (per hour)"){
      const v = numsOf(r, 1).map(x => x.v);
      if(v.some(x => x) && v.length >= 4) composite = { month:v[0], jtd:v[1], proj:v[2], est:v[3] };
    }
    else if(!month && first === "Phase" && r.items[1]) month = r.items[1].str.trim();
  }
  if(!lines.length) throw new Error("the report was recognised but no phase-code rows could be read from it. If it was scanned or printed to an image, export it from the accounting system as a PDF instead.");
  const jobs = all.filter(isTot).length;
  if(jobs > 1) throw new Error(`this PDF covers ${jobs} jobs. Run the report for one job and load that.`);

  /* Header block on page 1: each value is the text just right of its label. */
  const p0 = all.filter(r => r.page === 0);
  const after = (label) => { for(const r of p0){ const i = r.items.findIndex(it => it.str.trim() === label); if(i >= 0) return r.items[i+1] ? r.items[i+1].str.trim() : ""; } return ""; };
  const n = (label) => { const v = crNumber(after(label)); return v === null ? 0 : v; };
  const job = {
    number:after("Job Number:"), description:after("Job Description:"), customer:after("Customer Name:"),
    start:fmtDate(after("Start Date:")), complete:fmtDate(after("Complete Date:")),
    pctComplete:n("% Complete:"), pctBilled:n("% Billed:"), billed:n("Billed To Date:"), earned:n("Earned To Date:"), overUnder:n("Over / Under:"),
    retention:n("Retention Bal:"), currentDue:n("Current Due:"),
    contractOriginal:n("Original Contract:"), executedChanges:n("Executed Changes:"), contractRevised:n("Revised Contract:"),
    pendingChanges:n("Pending Changes:"), proposedChanges:n("Proposed Changes:"),
    jtdCost:n("JTD Cost:"), openAP:n("Open AP:"), cashFlow:n("Cash Flow:")
  };
  return { asOf:fmtDate(asOfText), asOfText, month, job, lines, subtotals, total, gp, composite, pages:pdf.pageCount, measured:full.length > 0 };
}

async function handleCostReportUpload(){
  const el = $("crFile"), file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose the cost report PDF first.","bad"); return; }
  toast("Reading cost report…");
  try{
    const parsed = parseCostReport(await PDFX.read(file));
    const old = state.cr || {};
    /* Keep a compact copy of the last report so this one can show what moved.
       Re-loading the same as-of date keeps the comparison already held. */
    let prior = old.prior || null;
    if((old.lines || []).length && old.asOf && old.asOf !== parsed.asOf){
      prior = { asOf:old.asOf, asOfText:old.asOfText, fileName:old.fileName, byCode:{} };
      old.lines.forEach(l => { prior.byCode[l.code] = [l.hoursJtd, l.costJtd, l.hoursProj, l.costProj]; });
    }
    state.cr = { fileName:file.name, uploadedAt:new Date().toLocaleString(), ...parsed, prior };
    const c = crChecks();
    addAudit("Cost Report","Cost Report Uploaded",
      `${file.name} — as of ${parsed.asOfText}, ${parsed.lines.length} phase codes, ${money(c.total.costProj)} projected cost, ${hrs0(c.total.hoursJtd)} hours to date.` +
      (c.sumsOk ? " Line sums match the report's subtotal rows." : " LINE SUMS DO NOT MATCH THE REPORT'S SUBTOTALS — check the Cost Report page."));
    let applied = false;
    if(state.financial.source !== "manual"){ applyCostReportFigures(true); applied = true; }
    save(); renderAll(); navigate("costReport");
    toast(`Cost report loaded: as of ${parsed.asOfText}, ${parsed.lines.length} phase codes.` + (applied ? " Job figures updated from it." : ""), c.sumsOk ? "" : "bad");
  }catch(err){
    toast("Cost report upload failed: " + err.message, "bad");
    addAudit("Cost Report","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}

/* Contract, cost to date and EAC come straight from the report. Run on upload
   unless the PM has typed figures into Job Setup by hand — those are only
   replaced when asked. */
function applyCostReportFigures(quiet){
  const cr = state.cr, j = cr.job || {}, f = state.financial;
  if(!(cr.lines || []).length) return;
  if(!quiet && !confirmAction(`Replace the figures in Job Setup with the cost report's (as of ${cr.asOfText})?\n\nContract ${money(j.contractOriginal)}, executed changes ${money(j.executedChanges)}, cost to date ${money(j.jtdCost)}, EAC ${money(crChecks().total.costProj)}.`)) return;
  /* The report's revised contract is original plus executed changes. Pending
     and proposed changes are not revenue yet, so they are shown on the Cost
     Report page and left out of the contract — the cockpit's contract and
     margin then tie to the report's own. */
  f.originalContract = j.contractOriginal; f.approvedCO = j.executedChanges; f.pendingCO = 0;
  f.costToDate = j.jtdCost; f.eac = crChecks().total.costProj;
  f.asOf = cr.asOf; f.source = "report";
  if(!state.reports.openPO) f.openPO = crChecks().total.commit;         // open commitments stand in until a PO report is loaded
  if(!state.job.name && j.description) state.job.name = j.description;
  if(!state.job.number && j.number) state.job.number = j.number;
  if(!state.job.gc && j.customer) state.job.gc = j.customer;
  [["KD-CR-START","Job start", j.start], ["KD-CR-COMPLETE","Job complete", j.complete]].forEach(([id, label, date]) => {
    if(!isISO(date)) return;
    const k = state.job.keyDates.find(d => d.id === id);
    if(k) k.date = date; else state.job.keyDates.push({ id, label, date });
  });

function crFar(p, e, floor){ return p > 0 && e > 0 && Math.abs(p - e) >= floor && (p / e >= 4 || p / e <= 0.25); }

/* Sums, subtotal checks and the lists the page flags. Worked out once per
   loaded report — the vitals bar asks for the totals on every render. */
let CRCACHE = { lines:null, out:null };
function crChecks(){
  const cr = state.cr, lines = cr.lines || [], byType = {}, total = {};
  if(CRCACHE.lines === lines && CRCACHE.out) return CRCACHE.out;
  CR_SUMS.forEach(c => { total[c] = 0; });
  lines.forEach(l => {
    const t = byType[l.type] = byType[l.type] || Object.assign({ n:0 }, Object.fromEntries(CR_SUMS.map(c => [c, 0])));
    t.n++;
    CR_SUMS.forEach(c => { t[c] += l[c] || 0; total[c] += l[c] || 0; });
  });
  /* Every summed column of every cost type against its subtotal row. Cents
     drift on long columns of rounded figures, so a dollar of slack. */
  const subBad = [];
  Object.keys(cr.subtotals || {}).forEach(t => {
    const b = byType[t], s = cr.subtotals[t];
    if(!b) return;
    const off = CR_SUMS.filter(c => Math.abs((b[c] || 0) - (s[c] || 0)) > 1.01);
    if(off.length) subBad.push({ type:t, cols:off });
  });
  const totalBad = cr.total ? CR_SUMS.filter(c => Math.abs(total[c] - (cr.total[c] || 0)) > 1.01) : [];
  const plan = phasePlan(lines);
  const offEst = lines.filter(l => Math.abs(l.costProj - l.costEst) >= 1 || Math.abs(l.hoursProj - l.hoursEst) >= 0.5)
    .sort((a,b) => (Math.abs(b.costProj - b.costEst) + Math.abs(b.hoursProj - b.hoursEst) * 60) - (Math.abs(a.costProj - a.costEst) + Math.abs(a.hoursProj - a.hoursEst) * 60));
  /* A projection that is a small fraction or a large multiple of its estimate
     — what a dropped or doubled digit looks like. */
  const scaleOdd = lines.filter(l => crFar(l.hoursProj, l.hoursEst, 100) || crFar(l.costProj, l.costEst, 10000));
  const overHours = lines.filter(l => l.hoursJtd > l.hoursProj + 0.5);
  // a labor line over on hours is over on cost for the same reason; it is listed once, under hours
  const overCost = lines.filter(l => l.costProj > 0 && l.costJtd > l.costProj + 1 && !(l.hoursJtd > l.hoursProj + 0.5));
  const unbudgeted = lines.filter(l => (l.hoursJtd > 0 || l.costJtd > 0) && l.costProj === 0 && l.hoursProj === 0);

  /* A labor line priced at a different rate than the same task everywhere
     else. The task is the last three digits; with three or more lines to go
     on, a line off the group's usual rate is usually a mistyped dollar figure. */
  const byTask = {};
  lines.forEach(l => { if(l.type === "L" && l.aa && l.hoursProj > 0 && l.costProj > 0) (byTask[l.code.slice(5)] = byTask[l.code.slice(5)] || []).push(l); });
  const rateOdd = [];
  Object.values(byTask).forEach(g => {
    if(g.length < 3) return;
    const r = g.map(l => l.costProj / l.hoursProj).sort((a,b) => a - b), med = r[Math.floor(r.length / 2)];
    g.forEach(l => { const rt = l.costProj / l.hoursProj; if(Math.abs(rt - med) / med > 0.004) rateOdd.push({ line:l, rate:rt, usual:med, expect:Math.round(l.hoursProj * med * 100) / 100, peers:g.length - 1 }); });
  });

  /* One description on more than one code. The report cuts descriptions at 25
     characters, so only ones short enough to be whole are compared. */
  const byDesc = {};
  lines.forEach(l => { const d = l.description.trim(); if(d && d.length < 24) (byDesc[l.type + "|" + d.toLowerCase()] = byDesc[l.type + "|" + d.toLowerCase()] || []).push(l); });
  const dupDesc = Object.values(byDesc).filter(g => g.length > 1);
  CRCACHE = { lines, out:{ byType, total, subBad, totalBad, sumsOk:!subBad.length && !totalBad.length, plan, strays:plan ? plan.strays : [], offEst, overHours, overCost, unbudgeted, rateOdd, dupDesc, scaleOdd } };
  return CRCACHE.out;
}

/* What changed since the report loaded before this one. */
function crMovement(){
  const cr = state.cr, p = cr.prior;
  if(!p || !(cr.lines || []).length) return null;
  const rows = [], now = new Set();
  let dHours = 0, dCost = 0, dProjH = 0, dProjC = 0;
  cr.lines.forEach(l => {
    now.add(l.code);
    const o = p.byCode[l.code] || [0, 0, 0, 0], isNew = !p.byCode[l.code];
    const d = { line:l, isNew, hours:l.hoursJtd - o[0], cost:l.costJtd - o[1], projH:l.hoursProj - o[2], projC:l.costProj - o[3] };
    dHours += d.hours; dCost += d.cost; dProjH += d.projH; dProjC += d.projC;
    if(isNew || Math.abs(d.hours) >= 0.5 || Math.abs(d.cost) >= 1 || Math.abs(d.projH) >= 0.5 || Math.abs(d.projC) >= 1) rows.push(d);
  });
  const gone = Object.keys(p.byCode).filter(c => !now.has(c));
  rows.sort((a,b) => (Math.abs(b.cost) + Math.abs(b.projC)) - (Math.abs(a.cost) + Math.abs(a.projC)));
  return { prior:p, rows, gone, dHours, dCost, dProjH, dProjC };
}

/* ---------------------------------------------------------------------------
   Cost report against the WBS workbook. Lines are paired by code first, then
   by description (the report cuts descriptions at 25 characters), then by
   matching figures inside the same area — which is how a line that was given
   a new code between the workbook and the books is still recognised.
   --------------------------------------------------------------------------- */
function crVsWbs(){
  const A = state.cr.lines || [], B = state.wbs.lines || [];
  if(!A.length || !B.length) return null;
  const norm = (s) => String(s || "").toLowerCase().replace(/&/g," and ").replace(/\s+/g," ").trim();
  /* Equal, or one is the other cut short. The report cuts descriptions at 25
     characters, so a prefix only counts when it is long enough to be a cut —
     a two-word description must not match everything that starts with it. */
  const starts = (a, b) => { const x = norm(a), y = norm(b); return !!x && !!y && (x === y || (Math.min(x.length, y.length) >= 24 && (y.startsWith(x) || x.startsWith(y)))); };
  const usedB = new Set(), pairs = [], onlyA = [];
  const byCode = new Map();
  B.forEach((b, i) => { if(!b.code) return; if(!byCode.has(b.code)) byCode.set(b.code, []); byCode.get(b.code).push(i); });
  const take = (a, i, how) => { usedB.add(i); pairs.push({ a, b:B[i], how }); };
  const nearest = (a, cand) => cand.slice().sort((x, y) => Math.abs(B[x].costEst - a.costEst) - Math.abs(B[y].costEst - a.costEst))[0];

  /* 1. same code and the same description */
  let rest = [];
  A.forEach(a => {
    const cand = (byCode.get(a.code) || []).filter(i => !usedB.has(i) && starts(a.description, B[i].description));
    if(cand.length) take(a, nearest(a, cand), "code"); else rest.push(a);
  });
  /* 2. the same description under another code — the line was re-coded. This
        runs before a bare code match so "Bridging Power", moved from A0001000
        to A0002000, is not paired with whatever now holds its old code. */
  let rest2 = [];
  rest.forEach(a => {
    const cand = B.map((b, i) => i).filter(i => !usedB.has(i) && B[i].type === a.type && starts(a.description, B[i].description));
    if(cand.length) take(a, nearest(a, cand), "description"); else rest2.push(a);
  });
  /* 3. same code, description reworded */
  rest = [];
  rest2.forEach(a => {
    const cand = (byCode.get(a.code) || []).filter(i => !usedB.has(i));
    if(cand.length) take(a, nearest(a, cand), "code"); else rest.push(a);
  });
  /* 4. same figures and the same leading words, inside the same cost type */
  rest.forEach(a => {
    const two = wbsTok(norm(a.description)).slice(0, 2).join(" ");
    const cand = B.map((b, i) => i).filter(i => !usedB.has(i) && B[i].type === a.type && (a.costEst || a.hoursEst) &&
      Math.abs(B[i].costEst - a.costEst) < 1 && Math.abs(B[i].hoursEst - a.hoursEst) < 0.5 && wbsTok(norm(B[i].description)).slice(0, 2).join(" ") === two);
    // several lines with the same figures: the one with the same task digits
    const one = cand.length === 1 ? cand : cand.filter(i => B[i].code && B[i].code.slice(5) === a.code.slice(5));
    if(one.length === 1) take(a, one[0], "figures"); else onlyA.push(a);
  });
  const onlyB = B.filter((b, i) => !usedB.has(i));

  const recoded = pairs.filter(p => p.a.code !== p.b.code);
  const rate = 60;      // rough dollars per hour, only to rank an hours-only difference among dollar ones
  const diffs = pairs.map(p => ({ ...p, dHP:p.a.hoursProj - p.b.hoursProj, dHE:p.a.hoursEst - p.b.hoursEst, dCP:p.a.costProj - p.b.costProj, dCE:p.a.costEst - p.b.costEst }))
    .filter(d => Math.abs(d.dHP) >= 0.5 || Math.abs(d.dHE) >= 0.5 || Math.abs(d.dCP) >= 1 || Math.abs(d.dCE) >= 1)
    .sort((x, y) => (Math.abs(y.dCP) + Math.abs(y.dHP) * rate) - (Math.abs(x.dCP) + Math.abs(x.dHP) * rate));
  const tot = (list, k, type) => list.filter(l => !type || l.type === type).reduce((s, l) => s + (l[k] || 0), 0);
  const types = WBS_TYPE_ORDER.filter(t => A.some(l => l.type === t) || state.wbs.lines.some(l => l.type === t));
  const byType = types.map(t => ({ type:t, crH:tot(A,"hoursProj",t), wbH:tot(state.wbs.lines,"hoursProj",t), crC:tot(A,"costProj",t), wbC:tot(state.wbs.lines,"costProj",t) }));
  return { pairs:pairs.length, recoded, diffs, onlyA, onlyB, byType };
}
