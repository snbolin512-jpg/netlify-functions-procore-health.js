/* ===========================================================================
   Ωboy V0.24.0 — Schedule intake, hardened + delay attribution
   ---------------------------------------------------------------------------
   Three parser defects found against real exports:

     1. CSV date serials. Excel writes dates as serial numbers (46083). The old
        code handed that to new Date(), which reads it as 46083 *milliseconds*
        after 1970 and produced "+046083-01". XLSX was fine because the style
        table flags date cells; CSV has no style table, so serials have to be
        recognised by shape.
     2. No Activity ID column. MS Project's default export has none, so every
        row got actId "" and slip detection collided rows against each other.
     3. No float column. Critical-path detection depended entirely on float, so
        an MS Project export flagged nothing at all — the risk engine was dead
        on the most common export format.

   Plus the thing that was actually missing: slips are now attributed. A date
   moving is not the story; who moved it and whether you're owed for it is.
   =========================================================================== */

/* ---------- date handling ---------- */

// Excel serials for a construction schedule land roughly 2000-2050.
const SERIAL_MIN = 36526;   // 2000-01-01
const SERIAL_MAX = 54789;   // 2050-01-01

function parseSchedDate(v){
  if(v === null || v === undefined) return null;
  const s = String(v).trim();
  if(!s) return null;

  // Bare number in date-serial range: Excel serial (days since 1899-12-30).
  if(/^\d+(\.\d+)?$/.test(s)){
    const n = Number(s);
    if(n >= SERIAL_MIN && n <= SERIAL_MAX){
      const d = new Date(Math.round((n - 25569) * 86400000));
      return isNaN(d) ? null : d;
    }
    return null;   // a plain integer outside that range is not a date
  }

  // Already ISO
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    const d = new Date(s.slice(0,10) + "T00:00:00");
    return isNaN(d) ? null : d;
  }

  // dd-MMM-yy / dd-MMM-yyyy (P6 default) — also handles "02-Mar-26 08:00"
  let m = /^(\d{1,2})[-\s]([A-Za-z]{3})[-\s](\d{2,4})/.exec(s);
  if(m){
    const months = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
    const mo = months[m[2].toLowerCase()];
    if(mo !== undefined){
      let y = Number(m[3]); if(y < 100) y += y < 70 ? 2000 : 1900;
      return new Date(y, mo, Number(m[1]));
    }
  }

  // US m/d/yy — the default for MS Project on a US locale.
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(s);
  if(m){
    let y = Number(m[3]); if(y < 100) y += y < 70 ? 2000 : 1900;
    return new Date(y, Number(m[1]) - 1, Number(m[2]));
  }

  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function schedDateISO(v){
  const d = parseSchedDate(v);
  return d ? d.toISOString().slice(0,10) : "";
}

// "8d", "0", "-3 days", "12h" -> number of days. Empty stays null so "no float
// column" is distinguishable from "float is zero".
function parseFloatDays(v){
  const s = String(v ?? "").trim();
  if(!s) return null;
  const m = /^(-?\d+(?:\.\d+)?)\s*([dhwm]?)/i.exec(s.replace(/,/g,""));
  if(!m) return null;
  let n = Number(m[1]);
  const unit = (m[2] || "d").toLowerCase();
  if(unit === "h") n = n / 8;        // 8-hour working day
  if(unit === "w") n = n * 5;
  if(unit === "m") n = n * 20;
  return n;
}

function parsePct(v){
  const s = String(v ?? "").trim();
  if(!s) return 0;
  const n = parseFloat(s.replace(/[^0-9.\-]/g,""));
  if(!isFinite(n)) return 0;
  return Math.max(0, Math.min(100, n));
}

/* ---------- responsibility coding ---------- */

const DELAY_PARTIES = [
  ["us",      "Us / Our Crew",      "Our own manpower, sequencing, or rework."],
  ["gc",      "GC",                 "Access, coordination, GC-directed resequence, site conditions."],
  ["owner",   "Owner",              "Owner-driven scope change, decision delay, or directive."],
  ["vendor",  "Vendor / Supplier",  "Gear, switchgear, cable, or material delivery."],
  ["sub",     "Subcontractor",      "Our sub's manpower or performance."],
  ["engineer","Engineer / EOR",     "RFI turnaround, drawing revision, design conflict."],
  ["trade",   "Other Trade",        "Predecessor trade not complete, stacked work."],
  ["weather", "Weather / Force Majeure", "Excusable but typically non-compensable."],
  ["unknown", "Unassigned",         "Not yet attributed."]
];

// Excusable = we shouldn't eat the time. Compensable = we should be paid.
const PARTY_ENTITLEMENT = {
  us:       { excusable:false, compensable:false, note:"Our own delay. No entitlement — this is margin we absorb." },
  gc:       { excusable:true,  compensable:true,  note:"GC-caused. Time and cost typically recoverable — notice matters." },
  owner:    { excusable:true,  compensable:true,  note:"Owner-caused. Strongest entitlement position." },
  vendor:   { excusable:true,  compensable:false, note:"Vendor delay. Time may be excusable; cost usually runs back to the vendor, not the GC." },
  sub:      { excusable:false, compensable:false, note:"Our sub, our exposure. Recovery is against the sub." },
  engineer: { excusable:true,  compensable:true,  note:"Design-caused. Track the RFI and revision that drove it." },
  trade:    { excusable:true,  compensable:true,  note:"Another trade. Entitlement typically runs through the GC." },
  weather:  { excusable:true,  compensable:false, note:"Excusable, not compensable under most contracts. Time only." },
  unknown:  { excusable:false, compensable:false, note:"Unattributed. Assign a cause before it becomes undefendable." }
};

const NOTICE_DEFAULT_DAYS = 7;   // fallback only — the executed contract governs
function noticeWindowDays(){
  // Once the contract is uploaded and the notice term confirmed, that value
  // wins. Being wrong about this window is how a defensible claim dies.
  return (typeof contractNoticeDays === "function") ? contractNoticeDays() : NOTICE_DEFAULT_DAYS;
}

function delayKey(a){ return a.actId || a.name; }

/* Records a slip and opens a delay entry for the PM to attribute. */
function logDelay(act, slipDays, priorFinish){
  state.delays = state.delays || [];
  const key = delayKey(act);
  const existing = state.delays.find(d => d.key === key && d.newFinish === act.finish);
  if(existing) return existing;
  const entry = {
    id: uid("DLY"),
    key,
    actId: act.actId,
    name: act.name,
    priorFinish,
    newFinish: act.finish,
    slipDays,
    critical: !!act.critical,
    party: "unknown",
    cause: "",
    noticeGiven: false,
    noticeDate: "",
    detectedAt: new Date().toLocaleString(),
    detectedOn: todayISO(),
    coRef: "",
    rfiRef: "",
    costImpact: 0,
    notes: ""
  };
  state.delays.push(entry);
  return entry;
}

function updateDelay(id, field, value){
  const d = (state.delays||[]).find(x => x.id === id);
  if(!d) return;
  if(field === "costImpact") value = Number(value) || 0;
  if(field === "noticeGiven"){
    value = !!value;
    if(value && !d.noticeDate) d.noticeDate = todayISO();
  }
  d[field] = value;
  if(field === "party"){
    addAudit("Schedule Risk","Delay Attributed",
      `${d.actId||d.name} (${d.slipDays}d) attributed to ${(DELAY_PARTIES.find(p=>p[0]===value)||[,value])[1]}.`);
  }
  save(); renderAll(); navigate("scheduleRisk");
}

function deleteDelay(id){
  const d = (state.delays||[]).find(x => x.id === id);
  if(!d) return;
  if(!confirmAction(`Remove the delay record for ${d.actId||d.name} (${d.slipDays}d)?`)) return;
  state.delays = state.delays.filter(x => x.id !== id);
  addAudit("Schedule Risk","Delay Record Removed", `${d.actId||d.name} — ${d.slipDays}d.`);
  save(); renderAll(); navigate("scheduleRisk");
}

function noticeDaysLeft(d){
  const detected = parseDate(d.detectedOn);
  if(!detected) return null;
  const due = new Date(detected.getTime() + noticeWindowDays() * 86400000);
  return Math.ceil((due - new Date()) / 86400000);
}

function delayRollup(){
  const list = state.delays || [];
  const r = { total:list.length, days:0, critical:0, unattributed:0,
              compensable:0, compensableDays:0, excusableDays:0, ownDays:0,
              noticeOverdue:0, noticeDue:0, cost:0, byParty:{} };
  for(const d of list){
    const e = PARTY_ENTITLEMENT[d.party] || PARTY_ENTITLEMENT.unknown;
    r.days += d.slipDays;
    r.cost += d.costImpact || 0;
    if(d.critical) r.critical++;
    if(d.party === "unknown") r.unattributed++;
    if(e.compensable){ r.compensable++; r.compensableDays += d.slipDays; }
    if(e.excusable) r.excusableDays += d.slipDays;
    if(d.party === "us" || d.party === "sub") r.ownDays += d.slipDays;
    if(e.compensable && !d.noticeGiven){
      const left = noticeDaysLeft(d);
      if(left !== null && left < 0) r.noticeOverdue++;
      else if(left !== null && left <= 3) r.noticeDue++;
    }
    r.byParty[d.party] = (r.byParty[d.party] || 0) + d.slipDays;
  }
  return r;
}

/* ---------- intake ---------- */

const ALIAS_SCHED = {
  actId:["activityid","id","taskid","uniqueid","activitycode","taskuniqueid","wbscode","code"],
  name:["activityname","taskname","name","description","activity","task"],
  start:["start","startdate","earlystart","actualstart","begin","plannedstart","currentstart"],
  finish:["finish","finishdate","earlyfinish","end","enddate","completion","plannedfinish","currentfinish"],
  float:["totalfloat","float","slack","totalslack","freefloat"],
  pct:["activitypercentcomplete","percentcomplete","pctcomplete","complete","progress","physicalpercentcomplete"],
  critical:["critical","criticalpath","iscritical"],
  status:["activitystatus","status","state"],
  duration:["originalduration","duration","atcompletionduration","remainingduration"],
  resource:["resourcenames","resource","crew","trade","responsibility","assignedto"],
  predecessors:["predecessors","predecessor","preds"]
};

async function handleScheduleUpload(){
  const el = $("scheduleFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a schedule file first.","bad"); return; }
  try{
    const sheets = await SHEET.readFile(file);
    if(!sheets.length || !sheets[0].rows.length) throw new Error("No rows found in that file.");

    // Pick the sheet with the most parseable rows — P6 and MS Project both
    // export cover/legend sheets ahead of the data.
    let best = sheets[0], bestScore = -1;
    for(const sh of sheets){
      const probe = SHEET.toRecords(sh.rows, ALIAS_SCHED);
      const score = probe.records.filter(r => r.name || r.actId).length;
      if(score > bestScore){ bestScore = score; best = sh; }
    }

    const { records, map, headerRow } = SHEET.toRecords(best.rows, ALIAS_SCHED);
    if(map.name < 0 && map.actId < 0){
      throw new Error("Couldn't find an activity name or ID column. Expected a header row containing something like 'Activity Name' or 'Task Name'.");
    }
    if(map.finish < 0){
      throw new Error("Couldn't find a finish-date column. Without finish dates there's nothing to compare, so slip detection can't run.");
    }

    const prior = {};
    (state.schedule.activities || []).forEach(a => { prior[delayKey(a)] = a; });

    const warnings = [];
    if(map.actId < 0) warnings.push("No Activity ID column — matching on activity name instead. Renaming a task will read as a new activity.");
    if(map.float < 0 && map.critical < 0) warnings.push("No Total Float or Critical column — critical-path flagging is off for this file. In MS Project add the Total Slack column before exporting.");

    let badDates = 0, summaryRows = 0;

    const acts = records.map(r => {
      const rawName = String(r._untrimmed_name ?? r.name ?? "");
      // MS Project indents child tasks with leading spaces; keep the depth,
      // drop the padding so names match across exports.
      const indent = (rawName.match(/^\s+/) || [""])[0].length;
      const name = rawName.trim();

      const startISO = map.start >= 0 ? schedDateISO(r.start) : "";
      const finishISO = schedDateISO(r.finish);
      if(r.finish && !finishISO) badDates++;

      const fl = map.float >= 0 ? parseFloatDays(r.float) : null;
      const critFlag = /^(y|yes|true|1|critical)$/i.test(String(r.critical || "").trim());
      const critical = map.critical >= 0 ? critFlag : (fl !== null ? fl <= 0 : false);

      return {
        actId: String(r.actId || "").trim(),
        name, indent,
        start: startISO,
        finish: finishISO,
        float: fl,
        pct: parsePct(r.pct),
        critical,
        status: r.status || "",
        duration: r.duration || "",
        resource: r.resource || "",
        predecessors: r.predecessors || ""
      };
    }).filter(a => (a.actId || a.name) && a.finish);

    // A summary/rollup row spans its children, so counting it double-counts
    // the work and inflates the slip count. Two signals: MS Project indents
    // children under their parent, and a summary's date span contains theirs.
    for(let i = 0; i < acts.length; i++){
      const next = acts[i+1];
      if(next && next.indent > acts[i].indent){ acts[i].isSummary = true; summaryRows++; continue; }
      // Fallback for exports that lost indentation: a row whose span strictly
      // contains the next two rows' spans is a parent, not a work item.
      if(!next || acts[i].indent !== 0) continue;
      const a = acts[i], b = acts[i+1], c = acts[i+2];
      if(!c || b.indent !== 0 || c.indent !== 0) continue;
      const as = parseDate(a.start), af = parseDate(a.finish);
      const bs = parseDate(b.start), bf = parseDate(b.finish);
      const cs = parseDate(c.start), cf = parseDate(c.finish);
      if(as && af && bs && bf && cs && cf &&
         as <= bs && af >= bf && as <= cs && af >= cf &&
         (af - as) > (bf - bs) && (af - as) > (cf - cs)){
        a.isSummary = true; summaryRows++;
      }
    }
    const leaf = acts.filter(a => !a.isSummary);

    if(typeof applyFlagRules === "function") { state.schedule = state.schedule || {}; }

    // Slip detection against the previous upload.
    const slipped = [], pulled = [];
    for(const a of leaf){
      const p = prior[delayKey(a)];
      if(!p || !p.finish || !a.finish) continue;
      const d1 = parseDate(p.finish), d2 = parseDate(a.finish);
      if(!d1 || !d2) continue;
      a.priorFinish = p.finish;
      a.slipDays = Math.round((d2 - d1) / 86400000);
      if(a.slipDays > 0) slipped.push(a);
      else if(a.slipDays < 0) pulled.push(a);
    }

    state.schedule = {
      fileName: file.name, sheet: best.name, headerRow: headerRow + 1,
      uploadedAt: new Date().toLocaleString(),
      activities: leaf, allRows: acts.length, warnings,
      priorFileName: (state.schedule || {}).fileName || null
    };

    if(typeof applyFlagRules === "function") applyFlagRules();

    // Open a delay record for each slip so it can be attributed.
    slipped.forEach(a => logDelay(a, a.slipDays, a.priorFinish));

    addAudit("Schedule Intake","Schedule Uploaded",
      `${file.name} — ${leaf.length} activities (${summaryRows} summary row(s) excluded), ` +
      `${leaf.filter(a=>a.critical).length} critical` +
      (slipped.length ? `, ${slipped.length} slipped` : "") +
      (pulled.length ? `, ${pulled.length} pulled in` : "") + ".");

    if(badDates){
      warnings.push(`${badDates} row(s) had a finish date that couldn't be read and were skipped.`);
    }

    if(slipped.length){
      const crit = slipped.filter(a => a.critical);
      const worst = slipped.slice().sort((a,b) => b.slipDays - a.slipDays)[0];
      state.packets.push({
        id: uid("PKT"), type:"schedule",
        title: `Schedule Slip — ${slipped.length} activit${slipped.length===1?"y":"ies"}, worst ${worst.slipDays}d`,
        summary: `${file.name} vs the prior upload: ${slipped.length} activities moved later` +
          (crit.length ? `, ${crit.length} on the critical path` : "") +
          `. Worst is ${worst.name} at ${worst.slipDays} days. Attribute each slip on the Schedule Risk page — ` +
          `notice clocks start from detection, not from when you get around to it.`,
        score: crit.length ? 96 : 80,
        moneyAtRisk: 0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
        raw:{ scheduleUpload:true, fileName:file.name, slipped:slipped.slice(0,25).map(a=>({
              actId:a.actId, name:a.name, priorFinish:a.priorFinish, finish:a.finish,
              slipDays:a.slipDays, critical:a.critical })) }
      });
    }

    save(); renderAll(); navigate(slipped.length ? "scheduleRisk" : "schedule");
    toast(`Schedule loaded: ${leaf.length} activities` +
      (slipped.length ? `, ${slipped.length} slipped — attribute them on Schedule Risk.` : ".") +
      (warnings.length ? ` ${warnings.length} warning(s).` : ""), slipped.length ? "bad" : "");
  }catch(err){
    toast("Schedule upload failed: " + err.message, "bad");
    addAudit("Schedule Intake","Upload Failed", `${file.name} — ${err.message}`);
    save(); renderAll(); navigate("schedule");
  }
}

/* ---------- schedule risk page ---------- */

function delayRow(d){
  const e = PARTY_ENTITLEMENT[d.party] || PARTY_ENTITLEMENT.unknown;
  const left = noticeDaysLeft(d);
  const noticeCls = d.noticeGiven ? "cell-good" : (left !== null && left < 0 ? "cell-late" : "");
  const noticeTxt = d.noticeGiven
    ? `given ${esc(d.noticeDate||"")}`
    : (!e.compensable ? "—" : (left === null ? "—" : (left < 0 ? `${Math.abs(left)}d OVERDUE` : `${left}d left`)));
  return `<tr>
    <td>${esc(d.actId||"—")}<br><small>${esc((d.name||"").slice(0,40))}</small></td>
    <td>${esc(d.priorFinish||"—")} → <b>${esc(d.newFinish||"—")}</b><br>
        <small class="${d.critical?"cell-late":""}">${d.slipDays>0?"+":""}${d.slipDays}d${d.critical?" · CRITICAL":""}</small></td>
    <td><select class="mini-select" onchange="updateDelay('${esc(d.id)}','party',this.value)">
        ${DELAY_PARTIES.map(([k,label])=>`<option value="${k}"${k===d.party?" selected":""}>${esc(label)}</option>`).join("")}
      </select><br><small>${esc(e.note)}</small></td>
    <td><input class="cell-input" value="${esc(d.cause)}" placeholder="gear delivery slipped"
        onchange="updateDelay('${esc(d.id)}','cause',this.value)"></td>
    <td>${e.excusable?'<span class="badge badge-ok">Excusable</span>':'<span class="badge badge-warn">Not excusable</span>'}
        ${e.compensable?'<span class="badge badge-ok">Compensable</span>':""}</td>
    <td class="${noticeCls}">
      <label class="chk"><input type="checkbox" ${d.noticeGiven?"checked":""}
        onchange="updateDelay('${esc(d.id)}','noticeGiven',this.checked)"> notice</label>
      <br><small>${noticeTxt}</small></td>
    <td><input class="cell-input" type="number" step="500" value="${d.costImpact||0}"
        onchange="updateDelay('${esc(d.id)}','costImpact',this.value)"></td>
    <td><button class="action danger" onclick="deleteDelay('${esc(d.id)}')">Remove</button></td>
  </tr>`;
}

function renderScheduleRisk(){
  const list = (state.delays || []).slice().reverse();
  const r = delayRollup();
  const partyRows = DELAY_PARTIES.filter(([k]) => r.byParty[k])
    .map(([k,label]) => {
      const e = PARTY_ENTITLEMENT[k];
      return `<tr><td>${esc(label)}</td><td>${r.byParty[k]}d</td>
        <td>${e.excusable?"Yes":"No"}</td><td>${e.compensable?"Yes":"No"}</td></tr>`;
    }).join("");

  renderPage("scheduleRisk","Schedule Risk & Delay Attribution",
    "Every slip detected on upload lands here. A date moving isn't the story — who moved it, and whether you're owed time or money for it, is.",
    `<div class="grid four">
      <div class="card kpi"><span>Delay Records</span><strong>${r.total}</strong></div>
      <div class="card kpi"><span>Total Days Slipped</span><strong>${r.days}</strong></div>
      <div class="card kpi"><span>On Critical Path</span><strong>${r.critical}</strong></div>
      <div class="card kpi"><span>Unattributed</span><strong class="${r.unattributed?"neg":""}">${r.unattributed}</strong></div>
    </div>

    <div class="grid four" style="margin-top:16px">
      <div class="card kpi"><span>Compensable Days</span><strong class="pos">${r.compensableDays}</strong></div>
      <div class="card kpi"><span>Excusable Days</span><strong>${r.excusableDays}</strong></div>
      <div class="card kpi"><span>Our Own Days</span><strong class="${r.ownDays?"neg":""}">${r.ownDays}</strong></div>
      <div class="card kpi"><span>Notice Overdue</span><strong class="${r.noticeOverdue?"neg":""}">${r.noticeOverdue}</strong></div>
    </div>

    ${r.noticeOverdue || r.noticeDue ? `<div class="card panel" style="margin-top:18px;border-color:rgba(201,37,37,.45)">
      <h2>Notice Clock</h2>
      <p class="sub">${r.noticeOverdue ? `<b>${r.noticeOverdue} compensable delay(s) are past the ${noticeWindowDays()}-day notice window.</b> ` : ""}
      ${r.noticeDue ? `${r.noticeDue} more come due within 3 days. ` : ""}
      Your contract sets written notice at <b>${noticeWindowDays()} days</b> of a delay event. Miss the window and a
      well-documented, clearly compensable delay becomes unrecoverable on a technicality. Check your specific contract —
      ${((state.contract||{}).terms||{}).noticeDays && state.contract.terms.noticeDays.confirmed ? 'Taken from your uploaded contract.' : 'This is the 7-day default — upload the contract so this reflects your actual terms.'}</p>

/* ===========================================================================
   Ωboy V0.25.0 — Constraints & Flag Rules
   ---------------------------------------------------------------------------
   A CPM schedule shows durations and logic. It does not know that switchgear is
   38 weeks out, that prefab needs 6 weeks of shop time before it ships, or that
   nobody pours in February. That knowledge lives in the PM's head, which means
   it surfaces as a crisis rather than a plan.

   Two mechanisms:

   CONSTRAINTS — a lead time attached to the work it feeds. OhmBoy walks the
   activity's start date backwards by the lead time to get a must-release-by
   date, then compares that to today. Negative slack means the order is already
   late and the schedule doesn't know yet.

   FLAG RULES — keyword patterns the PM defines. Every schedule upload scans
   activity names and descriptions, and anything matching gets flagged with a
   party, a risk category, and a severity. This is how "energize", "tie-in",
   "outage", or a specific vendor's name become automatic watch items instead
   of something you have to remember to look for.
   =========================================================================== */

const CONSTRAINT_TYPES = [
  ["vendor",     "Vendor Lead Time",   "Gear, switchgear, transformers, cable, devices."],
  ["prefab",     "Prefab / Shop Time", "Shop fabrication and kitting before it ships."],
  ["submittal",  "Submittal / Approval","Approval cycle before release for fabrication."],
  ["permit",     "Permit / Inspection","AHJ review, permit issue, inspection scheduling."],
  ["utility",    "Utility Coordination","POCO scheduling, service, metering, outages."],
  ["weather",    "Weather Window",     "Seasonal restriction on when work can happen."],
  ["access",     "Site Access",        "Area not available until another trade clears."],
  ["longlead",   "Other Long Lead",    "Anything else with a release-by date."]
];

const RISK_CATEGORIES = [
  ["procurement","Procurement"], ["labor","Labor"], ["access","Access / Coordination"],
  ["design","Design / RFI"], ["safety","Safety / Outage"], ["commercial","Commercial"],
  ["weather","Weather"], ["quality","Quality / Inspection"]
];

const SEVERITIES = [["high","High"],["medium","Medium"],["low","Low"]];

/* Seeded rules — an electrical PM's usual suspects. All editable and
   deletable; they're a starting point, not a fixed list. */
function defaultFlagRules(){
  return [
    { id:uid("RULE"), term:"energize", category:"safety", party:"utility", severity:"high", enabled:true,
      note:"Energization needs utility coordination, switching order, and an approved outage window." },
    { id:uid("RULE"), term:"tie-in|tie in|cutover|changeover", category:"safety", party:"gc", severity:"high", enabled:true,
      note:"Tie-ins usually require an outage and building occupant coordination." },
    { id:uid("RULE"), term:"outage|shutdown", category:"safety", party:"owner", severity:"high", enabled:true,
      note:"Outage windows are scarce, scheduled far ahead, and painful to move." },
    { id:uid("RULE"), term:"switchgear|swbd|switchboard|MSB", category:"procurement", party:"vendor", severity:"high", enabled:true,
      note:"Long-lead gear. Confirm the release date and the approved submittal." },
    { id:uid("RULE"), term:"transformer|xfmr", category:"procurement", party:"vendor", severity:"high", enabled:true,
      note:"Transformers run long and have gotten worse. Verify the ship date." },
    { id:uid("RULE"), term:"generator|genset|ATS", category:"procurement", party:"vendor", severity:"high", enabled:true,
      note:"Emergency power equipment. Long lead and inspection-sensitive." },
    { id:uid("RULE"), term:"inspection|AHJ|final accept", category:"quality", party:"gc", severity:"medium", enabled:true,
      note:"Inspection dates are set by others and rarely move in your favour." },
    { id:uid("RULE"), term:"commission|startup|start-up|acceptance test|L[1-5] test", category:"quality", party:"owner", severity:"high", enabled:true,
      note:"Commissioning is where compressed schedules come apart." },
    { id:uid("RULE"), term:"trench|excavat|duct bank|underground", category:"weather", party:"weather", severity:"medium", enabled:true,
      note:"Weather-exposed and dependent on ground conditions." },
    { id:uid("RULE"), term:"core drill|penetrat|x-ray", category:"access", party:"gc", severity:"medium", enabled:true,
      note:"Needs structural sign-off and usually off-hours access." }

/* ---------- constraints ---------- */

function addConstraint(){
  const desc = val("cnDesc","").trim();
  if(!desc){ toast("The constraint needs a description.","bad"); return; }
  const weeks = Number(val("cnWeeks",0)) || 0;
  const c = {
    id: uid("CON"),
    type: val("cnType","vendor"),
    description: desc,
    vendor: val("cnVendor","").trim(),
    leadWeeks: weeks,
    // Which schedule activity this feeds. Either an exact ID or a keyword the
    // activity name contains — a keyword survives schedule renumbering.
    activityId: val("cnActId","").trim(),
    matchTerm: val("cnMatch","").trim(),
    poNumber: val("cnPO","").trim(),
    released: false,
    releasedDate: "",
    confirmedShipDate: val("cnShip",""),
    severity: val("cnSeverity","high"),
    notes: val("cnNotes","").trim(),
    createdAt: new Date().toLocaleString()
  };
  state.constraints = state.constraints || [];
  state.constraints.push(c);
  addAudit("Constraints","Constraint Added",
    `${c.description} — ${c.leadWeeks} week lead${c.vendor?` from ${c.vendor}`:""}.`);
  save(); renderAll(); navigate("constraints");
  const ev = evaluateConstraint(c);
  toast(ev.orderBy
    ? `Added. Must release by ${ev.orderBy}${ev.slackDays<0?` — already ${Math.abs(ev.slackDays)} days late.`:` (${ev.slackDays} days of slack).`}`
    : "Added. Link it to a schedule activity to get a release-by date.",
    ev.slackDays < 0 ? "bad" : "");
}

function updateConstraint(id, field, value){
  const c = (state.constraints||[]).find(x => x.id === id);
  if(!c) return;
  if(field === "leadWeeks") value = Number(value) || 0;
  if(field === "released"){
    value = !!value;
    if(value && !c.releasedDate) c.releasedDate = todayISO();
    if(!value) c.releasedDate = "";
  }
  c[field] = value;
  if(field === "released"){
    addAudit("Constraints", value ? "Constraint Released" : "Release Cleared",
      `${c.description}${value?` released ${c.releasedDate}`:""}.`);
  }
  save(); renderAll(); navigate("constraints");
}

function deleteConstraint(id){
  const c = (state.constraints||[]).find(x => x.id === id);
  if(!c) return;
  if(!confirmAction(`Delete constraint "${c.description}"?`)) return;
  state.constraints = state.constraints.filter(x => x.id !== id);
  addAudit("Constraints","Constraint Deleted", c.description);
  save(); renderAll(); navigate("constraints");
}

/* Finds the schedule activity a constraint feeds. */
function constraintActivity(c){
  const acts = (state.schedule || {}).activities || [];
  if(c.activityId){
    const byId = acts.find(a => a.actId && a.actId.toLowerCase() === c.activityId.toLowerCase());
    if(byId) return byId;
  }
  if(c.matchTerm){
    const t = c.matchTerm.toLowerCase();
    // Earliest matching activity — that's the one the lead time has to beat.
    const hits = acts.filter(a => (a.name||"").toLowerCase().includes(t) && a.start);
    if(hits.length){
      return hits.sort((x,y) => (parseDate(x.start)||0) - (parseDate(y.start)||0))[0];
    }
  }
  return null;
}

/* The whole point: walk back from when the work starts to when the order has
   to leave, then compare that to today. */
function evaluateConstraint(c){
  const act = constraintActivity(c);
  const needBy = act ? parseDate(act.start) : null;
  const out = {
    activity: act,
    needBy: act ? act.start : "",
    orderBy: "", slackDays: null, status: "unlinked", critical: !!(act && act.critical)
  };
  if(!needBy) return out;

  const orderBy = new Date(needBy.getTime() - (c.leadWeeks * 7 * 86400000));
  out.orderBy = orderBy.toISOString().slice(0,10);

  if(c.released){
    out.status = "released";
    // Released, but did the confirmed ship date beat the need-by?
    if(c.confirmedShipDate){
      const ship = parseDate(c.confirmedShipDate);
      if(ship){
        out.shipVsNeed = Math.round((needBy - ship) / 86400000);
        if(out.shipVsNeed < 0) out.status = "late-ship";
      }
    }
    return out;
  }

  const today = new Date(); today.setHours(0,0,0,0);
  out.slackDays = Math.round((orderBy - today) / 86400000);
  out.status = out.slackDays < 0 ? "overdue" : (out.slackDays <= 14 ? "urgent" : "ok");
  return out;
}

function constraintRollup(){
  const list = state.constraints || [];
  const r = { total:list.length, overdue:0, urgent:0, ok:0, released:0, unlinked:0, lateShip:0, criticalAtRisk:0 };
  for(const c of list){
    const e = evaluateConstraint(c);
    if(e.status === "overdue"){ r.overdue++; if(e.critical) r.criticalAtRisk++; }
    else if(e.status === "urgent"){ r.urgent++; if(e.critical) r.criticalAtRisk++; }
    else if(e.status === "released") r.released++;
    else if(e.status === "late-ship"){ r.lateShip++; if(e.critical) r.criticalAtRisk++; }
    else if(e.status === "unlinked") r.unlinked++;
    else r.ok++;
  }
  return r;
}

/* ---------- flag rules ---------- */

function addFlagRule(){
  const term = val("frTerm","").trim();
  if(!term){ toast("Enter a keyword or pattern to match.","bad"); return; }
  state.flagRules = state.flagRules || [];
  state.flagRules.push({
    id: uid("RULE"),
    term,
    category: val("frCategory","procurement"),
    party: val("frParty","gc"),
    severity: val("frSeverity","medium"),
    enabled: true,
    note: val("frNote","").trim()
  });
  addAudit("Flag Rules","Rule Added", `"${term}" → ${val("frSeverity","medium")} ${val("frCategory","procurement")}.`);
  save(); renderAll(); navigate("constraints");
  const hits = applyFlagRules();
  toast(`Rule added. ${hits} activit${hits===1?"y":"ies"} flagged on the current schedule.`);
}

function updateFlagRule(id, field, value){
  const r = (state.flagRules||[]).find(x => x.id === id);
  if(!r) return;
  r[field] = field === "enabled" ? !!value : value;
  applyFlagRules();
  save(); renderAll(); navigate("constraints");
}

function deleteFlagRule(id){
  const r = (state.flagRules||[]).find(x => x.id === id);
  if(!r) return;
  if(!confirmAction(`Delete the rule matching "${r.term}"?`)) return;
  state.flagRules = state.flagRules.filter(x => x.id !== id);
  addAudit("Flag Rules","Rule Deleted", r.term);
  applyFlagRules();
  save(); renderAll(); navigate("constraints");
}

function resetFlagRules(){
  if(!confirmAction("Replace all flag rules with the default electrical set? Your custom rules will be lost.")) return;
  state.flagRules = defaultFlagRules();
  applyFlagRules();
  addAudit("Flag Rules","Rules Reset","Restored the default electrical rule set.");
  save(); renderAll(); navigate("constraints");
}

/* Rules are stored as text but matched as regex, so "tie-in|cutover" works.
   A malformed pattern falls back to a literal substring match rather than
   throwing and taking the whole upload down with it. */
function ruleMatcher(term){
  try{ return new RegExp(term, "i"); }
  catch(e){
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    return new RegExp(escaped, "i");
  }
}

function applyFlagRules(){
  const acts = (state.schedule || {}).activities || [];
  const rules = (state.flagRules || []).filter(r => r.enabled);
  let count = 0;
  for(const a of acts){
    const hay = [a.name, a.resource, a.actId].filter(Boolean).join(" ");
    a.flags = [];
    for(const r of rules){
      if(ruleMatcher(r.term).test(hay)){
        a.flags.push({ ruleId:r.id, term:r.term, category:r.category, party:r.party, severity:r.severity, note:r.note });
      }
    }
    if(a.flags.length) count++;
  }
  return count;
}

function flaggedActivities(){
  const acts = (state.schedule || {}).activities || [];
  return acts.filter(a => (a.flags||[]).length)
    .sort((a,b) => {
      const rank = f => f.some(x => x.severity === "high") ? 0 : (f.some(x => x.severity === "medium") ? 1 : 2);
      const d = rank(a.flags) - rank(b.flags);
      if(d) return d;
      return (parseDate(a.start) || 0) - (parseDate(b.start) || 0);
    });
}

/* ---------- risk board ---------- */

function riskBoard(){
  const items = [];
  const today = new Date(); today.setHours(0,0,0,0);

  for(const c of (state.constraints || [])){
    const e = evaluateConstraint(c);
    if(e.status === "overdue"){
      items.push({ severity:"high", kind:"Procurement",
        title:`${c.description} — release date passed`,
        detail:`Needs ${c.leadWeeks} weeks. Should have been released ${e.orderBy}, which was ${Math.abs(e.slackDays)} days ago. Work starts ${e.needBy}${e.critical?" and is on the critical path":""}.`,
        action:"navigate('constraints')" });
    } else if(e.status === "urgent"){
      items.push({ severity: e.critical ? "high" : "medium", kind:"Procurement",
        title:`${c.description} — release within ${e.slackDays} day(s)`,
        detail:`${c.leadWeeks} week lead${c.vendor?` from ${c.vendor}`:""}. Release by ${e.orderBy} to hold the ${e.needBy} start.`,
        action:"navigate('constraints')" });
    } else if(e.status === "late-ship"){
      items.push({ severity:"high", kind:"Procurement",
        title:`${c.description} — confirmed ship date lands after it's needed`,
        detail:`Vendor confirmed ${c.confirmedShipDate}; work starts ${e.needBy}. That's ${Math.abs(e.shipVsNeed)} days short even though the PO is released.`,
        action:"navigate('constraints')" });
    }
  }

  for(const a of flaggedActivities()){
    const worst = a.flags.find(f => f.severity === "high") || a.flags[0];
    const start = parseDate(a.start);
    const daysOut = start ? Math.round((start - today) / 86400000) : null;
    // Only surface flagged work that's actually approaching or in progress.
    if(daysOut !== null && daysOut > 60) continue;
    if(a.pct >= 100) continue;
    items.push({
      severity: worst.severity === "high" && (a.critical || (daysOut !== null && daysOut <= 21)) ? "high" : worst.severity,
      kind: (RISK_CATEGORIES.find(c => c[0] === worst.category) || [,worst.category])[1],
      title: `${a.name}${a.critical ? " (critical path)" : ""}`,
      detail: `${daysOut === null ? "" : (daysOut < 0 ? `Started ${Math.abs(daysOut)} days ago` : `Starts in ${daysOut} days`)} · matched "${worst.term}". ${worst.note || ""}`,
      action: "navigate('schedule')"
    });
  }

  for(const d of (state.delays || [])){
    const e = PARTY_ENTITLEMENT[d.party] || PARTY_ENTITLEMENT.unknown;
    if(e.compensable && !d.noticeGiven){
      const left = noticeDaysLeft(d);
      if(left !== null && left <= 3){
        items.push({ severity:"high", kind:"Commercial",
          title:`Notice ${left < 0 ? "overdue" : "due"} — ${d.actId || d.name}`,
          detail:`${d.slipDays} day compensable delay attributed to ${(DELAY_PARTIES.find(p=>p[0]===d.party)||[,d.party])[1]}. ${left<0?`Notice window closed ${Math.abs(left)} days ago.`:`${left} day(s) left to give written notice.`}`,
          action:"navigate('scheduleRisk')" });
      }
    }
  }

  const order = { high:0, medium:1, low:2 };
  return items.sort((a,b) => order[a.severity] - order[b.severity]);
}

/* ---------- render ---------- */

function constraintRow(c){
  const e = evaluateConstraint(c);
  const badge = {
    overdue:'<span class="badge badge-warn">RELEASE OVERDUE</span>',
    urgent:'<span class="badge badge-warn">RELEASE NOW</span>',
    "late-ship":'<span class="badge badge-warn">SHIPS LATE</span>',
    released:'<span class="badge badge-ok">RELEASED</span>',
    ok:'<span class="badge">ON TRACK</span>',
    unlinked:'<span class="badge">NOT LINKED</span>'
  }[e.status];
  const typeLabel = (CONSTRAINT_TYPES.find(t => t[0] === c.type) || [,c.type])[1];
  return `<tr>
    <td>${esc(c.description)}<br><small>${esc(typeLabel)}${c.vendor?` · ${esc(c.vendor)}`:""}${c.poNumber?` · ${esc(c.poNumber)}`:""}</small></td>
    <td><input class="cell-input" type="number" min="0" step="1" value="${c.leadWeeks}"
        onchange="updateConstraint('${esc(c.id)}','leadWeeks',this.value)"> wk</td>
    <td>${e.activity ? `${esc(e.activity.name.slice(0,34))}<br><small>${esc(e.needBy)}${e.critical?" · CRITICAL":""}</small>`
        : `<small>${c.activityId||c.matchTerm ? "no match in the loaded schedule" : "not linked"}</small>`}</td>
    <td>${e.orderBy ? `<b>${esc(e.orderBy)}</b>` : "—"}</td>
    <td class="${e.slackDays!==null && e.slackDays<0 ? "cell-late" : (e.slackDays!==null && e.slackDays<=14 ? "cell-late" : "")}">
        ${e.slackDays===null ? "—" : (e.slackDays<0 ? `${Math.abs(e.slackDays)}d LATE` : `${e.slackDays}d`)}</td>
    <td>${badge}</td>
    <td><label class="chk"><input type="checkbox" ${c.released?"checked":""}
        onchange="updateConstraint('${esc(c.id)}','released',this.checked)"> released</label>
        ${c.released?`<br><small>${esc(c.releasedDate||"")}</small>`:""}</td>
    <td><button class="action danger" onclick="deleteConstraint('${esc(c.id)}')">Delete</button></td>
  </tr>`;
}

function flagRuleRow(r){
  const acts = (state.schedule||{}).activities || [];
  const hits = acts.filter(a => (a.flags||[]).some(f => f.ruleId === r.id)).length;
  return `<tr>
    <td><input class="cell-input wide" value="${esc(r.term)}"
        onchange="updateFlagRule('${esc(r.id)}','term',this.value)"></td>

/* ===========================================================================
   Ωboy V0.25.0 — Contract intake
   ---------------------------------------------------------------------------
   The delay notice clock has been running on a hardcoded 7 days. That number
   is a common default, not a rule — your subcontract governs it, and being
   wrong about it is exactly the kind of error that loses a defensible claim.

   This reads the executed contract, mines the terms that drive OhmBoy's math,
   and lets the PM confirm each one. Confirmed values then feed the notice
   clock, the SOV retainage default, and the LD exposure calculation.

   Everything extracted is a PROPOSAL. Nothing takes effect until the PM
   accepts it. A regex is not a lawyer and this is not legal advice — it finds
   candidate clauses and shows the surrounding text so a human can check.
   =========================================================================== */

function contractDefaults(){
  return {
    fileName:null, uploadedAt:null, textLength:0,
    terms:{
      noticeDays:{ value:7, source:"default", confirmed:false, quote:"" },
      retainagePct:{ value:10, source:"default", confirmed:false, quote:"" },
      ldPerDay:{ value:0, source:"default", confirmed:false, quote:"" },
      paymentDays:{ value:30, source:"default", confirmed:false, quote:"" },
      coMarkupPct:{ value:0, source:"default", confirmed:false, quote:"" },
      contractValue:{ value:0, source:"default", confirmed:false, quote:"" },
      substantialCompletion:{ value:"", source:"default", confirmed:false, quote:"" },
      warrantyMonths:{ value:12, source:"default", confirmed:false, quote:"" }
    },
    candidates:{}, flags:[]
  };
}

const TERM_LABELS = {
  noticeDays:["Delay Notice Window","days","Days after a delay event to give written notice. Drives the notice clock on Schedule Risk."],
  retainagePct:["Retainage","%","Withheld from each payment. Sets the SOV default."],
  ldPerDay:["Liquidated Damages","$/day","Daily damages for late completion. Drives LD exposure."],
  paymentDays:["Payment Terms","days","Net days from invoice. Used for cash timing."],
  coMarkupPct:["Change Order Markup","%","Allowed overhead and profit on changes."],
  contractValue:["Contract Value","$","Cross-checked against the SOV total."],
  substantialCompletion:["Substantial Completion","date","Milestone that stops LDs running."],
  warrantyMonths:["Warranty Period","months","From substantial completion."]
};

/* Each pattern returns candidates with the surrounding sentence, so the PM can
   see the language rather than trusting a bare number. Contracts state the
   same term several ways; every hit is offered and the PM picks. */
const CLAUSE_PATTERNS = {
  noticeDays: [
    /within\s+(\w+|\d+)\s*\(?\s*(\d+)?\s*\)?\s*(?:calendar\s+|working\s+|business\s+)?days?[^.]{0,120}?(?:written\s+)?notice/gi,
    /(?:written\s+)?notice[^.]{0,100}?within\s+(\w+|\d+)\s*\(?\s*(\d+)?\s*\)?\s*(?:calendar\s+|working\s+|business\s+)?days?/gi,
    /notice\s+of\s+(?:any\s+)?(?:delay|claim)[^.]{0,120}?(\d+)\s*days?/gi
  ],
  retainagePct: [
    /retain(?:age|ed)?[^.]{0,90}?(\d{1,2}(?:\.\d+)?)\s*(?:%|percent)/gi,
    /(\d{1,2}(?:\.\d+)?)\s*(?:%|percent)[^.]{0,60}?retain/gi
  ],
  ldPerDay: [
    /liquidated damages[^.]{0,140}?\$\s*([\d,]+(?:\.\d{2})?)/gi,
    /\$\s*([\d,]+(?:\.\d{2})?)\s*(?:per|\/|each)\s*(?:calendar\s+)?day[^.]{0,90}?(?:delay|damages|late)/gi
  ],
  paymentDays: [
    /(?:net|within)\s+(\d{1,3})\s*(?:calendar\s+)?days?[^.]{0,90}?(?:payment|invoice|pay\s+app)/gi,
    /payment[^.]{0,90}?within\s+(\d{1,3})\s*(?:calendar\s+)?days?/gi
  ],
  coMarkupPct: [
    /(?:overhead and profit|markup|mark-up)[^.]{0,90}?(\d{1,2}(?:\.\d+)?)\s*(?:%|percent)/gi,
    /(\d{1,2}(?:\.\d+)?)\s*(?:%|percent)[^.]{0,70}?(?:overhead and profit|markup|mark-up)/gi
  ],
  contractValue: [
    /(?:contract\s+(?:sum|price|amount|value)|total\s+(?:sum|price))[^.]{0,90}?\$\s*([\d,]+(?:\.\d{2})?)/gi
  ],
  warrantyMonths: [
    // "warrants" as well as "warranty", and the clause usually follows a
    // heading like "ARTICLE 18 - WARRANTY." so the pattern has to cross that
    // period. Contracts write "twenty four (24) months" — take the digits.
    /warrant\w*[^\n]{0,140}?\((\d{1,3})\)\s*(month|year)s?/gi,
    /warrant\w*[^\n]{0,140}?(\d{1,3})\s*(month|year)s?/gi
  ],
  substantialCompletion: [
    /substantial completion[^.]{0,120}?((?:\d{1,2}\/\d{1,2}\/\d{2,4})|(?:[A-Z][a-z]+ \d{1,2},? \d{4})|(?:\d{4}-\d{2}-\d{2}))/gi
  ]
};

const WORD_NUMBERS = { one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  eleven:11,twelve:12,fourteen:14,fifteen:15,twenty:20,thirty:30,sixty:60,ninety:90 };

function clauseNumber(raw){
  if(raw === undefined || raw === null) return NaN;
  const s = String(raw).trim().toLowerCase();
  if(WORD_NUMBERS[s] !== undefined) return WORD_NUMBERS[s];
  const n = parseFloat(s.replace(/,/g,""));
  return isFinite(n) ? n : NaN;
}

function contextAround(text, index, span){
  const start = Math.max(0, index - 90);
  const end = Math.min(text.length, index + (span || 0) + 150);
  return text.slice(start, end).replace(/\s+/g," ").trim();
}

function mineContract(raw){
  // Extracted PDF text is broken by newlines wherever the layout wrapped, which
  // splits clauses that [^.] patterns expect to be contiguous. Collapse all
  // whitespace first so a clause spanning three lines still matches as one.
  const text = String(raw).replace(/\s+/g, " ");
  const out = {};
  for(const [term, patterns] of Object.entries(CLAUSE_PATTERNS)){
    const hits = [];
    for(const re of patterns){
      re.lastIndex = 0;
      let m;
      while((m = re.exec(text))){
        // Some patterns capture "thirty (30)" — prefer the digits in group 2.
        let v = (term === "warrantyMonths")
          ? clauseNumber(m[1])
          : clauseNumber(m[2] !== undefined && m[2] !== "" ? m[2] : m[1]);
        if(term === "substantialCompletion") v = m[1];
        else if(!isFinite(v)) continue;

        if(term === "warrantyMonths"){
          const unit = (m[2] || "");
          if(/year/i.test(unit) && v <= 10) v = v * 12;
        }

        // Reject values outside plausible ranges — contracts are full of
        // numbers and a loose regex will happily grab a section number.
        const sane = {
          noticeDays: v => v >= 1 && v <= 90,
          retainagePct: v => v >= 0 && v <= 25,
          paymentDays: v => v >= 1 && v <= 180,
          coMarkupPct: v => v >= 0 && v <= 50,
          warrantyMonths: v => v >= 1 && v <= 120,
          ldPerDay: v => v > 0,
          contractValue: v => v > 1000
        }[term];
        if(sane && !sane(v)) continue;

        const quote = contextAround(text, m.index, m[0].length);
        if(hits.some(h => h.value === v && h.quote === quote)) continue;
        hits.push({ value:v, quote });
        if(hits.length >= 6) break;
      }
    }
    if(hits.length) out[term] = hits;
  }
  return out;
}

async function handleContractUpload(){
  const el = $("contractFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose the contract PDF first.","bad"); return; }
  toast("Reading contract…");
  try{
    const r = await DWG.analyze(file);        // same zero-dependency PDF reader
    if(!r.ok) throw new Error(r.error);
    if(r.scanned){
      state.contract = state.contract || contractDefaults();
      state.contract.fileName = file.name;
      state.contract.uploadedAt = new Date().toLocaleString();
      state.contract.scanned = true;
      state.contract.candidates = {};
      addAudit("Contract","Scanned Contract — No Text Layer",
        `${file.name} has no text layer. Terms must be entered manually.`);
      save(); renderAll(); navigate("contract");
      toast("That PDF is a scan with no text layer — nothing to read. Enter the terms manually below.","bad");
      return;
    }

    // DWG.analyze truncates its sample; re-extract the full text for mining.
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let src = ""; const chunk = 0x8000;
    for(let i = 0; i < bytes.length; i += chunk) src += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
    const full = await DWG.extractFullText(bytes, src);

    const candidates = mineContract(full);
    const prior = state.contract || contractDefaults();
    state.contract = {
      ...contractDefaults(),
      terms: prior.terms,
      fileName: file.name,
      uploadedAt: new Date().toLocaleString(),
      textLength: full.length,
      pages: r.pages,
      scanned: false,
      candidates
    };

    // Pre-fill unconfirmed terms with the first plausible hit. Confirmed terms
    // are left alone — a re-upload shouldn't silently overwrite the PM's call.
    let proposed = 0;
    for(const [term, hits] of Object.entries(candidates)){
      const t = state.contract.terms[term];
      if(!t || t.confirmed) continue;
      t.value = hits[0].value;
      t.source = "extracted";
      t.quote = hits[0].quote;
      proposed++;
    }

    addAudit("Contract","Contract Uploaded",
      `${file.name} — ${full.length} chars, ${proposed} term(s) proposed from ${Object.keys(candidates).length} clause type(s). Awaiting PM confirmation.`);
    save(); renderAll(); navigate("contract");
    toast(`${proposed} term(s) found. Confirm each one — they drive the notice clock and retainage.`);
  }catch(err){
    toast("Contract read failed: " + err.message, "bad");
    addAudit("Contract","Upload Failed", `${file.name} — ${err.message}`);
    save();
  }
}

function setContractTerm(term, value, confirm){
  state.contract = state.contract || contractDefaults();
  const t = state.contract.terms[term];
  if(!t) return;
  if(value !== undefined && value !== null){
    t.value = term === "substantialCompletion" ? value : (Number(value) || 0);
    if(t.source === "default") t.source = "manual";
  }
  if(confirm !== undefined){
    t.confirmed = !!confirm;
    if(t.confirmed){
      addAudit("Contract","Term Confirmed",
        `${TERM_LABELS[term][0]} = ${t.value} ${TERM_LABELS[term][1]} (${t.source}).`);
      // Confirmed terms take effect immediately.
      if(term === "retainagePct" && state.sov) state.sov.retainageDefault = t.value;
    }
  }
  save(); renderAll(); navigate("contract");
}

function pickCandidate(term, idx){
  const hits = ((state.contract||{}).candidates||{})[term] || [];
  const h = hits[idx];
  if(!h) return;
  const t = state.contract.terms[term];
  t.value = h.value; t.quote = h.quote; t.source = "extracted"; t.confirmed = false;
  save(); renderAll(); navigate("contract");
}

/* The notice clock and LD exposure now read from the contract. */
function contractNoticeDays(){
  const t = ((state.contract||{}).terms||{}).noticeDays;
  return t ? (Number(t.value) || 7) : 7;
}

function ldExposure(){
  const t = ((state.contract||{}).terms||{}).ldPerDay;
  const rate = t ? Number(t.value) || 0 : 0;
  if(!rate) return null;
  // Days we can't excuse are the ones that put completion at risk.
  const r = delayRollup();
  const unexcused = Math.max(0, r.days - r.excusableDays);
  return { rate, unexcused, exposure: rate * unexcused, totalDays: r.days, excusable: r.excusableDays };
}

function renderContract(){
  const c = state.contract || contractDefaults();
  const cands = c.candidates || {};
  const ld = ldExposure();
  const sovTotal = sovActive() ? sovRollup().revised : 0;
  const cv = c.terms.contractValue.value;
  const mismatch = cv && sovTotal && Math.abs(cv - sovTotal) > Math.max(1000, sovTotal * 0.01);

  const termCard = (key) => {
    const t = c.terms[key];
    const [label, unit, why] = TERM_LABELS[key];
    const hits = cands[key] || [];
    return `<div class="term-card ${t.confirmed?"confirmed":""}">
      <div class="term-head">
        <b>${esc(label)}</b>
        <span class="badge ${t.confirmed?"badge-ok":(t.source==="extracted"?"badge-warn":"")}">${t.confirmed?"CONFIRMED":(t.source==="extracted"?"PROPOSED":t.source.toUpperCase())}</span>
      </div>
      <p class="sub">${esc(why)}</p>
      <div class="term-row">
        <input class="cell-input" ${key==="substantialCompletion"?'type="date"':'type="number" step="any"'}
          value="${esc(String(t.value))}" onchange="setContractTerm('${key}',this.value)">
        <span class="term-unit">${esc(unit)}</span>
        <label class="chk"><input type="checkbox" ${t.confirmed?"checked":""}
          onchange="setContractTerm('${key}',undefined,this.checked)"> confirmed</label>
      </div>
      ${t.quote?`<div class="term-quote">…${esc(t.quote)}…</div>`:""}
      ${hits.length>1?`<div class="term-alts">${hits.length} candidate(s) found:
        ${hits.map((h,i)=>`<button class="action mini" onclick="pickCandidate('${key}',${i})">${esc(String(h.value))}</button>`).join("")}</div>`:""}
    </div>`;
  };

  renderPage("contract","Contract",
    "Upload the executed subcontract. OhmBoy proposes the terms that drive its math — you confirm each one before it takes effect.",
    `<div class="card panel upload-card">
      <h2>Upload Contract</h2>
      <p class="sub">PDF. OhmBoy reads the text and looks for the notice window, retainage, liquidated damages, payment terms, and change-order markup, showing the surrounding language for each so you can check it.</p>
      <div class="field full"><input id="contractFile" type="file" accept=".pdf"></div>
      <div class="takeoff-row-actions"><button class="action dark" onclick="handleContractUpload()">Read Contract</button></div>
      ${c.fileName?`<p class="sub" style="margin-top:10px">Loaded: <b>${esc(c.fileName)}</b>${c.pages?` · ${c.pages} page(s)`:""} · ${c.textLength.toLocaleString()} chars · ${esc(c.uploadedAt||"")}</p>`:""}
      <p class="sub" style="margin-top:10px"><b>Extraction is a proposal, not a reading.</b> A regex finds candidate clauses; it does not understand them, and it will miss terms buried in an exhibit or an incorporated document. Confirm every value against the contract yourself. Nothing here is legal advice.</p>
    </div>

    ${c.scanned?`<div class="card panel" style="margin-top:18px;border-color:rgba(201,37,37,.4)">
      <h2>No Text Layer</h2>
      <p class="sub">That PDF is a scan, so there's nothing to read. Enter the terms manually below — they still drive everything downstream.</p>
    </div>`:""}

    ${ld?`<div class="card panel" style="margin-top:18px;border-color:${ld.exposure>0?"rgba(201,37,37,.5)":"rgba(184,115,51,.35)"}">
      <h2>Liquidated Damages Exposure</h2>
      <p class="sub">At ${money(ld.rate)} per day, the ${ld.unexcused} unexcused day(s) of slip recorded so far carry
      <b>${money(ld.exposure)}</b> of LD exposure. ${ld.excusable} of the ${ld.totalDays} total slipped days are attributed to excusable causes.
      That split is only as good as your attribution — unattributed delay counts against you here.</p>
      <div class="takeoff-row-actions"><button class="action" onclick="navigate('scheduleRisk')">Open Schedule Risk</button></div>
    </div>`:""}

    ${mismatch?`<div class="card panel" style="margin-top:18px;border-color:rgba(201,37,37,.45)">
      <h2>Contract Value Doesn't Match the SOV</h2>
      <p class="sub">The contract states <b>${money(cv)}</b>; the Schedule of Values totals <b>${money(sovTotal)}</b> — a difference of ${money(Math.abs(cv-sovTotal))}.
      Either the SOV is incomplete, or approved change orders are on one and not the other.</p>
    </div>`:""}

    <div class="card panel" style="margin-top:18px">
      <h2>Contract Terms</h2>
      <p class="sub">Confirmed values take effect immediately: the notice window drives the Schedule Risk clock, retainage sets the SOV default, and LDs drive the exposure figure above.</p>
      <div class="term-grid">${Object.keys(TERM_LABELS).map(termCard).join("")}</div>
    </div>`);
}


/* J / K move through the triage queue without the mouse. Ignored while typing. */
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const onTriage = document.getElementById("triage").classList.contains("active");
  if (e.key === "Escape") { closeAlerts(); return; }
  if (!onTriage) return;
  if (e.key === "j" || e.key === "J" || e.key === "ArrowDown") { e.preventDefault(); stepTriage(1); }
  if (e.key === "k" || e.key === "K" || e.key === "ArrowUp")   { e.preventDefault(); stepTriage(-1); }
});

/* Word-level diff of two revision descriptions, so "REVISED FEEDER SCHEDULE"
   vs "REVISED FEEDER SCHEDULE PER RFI-014" shows what was added rather than
   reporting the whole line as changed. */
function wordDiff(a, b){
  const aw = String(a||"").split(/\s+/).filter(Boolean);
  const bw = String(b||"").split(/\s+/).filter(Boolean);
  const aSet = new Set(aw.map(w => w.toUpperCase()));
  const bSet = new Set(bw.map(w => w.toUpperCase()));
  return {
    added: bw.filter(w => !aSet.has(w.toUpperCase())),
    removed: aw.filter(w => !bSet.has(w.toUpperCase()))
  };
}

function compareDrawings(a, b){
  if(!a || !b) return null;

  const metaFields = ["Title","Author","Subject","Keywords","Creator","Producer","CreationDate","ModDate"];
  const metaDiff = metaFields.map(f => ({
    field: f,
    from: (a.meta||{})[f] || "",
    to: (b.meta||{})[f] || ""
  })).filter(x => x.from !== x.to);

  const sheetDiff = [
    ["Sheet Number", a.sheetNumber, b.sheetNumber],
    ["Sheet Title", a.sheetTitle, b.sheetTitle],
    ["Discipline", a.discipline, b.discipline],
    ["Current Revision", a.currentRevision, b.currentRevision],
    ["Issue Status", a.issueStatus, b.issueStatus],
    ["Pages", String(a.pages), String(b.pages)]
  ].filter(([, x, y]) => (x||"") !== (y||""))
   .map(([field, from, to]) => ({ field, from: from||"—", to: to||"—" }));

  // Revision rows keyed by rev number, so a new delta is distinguishable from
  // an edited description of an existing one.
  const aRev = new Map((a.revisions||[]).map(r => [String(r.rev).toUpperCase(), r]));
  const bRev = new Map((b.revisions||[]).map(r => [String(r.rev).toUpperCase(), r]));
  const added = [], changed = [], removed = [];
  for(const [k, r] of bRev){
    if(!aRev.has(k)) added.push(r);
    else {
      const o = aRev.get(k);
      if(o.description !== r.description || o.date !== r.date){
        changed.push({ rev:k, from:o, to:r, diff: wordDiff(o.description, r.description) });
      }
    }
  }
  for(const [k, r] of aRev) if(!bRev.has(k)) removed.push(r);

  const aNotes = new Set((a.revisionNotes||[]).map(n => `${n.rev}|${n.note}`));
  const newNotes = (b.revisionNotes||[]).filter(n => !aNotes.has(`${n.rev}|${n.note}`));

  const sameSheet = (a.sheetNumber||"") === (b.sheetNumber||"");
  const revMoved = Number(b.currentRevision) > Number(a.currentRevision);

  return {
    a, b, sameSheet, revMoved, metaDiff, sheetDiff,
    revisions:{ added, changed, removed },
    newNotes,
    hasChanges: !!(metaDiff.length || sheetDiff.length || added.length || changed.length || removed.length || newNotes.length)
  };
}

function compareReportRows(cmp){
  const rows = [["OhmBoy Drawing Revision Comparison"],[]];
  rows.push(["Generated", new Date().toLocaleString()]);
  rows.push(["From", `${cmp.a.sheetNumber||cmp.a.fileName} REV ${cmp.a.currentRevision||"?"}`, cmp.a.fileName]);
  rows.push(["To", `${cmp.b.sheetNumber||cmp.b.fileName} REV ${cmp.b.currentRevision||"?"}`, cmp.b.fileName]);
  rows.push([]);

  if(!cmp.sameSheet) rows.push(["WARNING","These are different sheet numbers — verify you're comparing the same sheet."],[]);

  if(cmp.sheetDiff.length){
    rows.push(["SHEET ATTRIBUTE CHANGES"]);
    rows.push(["Field","From","To"]);
    cmp.sheetDiff.forEach(d => rows.push([d.field, d.from, d.to]));
    rows.push([]);
  }
  if(cmp.revisions.added.length){
    rows.push(["NEW REVISIONS"]);
    rows.push(["Rev","Date","Description","By"]);
    cmp.revisions.added.forEach(r => rows.push([r.rev, r.date, r.description, r.by||""]));
    rows.push([]);
  }
  if(cmp.revisions.changed.length){
    rows.push(["AMENDED REVISION ENTRIES"]);
    rows.push(["Rev","Was","Now","Words Added"]);
    cmp.revisions.changed.forEach(c =>
      rows.push([c.rev, c.from.description, c.to.description, c.diff.added.join(" ")]));
    rows.push([]);
  }
  if(cmp.revisions.removed.length){
    rows.push(["REVISION ROWS NO LONGER SHOWN"]);
    rows.push(["Rev","Date","Description"]);
    cmp.revisions.removed.forEach(r => rows.push([r.rev, r.date, r.description]));
    rows.push([]);
  }
  if(cmp.newNotes.length){
    rows.push(["NEW CLOUD / DELTA CALLOUTS"]);
    rows.push(["Delta","Note"]);
    cmp.newNotes.forEach(n => rows.push([n.rev, n.note]));
    rows.push([]);
  }
  if(cmp.metaDiff.length){
    rows.push(["FILE METADATA CHANGES"]);
    rows.push(["Field","From","To"]);
    cmp.metaDiff.forEach(d => rows.push([d.field, d.from, d.to]));
    rows.push([]);
  }
  rows.push(["PM REVIEW REQUIRED"]);
  rows.push(["Extracted by pattern matching from the sheet's text layer. Confirm against the issued drawings before acting."]);
  return rows;
}

  exportRowsXlsx(compareReportRows(cmp), "REV Comparison", name);
  addAudit("Drawing Compare","Comparison Report Exported",
    `${cmp.a.sheetNumber||cmp.a.fileName} REV ${cmp.a.currentRevision||"?"} → REV ${cmp.b.currentRevision||"?"} — ${cmp.revisions.added.length} new revision(s).`);

  toast("Comparison report exported.");
}

function copyCompareSummary(){
  const cmp = currentCompare();
  if(!cmp){ toast("Select two drawings first.","bad"); return; }
  const L = [];
  L.push(`DRAWING REVISION COMPARISON — ${cmp.b.sheetNumber||cmp.b.fileName}`);
  L.push(`REV ${cmp.a.currentRevision||"?"} → REV ${cmp.b.currentRevision||"?"}   (${new Date().toLocaleDateString()})`);
  L.push("");
  if(!cmp.sameSheet) L.push("** Different sheet numbers — verify these are the same sheet. **","");
  if(cmp.revisions.added.length){
    L.push("NEW REVISIONS:");
    cmp.revisions.added.forEach(r => L.push(`  REV ${r.rev} (${r.date}) — ${r.description}${r.by?` [${r.by}]`:""}`));
    L.push("");
  }
  if(cmp.revisions.changed.length){
    L.push("AMENDED ENTRIES:");
    cmp.revisions.changed.forEach(c => L.push(`  REV ${c.rev}: "${c.from.description}" → "${c.to.description}"`));
    L.push("");
  }
  if(cmp.newNotes.length){
    L.push("NEW CLOUD CALLOUTS:");
    cmp.newNotes.forEach(n => L.push(`  Δ${n.rev} — ${n.note}`));
    L.push("");
  }
  if(cmp.sheetDiff.length){
    L.push("SHEET ATTRIBUTES:");
    cmp.sheetDiff.forEach(d => L.push(`  ${d.field}: ${d.from} → ${d.to}`));
    L.push("");
  }
  L.push("Extracted automatically — confirm against the issued drawings before acting.");
  copyText(L.join("\n"), "Comparison summary");
}

function currentCompare(){
  const c = state.compare || {};
  const a = (state.drawings||[]).find(d => d.id === c.a);
  const b = (state.drawings||[]).find(d => d.id === c.b);
  return (a && b) ? compareDrawings(a, b) : null;
}

/* Raising a packet makes the comparison actionable rather than informational. */
function raiseComparePacket(){
  const cmp = currentCompare();
  if(!cmp){ toast("Select two drawings first.","bad"); return; }
  if(!cmp.hasChanges){ toast("No differences found — nothing to raise.","bad"); return; }
  const newRevs = cmp.revisions.added;
  state.packets.push({
    id: uid("PKT"), type:"drawing",
    title: `REV ${cmp.a.currentRevision||"?"} → ${cmp.b.currentRevision||"?"} — ${cmp.b.sheetNumber||cmp.b.fileName}`,
    summary: (newRevs.length
      ? `${newRevs.length} new revision(s): ${newRevs.map(r=>`REV ${r.rev} ${r.description}`).join("; ").slice(0,300)}`
      : `Sheet attributes or revision entries changed between the two uploads.`) +
      ` Review for scope, procurement, routing, and schedule exposure.`,
    score: newRevs.length ? 93 : 78,
    moneyAtRisk: 0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
    raw:{ drawingCompare:true, from:cmp.a.fileName, to:cmp.b.fileName,
          fromRev:cmp.a.currentRevision, toRev:cmp.b.currentRevision,
          added:cmp.revisions.added, changed:cmp.revisions.changed.map(c=>({rev:c.rev,from:c.from.description,to:c.to.description})),
          newNotes:cmp.newNotes, sheetDiff:cmp.sheetDiff }
  });
  addAudit("Drawing Compare","Packet Raised From Comparison",
    `${cmp.b.sheetNumber||cmp.b.fileName} REV ${cmp.a.currentRevision||"?"} → ${cmp.b.currentRevision||"?"}.`);
  save(); renderAll(); navigate("triage");
  toast("Packet raised for triage.");
}

          <td>${esc(c2.to.description)}${c2.diff.added.length?`<br><small class="ins">+ ${esc(c2.diff.added.join(" "))}</small>`:""}</td></tr>`).join("")}</tbody></table>`:""}
