/* ===========================================================================
   ITEM 7 — Manpower Loading with bell-curve labor health
   ---------------------------------------------------------------------------
   Planned hours are distributed across the schedule window as a normal curve
   normalised to the estimate, so the plan always sums to the budget. The PM
   then enters earned and actual hours per week, and the chart overlays all
   three so labor health reads visually.

   Metric convention is the electrical-contractor one: PF = actual / earned,
   where below 1.00 is good. CPI (earned / actual) is shown alongside for
   anyone reading it from the CPM side.
   =========================================================================== */

function bellCurve(totalHours, weeks, skew, spread){
  const mu = (skew ?? 0.5) * (weeks - 1);
  const sigma = Math.max(0.8, (spread ?? 0.21) * weeks);
  const w = []; let sum = 0;
  for(let i = 0; i < weeks; i++){ const v = Math.exp(-Math.pow(i - mu, 2) / (2 * sigma * sigma)); w.push(v); sum += v; }
  return w.map(v => totalHours * v / sum);
}

function weeksBetween(startISO, finishISO){
  const a = parseDate(startISO), b = parseDate(finishISO);
  if(!a || !b || b <= a) return 0;
  return Math.max(1, Math.ceil((b - a) / (7 * 86400000)));
}

function weekLabel(startISO, i){
  const d = parseDate(startISO);
  if(!d) return "W" + (i + 1);
  d.setDate(d.getDate() + i * 7);
  return d.toISOString().slice(5,10);
}

function manpowerModel(){
  const m = state.manpower;
  const weeks = weeksBetween(m.startDate, m.finishDate);
  if(!weeks) return { weeks:0, rows:[], totals:{} };
  const planned = bellCurve(m.estimatedHours, weeks, m.peakSkew, m.spread);
  const rows = [];
  let cp = 0, ce = 0, ca = 0;
  for(let i = 0; i < weeks; i++){
    const entry = m.entries[i] || {};
    const earned = Number(entry.earned || 0), actual = Number(entry.actual || 0);
    cp += planned[i]; ce += earned; ca += actual;
    rows.push({
      i, label: weekLabel(m.startDate, i),
      planned: planned[i], earned, actual,
      crewPlanned: planned[i] / (m.hoursPerWeek || 40),
      crewActual: actual / (m.hoursPerWeek || 40),
      cumPlanned: cp, cumEarned: ce, cumActual: ca
    });
  }
  const totEarned = ce, totActual = ca;
  const pf  = totEarned > 0 ? totActual / totEarned : 0;      // <1.00 is good
  const cpi = totActual > 0 ? totEarned / totActual : 0;      // >1.00 is good
  const peak = Math.max(...planned);
  const remainingHrs = Math.max(0, m.estimatedHours - totEarned);
  const forecastAtComplete = pf > 0 ? m.estimatedHours * pf : m.estimatedHours;

  return {
    weeks, rows,
    totals:{
      estimated:m.estimatedHours, earned:totEarned, actual:totActual,
      variance: totEarned - totActual, pf, cpi,
      pctComplete: m.estimatedHours ? (totEarned / m.estimatedHours) * 100 : 0,
      peakHours: peak, peakCrew: peak / (m.hoursPerWeek || 40),
      remainingHrs, forecastAtComplete, forecastVariance: m.estimatedHours - forecastAtComplete
    }
  };
}

function manpowerChart(model){
  if(!model.weeks) return `<div class="item"><h3>Set the schedule window</h3><p>Enter a start date, finish date, and estimated hours to generate the loading curve.</p></div>`;
  const W = 1000, H = 380, padL = 62, padR = 18, padT = 18, padB = 46;
  const iw = W - padL - padR, ih = H - padT - padB;
  const rows = model.rows;
  const maxY = Math.max(...rows.map(r => Math.max(r.planned, r.earned, r.actual)), 1) * 1.12;
  const bw = iw / rows.length;
  const x = i => padL + i * bw;
  const y = v => padT + ih - (v / maxY) * ih;

  const bars = rows.map((r,i) =>
    `<rect x="${(x(i)+bw*0.12).toFixed(1)}" y="${y(r.planned).toFixed(1)}" width="${(bw*0.76).toFixed(1)}" height="${Math.max(0,(padT+ih-y(r.planned))).toFixed(1)}" fill="rgba(184,115,51,.30)" stroke="rgba(184,115,51,.65)" stroke-width="1"><title>${esc(r.label)} — planned ${Math.round(r.planned)} hrs (${r.crewPlanned.toFixed(1)} crew)</title></rect>`
  ).join("");

  const line = (key, color, dash) => {
    const pts = rows.map((r,i) => `${(x(i)+bw/2).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ");
    return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.4"${dash?` stroke-dasharray="${dash}"`:""}/>` +
           rows.map((r,i) => r[key] > 0 ? `<circle cx="${(x(i)+bw/2).toFixed(1)}" cy="${y(r[key]).toFixed(1)}" r="3" fill="${color}"><title>${esc(r.label)} — ${key} ${Math.round(r[key])} hrs</title></circle>` : "").join("");
  };

  const ticks = [0,.25,.5,.75,1].map(t => {
    const v = maxY * t;
    return `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="rgba(184,115,51,.16)"/>
            <text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#666" stroke="none">${Math.round(v).toLocaleString()}</text>`;
  }).join("");

  const step = Math.max(1, Math.ceil(rows.length / 16));
  const xlab = rows.map((r,i) => i % step === 0
    ? `<text x="${(x(i)+bw/2).toFixed(1)}" y="${H-padB+18}" text-anchor="middle" font-size="10" fill="#666" stroke="none">${esc(r.label)}</text>` : "").join("");

  const peakI = rows.reduce((b,r,i) => r.planned > rows[b].planned ? i : b, 0);

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="mp-chart" preserveAspectRatio="xMidYMid meet">
    ${ticks}
    ${bars}
    <line x1="${(x(peakI)+bw/2).toFixed(1)}" y1="${padT}" x2="${(x(peakI)+bw/2).toFixed(1)}" y2="${padT+ih}" stroke="rgba(15,118,110,.5)" stroke-dasharray="4 4"/>
    <text x="${(x(peakI)+bw/2+6).toFixed(1)}" y="${padT+12}" font-size="11" fill="#0f766e" stroke="none">peak ${Math.round(rows[peakI].crewPlanned)} crew</text>
    ${line("earned","#0f766e")}
    ${line("actual","#c92525","5 4")}
    <line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="rgba(184,115,51,.5)"/>
    ${xlab}
  </svg></div>
  <div class="legend">
    <span><i class="sw plan"></i>Planned (bell curve)</span>
    <span><i class="sw earn"></i>Earned hours</span>
    <span><i class="sw act"></i>Actual hours</span>
  </div>`;
}

function manpowerSCurve(model){
  if(!model.weeks) return "";
  const W = 1000, H = 260, padL = 62, padR = 18, padT = 14, padB = 34;
  const iw = W - padL - padR, ih = H - padT - padB;
  const rows = model.rows;
  const maxY = Math.max(model.totals.estimated, ...rows.map(r => Math.max(r.cumPlanned, r.cumEarned, r.cumActual)), 1) * 1.06;
  const x = i => padL + (i / Math.max(1, rows.length - 1)) * iw;
  const y = v => padT + ih - (v / maxY) * ih;
  const path = (key, color, dash) =>
    `<polyline points="${rows.map((r,i)=>`${x(i).toFixed(1)},${y(r[key]).toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2.4"${dash?` stroke-dasharray="${dash}"`:""}/>`;
  const ticks = [0,.5,1].map(t => `<line x1="${padL}" y1="${y(maxY*t)}" x2="${W-padR}" y2="${y(maxY*t)}" stroke="rgba(184,115,51,.16)"/>
    <text x="${padL-8}" y="${y(maxY*t)+4}" text-anchor="end" font-size="11" fill="#666" stroke="none">${Math.round(maxY*t).toLocaleString()}</text>`).join("");
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" class="mp-chart" preserveAspectRatio="xMidYMid meet">
    ${ticks}
    ${path("cumPlanned","rgba(184,115,51,.85)")}
    ${path("cumEarned","#0f766e")}
    ${path("cumActual","#c92525","5 4")}
    <line x1="${padL}" y1="${padT+ih}" x2="${W-padR}" y2="${padT+ih}" stroke="rgba(184,115,51,.5)"/>
  </svg></div>
  <div class="legend"><span><i class="sw plan"></i>Cum. planned</span><span><i class="sw earn"></i>Cum. earned</span><span><i class="sw act"></i>Cum. actual</span></div>`;
}

function saveManpowerConfig(){

async function handleManpowerUpload(){
  const el = $("mpFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a timesheet export first.","bad"); return; }
  try{
    const sheets = await SHEET.readFile(file);
    const ALIAS_MP = {
      week:["week","weekending","period","date","weekend","enddate"],
      earned:["earnedhours","earned","earnedhrs","evhours","earnedvalue"],
      actual:["actualhours","actual","actualhrs","hours","manhours","laborhours"]
    };
    const { records, map } = SHEET.toRecords(sheets[0].rows, ALIAS_MP);
    if(map.actual < 0) throw new Error("Couldn't find an actual-hours column.");
    const m = state.manpower;
    const start = parseDate(m.startDate);
    let applied = 0;
    records.forEach((r, idx) => {
      let i = idx;
      const d = parseDate(r.week);
      if(d && start) i = Math.floor((d - start) / (7 * 86400000));
      if(i < 0 || i >= weeksBetween(m.startDate, m.finishDate)) return;
      m.entries[i] = {
        earned: SHEET.num(r.earned) || (m.entries[i]||{}).earned || 0,
        actual: SHEET.num(r.actual),
        note: "imported " + file.name
      };
      applied++;
    });
    addAudit("Manpower","Timesheet Import",`${file.name} — ${applied} week(s) applied.`);
    save(); renderAll(); navigate("manpower");
    toast(`Imported ${applied} week(s) of hours.`);
  }catch(err){
    toast("Import failed: " + err.message, "bad");
  }
}

async function handleDrawingUpload(){
  const el = $("dwgFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose a drawing PDF first.","bad"); return; }
  toast("Reading drawing…");
  try{
    const r = await DWG.analyze(file);
    if(!r.ok) throw new Error(r.error);
    r.id = uid("DWG");
    r.uploadedAt = new Date().toLocaleString();
    r.reviewed = false;
    state.drawings.push(r);

    const label = [r.sheetNumber, r.sheetTitle].filter(Boolean).join(" — ") || file.name;
    if(r.scanned){
      addAudit("Drawing Intake","Scanned Sheet — No Text Layer",
        `${file.name} has no extractable text. Revision data must be entered manually.`);
      toast("Sheet has no text layer (scanned). Metadata captured; revisions need manual entry.","bad");
    } else {
      addAudit("Drawing Intake","Drawing Analyzed",
        `${label} — REV ${r.currentRevision||"?"}, ${r.revisions.length} revision row(s) found. Flagged for PM review.`);

      state.packets.push({
        id: uid("PKT"), type:"drawing",
        title: `Drawing REV ${r.currentRevision||"?"} — ${label}`,
        summary: r.revisions.length
          ? `Latest: ${(r.revisions[r.revisions.length-1]||{}).description||"see revision block"}. ${r.revisions.length} revision row(s) extracted from the sheet. Confirm against the issued set, then decide RFI / CO / procurement / schedule exposure.`
          : `No revision table found on this sheet. Metadata captured; confirm revision status manually.`,
        score: r.revisions.length ? 92 : 70,
        moneyAtRisk: 0, status:"open", createdAt:new Date().toLocaleString(), treatments:{},
        raw:{ drawingUpload:true, drawingId:r.id, fileName:file.name, sheetNumber:r.sheetNumber,
              currentRevision:r.currentRevision, issueStatus:r.issueStatus,
              revisions:r.revisions, revisionNotes:r.revisionNotes, meta:r.meta }
      });
      toast(`${label} — REV ${r.currentRevision||"?"}, ${r.revisions.length} revision row(s) extracted.`);
    }
    save(); renderAll(); navigate("drawingIntel");
  }catch(err){
    toast("Drawing read failed: " + err.message, "bad");
    addAudit("Drawing Intake","Analysis Failed", `${file.name} — ${err.message}`);
    save();
  }
}

function markDrawingReviewed(id){
  const d = state.drawings.find(x => x.id === id);
  if(!d) return;
  d.reviewed = !d.reviewed;
  d.reviewedAt = d.reviewed ? new Date().toLocaleString() : null;
  addAudit("Drawing Intake", d.reviewed ? "Drawing Marked Reviewed" : "Drawing Review Cleared",
    `${d.sheetNumber||d.fileName} — REV ${d.currentRevision||"?"}`);
  save(); renderAll(); navigate("drawingIntel");
}

function deleteDrawing(id){
  const d = state.drawings.find(x => x.id === id);
  if(!d) return;
  if(!confirmAction(`Remove ${d.sheetNumber||d.fileName} from the drawing register?`)) return;
  state.drawings = state.drawings.filter(x => x.id !== id);
  addAudit("Drawing Intake","Drawing Removed", `${d.sheetNumber||d.fileName} removed by PM.`);
  save(); renderAll(); navigate("drawingIntel"); toast("Drawing removed.");
}

      <button class="action ${d.reviewed?"":"dark"}" onclick="markDrawingReviewed('${esc(d.id)}')">${d.reviewed?"Clear Review Flag":"Mark PM Reviewed"}</button>
      <button class="action danger" onclick="deleteDrawing('${esc(d.id)}')">Remove</button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------------
   B — Notifications
   The badge used to read Math.max(1, high), so it showed "1" forever even with
   nothing wrong, and the span had no click handler. Now it counts real alerts,
   hides at zero, and opens a panel where every row navigates somewhere useful.
   --------------------------------------------------------------------------- */

function notifications(){
  const out = [];
  const active = state.packets.filter(p => p.status !== "closed");

  active.filter(p => p.score >= 90).forEach(p => out.push({
    kind:"risk", severity:"high", title:p.title,
    detail:`Score ${p.score}${p.moneyAtRisk?` · ${money(p.moneyAtRisk)} at risk`:""}`,
    action:`selectTriage('${p.id}');navigate('triage')`
  }));

  state.rfi.filter(r => r.dueDate && !["Closed","Void"].includes(r.status) &&
                        parseDate(r.dueDate) && parseDate(r.dueDate) < new Date())
    .forEach(r => out.push({
      kind:"rfi", severity:"high", title:`${r.number} overdue — ${r.title}`,
      detail:`Due ${r.dueDate} · ball in court: ${r.ballInCourt||"unassigned"}`,
      action:`navigate('rfilog')`
    }));

  const slipped = ((state.schedule||{}).activities||[]).filter(a => (a.slipDays||0) > 0);
  if(slipped.length){
    const crit = slipped.filter(a => a.critical).length;
    out.push({
      kind:"schedule", severity: crit ? "high" : "warn",
      title:`${slipped.length} activit${slipped.length===1?"y":"ies"} slipped`,
      detail: crit ? `${crit} on the critical path` : "None on the critical path",
      action:`navigate('schedule')`
    });
  }

  const mp = manpowerModel().totals;
  if(mp.pf && mp.pf > 1.05){
    out.push({
      kind:"labor", severity: mp.pf > 1.15 ? "high" : "warn",
      title:`Labor PF ${mp.pf.toFixed(3)}`,
      detail:`Forecast ${Math.round(mp.forecastAtComplete).toLocaleString()} hrs against ${Math.round(mp.estimated).toLocaleString()} estimated`,
      action:`navigate('manpower')`
    });
  }

  if(state.financial.aging.net120 > 0){
    out.push({
      kind:"cash", severity:"warn",
      title:`${money(state.financial.aging.net120)} aged past 120 days`,
      detail:"Cash already spent and not collected",
      action:`navigate('agingReport')`
    });
  }

  const pendingDwg = (state.drawings||[]).filter(d => !d.reviewed).length;
  if(pendingDwg) out.push({
    kind:"drawing", severity:"warn",
    title:`${pendingDwg} drawing${pendingDwg===1?"":"s"} awaiting review`,
    detail:"Revisions extracted, not yet confirmed by PM",
    action:`navigate('drawingIntel')`
  });

  return out.sort((a,b) => (a.severity === "high" ? 0 : 1) - (b.severity === "high" ? 0 : 1));
}

function metrics(){
  const active = state.packets.filter(p => p.status !== "closed");
  const high = active.filter(p => p.score >= 75).length;
  const schedule = active.filter(p => p.type === "schedule").length;
  const f = finance();
  // Real count, not Math.max(1, …). Zero means zero.
  return { top:active.length, high, schedule, margin:f.margin, bell:notifications().length, f };
}

function setTopbar(){
  const n = notifications();
  $("datePill").innerHTML = icon("clock") +
    new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  const bell = $("bell");
  bell.innerHTML = icon("shield") + (n.length ? `<b>${n.length}</b>` : "");
  bell.setAttribute("role","button");
  bell.setAttribute("tabindex","0");
  bell.setAttribute("aria-label", n.length ? `${n.length} alerts` : "No alerts");
  bell.title = n.length ? `${n.length} alert${n.length===1?"":"s"} — click to review` : "No active alerts";
  bell.classList.toggle("has-alerts", n.length > 0);
  bell.onclick = (e) => { e.stopPropagation(); toggleAlerts(); };
  bell.onkeydown = (e) => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleAlerts(); } };
}

function closeAlerts(){ const p = $("alertPanel"); if(p) p.remove(); }

function toggleAlerts(){
  if($("alertPanel")) return closeAlerts();
  const n = notifications();
  const panel = document.createElement("div");
  panel.className = "alert-panel";
  panel.id = "alertPanel";
  panel.innerHTML = `
    <div class="alert-head">
      <b>${n.length ? `${n.length} Alert${n.length===1?"":"s"}` : "All Clear"}</b>
      <button class="alert-close" onclick="closeAlerts()" aria-label="Close">×</button>
    </div>
    ${n.length
      ? n.map(a => `<button class="alert-row ${esc(a.severity)}" onclick="closeAlerts();${a.action}">
          <span class="alert-dot"></span>
          <span><b>${esc(a.title)}</b><small>${esc(a.detail)}</small></span>
        </button>`).join("")
      : `<div class="alert-empty">Nothing needs your attention. No high-score packets, no overdue RFIs, no schedule slip, no labor or cash flags.</div>`}`;
  document.body.appendChild(panel);
  const r = $("bell").getBoundingClientRect();
  panel.style.top = (r.bottom + 10) + "px";
  panel.style.right = Math.max(12, window.innerWidth - r.right - 6) + "px";
  setTimeout(() => document.addEventListener("click", onceCloseAlerts), 0);
}

function onceCloseAlerts(e){
  const p = $("alertPanel");
  if(p && !p.contains(e.target)){ closeAlerts(); document.removeEventListener("click", onceCloseAlerts); }
}

/* ---------------------------------------------------------------------------
   C — Triage as a split view
   Previously reviewing a packet meant Triage -> Packet Detail -> back, over and
   over. Now the list and the full review sit side by side: click a packet (or
   press J/K) and the right pane updates in place. Nothing navigates.
   --------------------------------------------------------------------------- */

const TRIAGE_FILTERS = [
  ["open",     "Open"],
  ["high",     "High Risk"],
  ["drawing",  "Drawing"],
  ["schedule", "Schedule"],
  ["flagged",  "Flagged"],
  ["closed",   "Closed"]
];

let triageFilter = "open";

function triagePackets(){
  const all = state.packets;
  const open = all.filter(p => p.status !== "closed");
  switch(triageFilter){
    case "closed":   return all.filter(p => p.status === "closed");
    case "high":     return open.filter(p => p.score >= 75);
    case "drawing":  return open.filter(p => p.type === "drawing");
    case "schedule": return open.filter(p => p.type === "schedule");
    case "flagged":  return open.filter(p => Object.keys(p.treatments||{}).length);
    default:         return open;
  }
}

function setTriageFilter(f){
  triageFilter = f;
  const list = triagePackets();
  if(!list.some(p => p.id === selectedPacketId)) selectedPacketId = list.length ? list[0].id : null;
  renderTriage();
}

function selectTriage(id){
  selectedPacketId = id;
  renderTriage();
  const pane = $("triageDetail");
  if(pane && pane.scrollIntoView) pane.scrollIntoView({ block:"nearest" });
}

function stepTriage(dir){
  const list = triagePackets();
  if(!list.length) return;
  const i = list.findIndex(p => p.id === selectedPacketId);
  const next = Math.max(0, Math.min(list.length - 1, (i < 0 ? 0 : i + dir)));
  selectTriage(list[next].id);
}

function triageRow(p){
  const t = p.treatments || {};
  const flags = [t.rfi && "RFI", t.co && "CO", t.watch && "WATCH", t.procurement && "PROC", t.schedule && "SCHED"].filter(Boolean);
  return `<button class="triage-row ${p.id===selectedPacketId?"active":""} ${p.score>=90?"hot":""}"
      onclick="selectTriage('${esc(p.id)}')">
    <span class="triage-score">${p.score}</span>
    <span class="triage-body">
      <b>${esc(p.title)}</b>
      <small>${esc(p.type)}${p.moneyAtRisk?` · ${money(p.moneyAtRisk)}`:""}${p.status==="closed"?" · closed":""}</small>
      ${flags.length?`<span class="triage-flags">${flags.map(f=>`<i>${esc(f)}</i>`).join("")}</span>`:""}
    </span>
  </button>`;
}

function triageDetail(p){
  if(!p){
    return `<div class="triage-empty">
      <h3>Nothing selected</h3>
      <p>Pick a packet from the list to review it here. Use <kbd>J</kbd> and <kbd>K</kbd> to move through the queue without touching the mouse.</p>
    </div>`;
  }
  const isSchedule = p.type === "schedule";
  const entitlement = isSchedule
    ? "Possible acceleration, resequence, crew stacking, or delay exposure."
    : "Possible scope change, procurement impact, gear schedule change, routing impact, or RFI/CO exposure.";
  const raw = p.raw ? esc(JSON.stringify(p.raw, null, 2)) : "No raw event captured.";

  return `<div class="triage-detail-inner">
    <div class="detail-meta">
      <span class="badge">Score ${p.score}</span>
      <span class="badge">${esc(p.type)}</span>
      <span class="badge ${p.status==="closed"?"badge-ok":""}">${esc(p.status||"open")}</span>
      ${p.moneyAtRisk?`<span class="badge">${money(p.moneyAtRisk)} at risk</span>`:""}
    </div>
    <h2>${esc(p.title)}</h2>
    <p class="triage-summary">${esc(p.summary)}</p>

    ${pipelineButtons(p)}

    <div class="triage-cols">
      <div>
        <h3>Why OhmBoy cares</h3>
        <ul class="detail-list">
          <li>${esc(entitlement)}</li>
          <li>Creates a decision path before the issue disappears into email noise.</li>
          <li>Preserves original intake context for later entitlement and backup.</li>
        </ul>
        <h3>Recommended PM Review</h3>
        <ul class="detail-list">
          <li>Confirm drawing/schedule source and latest revision.</li>
          <li>Check downstream effects: labor, procurement, sequence, cost, entitlement.</li>
          <li>Decide treatment, assign owner, then close with notes.</li>
        </ul>
      </div>
      <div>
        <h3>Pipeline Status</h3>
        ${pipelineStatusHtml(p)}
        <h3>Source Trace</h3>
        <div class="trace-box">
          <b>Packet ID:</b> ${esc(p.id)}<br>
          <b>Created:</b> ${esc(p.createdAt||"simulated intake")}
        </div>
      </div>
    </div>

    <details class="triage-raw"><summary>Raw / normalized payload</summary><pre>${raw}</pre></details>

    ${renderCloseForm(p, "t")}
  </div>`;
}

function renderTriage(){
  const prev = $("triageList");
  const scroll = prev ? prev.scrollTop : 0;

  const list = triagePackets();
  if(!list.some(p => p.id === selectedPacketId)) selectedPacketId = list.length ? list[0].id : null;
  const sorted = list.slice().sort((a,b) => b.score - a.score);
  const p = state.packets.find(x => x.id === selectedPacketId) || null;
  const counts = { open:state.packets.filter(x=>x.status!=="closed").length,
                   closed:state.packets.filter(x=>x.status==="closed").length };

  renderPage("triage","Packet Triage","Review the queue in place — list on the left, full packet on the right. Nothing navigates away.",
    `<div class="triage-tabs">
      ${TRIAGE_FILTERS.map(([k,label]) => `<button class="triage-tab ${k===triageFilter?"on":""}" onclick="setTriageFilter('${k}')">${esc(label)}</button>`).join("")}
      <span class="triage-count">${sorted.length} shown · ${counts.open} open · ${counts.closed} closed</span>
    </div>
    <div class="triage-layout">
      <div class="triage-list" id="triageList">
        ${sorted.length ? sorted.map(triageRow).join("")
          : `<div class="triage-empty small"><p>Nothing in this view.</p></div>`}
      </div>
      <div class="triage-detail" id="triageDetail">${triageDetail(p)}</div>
    </div>`);

  const el = $("triageList");
  if(el) el.scrollTop = scroll;
}

/* Close-out form is namespaced so the copy inside triage and the copy on the
   Packet Detail page don't collide on element ids. */
function renderCloseForm(p, ns){
  ns = ns || "";
  if(p.status === "closed"){
    const r = p.resolution || {};
    return `<div class="card detail-section resolved-box">
      <h3>Resolved</h3>
      <div class="trace-box">
        <b>Disposition:</b> ${esc(r.disposition||"—")}<br>
        <b>Closed by:</b> ${esc(r.closedBy||"—")} on ${esc(r.closedAt||"—")}<br>
        <b>Cost impact:</b> ${money(r.costImpact||0)} &nbsp;|&nbsp; <b>Schedule impact:</b> ${esc(String(r.scheduleImpact||0))} day(s)
        ${r.notes?`<br><br><b>Resolution notes:</b><br>${esc(r.notes).replace(/\n/g,"<br>")}`:""}
      </div>
      <div class="takeoff-row-actions">
        <button class="action" onclick="reopenPacket('${esc(p.id)}')">Reopen Packet</button>
      </div>
    </div>`;
  }
  return `<div class="card detail-section">
    <h3>Close Out This Packet</h3>
    <p class="sub">Record how it was resolved. Closed packets drop off the open queue but stay in the audit trail and the closed register.</p>
    <div class="takeoff-form">
      <div class="field"><label>Disposition</label><select id="${ns}closeDisp">${RESOLUTIONS.map(r=>`<option>${esc(r)}</option>`).join("")}</select></div>
      <div class="field"><label>Closed By</label><input id="${ns}closeBy" placeholder="PM initials or name"></div>
      <div class="field"><label>Cost Impact ($)</label><input id="${ns}closeCost" type="number" step="100" value="0"></div>
      <div class="field"><label>Schedule Impact (days)</label><input id="${ns}closeDays" type="number" step="1" value="0"></div>
      <div class="field full"><label>Resolution Notes</label><textarea id="${ns}closeNotes" placeholder="What was the established resolution? Who agreed to it, what backup exists, and what closes the loop. Example: RFI-021 answered 8/4 — engineer confirmed existing feeder size adequate; no CO required; noted on E6.0 REV-04 markup filed in Procore."></textarea></div>
    </div>
    <div class="takeoff-row-actions">
      <button class="action dark" onclick="closePacket('${esc(p.id)}','${ns}')">Close Packet</button>
    </div>
  </div>`;
}

function closePacket(id, ns){
  ns = ns || "";
  const p = getPacket(id);
  if(!p) return;
  const notes = val(ns+"closeNotes","").trim();
  if(!notes){
    toast("Add resolution notes before closing — that's the record of what was decided.","bad");
    const el = $(ns+"closeNotes"); if(el && el.focus) el.focus();
    return;
  }
  p.status = "closed";
  p.resolution = {
    disposition: val(ns+"closeDisp", RESOLUTIONS[0]),
    closedBy: val(ns+"closeBy","").trim() || "PM",
    closedAt: new Date().toLocaleString(),
    costImpact: Number(val(ns+"closeCost",0)) || 0,
    scheduleImpact: Number(val(ns+"closeDays",0)) || 0,
    notes
  };
  addAudit("Packet Closed", p.title,
    `${p.resolution.disposition} — closed by ${p.resolution.closedBy}. ${notes.slice(0,160)}`);
  save();
  // Advance to the next packet in the queue so review keeps flowing.
  const queue = triagePackets();
  const next = queue.find(x => x.id !== id);
  selectedPacketId = next ? next.id : null;
  renderAll();
  toast("Packet closed. Next packet loaded.");
}

/* treatPacket used to jump to the detail page on every click. In the split
   view that yanked the PM out of the queue, so it now re-renders in place. */
function treatPacket(packetId, type){
  const p = getPacket(packetId);
  if(!p) return;
  const t = ensureTreatments(p);
  if(type === "rfi"){
    t.rfi = t.rfi || new Date().toLocaleString();
    addAudit("Treat Packet","Flagged: RFI Needed", p.title + " — PM to raise the RFI in the RFI Log.");
  }
  if(type === "co"){
    t.co = t.co || new Date().toLocaleString();
    addAudit("Treat Packet","Flagged: CO Exposure", p.title + " — PM to raise the change order in the Change Order Log.");
  }
  if(type === "watch"){
    t.watch = t.watch || new Date().toLocaleString();
    addAudit("Treat Packet","Packet added to Watchlist", p.title + " will stay visible in priority review.");
  }
  if(type === "procurement"){
    t.procurement = t.procurement || new Date().toLocaleString();
    addAudit("Treat Packet","Packet flagged for Procurement Review", p.title + " requires PO/buyout/long-lead review.");
  }
  if(type === "schedule"){
    t.schedule = t.schedule || new Date().toLocaleString();
    addAudit("Treat Packet","Packet flagged for Schedule Impact", p.title + " requires critical path/sequence review.");
  }
  save();
  setTopbar();
  renderTriage();
  if(selectedPacketId === packetId) renderPacketDetail(packetId);
  toast("Flagged. Raise the actual RFI or CO in its log when you're ready.");
}

const PROCORE_API = {
  health:    "/.netlify/functions/procore-health",
  whoami:    "/.netlify/functions/procore-whoami",
  authStart: "/.netlify/functions/procore-auth-start",
  register:  "/.netlify/functions/procore-webhook-register",
  deliveries:"/.netlify/functions/procore-webhook-deliveries"
};

function setProcoreOut(msg){
  const el = $("apiOutput");
  if(el) el.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
}

async function loadProcoreProjects(){
  setProcoreOut("Contacting Procore…");
  try{
    const r = await fetch(PROCORE_API.whoami);
    const j = await r.json();
    if(!j.ok){
      setProcoreOut(j);
      toast(j.error || "Not connected to Procore yet.","bad");
      return;
    }
    state.procore = state.procore || {};
    state.procore.companies = (j.companies||[]).map(c => ({id:c.id, name:c.name}));
    state.procore.projects  = (j.projects||[]).map(p => ({id:p.id, name:p.name}));
    state.procore.companyId = j.companyIdInUse || state.procore.companyId || null;
    state.procore.connected = true;
    state.procore.checkedAt = new Date().toLocaleString();
    save(); renderAll(); navigate("procore");
    setProcoreOut(`Connected. ${state.procore.projects.length} project(s) available. Pick one below and link it.`);
    toast(`${state.procore.projects.length} Procore project(s) loaded.`);
  }catch(err){
    setProcoreOut({ ok:false, error:err.message });
    toast("Couldn't reach the Procore function: " + err.message, "bad");
  }
}

function linkProcoreProject(){
  const sel = $("procoreProjectSel");
  const id = sel ? sel.value : "";
  if(!id){ toast("Pick a project first.","bad"); return; }
  const proj = (state.procore.projects||[]).find(p => String(p.id) === String(id));
  state.procore.projectId = proj ? proj.id : id;
  state.procore.projectName = proj ? proj.name : "";
  state.procore.linkedAt = new Date().toLocaleString();
  addAudit("Procore","Project Linked",
    `${state.procore.projectName || state.procore.projectId} (id ${state.procore.projectId}) linked to OhmBoy.`);
  save(); renderAll(); navigate("procore");
  toast(`Linked to ${state.procore.projectName || id}.`);
}

function unlinkProcoreProject(){
  if(!confirmAction("Unlink this Procore project? Packets already created stay put.")) return;
  addAudit("Procore","Project Unlinked", `${state.procore.projectName||state.procore.projectId} unlinked.`);
  state.procore.projectId = null; state.procore.projectName = null; state.procore.linkedAt = null;
  save(); renderAll(); navigate("procore"); toast("Project unlinked.");
}

async function registerProcoreHooks(){
  const pid = (state.procore||{}).projectId;
  setProcoreOut("Creating hook and triggers in Procore…");
  try{
    const url = PROCORE_API.register + (pid ? `?project_id=${encodeURIComponent(pid)}` : "");
    const r = await fetch(url);
    const j = await r.json();
    setProcoreOut(j);
    addAudit("Procore", j.ok ? "Webhooks Registered" : "Webhook Registration Issue",
      j.ok ? `Hook ${j.hookId}, ${(j.triggersAdded||[]).length} trigger(s) added.` : (j.error||"see output"));
    save();
    toast(j.ok ? `Hook ${j.hookId} ready.` : "Registration returned an issue — see the output.", j.ok ? "" : "bad");
  }catch(err){
    setProcoreOut({ ok:false, error:err.message });
    toast("Registration failed: " + err.message, "bad");
  }
}

async function checkProcoreDeliveries(){
  setProcoreOut("Fetching failing deliveries…");
  try{
    const r = await fetch(PROCORE_API.deliveries + "?status=failing");
    setProcoreOut(await r.json());
  }catch(err){ setProcoreOut({ ok:false, error:err.message }); }
}

async function checkHealth(){
  setProcoreOut("Checking…");
  try{
    const r = await fetch(PROCORE_API.health);
    const j = await r.json();
    setProcoreOut(j);
    state.procore = state.procore || {};
    state.procore.connected = !!(j.procore && j.procore.connected);
    addAudit("Health","Procore Health Check",
      j.procore ? `configured=${j.procore.configured}, connected=${j.procore.connected}` : "backend responded");
    save(); renderAll(); navigate("procore");
  }catch(err){
    setProcoreOut({ ok:false, error:err.message });
    addAudit("Health","Procore Health Check Failed", err.message);
    save();
  }
}

    </div></div>
    ${linkPanel}
    <div class="card panel" style="margin-top:18px">
      <h2>Diagnostics &amp; Simulation</h2>
      <div class="actions">
        <button class="action primary" id="healthBtn">Procore Health</button>

      </div>
      <pre id="apiOutput">Ready. Start with Procore Health — it lists exactly what is and isn't configured.</pre>
    </div>
    <div class="list">${state.rawEvents.slice().reverse().slice(0,25).map(e=>`<div class="item"><span class="badge">${esc(e.eventType||e.type||"event")}</span><h3>${esc(e.title||"Inbound Event")}</h3><p>${esc(e.summary||"Stored in local OhmBoy event queue.")}</p></div>`).join("")}</div>
  </div>`;

  $("healthBtn").onclick = checkHealth;
  $("pmDayBtn2").onclick = simPMDay;
  $("simDrawingBtn").onclick = () => simRev("drawing");

    localStorage.removeItem(STORAGE_KEY);

/* ===========================================================================
   Ωboy V0.23.0 — Schedule of Values / WBS
   ---------------------------------------------------------------------------
   Contract values used to be five hardcoded numbers in seedState with nothing
   behind them. Now they roll up from a cost-loaded SOV, so every figure on the
   Financial Source Map traces to a line of scope somebody owns.

   Structure follows AIA G703 (continuation sheet) because that's what gets
   billed against, extended with the cost side an electrical PM actually needs:

     scheduledValue   contract revenue for the line
     budgetCost       estimated cost to execute it
     pctComplete      physical percent complete
     costToDate       actual cost charged against it

   Derived per line:
     billedToDate   = scheduledValue x pct
     earnedCost     = budgetCost x pct
     forecastCost   = costToDate / pct   (once there's real cost history),
                      otherwise budgetCost — this is the line-level EAC and it
                      is where fade shows up first, long before the job total
                      moves.
     margin         = scheduledValue - forecastCost

   WBS is a plain dotted/dashed string (01.100.EL, 05-MV-DB, whatever your
   cost coding uses). Rollups group on any segment depth, plus area and cost
   code, so the same lines report three ways without re-entering anything.
   =========================================================================== */

const SOV_TYPES = ["base", "co"];

function sovDefaults(){
  return { lines:[], fileName:null, uploadedAt:null, retainageDefault:10, periodEnding:"", groupBy:"wbs", wbsDepth:1 };
}

function sovLine(o){
  o = o || {};
  return {
    id: o.id || uid("SOV"),
    itemNo: o.itemNo || "",
    wbs: o.wbs || "",
    description: o.description || "",
    area: o.area || "",
    costCode: o.costCode || "",
    type: SOV_TYPES.includes(o.type) ? o.type : "base",
    coRef: o.coRef || "",
    scheduledValue: Number(o.scheduledValue) || 0,
    budgetCost: Number(o.budgetCost) || 0,
    budgetHours: Number(o.budgetHours) || 0,
    pctComplete: Math.max(0, Math.min(100, Number(o.pctComplete) || 0)),
    previousPct: Math.max(0, Math.min(100, Number(o.previousPct) || 0)),
    materialsStored: Number(o.materialsStored) || 0,
    costToDate: Number(o.costToDate) || 0,
    retainagePct: o.retainagePct === undefined || o.retainagePct === ""
      ? (state.sov ? state.sov.retainageDefault : 10)
      : Number(o.retainagePct),
    notes: o.notes || ""
  };
}

/* ---------- per-line derivation ---------- */

function sovCalc(l){
  const pct = l.pctComplete / 100;
  const billedToDate = l.scheduledValue * pct;
  const thisPeriod = l.scheduledValue * ((l.pctComplete - l.previousPct) / 100);
  const earnedCost = l.budgetCost * pct;
  // Once a line has real cost against real progress, extrapolate it. Below ~2%
  // complete the divisor makes the forecast meaningless, so hold the budget.
  const forecastCost = (l.costToDate > 0 && l.pctComplete >= 2)
    ? l.costToDate / pct
    : l.budgetCost;
  const retainageHeld = (billedToDate + l.materialsStored) * (l.retainagePct / 100);
  return {
    billedToDate,
    thisPeriod,
    previouslyBilled: l.scheduledValue * (l.previousPct / 100),
    completedAndStored: billedToDate + l.materialsStored,
    balanceToFinish: l.scheduledValue - billedToDate - l.materialsStored,
    earnedCost,
    costVariance: earnedCost - l.costToDate,      // positive = under budget
    forecastCost,
    budgetMargin: l.scheduledValue - l.budgetCost,
    forecastMargin: l.scheduledValue - forecastCost,
    fade: (l.scheduledValue - forecastCost) - (l.scheduledValue - l.budgetCost),
    retainageHeld,
    netBilled: billedToDate + l.materialsStored - retainageHeld
  };
}

function sovRollup(){
  const lines = (state.sov && state.sov.lines) || [];
  const t = {
    count: lines.length,
    base: 0, co: 0, revised: 0,
    budgetCost: 0, budgetHours: 0,
    billedToDate: 0, thisPeriod: 0, previouslyBilled: 0,
    materialsStored: 0, completedAndStored: 0, balanceToFinish: 0,
    costToDate: 0, earnedCost: 0, forecastCost: 0,
    retainageHeld: 0, netBilled: 0, fade: 0
  };
  for(const l of lines){
    const c = sovCalc(l);
    if(l.type === "co") t.co += l.scheduledValue; else t.base += l.scheduledValue;
    t.revised += l.scheduledValue;
    t.budgetCost += l.budgetCost;
    t.budgetHours += l.budgetHours;
    t.billedToDate += c.billedToDate;
    t.thisPeriod += c.thisPeriod;
    t.previouslyBilled += c.previouslyBilled;
    t.materialsStored += l.materialsStored;
    t.completedAndStored += c.completedAndStored;
    t.balanceToFinish += c.balanceToFinish;
    t.costToDate += l.costToDate;
    t.earnedCost += c.earnedCost;
    t.forecastCost += c.forecastCost;
    t.retainageHeld += c.retainageHeld;
    t.netBilled += c.netBilled;
    t.fade += c.fade;
  }
  t.pctComplete = t.revised ? (t.billedToDate / t.revised) * 100 : 0;
  t.budgetMargin = t.revised - t.budgetCost;
  t.forecastMargin = t.revised - t.forecastCost;
  t.budgetMarginPct = t.revised ? (t.budgetMargin / t.revised) * 100 : 0;
  t.forecastMarginPct = t.revised ? (t.forecastMargin / t.revised) * 100 : 0;
  return t;
}

function sovActive(){ return !!((state.sov && state.sov.lines || []).length); }

/* ---------- the financial map now reads from the SOV ----------
   When there are no SOV lines this falls straight back to the manual figures,
   so an empty install still behaves exactly as before.                      */

function finance(){
  const f = state.financial;
  const agingTotal = f.aging.net30 + f.aging.net60 + f.aging.net90 + f.aging.net120;

  if(!sovActive()){
    const revised = f.originalContract + f.approvedCO + f.pendingCO;
    const gainFade = revised - f.eac;
    return { ...f, revised, left: f.eac - f.costToDate, agingTotal, gainFade,
             margin: revised ? gainFade / revised * 100 : 0, source: "manual" };
  }

  const t = sovRollup();
  // Pending COs are the ones raised in the CO Log but not yet approved into a
  // billable SOV line — carried separately so forecast margin sees the exposure
  // without pretending it's contracted revenue.
  const pendingCO = state.co
    .filter(c => ["Draft","Notice Given","Pricing","Submitted"].includes(c.status))
    .reduce((s,c) => s + (c.value || 0), 0);

  const revised = t.revised;
  const eac = t.forecastCost;
  const gainFade = revised - eac;

  return {
    ...f,
    originalContract: t.base,
    approvedCO: t.co,
    pendingCO,
    costToDate: t.costToDate,
    eac,
    revised,
    left: eac - t.costToDate,
    agingTotal,
    gainFade,
    margin: revised ? gainFade / revised * 100 : 0,
    source: "sov",
    sov: t
  };
}

/* ---------- WBS / area / cost-code grouping ---------- */

function wbsKey(l, depth){
  const raw = (l.wbs || "").trim();
  if(!raw) return "(no WBS)";
  const parts = raw.split(/[.\-\/]/).filter(Boolean);
  return parts.slice(0, Math.max(1, depth)).join(".") || raw;
}

function sovGroups(){
  const lines = (state.sov.lines || []);
  const by = state.sov.groupBy || "wbs";
  const depth = state.sov.wbsDepth || 1;
  const map = new Map();
  for(const l of lines){
    const key = by === "area" ? (l.area || "(no area)")
              : by === "costCode" ? (l.costCode || "(no cost code)")
              : by === "type" ? (l.type === "co" ? "Change Orders" : "Base Contract")
              : wbsKey(l, depth);
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(l);
  }
  return [...map.entries()].sort((a,b) => a[0].localeCompare(b[0], undefined, { numeric:true }))
    .map(([key, ls]) => {
      const g = { key, lines: ls, scheduledValue:0, budgetCost:0, billedToDate:0,
                  costToDate:0, forecastCost:0, budgetHours:0 };
      for(const l of ls){
        const c = sovCalc(l);
        g.scheduledValue += l.scheduledValue;
        g.budgetCost += l.budgetCost;
        g.budgetHours += l.budgetHours;
        g.billedToDate += c.billedToDate;
        g.costToDate += l.costToDate;
        g.forecastCost += c.forecastCost;
      }
      g.pctComplete = g.scheduledValue ? (g.billedToDate / g.scheduledValue) * 100 : 0;
      g.forecastMargin = g.scheduledValue - g.forecastCost;
      g.forecastMarginPct = g.scheduledValue ? (g.forecastMargin / g.scheduledValue) * 100 : 0;
      g.fade = g.forecastMargin - (g.scheduledValue - g.budgetCost);
      return g;
    });
}

/* ---------- mutations ---------- */

function addSovLine(){
  const desc = val("sovDesc","").trim();
  if(!desc){ toast("A line needs a description.","bad"); return; }
  const sv = Number(val("sovValue",0)) || 0;
  if(sv <= 0 && val("sovType","base") === "base"){
    toast("Scheduled value should be greater than zero.","bad"); return;
  }
  const line = sovLine({
    itemNo: val("sovItemNo","").trim() || String((state.sov.lines.length + 1)).padStart(3,"0"),
    wbs: val("sovWbs","").trim(),
    description: desc,
    area: val("sovArea","").trim(),
    costCode: val("sovCostCode","").trim(),
    type: val("sovType","base"),
    scheduledValue: sv,
    budgetCost: Number(val("sovBudget",0)) || 0,
    budgetHours: Number(val("sovHours",0)) || 0,
    pctComplete: Number(val("sovPct",0)) || 0,
    retainagePct: val("sovRetainage", state.sov.retainageDefault),
    notes: val("sovNotes","").trim()
  });
  state.sov.lines.push(line);
  addAudit("Schedule of Values","SOV Line Added",
    `${line.itemNo} ${line.description} — ${money(line.scheduledValue)} value, ${money(line.budgetCost)} budget.`);
  save(); renderAll(); navigate("sov");
  toast(`Line added. Contract now ${money(sovRollup().revised)}.`);
}

function updateSovLine(id, field, value){
  const l = state.sov.lines.find(x => x.id === id);
  if(!l) return;
  const before = l[field];
  if(["scheduledValue","budgetCost","budgetHours","pctComplete","previousPct","materialsStored","costToDate","retainagePct"].includes(field)){
    let n = Number(value) || 0;
    if(field === "pctComplete" || field === "previousPct" || field === "retainagePct") n = Math.max(0, Math.min(100, n));
    l[field] = n;
  } else l[field] = value;
  if(before !== l[field]){
    addAudit("Schedule of Values","SOV Line Updated",
      `${l.itemNo} ${l.description} — ${field} ${before} → ${l[field]}.`);
  }
  save(); renderAll(); navigate("sov");
}

function deleteSovLine(id){
  const l = state.sov.lines.find(x => x.id === id);
  if(!l) return;
  if(!confirmAction(`Delete SOV line ${l.itemNo} — ${l.description}?\n\n${money(l.scheduledValue)} comes off the contract value. This cannot be undone.`)) return;
  state.sov.lines = state.sov.lines.filter(x => x.id !== id);
  addAudit("Schedule of Values","SOV Line Deleted",
    `${l.itemNo} ${l.description} — ${money(l.scheduledValue)} removed from contract.`);
  save(); renderAll(); navigate("sov");
  toast(`Line deleted. Contract now ${money(sovRollup().revised)}.`);
}

function setSovGroup(by){ state.sov.groupBy = by; save(); renderAll(); navigate("sov"); }
function setSovDepth(d){ state.sov.wbsDepth = Math.max(1, Math.min(4, Number(d) || 1)); save(); renderAll(); navigate("sov"); }

/* Locks the current percentages as "previously billed" so next month's
   this-period column is a real delta instead of the cumulative figure. */
function closeBillingPeriod(){
  const t = sovRollup();
  if(!t.count){ toast("No SOV lines to bill.","bad"); return; }
  if(!confirmAction(
    `Close the billing period?\n\nThis period: ${money(t.thisPeriod)}\nCompleted & stored: ${money(t.completedAndStored)}\nRetainage held: ${money(t.retainageHeld)}\nNet due: ${money(t.netBilled - (t.previouslyBilled))}\n\nCurrent percentages become "previously billed". This cannot be undone.`
  )) return;
  const period = val("sovPeriod", todayISO()) || todayISO();
  state.sov.lines.forEach(l => { l.previousPct = l.pctComplete; });
  state.sov.periodEnding = period;
  state.sov.lastClosed = { at:new Date().toLocaleString(), period, amount:t.thisPeriod };
  addAudit("Schedule of Values","Billing Period Closed",
    `Period ending ${period} — ${money(t.thisPeriod)} billed this period, ${money(t.retainageHeld)} retainage held, ${money(t.balanceToFinish)} left to bill.`);
  save(); renderAll(); navigate("sov");
  toast(`Period closed. ${money(t.thisPeriod)} billed.`);
}

/* Approved change orders belong on the SOV as billable lines. This pulls any
   that aren't there yet rather than making the PM key them twice. */
function pushApprovedCOsToSov(){
  const approved = state.co.filter(c => c.status === "Approved");
  const existing = new Set(state.sov.lines.filter(l => l.coRef).map(l => l.coRef));
  const toAdd = approved.filter(c => !existing.has(c.id));
  if(!toAdd.length){
    toast(approved.length ? "All approved change orders are already on the SOV." : "No approved change orders to push.");
    return;
  }
  toAdd.forEach((c, i) => {
    state.sov.lines.push(sovLine({
      itemNo: "CO-" + String(state.sov.lines.filter(l => l.type === "co").length + i + 1).padStart(2,"0"),
      wbs: "CO",
      description: `${c.number} — ${c.title}`,
      area: "",
      costCode: "CHANGE",
      type: "co",
      coRef: c.id,
      scheduledValue: c.value || 0,
      // No cost budget assumed — the PM sets it. Leaving it at zero would
      // otherwise report 100% margin on every change order.
      budgetCost: 0,
      notes: c.summary || ""
    }));
  });
  addAudit("Schedule of Values","Approved COs Pushed to SOV",
    `${toAdd.length} change order(s) added: ${toAdd.map(c => c.number).join(", ")}. Set a cost budget on each.`);
  save(); renderAll(); navigate("sov");
  toast(`${toAdd.length} CO line(s) added. Set the cost budget on each — they land at zero.`);
}

/* ---------- import ---------- */

const ALIAS_SOV = {
  itemNo:["itemno","item","lineno","line","no","sovitem"],
  wbs:["wbs","wbscode","phase","phasecode","breakdown"],
  description:["description","desc","scope","workdescription","item","title"],
  area:["area","building","bldg","location","zone","level"],
  costCode:["costcode","code","cost","account","costtype"],
  scheduledValue:["scheduledvalue","contractvalue","value","amount","sellprice","revenue","contractamount"],
  budgetCost:["budgetcost","budget","estimatedcost","cost","estcost","totalcost"],
  budgetHours:["budgethours","hours","estimatedhours","manhours","laborhours","esthours"],
  pctComplete:["complete","percentcomplete","pctcomplete","progress"],
  materialsStored:["materialsstored","storedmaterials","stored","materialspresently"],
  costToDate:["costtodate","actualcost","actual","spenttodate","jtdcost"]
};

async function handleSovUpload(){
  const el = $("sovFile");
  const file = el && el.files ? el.files[0] : null;
  if(!file){ toast("Choose an SOV or WBS file first.","bad"); return; }
  const mode = val("sovImportMode","replace");
  try{
    const sheets = await SHEET.readFile(file);
    if(!sheets.length || !sheets[0].rows.length) throw new Error("No rows found in that file.");
    const { records, map, headerRow } = SHEET.toRecords(sheets[0].rows, ALIAS_SOV);
    if(map.description < 0 && map.itemNo < 0){
      throw new Error("Couldn't find a description or item-number column. Check the header row.");
    }
    if(map.scheduledValue < 0){
      throw new Error("Couldn't find a scheduled-value / contract-amount column — that's what the contract rolls up from.");
    }

    const imported = records.map((r,i) => sovLine({
      itemNo: r.itemNo || String(i+1).padStart(3,"0"),
      wbs: r.wbs,
      description: r.description,
      area: r.area,
      costCode: r.costCode,
      type: /^co\b|change order/i.test(r.wbs + " " + r.description) ? "co" : "base",
      scheduledValue: SHEET.num(r.scheduledValue),
      budgetCost: SHEET.num(r.budgetCost),
      budgetHours: SHEET.num(r.budgetHours),
      pctComplete: SHEET.num(r.pctComplete),
      previousPct: SHEET.num(r.pctComplete),   // an import is a starting position
      materialsStored: SHEET.num(r.materialsStored),
      costToDate: SHEET.num(r.costToDate)
    })).filter(l => l.description || l.scheduledValue);

    if(!imported.length) throw new Error("No usable rows after the header.");

    // A totals row at the bottom would double the contract value.
    const total = imported.reduce((s,l) => s + l.scheduledValue, 0);
    const suspects = imported.filter(l =>
      /^(grand )?total|^subtotal|^sum\b/i.test(l.description.trim()) ||
      (l.scheduledValue > 0 && Math.abs(l.scheduledValue - (total - l.scheduledValue)) < 1));
    const clean = imported.filter(l => !suspects.includes(l));

    if(mode === "replace") state.sov.lines = clean;
    else state.sov.lines = state.sov.lines.concat(clean);

    state.sov.fileName = file.name;
    state.sov.uploadedAt = new Date().toLocaleString();

    const t = sovRollup();
    addAudit("Schedule of Values","SOV Imported",
      `${file.name} — ${clean.length} line(s) ${mode === "replace" ? "replacing" : "appended to"} the SOV. ` +
      `Contract ${money(t.revised)}, budget ${money(t.budgetCost)}.` +
      (suspects.length ? ` ${suspects.length} total/subtotal row(s) skipped.` : ""));
    save(); renderAll(); navigate("sov");
    toast(`${clean.length} line(s) imported. Contract ${money(t.revised)}.` +
          (suspects.length ? ` Skipped ${suspects.length} totals row(s).` : ""));
  }catch(err){
    toast("SOV import failed: " + err.message, "bad");
    addAudit("Schedule of Values","Import Failed", `${file.name} — ${err.message}`);
    save();
  }
}

/* ---------- export ---------- */

function exportRowsXlsx(rows, sheetName, fileName){
  const files = [
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {name:"xl/workbook.xml",data:`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xmlEscape(sheetName)}" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},
    {name:"xl/worksheets/sheet1.xml",data:sheetXml(rows)}
  ];
  const blob = new Blob([zipStore(files)],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function exportSovXlsx(){
  const rows = [[
    "Item","WBS","Description","Area","Cost Code","Type",
    "Scheduled Value","Budget Cost","Budget Hours",
    "% Complete","Previously Billed","This Period","Materials Stored",
    "Completed & Stored","Balance To Finish","Retainage %","Retainage Held",
    "Cost To Date","Earned Cost","Cost Variance","Forecast Cost","Forecast Margin","Fade","Notes"
  ]];
  state.sov.lines.forEach(l => {
    const c = sovCalc(l);
    rows.push([l.itemNo,l.wbs,l.description,l.area,l.costCode,l.type,
      l.scheduledValue,l.budgetCost,l.budgetHours,l.pctComplete,
      c.previouslyBilled,c.thisPeriod,l.materialsStored,c.completedAndStored,
      c.balanceToFinish,l.retainagePct,c.retainageHeld,
      l.costToDate,c.earnedCost,c.costVariance,c.forecastCost,c.forecastMargin,c.fade,l.notes]);
  });
  const t = sovRollup();
  rows.push([]);
  rows.push(["TOTALS","","","","","",t.revised,t.budgetCost,t.budgetHours,
    Number(t.pctComplete.toFixed(2)),t.previouslyBilled,t.thisPeriod,t.materialsStored,
    t.completedAndStored,t.balanceToFinish,"",t.retainageHeld,
    t.costToDate,t.earnedCost,t.earnedCost - t.costToDate,t.forecastCost,t.forecastMargin,t.fade,""]);
  exportRowsXlsx(rows, "Schedule of Values", "OhmBoy_Schedule_of_Values.xlsx");
  addAudit("Export","SOV Exported", `${state.sov.lines.length} line(s), contract ${money(t.revised)}.`);
  save();
  toast("Schedule of Values exported.");
}

    <td><b>${esc(l.itemNo)}</b>${l.type==="co"?'<br><span class="badge">CO</span>':""}</td>

function renderSOV(){
  const sov = state.sov || sovDefaults();

  const groups = sovGroups();
  const approvedNotOnSov = state.co.filter(c => c.status === "Approved")
    .filter(c => !sov.lines.some(l => l.coRef === c.id)).length;

  const groupRows = groups.map(g => `<tr>
    <td><b>${esc(g.key)}</b><br><small>${g.lines.length} line(s)</small></td>
    <td>${money(g.scheduledValue)}</td>
    <td>${money(g.budgetCost)}</td>
    <td>${g.pctComplete.toFixed(1)}%</td>
    <td>${money(g.billedToDate)}</td>
    <td>${money(g.costToDate)}</td>

/* ===========================================================================
   Ωboy V0.23.1 — Procore Setup, made self-explaining
   ---------------------------------------------------------------------------
   The old panel listed four steps with no context and three buttons that threw
   raw errors when their prerequisites weren't met. Correct behaviour, useless
   to a human. This replaces it with a live checklist that says what is done,
   what is missing, and exactly what to paste where.
   =========================================================================== */

function procoreRedirectUri(){
  // The exact string Procore needs registered. Computed from wherever this is
  // actually being served, so it's right for preview deploys too.
  try{ return window.location.origin + "/.netlify/functions/procore-auth-callback"; }
  catch(e){ return "https://<your-site>.netlify.app/.netlify/functions/procore-auth-callback"; }
}

async function copyText(text, label){
  try{
    await navigator.clipboard.writeText(text);
    toast((label || "Copied") + " copied to clipboard.");
  }catch(e){
    // Clipboard needs a secure context and permission; fall back to selection.
    window.prompt("Copy this value:", text);
  }
}

/* Reads the health endpoint and caches what it found, so the checklist can be
   drawn without a network call on every render. */
async function refreshProcoreSetup(quiet){
  state.procore = state.procore || {};
  if(!quiet) setProcoreOut("Checking setup…");
  try{
    const r = await fetch(PROCORE_API.health);
    const j = await r.json();
    const p = j.procore || {};
    state.procore.setup = {
      reachable: true,
      configured: !!p.configured,
      missingEnv: p.missingEnv || [],
      invalidEnv: p.invalidEnv || [],
      companyIdSet: !!p.companyIdSet,
      webhookSecretSet: !!p.webhookSecretSet,
      connected: !!p.connected,
      oauthBase: p.oauthBase || "",
      apiBase: p.apiBase || "",
      namespace: p.namespace || "",
      tokenExpiresAt: p.tokenExpiresAt || null,
      checkedAt: new Date().toLocaleString()
    };
    state.procore.connected = !!p.connected;
    if(!quiet) setProcoreOut(j);
  }catch(err){
    // A network failure here almost always means the functions aren't deployed
    // yet, or you're opening index.html from disk instead of over Netlify.
    state.procore.setup = {
      reachable: false,
      error: err.message,
      checkedAt: new Date().toLocaleString()
    };
    if(!quiet) setProcoreOut({ ok:false, error:err.message,
      likelyCause:"The Netlify functions aren't reachable. Are you opening the site through its Netlify URL rather than a local file?" });
  }
  save();
}

function setupRow(done, blocked, title, body){
  const cls = done ? "done" : (blocked ? "blocked" : "todo");
  const mark = done ? "✓" : (blocked ? "•" : "!");
  return `<li class="setup-step ${cls}"><span class="setup-mark">${mark}</span><div><b>${title}</b>${body?`<div class="setup-body">${body}</div>`:""}</div></li>`;
}

function procoreSetupPanel(){
  const s = (state.procore && state.procore.setup) || null;
  const redirect = procoreRedirectUri();

  if(!s){
    return `<div class="card panel">
      <h2>Procore Connection</h2>
      <p class="sub">OhmBoy hasn't checked its Procore setup yet.</p>
      <div class="takeoff-row-actions"><button class="action dark" onclick="refreshProcoreSetup()">Check Setup</button></div>
    </div>`;
  }

  if(!s.reachable){
    return `<div class="card panel">
      <h2>Procore Connection</h2>
      <p class="sub"><b>Can't reach the OhmBoy backend functions.</b> ${esc(s.error||"")}</p>
      <p class="sub">This usually means one of two things: the site is being opened as a local file instead of through its Netlify address, or the deploy hasn't finished. Everything else in OhmBoy works offline — only the Procore connection needs the backend.</p>
      <div class="takeoff-row-actions"><button class="action" onclick="refreshProcoreSetup()">Check Again</button></div>
    </div>`;
  }

  const envDone = s.configured;
  const companyDone = s.companyIdSet;
  const connected = s.connected;
  const linked = !!(state.procore || {}).projectId;
  const secretDone = s.webhookSecretSet;
  const sandbox = /sandbox/i.test(s.oauthBase || "");

  const steps = [
    setupRow(envDone, false, "1 &nbsp;Register OhmBoy as a Procore app and add its credentials to Netlify",
      envDone
        ? `Done. OhmBoy is pointed at <b>${esc(sandbox ? "the Procore sandbox" : "production Procore")}</b> (<code>${esc(s.oauthBase)}</code>).`
        : `<p>Procore won't hand data to anything that hasn't been registered. You create an app at
           <b>developers.procore.com</b>, which gives you a Client ID and a Client Secret — think of them
           as OhmBoy's own username and password. Those go into Netlify, never into this page, so they
           stay on the server where nobody can read them out of the browser.</p>
           ${(s.missingEnv||[]).length?`<p><b>Not set yet:</b> ${s.missingEnv.map(v=>`<code>${esc(v)}</code>`).join(", ")}</p>`:""}
           ${(s.invalidEnv||[]).length?`<div class="env-bad"><b>These are set, but the value isn't usable:</b>
             <ul>${s.invalidEnv.map(b=>`<li><code>${esc(b.variable)}</code> — ${esc(b.problem)}</li>`).join("")}</ul>
             <p>In Netlify, the <b>Key</b> box takes the name and the <b>Value</b> box takes <i>only</i> the credential — no variable name, no equals sign, no quotes, no spaces.</p></div>`:""}
           <p>While you're in the Procore app settings, add this exact Redirect URI:</p>
           <div class="copy-row"><code>${esc(redirect)}</code>
             <button class="action" onclick="copyText('${esc(redirect)}','Redirect URI')">Copy</button></div>
           <p class="setup-warn">It has to match character for character, including <code>https://</code> and no trailing slash.</p>
           <p>Then in <b>Netlify → Site settings → Environment variables</b>, add the values and
           <b>redeploy</b> — Netlify only picks up new variables on a fresh deploy.</p>`),

    setupRow(connected, !envDone, "2 &nbsp;Authorise OhmBoy against your Procore account",
      connected
        ? `Connected.${s.tokenExpiresAt?` Access token valid until ${esc(new Date(s.tokenExpiresAt).toLocaleString())} — it refreshes itself.`:""}`
        : (!envDone
            ? `Waiting on step 1. The button below stays disabled until the credentials are in place.`
            : `<p>This is the one-time consent: you log into Procore and approve OhmBoy reading the account.
               It opens in a new tab and comes back with a page listing your companies.</p>`)),

    setupRow(companyDone, !connected, "3 &nbsp;Tell OhmBoy which Procore company to use",
      companyDone
        ? `Set. OhmBoy is reading company data and can list your projects.`
        : `<p>The page from step 2 lists your companies with their id numbers. Copy the id of the one
           this job lives under, add it in Netlify as <code>PROCORE_COMPANY_ID</code>, and redeploy.</p>
           <p class="setup-warn">Yes, a second redeploy. Procore doesn't tell you the company id until
           after you've authorised, so it can't go in on the first pass.</p>`),

    setupRow(linked, !companyDone, "4 &nbsp;Link the project",
      linked
        ? `Linked to <b>${esc((state.procore||{}).projectName || "project " + state.procore.projectId)}</b> (id ${esc(String(state.procore.projectId))}).`
        : `Load your projects and pick the one this job is. Everything OhmBoy pulls will be scoped to it.`),

    setupRow(false, !linked, "5 &nbsp;Turn on webhooks",
      !secretDone
        ? `Needs <code>PROCORE_WEBHOOK_SECRET</code> in Netlify — any long random string you invent. It's the shared password Procore sends back so OhmBoy knows a webhook really came from Procore.`
        : `Registers the hook and triggers so Procore pushes drawing revisions and schedule changes to OhmBoy as they happen. Safe to run more than once.`)
  ];

  const nextLine = !envDone ? "Start at step 1 — nothing else can happen until the credentials are in Netlify."
    : !connected ? "You're ready for step 2. Click Open Procore Authorisation."
    : !companyDone ? "You're on step 3 — grab the company id and add it in Netlify."
    : !linked ? "Almost there. Load your projects and link one."
    : "Connected and linked. Register webhooks if you haven't.";

  return `<div class="card panel">
    <div class="setup-head">
      <div>
        <h2>Procore Connection</h2>
        <p class="sub">${esc(nextLine)}</p>
      </div>
      <button class="action" onclick="refreshProcoreSetup()">Re-check</button>
    </div>
    <ol class="setup-list">${steps.join("")}</ol>
    <p class="sub" style="margin-top:6px">Last checked ${esc(s.checkedAt)}.
      ${sandbox ? "Pointed at the <b>sandbox</b> — safe to experiment." : "Pointed at <b>production</b> — this is live company data."}</p>
  </div>`;
}

/* Buttons now explain instead of failing. Each checks its own prerequisite and
   says which step is outstanding rather than surfacing a raw fetch error. */

function openProcoreAuth(){
  const s = (state.procore && state.procore.setup) || {};
  if(!s.reachable){ toast("Can't reach the backend functions — check the site is served from Netlify.","bad"); return; }
  if(!s.configured){
    toast("Step 1 isn't done: the Procore credentials aren't in Netlify yet.","bad");
    setProcoreOut({
      blocked: "Procore credentials are not configured.",
      missingEnv: s.missingEnv || [],
      whatToDo: "Add these in Netlify > Site settings > Environment variables, then redeploy.",
      redirectUriToRegisterInProcore: procoreRedirectUri()
    });
    return;
  }
  window.open(PROCORE_API.authStart, "_blank");
  setProcoreOut("Authorisation opened in a new tab. Approve OhmBoy there, then come back and press Re-check.");
}

async function loadProcoreProjects(){
  const s = (state.procore && state.procore.setup) || {};
  if(!s.reachable || !s.configured || !s.connected || !s.companyIdSet){
    await refreshProcoreSetup(true);
  }
  const st = (state.procore && state.procore.setup) || {};
  if(!st.reachable){ toast("Can't reach the backend functions.","bad"); renderAll(); navigate("procore"); return; }
  if(!st.configured){ toast("Step 1 first — credentials aren't in Netlify yet.","bad"); renderAll(); navigate("procore"); return; }
  if(!st.connected){ toast("Step 2 first — OhmBoy isn't authorised against Procore yet.","bad"); renderAll(); navigate("procore"); return; }

  setProcoreOut("Asking Procore for your projects…");
  try{
    const r = await fetch(PROCORE_API.whoami);
    const j = await r.json();
    if(!j.ok){
      setProcoreOut(j);
      toast(j.error || "Procore refused that request.","bad");
      return;
    }
    state.procore.companies = (j.companies||[]).map(c => ({ id:c.id, name:c.name }));
    state.procore.projects  = (j.projects||[]).map(p => ({ id:p.id, name:p.name }));
    state.procore.companyId = j.companyIdInUse || state.procore.companyId || null;
    state.procore.connected = true;
    state.procore.checkedAt = new Date().toLocaleString();
    save(); renderAll(); navigate("procore");

    if(!state.procore.projects.length){
      setProcoreOut({
        ok: true,
        companies: j.companies,
        note: "Connected, but no projects came back for this company. Either PROCORE_COMPANY_ID points at the wrong company, or the Procore user who authorised doesn't have access to any projects in it.",
        companyIdInUse: j.companyIdInUse
      });
      toast("Connected, but no projects returned — see the output below.","bad");
      return;
    }
    setProcoreOut(`Connected. ${state.procore.projects.length} project(s) available — pick one and link it.`);
    toast(`${state.procore.projects.length} Procore project(s) loaded.`);
  }catch(err){
    setProcoreOut({ ok:false, error:err.message });
    toast("Couldn't reach Procore: " + err.message, "bad");
  }
}

function linkProcoreProject(){
  const projects = (state.procore || {}).projects || [];
  if(!projects.length){
    toast("Load your projects first — there's nothing to link yet.","bad");
    return;
  }
  const sel = $("procoreProjectSel");
  const id = sel ? sel.value : "";
  if(!id){ toast("Pick a project from the list first.","bad"); return; }
  const proj = projects.find(p => String(p.id) === String(id));
  state.procore.projectId = proj ? proj.id : id;
  state.procore.projectName = proj ? proj.name : "";
  state.procore.linkedAt = new Date().toLocaleString();
  addAudit("Procore","Project Linked",
    `${state.procore.projectName || state.procore.projectId} (id ${state.procore.projectId}) linked to OhmBoy.`);
  save(); renderAll(); navigate("procore");
  toast(`Linked to ${state.procore.projectName || id}.`);
}

async function registerProcoreHooks(){
  const pc = state.procore || {};
  if(!pc.projectId){ toast("Link a project first — webhooks are scoped to it.","bad"); return; }
  if(!((pc.setup||{}).webhookSecretSet)){
    toast("PROCORE_WEBHOOK_SECRET isn't set in Netlify yet.","bad");
    setProcoreOut({
      blocked: "PROCORE_WEBHOOK_SECRET is not set.",
      whatItIs: "Any long random string you invent. Procore sends it back on every webhook so OhmBoy can tell a real delivery from a forged one.",
      whatToDo: "Add it in Netlify > Site settings > Environment variables, redeploy, then press Re-check."
    });
    return;
  }
  setProcoreOut("Creating the hook and triggers in Procore…");
  try{
    const r = await fetch(PROCORE_API.register + `?project_id=${encodeURIComponent(pc.projectId)}`);
    const j = await r.json();
    setProcoreOut(j);
    addAudit("Procore", j.ok ? "Webhooks Registered" : "Webhook Registration Issue",
      j.ok ? `Hook ${j.hookId}, ${(j.triggersAdded||[]).length} trigger(s) added.` : (j.error || "see output"));
    save();
    toast(j.ok ? `Hook ${j.hookId} ready. Procore will push changes to OhmBoy.`
               : "Registration returned an issue — see the output below.", j.ok ? "" : "bad");
  }catch(err){
    setProcoreOut({ ok:false, error:err.message });
    toast("Registration failed: " + err.message, "bad");
  }
}
